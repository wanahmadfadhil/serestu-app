async function loadBantuan() {
  $('#bBody').innerHTML = `<tr><td colspan="8" class="p-4">${skel('h-10', 5, 'mb-2')}</td></tr>`;
  try {
    B.list = await api('senaraiAgihan', { tahun: B.tahun });
    paintBantuan();
  } catch (e) { $('#bBody').innerHTML = `<tr><td colspan="8">${errBox(e.message, 'loadBantuan()')}</td></tr>`; }
}

function paintBantuan() {
  // Tapis tahun/kelas/nama dahulu; kiraan pada butang skim ikut tapisan ini
  const q = B.fQ.trim().toLowerCase();
  const ditapis = (B.list || []).filter(a => {
    const m = IDX.murid.get(a.idMurid);
    const k = m ? IDX.kelas.get(m.idKelas) : S.kelas.find(x => x.nama === a.namaKelas);
    if (B.fTahun && (!k || k.tahun !== B.fTahun)) return false;
    if (B.fKelas && (!k || k.id !== B.fKelas)) return false;
    return !q || a.namaMurid.toLowerCase().includes(q);
  });
  // Bukan warganegara, dan murid tanpa maklumat pendapatan (kecuali BAP/SPBT), dikeluarkan daripada senarai
  // penerima (rekod tidak dipadam; lihat butang "Tiada maklumat pendapatan")
  const warga = ditapis.filter(a => a.warganegara !== false);
  const list = warga.filter(a => a.pendapatan != null || semuaLayakSkim(S.katBantuan.find(k => k.id === a.idKategori)));
  const bilSkim = arr => arr.filter(a => !B.kat || a.idKategori === B.kat).length;
  const tersembunyi = bilSkim(warga) - bilSkim(list), bukanWarga = bilSkim(ditapis) - bilSkim(warga);
  const count = {}; list.forEach(a => { count[a.idKategori] = (count[a.idKategori] || 0) + 1; });
  $('#bMenu').innerHTML = jubinSkim('', 'Semua jenis bantuan', `Sesi ${B.tahun}`, null, list.length, 'fa-layer-group', 'bg-slate-200 text-slate-700', false) +
    S.katBantuan.map((k, i) => jubinSkim(k.id, k.kod, k.nama, k.namaPIC || '', count[k.id] || 0, IKON_SKIM[k.kod] || 'fa-hand-holding-heart', WARNA_SKIM[i % WARNA_SKIM.length], !!k.idPIC && k.idPIC === S.user.id)).join('');
  $('#bMenu').onclick = e => { const b = e.target.closest('[data-skim]'); if (b) { B.kat = b.dataset.skim; paintBantuan(); } };
  const f = B.kat ? list.filter(a => a.idKategori === B.kat) : list;
  const kat = S.katBantuan.find(k => k.id === B.kat);
  $('#bHead').textContent = kat ? `${kat.kod}: ${kat.nama}` : `Semua jenis bantuan ${B.tahun}`;
  $('#bHad').textContent = kat ? [kat.namaPIC ? 'PIC: ' + kat.namaPIC : 'PIC belum dilantik', teksHad(kat) ? 'Had kelayakan: ' + teksHad(kat) : 'Had kelayakan belum ditetapkan'].join(' · ') : '';
  $('#bAksi').innerHTML = urusSkim(kat) ? `
    <button class="btn btn-ghost py-1 text-[11px]" onclick="openSkimModal('${jsq(kat.id)}')"><i class="fa-solid fa-sliders"></i> Ubah skim & had</button>
    <button class="btn btn-success py-1 text-[11px]" onclick="openMuridLayak('${jsq(kat.id)}')"><i class="fa-solid fa-list-check"></i> Murid layak</button>` : '';
  $('#bCount').textContent = `${f.length} penerima`;
  if (tersembunyi) $('#bHad').innerHTML = `${esc($('#bHad').textContent)}${$('#bHad').textContent ? ' · ' : ''}<button class="text-amber-700 font-semibold hover:underline" onclick="openTiadaPendapatan()">${tersembunyi} rekod tiada maklumat pendapatan tidak dipaparkan</button>`;
  if (bukanWarga) $('#bHad').insertAdjacentHTML('beforeend', `${$('#bHad').textContent ? ' · ' : ''}<span class="text-rose-700 font-semibold">${bukanWarga} rekod bukan warganegara tidak dipaparkan</span>`);
  $('#bBody').innerHTML = f.length ? f.sort((a, b) => a.namaMurid.localeCompare(b.namaMurid)).map(a => `
    <tr class="hover:bg-slate-50/70">
      <td class="td font-bold text-slate-800">${esc(a.namaMurid)}</td>
      <td class="td">${esc(a.namaKelas)}</td>
      <td class="td font-bold text-brand-700">${esc(a.kod)}</td>
      <td class="td">${selPendapatan(a.pendapatan, a.perKapita, a.kategoriPendapatan)}</td>
      <td class="td">${badgeAgihan(a.status)}</td>
      <td class="td text-slate-500">${a.tarikhSerahan ? fmtPendek(a.tarikhSerahan) : '-'}</td>
      <td class="td">${fmtRM(a.amaun)}</td>
      ${urusSkim(S.katBantuan.find(k => k.id === a.idKategori)) ? `<td class="td text-right"><button class="btn btn-ghost py-1" onclick="openAgihanModal('${jsq(a.idAgihan)}')" aria-label="Kemas kini"><i class="fa-solid fa-pen"></i></button></td>` : skimSaya().length ? '<td class="td"></td>' : ''}
    </tr>`).join('') : `<tr><td colspan="8">${emptyBox('fa-box-open', kat ? urusSkim(kat) ? 'Belum ada penerima. Tekan <b>Daftar penerima</b> untuk bermula.' : 'Tiada penerima dalam kelas anda bagi jenis bantuan ini.' : can('urus_bantuan') ? 'Belum ada penerima. Tekan <b>Daftar penerima</b> untuk bermula.' : 'Tiada penerima bantuan bagi tahun ini.')}</td></tr>`;
  paintRmtNav();
  paintBap();
}

/* ---- BAP: senarai semak penerimaan. Semua murid warganegara layak; guru kelas menanda yang sudah terima ---- */
const BP = { kunci: '', id: '', data: null, pending: new Map(), timer: null, menyimpan: false, ralat: '' };
window.addEventListener('beforeunload', e => { if (BP.pending.size || BP.menyimpan) e.preventDefault(); });

function paintBap() {
  const box = $('#bBap'); if (!box) return;
  const k = S.katBantuan.find(x => x.id === B.kat), urus = urusSkim(k);
  const milik = (S.user.kelasSaya || []).map(x => IDX.kelas.get(x)).filter(Boolean);
  if (!k || String(k.kod).toUpperCase() !== 'BAP' || (!urus && !milik.length)) { box.innerHTML = ''; return; }
  $('#bKad').classList.toggle('hidden', !urus);
  if ($('#bapIsi') && BP.kunci === B.tahun) return;
  BP.kunci = B.tahun;
  if (!urus && !milik.some(c => c.id === BP.id)) BP.id = milik[0].id;
  box.innerHTML = `<div class="card p-4 space-y-3">
    <div class="flex flex-wrap items-center justify-between gap-2">
      <div><h4 class="font-bold text-slate-800 text-sm">Senarai semak BAP ${esc(B.tahun)}</h4>
        <p class="text-[11px] text-slate-500">Semua murid warganegara layak. Tandakan murid yang sudah menerima bantuan.</p></div>
      <div class="flex flex-wrap items-center gap-2"><span id="bapStatus" class="text-xs"></span>
        <select id="bapKelas" class="${TAPIS_CLS}" aria-label="Pilih kelas">${urus ? kelasOptions(BP.id, 'Ringkasan semua kelas')
          : milik.map(c => `<option value="${esc(c.id)}" ${c.id === BP.id ? 'selected' : ''}>${esc(namaKelasTajuk(c))}</option>`).join('')}</select></div>
    </div>
    <div id="bapIsi"></div></div>`;
  $('#bapKelas').addEventListener('change', e => { BP.id = e.target.value; muatBap(); });
  $('#bapIsi').addEventListener('change', e => {
    const c = e.target.closest('input[data-bm]'); if (!c) return;
    const m = BP.data.murid.find(x => x.id === c.dataset.bm);
    if (m) { setBap(m, c.checked); jadualSimpanBap(); }
  });
  $('#bapIsi').addEventListener('click', e => {
    const b = e.target.closest('[data-bk]');
    if (b) { BP.id = b.dataset.bk; $('#bapKelas').value = BP.id; muatBap(); }
  });
  statusBap();
  muatBap();
}

async function muatBap() {
  const id = BP.id, tahun = BP.kunci;
  $('#bapIsi').innerHTML = skel('h-10', 5, 'mb-2');
  try {
    await simpanBap();
    const d = await api('getBap', { idKelas: id, tahun });
    if (BP.id !== id || BP.kunci !== tahun || !$('#bapIsi')) return;
    BP.data = d; lukisBap();
  } catch (e) { if (BP.id === id && $('#bapIsi')) $('#bapIsi').innerHTML = errBox(e.message, 'muatBap()'); }
}

function lukisBap() {
  const d = BP.data;
  if (d.kelas) return lukisRingkasBap();
  const bil = d.murid.filter(m => m.terima).length;
  $('#bapIsi').innerHTML = `
    <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-100">
      <p class="text-xs text-slate-600"><b id="bapBil" class="text-slate-800">${bil}</b> daripada ${d.murid.length} murid sudah terima${d.bukanWarga ? `. ${d.bukanWarga} murid bukan warganegara tidak layak` : ''}${d.bolehUbah ? '' : '. Rekod tahun lepas tidak boleh diubah'}</p>
      <div class="flex flex-wrap gap-2">
        ${d.bolehUbah ? '<button class="btn btn-ghost py-1 text-[11px]" onclick="tandaSemuaBap()"><i class="fa-solid fa-check-double"></i> Tandakan semua</button>' : ''}
        <button class="btn btn-ghost py-1 text-[11px]" onclick="cetakBap()"><i class="fa-solid fa-print"></i> Cetak</button>
      </div>
    </div>
    ${d.murid.length ? `<div class="divide-y divide-slate-100">${d.murid.map((m, i) => `
      <label class="flex items-center gap-3 py-2 px-1 hover:bg-slate-50 ${d.bolehUbah ? 'cursor-pointer' : ''}">
        <input type="checkbox" data-bm="${esc(m.id)}" class="w-5 h-5 shrink-0 accent-emerald-600" ${m.terima ? 'checked' : ''} ${d.bolehUbah ? '' : 'disabled'}>
        <span class="w-6 shrink-0 text-right text-xs text-slate-400">${i + 1}</span>
        <span class="flex-1 min-w-0 text-sm font-semibold text-slate-800">${esc(m.nama)}</span>
        <span data-bt="${esc(m.id)}" class="shrink-0 text-[11px] text-emerald-700 font-semibold">${m.tarikh ? esc(fmtPendek(m.tarikh)) : ''}</span>
      </label>`).join('')}</div>` : emptyBox('fa-users', 'Tiada murid warganegara dalam kelas ini.')}`;
}

function lukisRingkasBap() {
  const rows = BP.data.kelas.map(c => Object.assign({ k: IDX.kelas.get(c.idKelas) }, c)).filter(c => c.k)
    .sort((a, b) => tahunSort(a.k.tahun) - tahunSort(b.k.tahun) || namaKelasSahaja(a.k.nama).localeCompare(namaKelasSahaja(b.k.nama)));
  const layak = rows.reduce((n, c) => n + c.layak, 0), terima = rows.reduce((n, c) => n + c.terima, 0);
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  $('#bapIsi').innerHTML = `
    <p class="text-xs text-slate-600 pb-3"><b class="text-slate-800">${terima}</b> daripada ${layak} murid sudah terima (${pct(terima, layak)}%). Tekan kelas untuk melihat senarai murid.</p>
    <div class="overflow-x-auto"><table class="w-full text-xs">
      <thead class="bg-slate-50 border-b border-slate-200"><tr><th class="th">Kelas</th><th class="th">Layak</th><th class="th">Sudah terima</th><th class="th">Belum</th><th class="th">Kemajuan</th></tr></thead>
      <tbody class="divide-y divide-slate-100">${rows.map(c => `
        <tr class="hover:bg-slate-50/70 cursor-pointer" data-bk="${esc(c.idKelas)}">
          <td class="td font-bold text-brand-700">${esc(namaKelasTajuk(c.k))}</td><td class="td">${c.layak}</td><td class="td">${c.terima}</td><td class="td">${c.layak - c.terima}</td>
          <td class="td"><div class="flex items-center gap-2"><div class="h-2 w-24 rounded-full bg-slate-100 overflow-hidden"><div class="h-full bg-emerald-500" style="width:${pct(c.terima, c.layak)}%"></div></div><span class="text-slate-500">${pct(c.terima, c.layak)}%</span></div></td>
        </tr>`).join('')}</tbody></table></div>`;
}

function setBap(m, terima) {
  m.terima = terima; m.tarikh = terima ? todayStr() : '';
  BP.pending.set(m.id, { kelas: BP.id, idMurid: m.id, terima });
  const t = $('#bapIsi').querySelector(`[data-bt="${CSS.escape(m.id)}"]`);
  if (t) t.textContent = m.tarikh ? fmtPendek(m.tarikh) : '';
  $('#bapBil').textContent = BP.data.murid.filter(x => x.terima).length;
}
function tandaSemuaBap() {
  BP.data.murid.filter(m => !m.terima).forEach(m => {
    setBap(m, true);
    $('#bapIsi').querySelector(`input[data-bm="${CSS.escape(m.id)}"]`).checked = true;
  });
  jadualSimpanBap();
}
function jadualSimpanBap() { clearTimeout(BP.timer); BP.timer = setTimeout(simpanBap, 800); statusBap(); }

async function simpanBap() {
  clearTimeout(BP.timer);
  if (BP.menyimpan || !BP.pending.size) return;
  const semua = Array.from(BP.pending.values()), idKelas = semua[0].kelas;
  const hantar = semua.filter(x => x.kelas === idKelas);
  hantar.forEach(x => BP.pending.delete(x.idMurid));
  BP.menyimpan = true; statusBap();
  try {
    await api('simpanBap', { idKelas, ubah: hantar.map(x => ({ idMurid: x.idMurid, terima: x.terima })) });
    BP.ralat = '';
    segarBantuan();
  } catch (e) {
    hantar.forEach(x => { if (!BP.pending.has(x.idMurid)) BP.pending.set(x.idMurid, x); });   // kekalkan untuk cuba semula
    BP.ralat = e.message; toast('Rekod BAP belum disimpan: ' + e.message, 'error');
  } finally {
    BP.menyimpan = false; statusBap();
    if (BP.pending.size && !BP.ralat) simpanBap();
  }
}
// Kiraan jubin & senarai penerima ikut tanda terkini
async function segarBantuan() {
  const tahun = B.tahun;
  try {
    const list = await api('senaraiAgihan', { tahun });
    if (B.tahun === tahun && $('#bMenu')) { B.list = list; paintBantuan(); }
  } catch (e) { /* senarai dimuat semula apabila tab dibuka */ }
}
function statusBap() {
  const el = $('#bapStatus'); if (!el) return;
  const belum = BP.pending.size > 0;
  el.innerHTML = BP.ralat && belum ? `<button class="text-rose-600 font-semibold hover:underline" onclick="BP.ralat='';simpanBap()"><i class="fa-solid fa-triangle-exclamation"></i> Gagal disimpan. Cuba semula</button>`
    : BP.menyimpan || belum ? '<span class="text-amber-600"><i class="fa-solid fa-spinner fa-spin"></i> Menyimpan…</span>'
    : '';
}

function cetakBap() {
  const d = BP.data, k = IDX.kelas.get(BP.id); if (!d || !d.murid || !k) return;
  const td = 'border:1px solid #94a3b8;padding:5px 6px;font-size:11px';
  printHTML(`<div style="font-family:Arial,sans-serif;color:#0f172a">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">${logoCetak('width:48px;height:48px')}
      <div><div style="font-size:14px;font-weight:700">Senarai Semak Bantuan Awal Persekolahan (BAP) ${esc(d.tahun)}</div>
      <div style="font-size:12px">${esc(S.tetapan.namaSekolah || '')} · ${esc(namaKelasTajuk(k))} · Guru kelas: ${esc(k.namaGuruKelas || '-')}</div></div></div>
    <table style="width:100%;border-collapse:collapse"><thead><tr style="background:#f1f5f9">
      <th style="${td};width:32px">Bil</th><th style="${td};text-align:left">Nama murid</th><th style="${td};width:70px">Sudah terima</th><th style="${td};width:90px">Tarikh</th></tr></thead>
      <tbody>${d.murid.map((m, i) => `<tr><td style="${td};text-align:center">${i + 1}</td><td style="${td}">${esc(m.nama)}</td><td style="${td};text-align:center">${m.terima ? '&#10003;' : ''}</td><td style="${td};text-align:center">${m.tarikh ? esc(fmtPendek(m.tarikh)) : ''}</td></tr>`).join('')}</tbody></table>
    <p style="font-size:11px;margin-top:8px">Jumlah sudah terima: ${d.murid.filter(m => m.terima).length} daripada ${d.murid.length} murid</p></div>`);
}

/* ---------------- Guru bertugas: jadual mingguan & laporan harian ----------------
 * PK HEM menetapkan kumpulan guru bertugas setiap minggu dan seorang pelapor bagi setiap hari.
 * Pelapor mengisi laporan (draf disimpan sendiri) dan menghantar; PK HEM mengesahkan atau memulangkan. */
const GB = { sub: '', tarikh: '', sesi: '', minggu: '', jadual: null, edit: null, editUbah: false, lap: null,
  dirty: false, timer: null, menyimpan: null, ralat: '', dari: '', hingga: '', fStatus: '', senarai: null };
const PANTAU_GB = [['ketibaan', 'Ketibaan murid & pintu pagar'], ['lalulintas', 'Keselamatan lalu lintas'], ['kawasan', 'Kebersihan kawasan sekolah'],
  ['tandas', 'Kebersihan tandas'], ['kantin', 'Kantin & waktu rehat'], ['bersurai', 'Murid bersurai & dijemput']];
const KEJADIAN_GB = ['Murid sakit', 'Kemalangan / kecederaan', 'Kerosakan harta benda', 'Pelawat', 'Lain-lain'];
const STATUS_GB = { '': ['Belum diisi', 'bg-slate-100 text-slate-600'], Draf: ['Draf', 'bg-sky-100 text-sky-800'],

function ubahGB() { GB.dirty = true; GB.ralat = ''; clearTimeout(GB.timer); GB.timer = setTimeout(() => simpanGB(), 1200); statusGB(); }
// Simpan draf (atau hantar). Pulangkan true jika berjaya.
async function simpanGB(hantar) {
  clearTimeout(GB.timer);
  const d = GB.lap;
  if (!d || !d.bolehIsi || (!hantar && !GB.dirty)) return true;
  if (GB.menyimpan) { try { await GB.menyimpan; } catch (e) { /* dicuba semula di bawah */ } }
  if (!hantar && !GB.dirty) return true;
  GB.dirty = false;
  const kerja = api('simpanLaporanBertugas', { tarikh: d.tarikh, sesi: d.sesi, data: d.data, fotoId: d.fotoId, hantar: !!hantar });
  GB.menyimpan = kerja; statusGB();
  try {
    const r = await kerja;
    d.status = r.status; GB.ralat = ''; GB.disimpan = true;
    return true;
  } catch (e) {
    GB.dirty = true; GB.ralat = e.message;
    toast((hantar ? 'Laporan belum dihantar: ' : 'Laporan belum disimpan: ') + e.message, 'error');
    return false;
  } finally { GB.menyimpan = null; statusGB(); }
}
function statusGB() {
  const el = $('#gbStatus'); if (!el) return;
  const d = GB.lap;
  el.innerHTML = !d || !d.bolehIsi ? ''
    : GB.ralat && GB.dirty ? `<button class="text-rose-600 font-semibold hover:underline" onclick="simpanGB()"><i class="fa-solid fa-triangle-exclamation"></i> Gagal disimpan. Cuba semula</button>`
    : GB.menyimpan || GB.dirty ? '<span class="text-amber-600"><i class="fa-solid fa-spinner fa-spin"></i> Menyimpan…</span>'
    : GB.disimpan ? '<span class="text-emerald-600"><i class="fa-solid fa-circle-check"></i> Draf disimpan</span>' : '';
}
async function hantarGB(btn) {
  const x = GB.lap.data;
  if (!x.perhimpunan) return toast('Pilih status perhimpunan dahulu.', 'error');
  const kurang = PANTAU_GB.filter(([k]) => !x.skala[k]).map(([, l]) => l);
  if (kurang.length) return toast('Lengkapkan skala pemantauan: ' + kurang.join(', '), 'error');
  if (!await confirmBox('Hantar laporan kepada PK HEM? Laporan tidak boleh diubah selepas dihantar.', 'Hantar')) return;
  const asal = GB.lap.status;
  btn.disabled = true;
  const ok = await simpanGB(true);
  btn.disabled = false;
  if (!ok) return;
  toast('Laporan dihantar kepada PK HEM.', 'success');
  const b = S.bertugas || {};
  const t = (b.tugas || []).find(v => GB.lap.tarikh === todayStr() && v.sesi === GB.lap.sesi);
  if (t) t.status = 'Dihantar';
  if (asal === 'Dipulangkan' && b.dipulangkan) b.dipulangkan--;
  lukisNavGB(); muatLaporanGB();
}
async function sahGB(btn, tindakan) {
  const ulasan = $('#gbUlasan').value.trim();
  if (tindakan === 'pulang' && !ulasan) return toast('Tulis ulasan tentang perkara yang perlu dibetulkan.', 'error');
  await busy(btn, async () => {
    await api('sahLaporanBertugas', { tarikh: GB.lap.tarikh, sesi: GB.lap.sesi, tindakan, ulasan });
    if (S.bertugas && S.bertugas.menunggu) S.bertugas.menunggu--;
    toast(tindakan === 'pulang' ? 'Laporan dipulangkan kepada pelapor.' : 'Laporan disahkan.', 'success');
    lukisNavGB(); muatLaporanGB();
  });
}

function lukisJadualGB() {

    ${urus ? `<div class="sm:w-72"><label class="lbl" for="gbKetua">Ketua guru bertugas</label><select id="gbKetua" class="inp"><option value="">Tiada</option>${ed.ahli.map(id => `<option value="${esc(id)}" ${id === ed.ketua ? 'selected' : ''}>${esc(namaGuruGB(id))}</option>`).join('')}</select></div>` : ''}
    <div class="overflow-x-auto"><table class="w-full text-xs">

      <tbody class="divide-y divide-slate-100">${hari.map(({ h, t }) => `<tr>
        <td class="td font-semibold whitespace-nowrap">${h}<div class="text-[11px] font-normal text-slate-500">${esc(fmtPendek(t))}</div></td>
        <td class="td">${urus ? `<select data-pel="${h}" class="inp py-1.5 text-xs min-w-[180px]" aria-label="Pelapor ${h}"><option value="">Tiada</option>${ed.ahli.map(id => `<option value="${esc(id)}" ${ed.pelapor[h] === id ? 'selected' : ''}>${esc(namaGuruGB(id))}</option>`).join('')}</select>`
          : `<span class="${ed.pelapor[h] === S.user.id ? 'font-bold text-brand-700' : ''}">${esc(namaGuruGB(ed.pelapor[h]) || '-')}</span>`}</td>

  $('#gbGilir').onclick = () => {

    const susun = ed.ketua ? [ed.ketua].concat(ed.ahli.filter(x => x !== ed.ketua)) : ed.ahli;
    HARI_SEKOLAH.forEach((h, i) => { ed.pelapor[h] = susun[i % susun.length]; });
    ubah();
  };
  $('#gbSalin').onclick = e => busy(e.currentTarget, async () => {
    const p = await api('getBertugas', { minggu: tambahHariGB(d.minggu, -7), sesi: d.sesi });

    Object.keys(p.pelapor).forEach(h => { if (IDX.guru.has(p.pelapor[h])) GB.edit.pelapor[h] = p.pelapor[h]; });
    GB.editUbah = true; lukisJadualGB();
  });
  $('#gbSimpanJ').onclick = e => busy(e.currentTarget, async () => {
    const r = await api('simpanBertugas', { minggu: d.minggu, sesi: d.sesi, ahli: ed.ahli, ketua: ed.ketua, pelapor: ed.pelapor });
    GB.jadual = r; GB.edit = { ahli: r.ahli.slice(), ketua: r.ketua, pelapor: Object.assign({}, r.pelapor) }; GB.editUbah = false;
    toast('Jadual guru bertugas disimpan.', 'success'); lukisJadualGB();
    refreshBoot().catch(() => {});
  });
}

/* ---- RMT: kehadiran harian, laporan harian (C8) & rekod kehadiran (C9) ----
 * Format ikut Buku Panduan Pengurusan RMT 2.0. Boleh merekod: PIC RMT, PK HEM, guru bertugas hari itu. */
const R = { sub: '', tarikh: '', data: null, rekod: {}, skor: [0, 0, 0, 0], kelas: '', dirty: false, minggu: '', bulan: '' };
const KRITERIA_RMT = ['Mengikut menu', 'Kualiti rasa', 'Kebersihan', 'Disiplin murid'];
const SKALA_RMT = ['Tidak memuaskan', 'Kurang memuaskan', 'Memuaskan', 'Sangat memuaskan'];
function skimRmt() { return S.katBantuan.find(k => String(k.kod).toUpperCase() === 'RMT'); }
function isoTarikh(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }

function peringatanRmt() {
  const r = S.rmt;
  if (!r || !r.hariSekolah || r.laporanSudah || (!r.pic && !r.bertugasHariIni)) return '';
  return `<button onclick="bukaRmtDashboard()" class="w-full text-left bg-orange-50 border border-orange-200 rounded-2xl p-4 flex items-center gap-3 hover:bg-orange-100 transition">
    <span class="w-10 h-10 rounded-xl bg-orange-100 text-orange-700 flex items-center justify-center shrink-0"><i class="fa-solid fa-utensils"></i></span>
    <span class="min-w-0 flex-1"><span class="block text-sm font-bold text-orange-900">${r.hadirSudah ? 'Laporan harian RMT belum diisi' : 'Kehadiran RMT hari ini belum direkod'}</span>
    <span class="block text-xs text-orange-800">Tekan untuk ${r.hadirSudah ? 'mengisi laporan' : 'merekod kehadiran'} hari ini.</span></span>
    <i class="fa-solid fa-chevron-right text-orange-400"></i></button>`;
}
function bukaRmtDashboard() {
  B.mula = true; B.kat = (skimRmt() || {}).id || '';
  R.sub = S.rmt.hadirSudah ? 'laporan' : 'hadir'; R.tarikh = todayStr();

}

// Sub menu dipaparkan apabila jubin RMT dipilih oleh PIC / PK HEM / guru bertugas
function paintRmtNav() {

}
function lukisRmtNav() {
  const menu = [['hadir', 'Kehadiran harian', 'fa-clipboard-check'], ['laporan', 'Laporan harian', 'fa-file-pen'], ['c8', 'Cetak C8', 'fa-print'], ['c9', 'Rekod kehadiran C9', 'fa-table-cells']];

  $('#rmtNav').innerHTML = menu.map(([k, l, ik]) => `<button type="button" data-rs="${k}" aria-pressed="${R.sub === k}" class="btn ${R.sub === k ? 'btn-primary' : 'btn-ghost'}"><i class="fa-solid ${ik}"></i> ${l}</button>`).join('');
}
async function tukarSubRmt(sub) {
  if (sub === R.sub) return;
  if (R.dirty && !await confirmBox('Kehadiran RMT belum disimpan. Tinggalkan perubahan?')) return;
  R.dirty = false; R.sub = sub; lukisRmtNav(); bukaSubRmt();
}
function bukaSubRmt() {
  $('#bKad').classList.toggle('hidden', R.sub !== 'penerima');
  const el = $('#rmtIsi'); if (!el) return;
  if (R.sub === 'penerima') { el.innerHTML = ''; return; }
  ({ hadir: paintHadirRmt, laporan: paintLaporanRmt, c8: paintC8, c9: paintC9 })[R.sub]();
}

async function muatRmt(tarikh) { return pakaiRmt(await api('getRmt', { tarikh })); }
function pakaiRmt(d) {
  R.tarikh = d.tarikh; R.data = d; R.dirty = false; R.kelas = '';
  R.rekod = {};
  d.penerima.forEach(m => { R.rekod[m.id] = d.rekod && d.rekod[m.id] !== undefined ? d.rekod[m.id] : (m.sekolah === 'Hadir' || m.sekolah === 'Lewat' ? 1 : 0); });
  R.skor = d.skor ? d.skor.slice() : [0, 0, 0, 0];
  return d;
}
function selepasSimpanRmt() {
  const d = R.data;
  if (S.rmt && d.tarikh === todayStr()) {
    S.rmt.hadirSudah = d.tiadaRmt || !!d.rekod; S.rmt.laporanSudah = d.tiadaRmt || !!d.skor;
    snapshotBoot();
  }
}

async function paintHadirRmt() {
  const el = $('#rmtIsi'); el.innerHTML = `<div class="card p-4">${skel('h-12', 5, 'mb-2')}</div>`;
  try {
    const t = R.tarikh || todayStr();
    if (!(R.dirty && R.data && R.data.tarikh === t)) await muatRmt(t);
    if (R.sub === 'hadir') lukisHadirRmt();
  } catch (e) { el.innerHTML = errBox(e.message, 'paintHadirRmt()'); }
}
function ringkasHadirRmt() {
  const d = R.data, makan = d.penerima.filter(m => R.rekod[m.id]).length, jum = d.penerima.length;
  const kad = (n, l, w) => `<div class="rounded-xl p-2 text-center ${w}"><p class="text-xl font-extrabold">${n}</p><p class="text-[11px]">${l}</p></div>`;
  return kad(jum, 'Penerima RMT', 'bg-slate-100 text-slate-800') + kad(makan, 'Hadir makan', 'bg-green-50 text-green-700') + kad(jum - makan, 'Tidak makan', 'bg-rose-50 text-rose-700');
}
function barisHadirRmt(m, ubah) {
  const on = !!R.rekod[m.id], s = m.sekolah || 'Belum direkod';
  const w = s === 'Hadir' || s === 'Lewat' ? 'text-green-700' : s === 'Tidak Hadir' ? 'text-rose-600' : 'text-amber-600';
  return `<div class="px-4 py-2.5 flex items-center gap-3" data-rb="${esc(m.id)}">
    <div class="min-w-0 flex-1"><p class="text-xs font-bold text-slate-800 truncate">${esc(m.nama)}</p><p class="text-[11px] text-slate-500">${esc(namaKelasTajuk(IDX.kelas.get(m.idKelas)) || m.kelas)} · Kelas: <span class="${w}">${esc(s)}</span></p></div>
    <button type="button" data-rm="${esc(m.id)}" ${ubah ? '' : 'disabled'} aria-pressed="${on}" class="w-28 py-1.5 rounded-full border text-[11px] font-bold shrink-0 ${on ? 'bg-green-100 border-green-500 text-green-700' : 'bg-rose-50 border-rose-300 text-rose-600'}"><i class="fa-solid ${on ? 'fa-check' : 'fa-xmark'} mr-1"></i>${on ? 'Makan' : 'Tidak makan'}</button></div>`;
}
function senaraiHadirRmt() { return R.data.penerima.filter(m => !R.kelas || m.idKelas === R.kelas); }
function lukisHadirRmt() {
  const el = $('#rmtIsi'), d = R.data, ubah = d.bolehUbah;
  const kelasAda = Array.from(new Set(d.penerima.map(m => m.idKelas))).map(id => [id, namaKelasTajuk(IDX.kelas.get(id)) || id]);
  const guru = S.guru.slice().sort((a, b) => a.nama.localeCompare(b.nama));
  el.innerHTML = `<div class="space-y-3">
    <div class="card p-4 space-y-3">
      <div class="grid sm:grid-cols-3 gap-3">
        <div><label class="lbl" for="rmTarikh">Tarikh</label><input id="rmTarikh" type="date" class="inp" max="${todayStr()}" value="${esc(d.tarikh)}"><p class="text-[11px] text-slate-500 mt-1">${esc(d.hari)}</p></div>
        <div><label class="lbl" for="rmMenu">Menu hari ini</label><input id="rmMenu" class="inp" maxlength="200" value="${esc(d.menu)}" ${ubah ? '' : 'disabled'} placeholder="Cth: nasi ayam, sayur, buah"></div>
        <div><label class="lbl" for="rmGuru">Guru bertugas</label>${d.urus ? `<select id="rmGuru" class="inp"><option value="">Belum ditetapkan</option>${guru.map(g => `<option value="${esc(g.id)}" ${g.id === d.idGuruBertugas ? 'selected' : ''}>${esc(g.nama)}</option>`).join('')}</select>` : `<div class="inp">${esc(d.namaGuruBertugas || '-')}</div>`}</div>
      </div>
      <label class="flex items-center gap-2 text-xs text-slate-700"><input type="checkbox" id="rmTiada" ${d.tiadaRmt ? 'checked' : ''} ${ubah ? '' : 'disabled'}> Tiada RMT hari ini (cuti, Ramadan dan sebagainya)</label>
      <div id="rmTiadaBox" class="${d.tiadaRmt ? '' : 'hidden'}"><label class="lbl" for="rmSebab">Sebab</label><input id="rmSebab" class="inp" maxlength="200" value="${esc(d.tiadaRmt ? d.catatan : '')}" ${ubah ? '' : 'disabled'}></div>
      ${ubah ? '' : '<p class="text-[11px] text-amber-900 bg-amber-50 border border-amber-200 rounded-xl p-2">Paparan sahaja. Hanya guru bertugas hari ini, PIC RMT atau PK HEM boleh merekod.</p>'}
    </div>
    <div id="rmSenarai" class="${d.tiadaRmt ? 'hidden' : ''} space-y-3">
      ${d.penerima.length ? `<div class="card p-4 space-y-3">
        <div id="rmRingkas" class="grid grid-cols-3 gap-3">${ringkasHadirRmt()}</div>
        ${d.rekod ? '<p class="text-[11px] text-emerald-800 bg-emerald-50 border border-emerald-200 rounded-xl p-2"><i class="fa-solid fa-circle-check mr-1"></i>Kehadiran tarikh ini sudah direkod.</p>' : '<p class="text-[11px] text-sky-800 bg-sky-50 border border-sky-200 rounded-xl p-2"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i>Diisi awal daripada kehadiran kelas. Tekan murid yang berbeza. Kelas yang belum direkod ditanda "Tidak makan".</p>'}
        <div class="flex flex-wrap gap-2">
          <select id="rmKelas" class="${TAPIS_CLS}" aria-label="Tapis kelas"><option value="">Semua kelas</option>${kelasAda.map(([id, n]) => `<option value="${esc(id)}" ${R.kelas === id ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
          ${ubah ? '<button class="btn btn-ghost" id="rmSemua"><i class="fa-solid fa-check-double"></i> Semua makan</button>' : ''}
        </div>
      </div>
      <div class="card divide-y divide-slate-100 overflow-hidden" id="rmBaris">${senaraiHadirRmt().map(m => barisHadirRmt(m, ubah)).join('')}</div>` : `<div class="card">${emptyBox('fa-users', 'Belum ada penerima RMT berstatus Layak atau Selesai Agihan bagi tahun ini.')}</div>`}
    </div>
    ${ubah ? '<button class="btn btn-primary w-full py-3" id="rmSimpan"><i class="fa-solid fa-floppy-disk"></i> Simpan kehadiran</button>' : ''}
  </div>`;
  $('#rmTarikh').onchange = async e => {
    if (R.dirty && !await confirmBox('Kehadiran RMT belum disimpan. Tinggalkan perubahan?')) { e.target.value = R.tarikh; return; }
    R.dirty = false; R.tarikh = e.target.value || todayStr(); paintHadirRmt();
  };
  const tiada = $('#rmTiada');
  tiada.onchange = () => { $('#rmTiadaBox').classList.toggle('hidden', !tiada.checked); $('#rmSenarai').classList.toggle('hidden', tiada.checked); R.dirty = true; };
  ['#rmMenu', '#rmSebab'].forEach(s => { if ($(s)) $(s).oninput = () => { R.dirty = true; }; });
  if ($('#rmGuru')) $('#rmGuru').onchange = () => { R.dirty = true; };
  if ($('#rmKelas')) $('#rmKelas').onchange = e => { R.kelas = e.target.value; $('#rmBaris').innerHTML = senaraiHadirRmt().map(m => barisHadirRmt(m, ubah)).join(''); };
  if ($('#rmSemua')) $('#rmSemua').onclick = () => {
    senaraiHadirRmt().forEach(m => { R.rekod[m.id] = 1; });
    R.dirty = true; $('#rmBaris').innerHTML = senaraiHadirRmt().map(m => barisHadirRmt(m, ubah)).join(''); $('#rmRingkas').innerHTML = ringkasHadirRmt();
  };
  if ($('#rmBaris')) $('#rmBaris').onclick = e => {
    const b = e.target.closest('[data-rm]'); if (!b || b.disabled) return;
    const id = b.dataset.rm, m = d.penerima.find(x => x.id === id);
    R.rekod[id] = R.rekod[id] ? 0 : 1; R.dirty = true;
    b.closest('[data-rb]').outerHTML = barisHadirRmt(m, ubah);
    $('#rmRingkas').innerHTML = ringkasHadirRmt();
  };
  if ($('#rmSimpan')) $('#rmSimpan').onclick = e => busy(e.currentTarget, async () => {
    const p = { tarikh: d.tarikh, menu: $('#rmMenu').value.trim(), tiadaRmt: tiada.checked };
    if ($('#rmGuru')) p.idGuruBertugas = $('#rmGuru').value;
    if (tiada.checked) p.catatan = $('#rmSebab').value.trim();
    else {
      if (!d.penerima.length) throw new Error('Tiada penerima RMT untuk direkod.');
      p.rekod = R.rekod;
    }
    const r = pakaiRmt(await api('simpanRmt', p));
    selepasSimpanRmt();
    toast(tiada.checked ? 'Tarikh ini ditanda tiada RMT.' : `Kehadiran disimpan: ${r.bilHadir} murid makan.`, 'success');
    lukisHadirRmt();
  }, 'Menyimpan…');
}

async function paintLaporanRmt() {
  const el = $('#rmtIsi'); el.innerHTML = `<div class="card p-4">${skel('h-12', 5, 'mb-2')}</div>`;
  try { await muatRmt(R.tarikh || todayStr()); if (R.sub === 'laporan') lukisLaporanRmt(); }
  catch (e) { el.innerHTML = errBox(e.message, 'paintLaporanRmt()'); }
}
function lukisLaporanRmt() {
  const el = $('#rmtIsi'), d = R.data, ubah = d.bolehUbah && !d.tiadaRmt, adaRekod = !!d.rekod && !d.tiadaRmt;
  el.innerHTML = `<div class="card p-4 space-y-4">
    <div class="grid sm:grid-cols-2 gap-3 items-end">
      <div><label class="lbl" for="rlTarikh">Tarikh</label><input id="rlTarikh" type="date" class="inp" max="${todayStr()}" value="${esc(d.tarikh)}"></div>
      <div class="text-xs text-slate-600"><p>${esc(d.hari)} · Guru bertugas: <b>${esc(d.namaGuruBertugas || '-')}</b></p><p>Menu: <b>${esc(d.menu || '-')}</b> · Bil. murid hadir: <b>${adaRekod ? d.bilHadir : '-'}</b></p></div>
    </div>
    ${d.tiadaRmt ? `<p class="text-xs text-slate-700 bg-slate-100 rounded-xl p-3">Tarikh ini ditanda tiada RMT${d.catatan ? ': ' + esc(d.catatan) : ''}. Laporan tidak diperlukan.</p>` : !adaRekod
      ? `<p class="text-xs text-amber-900 bg-amber-50 border border-amber-200 rounded-xl p-3">Rekod kehadiran tarikh ini dahulu. <button class="font-bold underline" onclick="tukarSubRmt('hadir')">Buka kehadiran harian</button></p>`
      : `<div class="space-y-2">${KRITERIA_RMT.map((k, i) => `<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 bg-slate-50 rounded-xl p-3">
          <span class="text-xs font-semibold text-slate-700">${i + 1}. ${k}</span>
          <div class="flex gap-1.5">${[1, 2, 3, 4].map(s => `<button type="button" data-rk="${i}" data-rv="${s}" title="${SKALA_RMT[s - 1]}" aria-label="${k}: ${s} ${SKALA_RMT[s - 1]}" aria-pressed="${R.skor[i] === s}" ${ubah ? '' : 'disabled'} class="w-10 h-10 rounded-lg border-2 text-sm font-bold ${R.skor[i] === s ? 'bg-brand-600 border-brand-600 text-white' : 'bg-white border-slate-200 text-slate-500'}">${s}</button>`).join('')}</div></div>`).join('')}</div>
        <p class="text-[11px] text-slate-500">1 Tidak memuaskan · 2 Kurang memuaskan · 3 Memuaskan · 4 Sangat memuaskan</p>
        <div><label class="lbl" for="rlCatatan">Catatan</label><textarea id="rlCatatan" rows="2" maxlength="500" class="inp" ${ubah ? '' : 'disabled'}>${esc(d.catatan)}</textarea></div>
        ${ubah ? '<button class="btn btn-primary w-full py-3" id="rlSimpan"><i class="fa-solid fa-floppy-disk"></i> Simpan laporan harian</button>' : '<p class="text-[11px] text-amber-900 bg-amber-50 border border-amber-200 rounded-xl p-2">Paparan sahaja. Hanya guru bertugas hari ini, PIC RMT atau PK HEM boleh mengisi.</p>'}`}

    R.data.catatan = $('#rlCatatan').value;      // kekalkan catatan yang sedang ditaip
    R.skor[Number(b.dataset.rk)] = Number(b.dataset.rv); lukisLaporanRmt();
  });
  if ($('#rlSimpan')) $('#rlSimpan').onclick = e => busy(e.currentTarget, async () => {
    if (R.skor.some(s => !s)) throw new Error('Isi skor bagi keempat-empat kriteria.');

    selepasSimpanRmt(); toast('Laporan harian disimpan.', 'success'); lukisLaporanRmt();

/* ---- Cetakan C8 (seminggu) ---- */
function isninBagi(t) { const d = toDate(t); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; }
async function paintC8() {
  const el = $('#rmtIsi'); if (!R.minggu) R.minggu = todayStr();
  const mula = isninBagi(R.minggu), hingga = new Date(mula); hingga.setDate(mula.getDate() + 4);
  el.innerHTML = `<div class="space-y-3"><div class="card p-4 flex flex-wrap items-end gap-3">
      <div><label class="lbl" for="c8Tarikh">Minggu bagi tarikh</label><input id="c8Tarikh" type="date" class="inp w-auto" value="${esc(R.minggu)}"></div>
      <p class="text-xs text-slate-600 flex-1">${fmtPendek(isoTarikh(mula))} hingga ${fmtPendek(isoTarikh(hingga))}</p>
      <button class="btn btn-primary" id="c8Cetak" disabled><i class="fa-solid fa-print"></i> Cetak / PDF</button></div>
    <div class="card p-4 overflow-x-auto" id="c8Isi">${skel('h-12', 5, 'mb-2')}</div></div>`;
  $('#c8Tarikh').onchange = e => { R.minggu = e.target.value || todayStr(); paintC8(); };
  try {
    const d = await api('julatRmt', { dari: isoTarikh(mula), hingga: isoTarikh(hingga) });
    if (R.sub !== 'c8' || !$('#c8Isi')) return;
    const html = c8HTML(d, mula);
    $('#c8Isi').innerHTML = html;
    $('#c8Cetak').disabled = false;
    $('#c8Cetak').onclick = () => printHTML(`<style>@page{size:A4 landscape;margin:10mm}</style>${html}`);
  } catch (e) { $('#c8Isi').innerHTML = errBox(e.message, 'paintC8()'); }
}
function c8HTML(d, mula) {
  const td = 'border:1px solid #475569;padding:3px 5px', th = td + ';background:#e2e8f0;text-align:center';
  const ikut = {}; d.hari.forEach(h => { ikut[h.tarikh] = h; });
  const baris = HARI_SEKOLAH.map((nama, i) => {
    const t = new Date(mula); t.setDate(mula.getDate() + i);
    const iso = isoTarikh(t), h = ikut[iso], tiada = h && h.tiadaRmt, rs = 'rowspan="4"';
    return KRITERIA_RMT.map((k, ki) => `<tr>${ki === 0 ? `<td ${rs} style="${td};text-align:center">${nama}<br>${t.getDate()}/${t.getMonth() + 1}/${t.getFullYear()}</td>
        <td ${rs} style="${td};text-align:center">${esc((h && h.guru) || '')}</td><td ${rs} style="${td};text-align:center;font-weight:700">${h && !tiada ? h.bilHadir : ''}</td>` : ''}
      <td style="${td}">${ki + 1}. ${k}</td><td style="${td};text-align:center">${h && h.skor ? h.skor[ki] : ''}</td>
      ${ki === 0 ? `<td ${rs} style="${td}">${tiada ? 'Tiada RMT. ' : ''}${esc((h && h.catatan) || '')}</td><td ${rs} style="${td}"></td><td ${rs} style="${td}"></td>` : ''}</tr>`).join('');
  }).join('');
  return `<div style="font-size:10px;color:#0f172a;min-width:680px">
    <div style="text-align:right;font-weight:700">C8</div>
    <div style="text-align:center;margin-bottom:6px">${logoCetak('height:36px;display:block;margin:0 auto 3px')}
      <div style="font-size:12px;font-weight:800">LAPORAN HARIAN RANCANGAN MAKANAN TAMBAHAN (RMT) ${mula.getFullYear()}</div>
      <div>${esc(S.tetapan.namaSekolah || '')}</div></div>
    <table style="width:100%;border-collapse:collapse"><tr>${['HARI/TARIKH', 'GURU BERTUGAS', 'BIL. MURID HADIR', 'KRITERIA', 'SKOR', 'CATATAN', 'TANDATANGAN RMT GURU', 'TANDATANGAN PENGUSAHA'].map(x => `<th style="${th}">${x}</th>`).join('')}</tr>${baris}</table>
    <div style="margin-top:5px">Skor: 1 Tidak memuaskan, 2 Kurang memuaskan, 3 Memuaskan, 4 Sangat memuaskan</div>
    <div style="margin-top:16px">DI SEMAK OLEH: ______________________</div></div>`;
}

/* ---- Rekod kehadiran C9 (sebulan) ---- */

    const td = 'border:1px solid #475569;padding:2px 3px;text-align:center', th = td + ';background:#e2e8f0';
    const html = `<div style="font-size:9.5px;color:#0f172a">

    body: `
      ${a ? `<p class="text-xs text-slate-600 bg-slate-50 rounded-xl p-3"><b>${esc(a.kod)}</b>: ${esc(a.namaBantuan)}<br>${esc(a.namaKelas)}, ${esc(a.kategoriPendapatan || '')} ${fmtRM(a.pendapatan)}${a.perKapita != null ? ', per kapita ' + fmtRM(a.perKapita) : ''}</p>` : `
        <div><label class="lbl">Skim bantuan</label><select id="agKat" class="inp">${bolehDaftar.map(k => `<option value="${esc(k.id)}" ${B.kat === k.id ? 'selected' : ''}>${esc(k.kod)}: ${esc(k.nama)}</option>`).join('')}</select>
          <p id="agKriteria" class="text-[11px] text-slate-500 mt-1"></p></div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div><label class="lbl">Status</label><select id="agStatus" class="inp">${STATUS_AGIHAN.map(s => `<option ${(a ? a.status : 'Dalam Proses') === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
        <div><label class="lbl">Tarikh serahan</label><input id="agTarikh" type="date" class="inp" value="${a ? esc(a.tarikhSerahan) : ''}"></div>
        <div><label class="lbl">Amaun (RM, jika ada)</label><input id="agAmaun" type="number" min="0" step="0.01" class="inp" value="${a && a.amaun != null ? a.amaun : ''}"></div>
      </div>
      <div><label class="lbl">Catatan</label><textarea id="agCatatan" rows="2" class="inp" maxlength="500">${a ? esc(a.catatan) : ''}</textarea></div>`,
    footer: `<button class="btn btn-ghost" data-close>Batal</button><button class="btn btn-primary" id="agSave">${a ? 'Simpan perubahan' : 'Daftar penerima'}</button>`
  });
  if (!a) {
    let pilih = null, calon = new Map();
    // Papar maklumat pendapatan murid & sama ada memenuhi had skim yang dipilih
    const infoMurid = () => {
      const mu = pilih, z = mu && (mu.sensitif || calon.get(mu.id)); if (!z) return;
      const k = S.katBantuan.find(x => x.id === $('#agKat').value) || {};
      const l = layakSkim(z.pendapatan, z.perKapita, k);
      if (!wargaNegara(mu)) { $('#agInfo').innerHTML = `${esc(mu.namaKelas)}. <span class="badge bg-rose-100 text-rose-700">Bukan warganegara: tidak layak menerima bantuan</span>`; return; }
      $('#agInfo').innerHTML =`${esc(mu.namaKelas)}. Isi rumah: ${badgePendapatan(z.kategoriPendapatan)} ${fmtRM(z.pendapatan)}, per kapita ${fmtRM(z.perKapita)}${z.bilIsiRumah ? ` (${z.bilIsiRumah} orang)` : ''}${adaStatus(z.yatim) ? `, ${esc(z.yatim.toLowerCase())}` : ''}` +
        (z.pendapatan == null && !semuaLayakSkim(k) ? ' <span class="badge bg-amber-100 text-amber-900">Tiada maklumat pendapatan: tidak akan dipaparkan dalam senarai penerima</span>'
        : l === null ? '' : l ? ' <span class="badge bg-emerald-100 text-emerald-800">Memenuhi had skim</span>' : ' <span class="badge bg-rose-100 text-rose-700">Tidak memenuhi had skim</span>');
    };
    const showK = () => {
      const k = S.katBantuan.find(x => x.id === $('#agKat').value);
      $('#agKriteria').textContent = [k && teksHad(k) ? 'Had: ' + teksHad(k) : '', k && k.kriteria ? 'Kriteria: ' + k.kriteria : ''].filter(Boolean).join(' · ');
      infoMurid();
      if (k) calonSkim(k.id).then(c => { calon = c; if ($('#agInfo')) infoMurid(); }).catch(() => {});
    };
    $('#agKat').addEventListener('change', showK); showK();
    bindPicker('ag', mu => { pilih = mu; infoMurid(); });
  }
  m.querySelector('#agSave').onclick = e => busy(e.currentTarget, async () => {
    const p = { status: $('#agStatus').value, tarikhSerahan: $('#agTarikh').value, amaun: $('#agAmaun').value, catatan: $('#agCatatan').value.trim() };
    if (a) p.idAgihan = a.idAgihan;
    else {
      p.idKategori = $('#agKat').value; p.idMurid = $('#agId').value;
      if (!p.idMurid) throw new Error('Pilih murid daripada senarai carian.');
    }
    await api('simpanAgihan', p);
    DB.del('dash'); closeModal(); toast(a ? 'Status agihan dikemas kini.' : 'Penerima didaftarkan.', 'success');
    loadBantuan();
  });
}

        <div class="grid grid-cols-2 gap-3">
          <div><label class="lbl">Isi rumah maksimum (RM)</label><input id="skHadI" type="number" min="0" step="0.01" class="inp" placeholder="cth 5249" value="${v(k && k.hadIsiRumah)}"></div>
          <div><label class="lbl">Per kapita maksimum (RM)</label><input id="skHadP" type="number" min="0" step="0.01" class="inp" placeholder="cth 1198" value="${v(k && k.hadPerKapita)}"></div>

          <option value="KEDUA" ${!k || k.syarat !== 'SALAH_SATU' ? 'selected' : ''}>Mesti memenuhi KEDUA-DUA had</option>
          <option value="SALAH_SATU" ${k && k.syarat === 'SALAH_SATU' ? 'selected' : ''}>Memadai memenuhi SALAH SATU had</option></select></div>

      </div>

// Senarai murid yang memenuhi had skim & belum didaftarkan tahun ini → daftar pukal
async function openMuridLayak(idKat) {
  const k = S.katBantuan.find(x => x.id === idKat); if (!k) return;
  if (!teksHad(k)) return toast('Tetapkan had kelayakan skim ini dahulu (butang Ubah skim).', 'error');
  const sudah = new Set((B.list || []).filter(a => a.idKategori === k.id).map(a => a.idMurid));
  let calon;
  try { calon = await calonSkim(k.id); } catch (e) { return toast(e.message, 'error'); }
  const ada = S.murid.filter(m => calon.has(m.id)).map(m => Object.assign({}, m, { sensitif: calon.get(m.id) }));
  const tiadaData = semuaLayakSkim(k) ? 0 : ada.filter(m => wargaNegara(m) && m.sensitif.pendapatan == null).length;
  const bukanWarga = ada.filter(m => !wargaNegara(m)).length;
  const layak = ada.filter(m => !sudah.has(m.id) && wargaNegara(m) && layakSkim(m.sensitif.pendapatan, m.sensitif.perKapita, k))
    .sort((a, b) => (a.sensitif.perKapita ?? 1e9) - (b.sensitif.perKapita ?? 1e9) || a.nama.localeCompare(b.nama));
  const m = openModal({
    title: `Murid layak ${esc(k.kod)} (${B.tahun})`, size: 'max-w-3xl',
    body: `
      <p class="text-xs text-slate-600 bg-slate-50 rounded-xl p-3">Had: <b>${esc(teksHad(k))}</b>. ${layak.length} murid memenuhi had dan belum didaftarkan.${tiadaData ? ` ${tiadaData} murid tiada maklumat pendapatan (tidak disenaraikan).` : ''}${bukanWarga ? ` ${bukanWarga} murid bukan warganegara tidak layak.` : ''}</p>
      ${layak.length ? `<div class="max-h-[55vh] overflow-y-auto border border-slate-200 rounded-xl"><table class="w-full text-xs">
        <thead class="bg-slate-50 sticky top-0"><tr><th class="th w-8"><input type="checkbox" id="lyAll" checked aria-label="Pilih semua"></th><th class="th">Murid</th><th class="th">Kelas</th><th class="th">Isi rumah</th><th class="th">Per kapita</th><th class="th">Ahli</th></tr></thead>
        <tbody class="divide-y divide-slate-100">${layak.map(x => `<tr><td class="td"><input type="checkbox" data-ly="${esc(x.id)}" checked></td>
          <td class="td font-semibold text-slate-800">${esc(x.nama)}</td><td class="td">${esc(x.namaKelas)}</td>
          <td class="td">${badgePendapatan(x.sensitif.kategoriPendapatan)} ${fmtRM(x.sensitif.pendapatan)}</td><td class="td font-semibold">${fmtRM(x.sensitif.perKapita)}</td><td class="td">${x.sensitif.bilIsiRumah || '-'}</td></tr>`).join('')}</tbody></table></div>` : emptyBox('fa-circle-check', 'Tiada murid baharu yang memenuhi had skim ini.')}`,
    footer: `<button class="btn btn-ghost" data-close>Tutup</button>${layak.length && urusSkim(k) ? '<button class="btn btn-primary" id="lyDaftar"><i class="fa-solid fa-user-plus"></i> Daftar dipilih (status Layak)</button>' : ''}`
  });
  const semua = m.querySelector('#lyAll');
  if (semua) semua.onchange = () => m.querySelectorAll('[data-ly]').forEach(c => { c.checked = semua.checked; });
  const btn = m.querySelector('#lyDaftar');
  if (btn) btn.onclick = e => busy(e.currentTarget, async () => {
    const ids = Array.from(m.querySelectorAll('[data-ly]:checked')).map(c => c.dataset.ly);
    if (!ids.length) throw new Error('Tiada murid dipilih.');
    const r = await api('daftarAgihanPukal', { idKategori: k.id, idMurid: ids, status: 'Layak' });
    DB.del('dash'); closeModal();
    toast(`${r.didaftar} murid didaftarkan untuk ${k.kod}.${r.dilangkau ? ` ${r.dilangkau} dilangkau.` : ''}`, 'success');
    loadBantuan();
  }, 'Mendaftar…');
}

/* ==================================================================
 *  KEBERSIHAN & 3K (semua guru boleh menilai; hanya penilai boleh mengubah)
 * ================================================================== */
const KB = { bulan: '', tahun: '', idKelas: '', edit: null, list: null, fTahun: '', fKelas: '', saya: false };
const RUBRIK = [['lantai', 'Lantai dan tingkap'], ['meja', 'Susunan meja dan kerusi'], ['sudut', 'Sudut info dan papan kenyataan'], ['bacaan', 'Sudut bacaan dan tong sampah']];
const gredBersih = v => v >= 90 ? 'A (Cemerlang)' : v >= 80 ? 'B (Baik)' : v >= 65 ? 'C (Sederhana)' : 'D (Perlu tindakan)';

function renderKebersihan() {
  const el = $('#view-kebersihan');
  if (!KB.bulan) KB.bulan = todayStr().slice(0, 7);
  if (!KB.idKelas || !IDX.kelas.has(KB.idKelas)) KB.idKelas = defaultKelas();
  KB.idKelas = selarasKelas(KB.idKelas, KB.tahun, true);
  el.innerHTML = `
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
      <div class="card p-5 space-y-4 self-start" id="kbForm"></div>
      <div class="lg:col-span-2 space-y-5">
        <div class="card p-5 space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-3">
            <div><h3 class="font-bold text-slate-800">Kedudukan kebersihan kelas</h3><p class="text-xs text-slate-500">Purata semua penilaian dalam bulan dipilih</p></div>
            <input type="month" id="kbBulan" value="${KB.bulan}" max="${todayStr().slice(0, 7)}" class="inp w-auto py-1.5" aria-label="Bulan">
          </div>
          <div id="kbBoard">${skel('h-24', 1)}${skel('h-40', 1, 'mt-3')}</div>
        </div>
        <div class="card overflow-hidden">
          <div class="p-4 border-b border-slate-100 space-y-3">
            <div><h3 class="font-bold text-slate-800">Rekod penilaian</h3><p class="text-xs text-slate-500">Semua guru boleh melihat. Hanya guru yang mengisi boleh mengubah penilaiannya.</p></div>
            <div class="flex flex-wrap items-center gap-2">
              <select id="kbfTahun" class="${TAPIS_CLS}" aria-label="Tapis tahun">${tahunOptions(KB.fTahun)}</select>
              <select id="kbfKelas" class="${TAPIS_CLS}" aria-label="Tapis kelas">${kelasOptions(KB.fKelas, 'Semua kelas', KB.fTahun)}</select>
              <label class="inline-flex items-center gap-2 text-xs font-semibold text-slate-600 cursor-pointer"><input type="checkbox" id="kbSaya" ${KB.saya ? 'checked' : ''} class="w-4 h-4" style="accent-color:rgb(var(--b600))"> Penilaian saya sahaja</label>
            </div>
          </div>
          <div id="kbList" class="divide-y divide-slate-100">${skel('h-16', 3, 'm-3')}</div>
        </div>
      </div>
    </div>`;
  $('#kbBulan').addEventListener('change', e => { KB.bulan = e.target.value || todayStr().slice(0, 7); loadKedudukan(); loadSenaraiKebersihan(); });
  $('#kbfTahun').addEventListener('change', e => {
    KB.fTahun = e.target.value; KB.fKelas = selarasKelas(KB.fKelas, KB.fTahun, false);
    $('#kbfKelas').innerHTML = kelasOptions(KB.fKelas, 'Semua kelas', KB.fTahun); paintSenaraiKebersihan();
  });
  $('#kbfKelas').addEventListener('change', e => { KB.fKelas = e.target.value; paintSenaraiKebersihan(); });
  $('#kbSaya').addEventListener('change', e => { KB.saya = e.target.checked; paintSenaraiKebersihan(); });
  paintBorangKebersihan();
  loadKedudukan();
  loadSenaraiKebersihan();
}

function paintBorangKebersihan() {
  const e = KB.edit;
  const nilai = k => e ? e.skor[k] : 20;
  $('#kbForm').innerHTML = `
    <div class="border-b border-slate-100 pb-3">
      <h3 class="font-bold text-slate-800">${e ? 'Ubah penilaian anda' : 'Borang skor kebersihan'}</h3>
      <p class="text-xs text-slate-500">${e ? `${esc(e.namaKelas)}, ${fmtTarikh(e.tarikh)}` : 'Semua guru boleh menilai kebersihan kelas (3K)'}</p>
    </div>
    ${e ? `<p class="text-xs text-violet-800 bg-violet-50 border border-violet-200 rounded-xl p-2.5"><i class="fa-solid fa-pen mr-1"></i> Anda sedang mengubah penilaian sendiri. Kelas dan tarikh tidak boleh ditukar.</p>` : `
    <div class="grid grid-cols-2 gap-2">
      <div><label class="lbl">Tahun</label><select id="kbTahun" class="inp">${tahunOptions(KB.tahun)}</select></div>
      <div><label class="lbl">Kelas dinilai</label><select id="kbKelas" class="inp font-bold">${kelasOptions(KB.idKelas, null, KB.tahun)}</select></div>
    </div>
    <p class="text-[11px] text-slate-500">Jika anda sudah menilai kelas yang sama hari ini, penilaian itu akan dikemas kini (bukan ditambah).</p>`}
    ${RUBRIK.map(([k, l]) => `
      <div><div class="flex justify-between text-xs font-semibold mb-1"><span>${l}</span><span class="text-brand-600 font-bold"><span id="kbV-${k}">${nilai(k)}</span> / 25</span></div>
      <input type="range" id="kbR-${k}" min="0" max="25" value="${nilai(k)}" class="w-full" style="accent-color:rgb(var(--b600))"></div>`).join('')}
    <div class="p-3 bg-brand-50 rounded-xl flex items-center justify-between border border-brand-200">
      <div><span class="font-bold text-brand-900 text-xs">Jumlah skor</span><p id="kbGred" class="text-[11px] text-brand-800"></p></div>
      <span id="kbTotal" class="text-2xl font-black text-brand-600"></span>
    </div>
    <div>
      <label class="lbl">Foto kelas (pilihan)</label>
      ${e && e.fotoId ? `<div class="flex items-center gap-2 mb-2 text-xs"><button class="btn btn-ghost py-1" onclick="lihatFoto('${jsq(e.fotoId)}')"><i class="fa-solid fa-image"></i> Foto semasa</button><span class="text-slate-500">Pilih foto baharu untuk menggantikannya.</span></div>` : ''}
      <label class="block border-2 border-dashed border-slate-200 rounded-xl p-3 text-center cursor-pointer hover:bg-slate-50">
        <i class="fa-solid fa-camera text-slate-400 text-lg"></i><p class="text-[11px] text-slate-500">Ambil gambar atau pilih foto</p>
        <input type="file" id="kbFoto" accept="image/*" capture="environment" class="hidden" onchange="previewInput(this,'#kbPrev')">
      </label>
      <img id="kbPrev" class="hidden mt-2 h-28 w-full object-cover rounded-lg border border-slate-200" alt="Pratonton foto">
    </div>
    <div class="flex gap-2">
      ${e ? '<button class="btn btn-ghost flex-1 py-2.5" onclick="KB.edit=null;paintBorangKebersihan()">Batal</button>' : ''}
      <button class="btn btn-primary flex-1 py-2.5" onclick="hantarKebersihan(this)"><i class="fa-solid fa-circle-check"></i> ${e ? 'Simpan perubahan' : 'Hantar skor'}</button>
    </div>`;
  RUBRIK.forEach(([k]) => $('#kbR-' + k).addEventListener('input', kiraKebersihan));
  if (!e) {
    $('#kbKelas').addEventListener('change', ev => { KB.idKelas = ev.target.value; });
    $('#kbTahun').addEventListener('change', ev => {
      KB.tahun = ev.target.value; KB.idKelas = selarasKelas(KB.idKelas, KB.tahun, true);
      $('#kbKelas').innerHTML = kelasOptions(KB.idKelas, null, KB.tahun);
    });
  }
  kiraKebersihan();
}

function kiraKebersihan() {
  let t = 0;
  RUBRIK.forEach(([k]) => { const v = Number($('#kbR-' + k).value); $('#kbV-' + k).textContent = v; t += v; });
  $('#kbTotal').textContent = `${t} / 100`; $('#kbGred').textContent = 'Gred ' + gredBersih(t);
  return t;
}

async function hantarKebersihan(btn) {
  await busy(btn, async () => {
    const skor = {}; RUBRIK.forEach(([k]) => { skor[k] = Number($('#kbR-' + k).value); });
    const f = $('#kbFoto').files[0];
    const p = KB.edit ? { idNilai: KB.edit.idNilai, skor } : { idKelas: $('#kbKelas').value, skor };
    if (f) p.fotoId = await uploadFoto(f, 'kebersihan', 1280);
    const r = await api('simpanKebersihan', p);
    DB.del('dash');
    const nama = KB.edit ? KB.edit.namaKelas : IDX.kelas.get(p.idKelas).nama;
    toast(r.dikemaskini ? `Penilaian ${nama} dikemas kini (${r.jumlah}/100).` : `Skor ${nama} (${r.jumlah}/100) dihantar.`, 'success');
    KB.edit = null; paintBorangKebersihan();
    loadKedudukan(); loadSenaraiKebersihan();
  }, 'Menyimpan…');
}

async function loadSenaraiKebersihan() {
  const box = $('#kbList'); if (!box) return;
  const bulan = KB.bulan;
  try {
    const list = await api('senaraiKebersihan', { bulan });
    if (bulan !== KB.bulan) return;
    KB.list = list; paintSenaraiKebersihan();
  } catch (e) { box.innerHTML = errBox(e.message, 'loadSenaraiKebersihan()'); }
}

function paintSenaraiKebersihan() {
  const box = $('#kbList'); if (!box || !KB.list) return;
  const list = KB.list.filter(r => (!KB.fTahun || r.tahun === KB.fTahun) && (!KB.fKelas || r.idKelas === KB.fKelas) && (!KB.saya || r.milikSaya));
  const [y, mo] = KB.bulan.split('-').map(Number);
  box.innerHTML = list.length ? list.map(r => `
    <div class="p-3.5 flex flex-col sm:flex-row sm:items-center gap-3 ${r.milikSaya ? 'bg-brand-50/40' : ''}">
      <div class="flex items-center gap-3 flex-1 min-w-0">
        <span class="w-12 h-12 rounded-xl ${r.jumlah >= 90 ? 'bg-emerald-100 text-emerald-700' : r.jumlah >= 80 ? 'bg-sky-100 text-sky-700' : r.jumlah >= 65 ? 'bg-amber-100 text-amber-700' : 'bg-rose-100 text-rose-700'} flex flex-col items-center justify-center shrink-0">
          <span class="text-base font-black leading-none">${r.jumlah}</span><span class="text-[9px] font-bold">/100</span>
        </span>
        <div class="min-w-0">
          <p class="text-sm font-bold text-slate-800">${esc(r.namaKelas)} <span class="text-[11px] font-normal text-slate-400">${HARI[toDate(r.tarikh).getDay()]}, ${fmtPendek(r.tarikh)}</span></p>
          <p class="text-[11px] text-slate-500">Lantai ${r.skor.lantai}, meja ${r.skor.meja}, sudut ${r.skor.sudut}, bacaan ${r.skor.bacaan} · Gred ${esc(gredBersih(r.jumlah).split(' ')[0])}</p>
          <p class="text-[11px] ${r.milikSaya ? 'text-brand-700 font-semibold' : 'text-slate-400'}"><i class="fa-solid fa-user-pen mr-1"></i>${r.milikSaya ? 'Penilaian anda' : esc(r.penilai)}</p>
        </div>
      </div>
      <div class="flex gap-2 shrink-0 sm:justify-end">
        ${r.fotoId ? `<button class="btn btn-ghost py-1 text-[11px]" onclick="lihatFoto('${jsq(r.fotoId)}')"><i class="fa-solid fa-image"></i> Foto</button>` : ''}
        ${r.milikSaya ? `<button class="btn btn-ghost py-1 text-[11px]" onclick="ubahKebersihan('${jsq(r.idNilai)}')"><i class="fa-solid fa-pen"></i> Ubah</button>`
          : '<span class="inline-flex items-center gap-1 text-[11px] text-slate-400 px-2" title="Hanya guru yang mengisi boleh mengubah"><i class="fa-solid fa-lock"></i> Lihat sahaja</span>'}
      </div>
    </div>`).join('') : emptyBox('fa-broom', KB.saya ? `Anda belum menilai sebarang kelas pada ${BULAN[mo - 1]} ${y}.` : `Tiada penilaian sepadan bagi ${BULAN[mo - 1]} ${y}.`);
}

function ubahKebersihan(id) {
  const r = (KB.list || []).find(x => x.idNilai === id);
  if (!r || !r.milikSaya) return toast('Hanya guru yang mengisi boleh mengubah penilaian ini.', 'error');
  KB.edit = r; paintBorangKebersihan();
  $('#kbForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function loadKedudukan() {
  const box = $('#kbBoard');
  try {
    const r = await api('kedudukanKebersihan', { bulan: KB.bulan });
    const k = r.kedudukan || [];
    const [y, mo] = KB.bulan.split('-').map(Number);
    if (!k.length) { box.innerHTML = emptyBox('fa-broom', `Belum ada penilaian untuk ${BULAN[mo - 1]} ${y}.`); return; }
    const medal = [['Johan', 'bg-amber-100 border-amber-300', 'fa-trophy text-amber-500'], ['Naib johan', 'bg-slate-100 border-slate-300', 'fa-medal text-slate-400'], ['Ketiga', 'bg-orange-100 border-orange-300', 'fa-award text-amber-700']];
    box.innerHTML = `
      <div class="grid grid-cols-3 gap-3">${k.slice(0, 3).map((c, i) => `
        <div class="border ${medal[i][1]} p-3 rounded-2xl text-center flex flex-col items-center">
          <i class="fa-solid ${medal[i][2]} text-2xl mb-1"></i><span class="text-[11px] font-bold">${medal[i][0]}</span>
          <p class="font-black text-sm text-slate-900 mt-1 truncate w-full">${esc(c.nama)}</p><p class="text-xs font-bold">${c.purata} / 100</p>
        </div>`).join('')}</div>
      <div class="overflow-x-auto mt-4"><table class="w-full text-xs">
        <thead class="bg-slate-50"><tr><th class="th text-center">Kedudukan</th><th class="th">Kelas</th><th class="th">Sesi</th><th class="th">Purata</th><th class="th">Gred</th><th class="th">Penilaian</th><th class="th">Penilai terakhir</th></tr></thead>
        <tbody class="divide-y divide-slate-100">${k.map((c, i) => `
          <tr><td class="td text-center font-bold text-slate-400">${i + 1}</td><td class="td font-bold">${esc(c.nama)}</td><td class="td">${esc(c.sesi || '-')}</td>
          <td class="td font-extrabold">${c.purata}</td><td class="td ${c.purata >= 90 ? 'text-emerald-700 font-bold' : c.purata >= 80 ? 'text-blue-700' : 'text-amber-700'}">${esc(c.gred)}</td>
          <td class="td">${c.bilPenilaian} kali</td><td class="td text-slate-500">${esc(c.penilaiTerakhir || '-')}</td></tr>`).join('')}</tbody></table></div>`;
  } catch (e) { box.innerHTML = errBox(e.message, 'loadKedudukan()'); }
}

function setJenisDisiplin(j) {

  $('#dBtnDemerit').className = 'py-2 rounded-xl text-xs font-bold border-2 ' + (j === 'Demerit' ? on : 'bg-slate-50 text-slate-600 border-slate-200');
  $('#dBtnMerit').className = 'py-2 rounded-xl text-xs font-bold border-2 ' + (j === 'Merit' ? on : 'bg-slate-50 text-slate-600 border-slate-200');
  const kat = S.katDisiplin.filter(k => k.jenis === j);
  $('#dKat').innerHTML = kat.map(k => `<option value="${esc(k.id)}" data-mata="${k.mata}">${esc(k.nama)} (${j === 'Demerit' ? '-' : '+'}${k.mata})</option>`).join('') || '<option value="">Tiada kategori</option>';

function paintMeritTable() {
  const q = D.fQ.trim().toLowerCase();
  const list = S.murid.filter(m => muridLulus(m, D.fTahun, D.fKelas) && (!D.fStatus || m.statusMerit === D.fStatus) && (!q || m.nama.toLowerCase().includes(q)))
    .sort((a, b) => a.merit - b.merit || a.nama.localeCompare(b.nama));
  const show = list.slice(0, D.had);
  $('#dBody').innerHTML = show.length ? show.map(m => `
    <tr class="hover:bg-slate-50/70">
      <td class="td"><p class="font-bold text-slate-800">${esc(m.nama)}</p><p class="text-[10px] text-slate-400">${esc(m.id)}</p></td>
      <td class="td">${esc(m.namaKelas)}</td>
      <td class="td text-center"><span class="text-sm font-black ${m.statusMerit === 'Kritikal' ? 'text-rose-600' : m.statusMerit === 'Amaran' ? 'text-amber-600' : 'text-slate-800'}">${m.merit}</span></td>
      <td class="td">${meritBadge(m.statusMerit)}</td>
      <td class="td text-right whitespace-nowrap">
        <button class="btn btn-ghost py-1 text-[11px]" onclick="sejarahMurid('${jsq(m.id)}')"><i class="fa-solid fa-clock-rotate-left"></i> Sejarah</button>
        ${m.statusMerit === 'Kritikal' && can('surat_amaran') ? `<button class="btn btn-danger py-1 text-[11px]" onclick="suratAmaran('${jsq(m.id)}',this)"><i class="fa-solid fa-file-contract"></i> Surat</button>` : ''}
      </td>
    </tr>`).join('') : `<tr><td colspan="5">${emptyBox('fa-user-check', 'Tiada murid sepadan dengan penapis.')}</td></tr>`;
  const more = $('#dMore');
  if (list.length > D.had) { more.classList.remove('hidden'); more.innerHTML = `<button class="btn btn-ghost" onclick="D.had+=150;paintMeritTable()">Papar lagi (${list.length - D.had} murid)</button>`; }
  else more.classList.add('hidden');
}

async function hantarDisiplin(btn) {
  await busy(btn, async () => {
    const idMurid = $('#dmId').value, idKategori = $('#dKat').value;
    if (!idMurid) throw new Error('Pilih murid daripada senarai carian.');

async function ubahStatusKes(idKes, sel) {
  sel.disabled = true;
  try {
    await api('tindakanKes', { idKes, status: sel.value });
    Object.values(SAH).forEach(c => (c.list || []).forEach(r => { if (r.idKes === idKes) r.statusTindakan = sel.value; }));   // analisis sahsiah

  }
  catch (e) { toast(e.message, 'error'); }

}
