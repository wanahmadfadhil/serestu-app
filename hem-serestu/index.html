/* ---- Analisis sahsiah & disiplin ----
 * Satu komponen untuk dua tempat: tab "Sahsiah & Disiplin" dalam Pengurusan Kelas (konteks 'kelas')
 * dan tab "Analisis sahsiah" dalam menu Disiplin & Merit (konteks 'sekolah', boleh ditapis ikut tahun/kelas).
 * Rekod yang dilihat ikut kebenaran pelayan: guru kelas & pentadbir melihat rekod semua guru;
 * guru lain hanya rekod yang mereka masukkan. */
const SD_TEMPOH = { bulan: 'Bulan ini', tahun: 'Tahun ini', semua: 'Semua' };
// Kriteria senarai (dalam tempoh dipilih)
const SAH_BIMBING_DEMERIT = 2;      // ≥ 2 rekod salah laku → Perlu Bimbingan
const SAH = {
  kelas: { kunci: '', list: null, memuat: '', tempoh: 'tahun', jenis: '', murid: '', susun: 'merit' },
  sekolah: { kunci: '', list: null, memuat: '', tempoh: 'tahun', jenis: '', murid: '', susun: 'merit', tahun: '', kelas: '' }
};
function sahDari(c) {
  const t = todayStr();
  return c.tempoh === 'bulan' ? t.slice(0, 8) + '01' : c.tempoh === 'tahun' ? t.slice(0, 5) + '01-01' : '';
}
function sahKonteks(n) {
  const c = SAH[n];
  if (n === 'kelas') {
    return { n, c, el: K.sub === 'sahsiah' ? $('#kBody') : null, murid: muridKelas(K.id), idKelas: K.id,
      kunci: 'k|' + K.id + '|' + c.tempoh, tajuk: namaKelasTajuk(IDX.kelas.get(K.id)), aktif: () => S.tab === 'kelas' && K.sub === 'sahsiah' };
  }
  return { n, c, el: $('#dAnalisis'), murid: S.murid.filter(m => muridLulus(m, c.tahun, c.kelas)), idKelas: c.kelas,
    kunci: 's|' + c.kelas + '|' + c.tempoh, tajuk: c.kelas ? namaKelasTajuk(IDX.kelas.get(c.kelas)) : c.tahun ? tahunNama(c.tahun) : 'Seluruh sekolah',
    aktif: () => S.tab === 'disiplin' && D.sub === 'analisis' };
}

async function paintSahsiah(n = 'kelas') {
  const x = sahKonteks(n), c = x.c;
  if (c.memuat === x.kunci) return;            // elak muat berganda semasa data disegarkan di latar
  if (c.kunci !== x.kunci) c.list = null;
  if (!x.murid.some(m => m.id === c.murid)) c.murid = '';
  lukisSahsiah(n);                             // papar data tersimpan dahulu, kemudian segarkan
  c.memuat = x.kunci;
  try {
    const p = { dari: sahDari(c), had: 5000, analisis: true };
    if (x.idKelas) p.idKelas = x.idKelas;
    const list = await api('senaraiDisiplin', p);
    if (x.aktif() && sahKonteks(n).kunci === x.kunci) { c.kunci = x.kunci; c.list = list; lukisSahsiah(n); }
  } catch (e) {
    const box = x.el && x.el.querySelector('[data-sd-log]');
    if (box && x.aktif()) box.innerHTML = errBox(e.message, `SAH.${n}.kunci='';paintSahsiah('${n}')`);
  } finally { c.memuat = ''; }
}

// Kira semua analisis untuk satu konteks (dipakai oleh paparan & cetakan)
function kiraSahsiah(x) {
  const c = x.c, t = S.tetapan, meritAwal = Number(t.meritAwal) || 100;
  const ids = new Set(x.murid.map(m => m.id));
  const list = c.kunci === x.kunci && c.list ? c.list.filter(r => ids.has(r.idMurid)) : null;
  const per = {};
  (list || []).forEach(r => {
    const p = per[r.idMurid] = per[r.idMurid] || { merit: 0, demerit: 0, mataMerit: 0, belum: 0 };
    if (r.mata > 0) { p.merit++; p.mataMerit += r.mata; }
    else if (r.mata < 0) { p.demerit++; if (r.statusTindakan !== 'Selesai') p.belum++; }
  });
  const kosong = { merit: 0, demerit: 0, mataMerit: 0, belum: 0 };
  // Perlu Bimbingan: merit Kritikal/Amaran, ≥2 salah laku dalam tempoh, atau kes salah laku belum selesai
  const bimbingan = [], terpuji = [];
  x.murid.forEach(m => {
    const p = per[m.id] || kosong, sebab = [];
    if (m.statusMerit === 'Kritikal') sebab.push('Merit kritikal');
    else if (m.statusMerit === 'Amaran') sebab.push('Merit amaran');
    if (p.demerit >= SAH_BIMBING_DEMERIT) sebab.push(p.demerit + ' salah laku');
    if (p.belum) sebab.push(p.belum + ' kes belum selesai');
    if (sebab.length) { bimbingan.push({ m, sebab, p }); return; }
    // Sahsiah Terpuji: tiada salah laku dalam tempoh, merit Baik, dan ada amalan baik atau merit melebihi mata awal
    if (list && !p.demerit && m.statusMerit === 'Baik' && (p.merit > 0 || m.merit > meritAwal)) {
      terpuji.push({ m, p, sebab: [p.merit ? `${p.merit} amalan baik (+${p.mataMerit})` : '', m.merit > meritAwal ? `Merit ${m.merit}` : ''].filter(Boolean) });
    }
  });
  const tahapB = { Kritikal: 0, Amaran: 1, Baik: 2 };
  bimbingan.sort((a, b) => tahapB[a.m.statusMerit] - tahapB[b.m.statusMerit] || a.m.merit - b.m.merit || b.p.demerit - a.p.demerit);
  terpuji.sort((a, b) => b.m.merit - a.m.merit || b.p.mataMerit - a.p.mataMerit || a.m.nama.localeCompare(b.m.nama));
  // Kekerapan kategori
  const kerap = jenis => {
    const g = {};
    (list || []).filter(r => jenis === 'Merit' ? r.mata > 0 : r.mata < 0).forEach(r => { g[r.kategori] = (g[r.kategori] || 0) + 1; });
    return Object.keys(g).map(k => ({ k, n: g[k] })).sort((a, b) => b.n - a.n).slice(0, 6);
  };
  // Ringkasan ikut kelas (konteks sekolah tanpa tapisan kelas)
  let ikutKelas = null;
  if (x.n === 'sekolah' && !c.kelas) {
    const g = {};
    x.murid.forEach(m => {
      const k = g[m.idKelas] = g[m.idKelas] || { id: m.idKelas, bil: 0, jumMerit: 0, kritikal: 0, amaran: 0, merit: 0, demerit: 0 };
      const p = per[m.id] || kosong;
      k.bil++; k.jumMerit += Number(m.merit) || 0; k.merit += p.merit; k.demerit += p.demerit;
      if (m.statusMerit === 'Kritikal') k.kritikal++; else if (m.statusMerit === 'Amaran') k.amaran++;
    });
    ikutKelas = Object.values(g).map(k => Object.assign(k, { kls: IDX.kelas.get(k.id) || { nama: k.id, tahun: '' } }))
      .sort((a, b) => tahunSort(a.kls.tahun) - tahunSort(b.kls.tahun) || a.kls.nama.localeCompare(b.kls.nama));
  }
  const status = { Baik: 0, Amaran: 0, Kritikal: 0 };
  x.murid.forEach(m => { status[m.statusMerit] = (status[m.statusMerit] || 0) + 1; });
  return {
    list, per, bimbingan, terpuji, status, ikutKelas,
    purata: x.murid.length ? Math.round(x.murid.reduce((a, m) => a + (Number(m.merit) || 0), 0) / x.murid.length) : 0,
    rMerit: (list || []).filter(r => r.mata > 0), rDemerit: (list || []).filter(r => r.mata < 0),
    kerapDemerit: kerap('Demerit'), kerapMerit: kerap('Merit')
  };
}

  const penuh = n === 'kelas' ? (isGuruKelas(K.id) || can('lihat_sensitif_semua')) : can('lihat_sensitif_semua');

  const tapis = (list || []).filter(r => (!c.jenis || (c.jenis === 'Merit' ? r.mata > 0 : r.mata < 0)) && (!c.murid || r.idMurid === c.murid));

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      ${kad('Purata merit', a.purata, `Merit awal ${t.meritAwal || 100}, maksimum ${maks}`, 'bg-brand-100 text-brand-700', 'fa-star')}
      ${kad('Status merit', `<span class="text-emerald-600">${a.status.Baik}</span><span class="text-slate-300 text-base"> / </span><span class="text-amber-600">${a.status.Amaran}</span><span class="text-slate-300 text-base"> / </span><span class="text-rose-600">${a.status.Kritikal}</span>`, 'Baik / Amaran / Kritikal', 'bg-amber-100 text-amber-700', 'fa-scale-balanced')}
      ${kad('Rekod amalan baik', list ? a.rMerit.length : sedia, list ? `+${a.rMerit.reduce((s, r) => s + r.mata, 0)} mata · ${SD_TEMPOH[c.tempoh].toLowerCase()}` : '', 'bg-emerald-100 text-emerald-700', 'fa-thumbs-up')}

  hydrateFotos(el);
  el.querySelectorAll('[data-sdt]').forEach(b => b.onclick = () => { c.tempoh = b.dataset.sdt; paintSahsiah(n); });

/* ---- SPBT (buku teks): rekod pinjam & pulang sekelas ----
 * Hanya guru kelas bagi kelas itu dan pentadbir. Nilai sel: 1 pinjam, 2 pulang, 3 kedua-dua (bit).
 * Setiap tekanan disimpan sendiri di latar; hanya sel yang berubah dihantar ke pelayan. */
const SP = { id: '', data: null, q: '', pending: new Map(), timer: null, menyimpan: false, ralat: '' };
window.addEventListener('beforeunload', e => { if (SP.pending.size || SP.menyimpan) e.preventDefault(); });

function nilaiSpbt(idMurid, buku) { return ((SP.data.rekod || {})[idMurid] || {})[buku] || 0; }
function setNilaiSpbt(idMurid, buku, n) {
  const r = SP.data.rekod[idMurid] = SP.data.rekod[idMurid] || {};
  if (n) r[buku] = n; else delete r[buku];
  SP.pending.set(idMurid + '\n' + buku, { kelas: SP.id, idMurid, buku, nilai: n });
}
function jadualSimpanSpbt() { clearTimeout(SP.timer); SP.timer = setTimeout(simpanSpbt, 800); statusSpbt(); }

async function simpanSpbt() {
  clearTimeout(SP.timer);
  if (SP.menyimpan || !SP.pending.size) return;
  const semua = Array.from(SP.pending.entries()), idKelas = semua[0][1].kelas;
  const hantar = semua.filter(([, x]) => x.kelas === idKelas);
  hantar.forEach(([k]) => SP.pending.delete(k));
  SP.menyimpan = true; statusSpbt();
  try {
    await api('simpanSpbt', { idKelas, ubah: hantar.map(([, x]) => ({ idMurid: x.idMurid, buku: x.buku, nilai: x.nilai })) });
    SP.ralat = '';
  } catch (e) {
    hantar.forEach(([k, x]) => { if (!SP.pending.has(k)) SP.pending.set(k, x); });   // kekalkan untuk cuba semula
    SP.ralat = e.message; toast('Rekod SPBT belum disimpan: ' + e.message, 'error');
  } finally {
    SP.menyimpan = false; statusSpbt();
    if (SP.pending.size && !SP.ralat) simpanSpbt();
  }
}
function statusSpbt() {
  const el = $('#spStatus'); if (!el) return;
  const belum = SP.pending.size > 0;
  el.innerHTML = SP.ralat && belum ? `<button class="text-rose-600 font-semibold hover:underline" onclick="SP.ralat='';simpanSpbt()"><i class="fa-solid fa-triangle-exclamation"></i> Gagal disimpan. Cuba semula</button>`
    : SP.menyimpan || belum ? '<span class="text-amber-600"><i class="fa-solid fa-spinner fa-spin"></i> Menyimpan…</span>'
    : '<span class="text-emerald-600"><i class="fa-solid fa-circle-check"></i> Semua rekod disimpan</span>';
}

async function paintSpbt() {
  const id = K.id, el = $('#kBody'), k = IDX.kelas.get(id);
  if (!el || !k) return;
  SP.id = ''; SP.data = null;
  if (!bolehUrusKelas(id)) {
    const milik = (S.user.kelasSaya || []).map(x => IDX.kelas.get(x)).filter(Boolean);
    el.innerHTML = `<div class="card">${emptyBox('fa-lock', 'Rekod SPBT hanya boleh dibuka oleh guru kelas tersebut.', milik.map(x => `<button class="btn btn-primary mt-3 mx-1" onclick="K.id='${jsq(x.id)}';K.tahun='';renderKelas()"><i class="fa-solid fa-book"></i> ${esc(namaKelasTajuk(x))}</button>`).join(''))}</div>`;
    return;
  }
  el.innerHTML = `<div class="card p-4">${skel('h-12', 6, 'mb-2')}</div>`;
  try {
    const d = await api('getSpbt', { idKelas: id });
    if (K.id !== id || K.sub !== 'spbt') return;
    d.rekod = d.rekod || {};
    // Perubahan yang belum sampai ke pelayan kekal dipaparkan
    SP.pending.forEach(x => { if (x.kelas !== id) return; const r = d.rekod[x.idMurid] = d.rekod[x.idMurid] || {}; if (x.nilai) r[x.buku] = x.nilai; else delete r[x.buku]; });
    SP.id = id; SP.data = d; SP.q = '';
    lukisSpbt();
  } catch (e) { if (K.id === id && K.sub === 'spbt') el.innerHTML = errBox(e.message, 'paintSpbt()'); }
}

// Buku teks: semua murid layak kecuali bukan warganegara
function muridLayakSpbt() { return muridKelas(SP.id).filter(m => wargaNegara(m)); }
function muridSpbt() { const q = SP.q.trim().toLowerCase(); return muridLayakSpbt().filter(m => !q || m.nama.toLowerCase().includes(q)); }
function kemajuanSpbt(idMurid) {
  let pinjam = 0, pulang = 0;
  SP.data.buku.forEach(b => { const n = nilaiSpbt(idMurid, b); if (n & 1) pinjam++; if (n & 2) pulang++; });
  return { pinjam, pulang };
}
function ringkasSpbtHTML() {
  const ms = muridLayakSpbt(), buku = SP.data.buku, jum = ms.length * buku.length;
  let pinjam = 0, pulang = 0, belum = 0;
  ms.forEach(m => buku.forEach(b => { const n = nilaiSpbt(m.id, b); if (n & 1) pinjam++; if (n & 2) pulang++; if ((n & 1) && !(n & 2)) belum++; }));
  const pct = n => jum ? Math.round(n / jum * 100) : 0;
  const kad = (l, v, s, w) => `<div class="rounded-xl p-3 ${w}"><p class="text-[11px] font-semibold opacity-80">${l}</p><p class="text-xl font-extrabold leading-tight">${v}</p><p class="text-[11px] opacity-70">${s}</p></div>`;
  return kad('Murid', ms.length, `${buku.length} buku setiap murid`, 'bg-slate-100 text-slate-800') +
    kad('Telah pinjam', pinjam, `${pct(pinjam)}% daripada ${jum} naskhah`, 'bg-green-50 text-green-800') +
    kad('Belum pulang', belum, 'Dipinjam, belum dipulangkan', 'bg-amber-50 text-amber-800') +
    kad('Telah pulang', pulang, `${pct(pulang)}% daripada ${jum} naskhah`, 'bg-rose-50 text-rose-800');
}
function statSpbtHTML(idMurid) {
  const p = kemajuanSpbt(idMurid), t = 'block w-[68px] mx-auto rounded border px-1 py-0.5 text-[9px] font-bold truncate';
  return `<div class="space-y-1"><span class="${t} bg-sky-100 text-sky-700 border-sky-200">JUMLAH: ${SP.data.buku.length}</span><span class="${t} bg-green-100 text-green-700 border-green-200">PINJAM: ${p.pinjam}</span><span class="${t} bg-rose-100 text-rose-700 border-rose-200">PULANG: ${p.pulang}</span></div>`;
}
function selSpbtHTML(idMurid, b) {
  const n = nilaiSpbt(idMurid, SP.data.buku[b]);
  const btn = (t, label, on, w) => `<button type="button" data-id="${esc(idMurid)}" data-b="${b}" data-t="${t}" aria-pressed="${on}" class="flex items-center justify-center gap-1 w-[70px] py-1 rounded-full border text-[9px] font-extrabold transition ${on ? w : 'bg-white border-slate-300 text-slate-400 hover:border-slate-400'}"><i class="fa-solid ${on ? 'fa-check' : 'fa-xmark'} text-[9px]"></i> ${label}</button>`;
  return `<div class="flex flex-col items-center gap-1">${btn(1, 'PINJAM', !!(n & 1), 'bg-green-100 border-green-500 text-green-700')}${btn(2, 'PULANG', !!(n & 2), 'bg-rose-100 border-rose-500 text-rose-700')}</div>`;
}

function lukisSpbt() {
  const el = $('#kBody'), d = SP.data, k = IDX.kelas.get(SP.id);
  if (!el || !d) return;
  if (!d.buku.length) {
    el.innerHTML = `<div class="card">${emptyBox('fa-book', tahunSort(k.tahun) === 0 ? 'Prasekolah tidak mempunyai buku teks SPBT.' : 'Senarai buku bagi tahun ini belum ditetapkan.', d.semuaBuku ? '<button class="btn btn-primary mt-3" onclick="openBukuSpbt()"><i class="fa-solid fa-list"></i> Urus senarai buku</button>' : '')}</div>`;
    return;
  }
  el.innerHTML = `<div class="space-y-4">
    <div class="card p-4 space-y-3">
      <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
        <div><h4 class="font-bold text-slate-800">SPBT ${esc(namaKelasTajuk(k))} <span class="font-normal text-slate-500">· Sesi ${esc(d.tahunSesi)}</span></h4>
          <p id="spStatus" class="text-[11px] mt-0.5"></p></div>
        <div class="flex flex-wrap gap-2">
          <button class="btn bg-green-600 hover:bg-green-700 text-white" onclick="openPukalSpbt('PINJAM')"><i class="fa-solid fa-check-double"></i> Pinjam pukal</button>
          <button class="btn bg-amber-500 hover:bg-amber-600 text-white" onclick="openPukalSpbt('PULANG')"><i class="fa-solid fa-rotate-left"></i> Pulang pukal</button>
          <button class="btn btn-ghost" onclick="openPukalSpbt('KOSONG')"><i class="fa-solid fa-eraser"></i> Padam</button>
          <button class="btn btn-ghost" onclick="csvSpbt()"><i class="fa-solid fa-file-csv"></i> CSV</button>
          <button class="btn btn-ghost" onclick="cetakSpbt()"><i class="fa-solid fa-print"></i> Cetak / PDF</button>
          ${d.semuaBuku ? '<button class="btn btn-ghost" onclick="openBukuSpbt()"><i class="fa-solid fa-list"></i> Urus senarai buku</button>' : ''}
        </div>
      </div>
      <div id="spRingkas" class="grid grid-cols-2 lg:grid-cols-4 gap-3">${ringkasSpbtHTML()}</div>
      ${muridKelas(SP.id).length > muridLayakSpbt().length ? `<p class="text-xs text-rose-700">${muridKelas(SP.id).length - muridLayakSpbt().length} murid bukan warganegara tidak layak dan tidak disenaraikan.</p>` : ""}
      <input id="spCari" value="${esc(SP.q)}" placeholder="Cari nama murid" class="inp sm:w-64 py-1.5 text-xs">
    </div>
    <div class="card overflow-hidden"><div id="spJadual" class="overflow-auto max-h-[75vh]"></div></div>
  </div>`;
  statusSpbt();
  lukisJadualSpbt();
  $('#spCari').oninput = debounce(e => { SP.q = e.target.value; lukisJadualSpbt(); }, 150);
  $('#spJadual').onclick = e => {
    const b = e.target.closest('button[data-t]'); if (!b) return;
    const id = b.dataset.id, bi = Number(b.dataset.b), buku = SP.data.buku[bi];
    setNilaiSpbt(id, buku, nilaiSpbt(id, buku) ^ Number(b.dataset.t));
    b.closest('td').innerHTML = selSpbtHTML(id, bi);
    const st = $('#spJadual').querySelector(`[data-stat="${CSS.escape(id)}"]`); if (st) st.innerHTML = statSpbtHTML(id);
    $('#spRingkas').innerHTML = ringkasSpbtHTML();
    jadualSimpanSpbt();
  };
}

function lukisJadualSpbt() {
  const box = $('#spJadual'); if (!box) return;
  const ms = muridSpbt(), buku = SP.data.buku;
  const th = 'sticky top-0 bg-brand-700 text-white text-[10px] font-bold border-r border-white/20 py-2 px-1';
  if (!ms.length) { box.innerHTML = emptyBox('fa-users-slash', 'Tiada murid dijumpai.'); return; }
  box.innerHTML = `<table class="border-separate border-spacing-0 text-xs">
    <thead><tr>
      <th class="${th} left-0 z-30 w-9 min-w-[36px]">BIL</th>
      <th class="${th} left-9 z-30 min-w-[130px] sm:min-w-[210px] text-left px-2">NAMA MURID</th>
      <th class="${th} z-20 min-w-[86px]">STATISTIK</th>
      ${buku.map(b => `<th class="${th} z-20 min-w-[92px] max-w-[110px] leading-tight whitespace-normal">${esc(b)}</th>`).join('')}
    </tr></thead>
    <tbody>${ms.map((m, i) => { const bg = i % 2 ? 'bg-slate-50' : 'bg-white', td = `border-r border-b border-slate-200 ${bg}`; return `<tr>
      <td class="${td} sticky left-0 z-10 text-center text-slate-500 font-semibold">${i + 1}</td>
      <td class="${td} sticky left-9 z-10 px-2 py-1 font-bold text-slate-800 text-[11px] leading-tight min-w-[130px] sm:min-w-[210px]">${esc(m.nama)}</td>
      <td class="${td} px-1 py-1 text-center" data-stat="${esc(m.id)}">${statSpbtHTML(m.id)}</td>
      ${buku.map((b, bi) => `<td class="${td} px-1 py-1">${selSpbtHTML(m.id, bi)}</td>`).join('')}
    </tr>`; }).join('')}</tbody></table>`;
}

function openPukalSpbt(jenis) {
  const buku = SP.data.buku, ms = muridSpbt();
  const label = { PINJAM: 'Pinjam', PULANG: 'Pulang', KOSONG: 'Padam' }[jenis];
  const senarai = (attr, arr, teks) => arr.map((x, i) => `<label class="flex items-center gap-2 p-2 rounded-lg border border-slate-200 bg-white text-xs font-semibold cursor-pointer"><input type="checkbox" ${attr}="${esc(x)}" checked> <span class="truncate">${esc(teks(x, i))}</span></label>`).join('');
  const m = openModal({
    title: `${label} pukal`, size: 'max-w-4xl',
    body: `
      ${jenis === 'PULANG' ? '<p class="text-xs text-slate-600">Buku yang ditanda pulang juga ditanda sebagai telah dipinjam.</p>' : ''}
      <div class="flex items-center justify-between"><p class="text-xs font-bold text-slate-700">1. Senarai buku</p><button type="button" class="text-xs font-semibold text-brand-700 hover:underline" data-semua="data-pb">Pilih / nyahpilih semua</button></div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">${senarai('data-pb', buku, b => b)}</div>
      <div class="flex items-center justify-between pt-2"><p class="text-xs font-bold text-slate-700">2. Senarai murid</p><button type="button" class="text-xs font-semibold text-brand-700 hover:underline" data-semua="data-pm">Pilih / nyahpilih semua</button></div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">${senarai('data-pm', ms.map(x => x.id), (id, i) => `${i + 1}. ${IDX.murid.get(id).nama}`)}</div>`,
    footer: `<button class="btn btn-ghost" data-close>Batal</button><button class="btn ${jenis === 'KOSONG' ? 'btn-danger' : 'btn-primary'}" id="pkSimpan"><i class="fa-solid fa-floppy-disk"></i> ${label}</button>`
  });
  m.querySelectorAll('[data-semua]').forEach(b => b.onclick = () => {
    const c = Array.from(m.querySelectorAll(`[${b.dataset.semua}]`).values()).filter(x => x.type === 'checkbox'), on = c.some(x => !x.checked);
    c.forEach(x => { x.checked = on; });
  });
  m.querySelector('#pkSimpan').onclick = async () => {
    const pb = Array.from(m.querySelectorAll('input[data-pb]:checked')).map(x => x.dataset.pb);
    const pm = Array.from(m.querySelectorAll('input[data-pm]:checked')).map(x => x.dataset.pm);
    if (!pb.length || !pm.length) return toast('Pilih sekurang-kurangnya satu buku dan satu murid.', 'error');
    if (jenis === 'KOSONG' && !await confirmBox(`Padam rekod ${pb.length} buku bagi ${pm.length} murid?`, 'Padam', true)) return;
    pm.forEach(id => pb.forEach(b => {
      const n = nilaiSpbt(id, b), baru = jenis === 'PINJAM' ? n | 1 : jenis === 'PULANG' ? 3 : 0;
      if (baru !== n) setNilaiSpbt(id, b, baru);
    }));
    closeModal(); lukisJadualSpbt(); $('#spRingkas').innerHTML = ringkasSpbtHTML(); jadualSimpanSpbt();
    toast('Tindakan pukal direkodkan.', 'success');
  };
}

function simbolSpbt(n) { return (n & 1) && (n & 2) ? '✔' : (n & 1) ? 'X' : '-'; }
function csvSpbt() {
  const k = IDX.kelas.get(SP.id), buku = SP.data.buku, q = v => `"${String(v).replace(/"/g, '""')}"`;
  const baris = [['BIL', 'NAMA MURID', 'JUMLAH PINJAM', 'JUMLAH PULANG'].concat(buku).map(q).join(',')];
  muridLayakSpbt().forEach((m, i) => {
    const p = kemajuanSpbt(m.id);
    baris.push([i + 1, q(m.nama), p.pinjam, p.pulang].concat(buku.map(b => q(simbolSpbt(nilaiSpbt(m.id, b))))).join(','));
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([String.fromCharCode(0xFEFF) + baris.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = `Rekod_SPBT_${namaKelasTajuk(k).replace(/[^A-Za-z0-9]+/g, '_')}_${SP.data.tahunSesi}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

const PROFIL = new Map();   // cache dalam memori sahaja (maklumat sulit tidak disimpan dalam peranti)

function fmtTel(t) {
  const d = String(t || '').replace(/\D/g, ''); if (!d) return '';
  const l = d.indexOf('60') === 0 ? '0' + d.slice(2) : d;
  if (/^011\d{8}$/.test(l)) return `${l.slice(0, 3)}-${l.slice(3, 7)} ${l.slice(7)}`;
  if (/^01\d{8}$/.test(l)) return `${l.slice(0, 3)}-${l.slice(3, 6)} ${l.slice(6)}`;
  if (/^0[3-9]\d{7,8}$/.test(l)) return `${l.slice(0, 2)}-${l.slice(2)}`;
  return l;
}
function umur(tl) {
  const d = toDate(tl); if (!d) return '';
  const n = new Date(); let u = n.getFullYear() - d.getFullYear();
  if (n.getMonth() < d.getMonth() || (n.getMonth() === d.getMonth() && n.getDate() < d.getDate())) u--;
  return u >= 0 ? `${u} tahun` : '';
}
function fmtKP(k) { const d = String(k || ''); return /^\d{12}$/.test(d) ? `${d.slice(0, 6)}-${d.slice(6, 8)}-${d.slice(8)}` : d; }

async function openProfilMurid(id) {
  const m0 = IDX.murid.get(id); if (!m0) return;
  const m = openModal({ title: 'Profil murid', size: 'max-w-3xl', body: `<div id="pfBox">${skel('h-20', 1)}${skel('h-32', 1, 'mt-3')}${skel('h-64', 1, 'mt-3')}</div>` });
  try {
    let p = PROFIL.get(id);
    if (p) paintProfil(m, p);
    p = await api('profilMurid', { idMurid: id });
    PROFIL.set(id, p);
    if (document.body.contains(m)) paintProfil(m, p);
  } catch (e) { const b = m.querySelector('#pfBox'); if (b) b.innerHTML = errBox(e.message); }
}

async function simpanLokasiMurid(id, lat, lng) {
  const r = await api('simpanLokasi', { idMurid: id, lat, lng });
  const p = PROFIL.get(id);
  if (p && p.alamat) { Object.assign(p.alamat, r); const el = $('#pfAlamat'); if (el) el.innerHTML = alamatHTML(p); }
  toast('Lokasi rumah disimpan.', 'success');
}

function lokasiSemasa(id, btn) {
  if (!navigator.geolocation) return toast('Peranti ini tidak menyokong lokasi.', 'error');
  const html = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengesan…';
  navigator.geolocation.getCurrentPosition(async pos => {
    btn.disabled = false; btn.innerHTML = html;
    const { latitude: lat, longitude: lng, accuracy } = pos.coords;
    if (!await confirmBox(`Simpan lokasi anda sekarang sebagai lokasi rumah murid ini? Ketepatan kira-kira ${Math.round(accuracy)} meter. Gunakan hanya semasa berada di rumah murid.`, 'Simpan lokasi')) return;
    try { await simpanLokasiMurid(id, lat, lng); } catch (e) { toast(e.message, 'error'); }
  }, err => {
    btn.disabled = false; btn.innerHTML = html;
    toast(err.code === 1 ? 'Kebenaran lokasi ditolak. Benarkan akses lokasi dalam tetapan pelayar.' : 'Lokasi tidak dapat dikesan. Cuba di kawasan terbuka.', 'error');
  }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
}

function parseKoordinat(t) {
  const s = String(t || '');
  const pola = [/@(-?\d+\.\d+),(-?\d+\.\d+)/, /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,
    /[?&](?:q|query|ll|destination|viewpoint)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i, /(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{2,3}\.\d{3,})/];
  for (const re of pola) { const m = s.match(re); if (m) return { lat: Number(m[1]), lng: Number(m[2]) }; }
  return null;
}

function tampalLokasi(id) {
  const m = openModal({
    title: 'Betulkan lokasi rumah', size: 'max-w-md',
    body: `
      <p class="text-xs text-slate-600">Dalam aplikasi Google Maps, <b>tekan lama</b> pada bumbung rumah murid. Salin koordinat yang muncul (cth <code>3.265412, 101.612345</code>) atau pautan penuh, kemudian tampal di bawah.</p>
      <input id="lkIn" class="inp" placeholder="3.265412, 101.612345" autocomplete="off">
      <p id="lkInfo" class="text-[11px] text-slate-500"></p>`,
    footer: '<button class="btn btn-ghost" data-close>Batal</button><button class="btn btn-primary" id="lkSave" disabled>Simpan lokasi</button>'
  });
  const inp = m.querySelector('#lkIn'), info = m.querySelector('#lkInfo'), sv = m.querySelector('#lkSave');
  inp.addEventListener('input', () => {
    const k = parseKoordinat(inp.value);
    sv.disabled = !k;
    info.textContent = k ? `Dikesan: ${k.lat.toFixed(6)}, ${k.lng.toFixed(6)}` : (inp.value.trim() ? 'Koordinat tidak dikesan. Pautan pendek (maps.app.goo.gl) tidak boleh dibaca; salin koordinat terus.' : '');
  });
  sv.onclick = e => busy(e.currentTarget, async () => {
    const k = parseKoordinat(inp.value);
    await simpanLokasiMurid(id, k.lat, k.lng); closeModal();
  });
  setTimeout(() => inp.focus(), 50);
}

const WARNA_LATAR = ['#ffffff', '#fef9c3', '#fce7f3', '#e0f2fe', '#dcfce7', '#ede9fe', '#ffedd5', '#f1f5f9', '#1e3a5f', '#14532d'];

function campurWarna(a, b, t) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)), x = p(a), y = p(b);
  return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
function warnaGelap(h) { const [r, g, b] = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255); return 0.299 * r + 0.587 * g + 0.114 * b < 0.55; }
function sahWarna(h) { return /^#[0-9a-f]{6}$/i.test(String(h || '')) ? String(h).toLowerCase() : ''; }
// Gabung reka bentuk dengan pilihan warna pengguna; teks ditukar automatik supaya kontras kekal jelas
function rekaCarta(rk, latar, kotak) {
  const D = Object.assign({}, CARTA_REKA[rk] || CARTA_REKA.ceria);
  latar = sahWarna(latar); kotak = sahWarna(kotak);
  if (latar) {
    D.bg = `linear-gradient(160deg,${latar} 0%,${campurWarna(latar, '#ffffff', warnaGelap(latar) ? 0.15 : 0.45)} 100%)`;
    if (warnaGelap(latar)) Object.assign(D, { sub: '#e2e8f0', title: '#ffffff', line: 'rgba(255,255,255,.8)' });
  }
  if (kotak) {
    const g = warnaGelap(kotak);
    D.card = kotak; D.cardTx = g ? '#ffffff' : '#0f172a';
    if (!D.kekalBd) { D.cardBd = campurWarna(kotak, g ? '#ffffff' : '#000000', 0.25); D.ikutAksen = false; }
    if (g && !D.band) { D.lbl = '#fde68a'; D.accents = ['#fde68a']; }
    if (g) { D.fotoBg = 'rgba(255,255,255,.18)'; D.fotoTx = '#ffffff'; }     // huruf awal kekal jelas atas kotak gelap
  }
  return D;
}

async function pastiFoto(ids) {
  const perlu = Array.from(new Set(ids.filter(Boolean))).filter(id => !FOTO.has(id));
  for (const id of perlu.slice()) { const v = await DB.get('foto:' + id); if (v) { FOTO.set(id, v); perlu.splice(perlu.indexOf(id), 1); } }
  for (let i = 0; i < perlu.length; i += 20) {
    const ch = perlu.slice(i, i + 20);
    try {
      const r = await api('lihatFotoPukal', { fileIds: ch });
      ch.forEach(id => { if (r && r[id]) { FOTO.set(id, r[id]); DB.set('foto:' + id, r[id]); } });
      if (r && Array.isArray(r._baki)) r._baki.forEach(id => { if (perlu.indexOf(id, i + 20) < 0) perlu.push(id); });   // had saiz pelayan
    } catch (e) { /* teruskan tanpa foto */ }
  }
}

// Bayang keras (tanpa kabur) dilukis sebagai blok di belakang: html2canvas merosakkan box-shadow tanpa kabur

      <p class="text-[11px] text-slate-500">Saiz A4 melintang. <b>Cetak / PDF</b> untuk cetak terus atau simpan sebagai PDF; <b>PNG</b> untuk gambar resolusi tinggi.</p>`,
    footer: `<button class="btn btn-ghost" data-close>Tutup</button>
      <button class="btn btn-ghost" id="pstPng"><i class="fa-solid fa-image"></i> Muat turun PNG</button>
      <button class="btn btn-primary" id="pstCetak"><i class="fa-solid fa-print"></i> Cetak / PDF</button>`
  });
  const c = K.data.cartaOrg || {};

      document.body.appendChild(a); a.click(); a.remove();
    } finally { hold.remove(); }
  }, 'Menjana…');
}

/* ==================================================================
 *  CARTA ORGANISASI HEM (Dashboard)

 *  dan susunan anak mendatar / menegak. PK HEM menyusun dengan seret & lepas atau butang.
 * ================================================================== */
const CH = { ctx: null, data: null, urus: false, sunting: false, edit: null, ubah: false, pilih: '', seret: '', cubaFoto: new Set() };
// Konteks carta: carta HEM (Dashboard) atau carta setiap unit HEM. Bertukar konteks = mula semula penyunting.
const CTX_HEM = { kunci: 'hem', el: '#dsbIsi', nama: 'HEM', fail: 'Carta_Organisasi_HEM', lalai: () => cartaHemLalai(), simpan: c => api('simpanCartaHem', { carta: c }).then(r => r.carta) };
function pasangKonteksCH(ctx) {
  if (!CH.ctx || CH.ctx.kunci !== ctx.kunci) {
    // Kosongkan penyunting konteks lama supaya ID elemen (#chEditor, #chPratonton) tidak berganda
    if (CH.ctx && CH.ctx.el !== ctx.el && $(CH.ctx.el)) $(CH.ctx.el).innerHTML = '';
    Object.assign(CH, { data: null, sunting: false, edit: null, ubah: false, pilih: '' });
  }
  CH.ctx = ctx;
}
window.addEventListener('beforeunload', e => { if (CH.ubah) e.preventDefault(); });

function cartaHemLalai() {
  const n = (id, parent, jawatan, susun) => ({ id, parent, jawatan, ahli: [], susun: susun || 'mendatar' });
  return { tajuk: 'Carta Organisasi Hal Ehwal Murid', sub: 'Sesi ' + new Date().getFullYear(), reka: 'eksekutif', latar: '', kotak: '',
    nodes: [n('n1', '', 'Guru Besar'), n('n2', 'n1', 'Penolong Kanan HEM'), n('n3', 'n2', 'Setiausaha HEM'),
      n('n4', 'n3', 'Unit Disiplin'), n('n5', 'n3', 'Unit Bimbingan & Kaunseling'), n('n6', 'n3', 'Unit Kebajikan & Bantuan'), n('n7', 'n3', 'Unit Kesihatan')] };
}
const salinCH = c => JSON.parse(JSON.stringify(c));
const cartaKini = () => CH.sunting ? CH.edit : CH.data;
function anakCH(c, p) {
  const ada = new Set(c.nodes.map(n => n.id));
  return c.nodes.filter(n => (n.parent && ada.has(n.parent) ? n.parent : '') === p);
}
function keturunanCH(c, id) {
  const out = new Set(), jalan = p => anakCH(c, p).forEach(n => { out.add(n.id); jalan(n.id); });
  jalan(id); return out;
}
function orangCH(a) {
  const g = a.idGuru ? IDX.guru.get(a.idGuru) : null;
  return { nama: g ? g.nama : a.nama, fotoId: a.fotoId || (g && g.fotoId) || '', jantina: '' };
}
function fotoCH(c) { return c.nodes.flatMap(n => n.ahli.map(a => orangCH(a).fotoId)).concat([c.latarFoto]).filter(Boolean); }
const WARNA_UTAMA = ['#7f1d1d', '#be123c', '#c2410c', '#b8860b', '#15803d', '#0f766e', '#0284c7', '#1e3a8a', '#6d28d9', '#334155'];
// Reka bentuk + warna latar/kotak, kemudian warna utama dan gambar latar pilihan admin
function rekaCH(c) {
  const D = rekaCarta(c.reka, c.latar, c.kotak), u = sahWarna(c.utama);
  if (u) {
    const gelap = warnaGelap(u);
    Object.assign(D, { head: u, headTx: gelap ? '#ffffff' : '#0f172a', line: u, accents: [u], ikutAksen: false });
    D.lbl = D.band ? (gelap ? '#ffffff' : '#0f172a') : u;
    if (D.headBd) D.headBd = `3px solid ${campurWarna(u, '#000000', 0.25)}`;
  }
  const url = c.latarFoto && FOTO.get(c.latarFoto);
  if (url) {
    const a = typeof c.lapisan === 'number' ? c.lapisan : 0.4;
    D.bg = `#ffffff url('${url}') center/cover no-repeat`;
    D.deco = (a ? `<div style="position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,${a})"></div>` : '') + (D.deco || '');
  }
  return D;
}

/* ---- Lukisan poster (A4 melintang) ---- */
function pokokCH(c, D) {
  const t = D.headBd ? 4 : 3, gr = h => `<div style="width:${t}px;height:${h}px;background:${D.line};margin:0 auto"></div>`;
  const ukur = [[84, 210], [70, 175], [58, 145]];
  const nod = (n, aras) => {
    const [foto, lebar] = ukur[Math.min(aras, 2)], warna = D.accents[aras % D.accents.length];
    const kad = `<div style="display:flex;gap:10px;justify-content:center">${(n.ahli.length ? n.ahli : [null]).map(a =>
      `<div style="width:${lebar}px">${kotakJawatan(D, n.jawatan, a ? orangCH(a) : null, foto + 'px', aras ? warna : (D.band ? D.head : undefined), true)}</div>`).join('')}</div>`;
    const anak = anakCH(c, n.id);
    if (!anak.length) return `<div style="display:flex;flex-direction:column;align-items:center">${kad}</div>`;
    if (n.susun === 'menegak') return `<div style="display:flex;flex-direction:column;align-items:center">${kad}${anak.map(x => gr(18) + nod(x, aras + 1)).join('')}</div>`;
    return `<div style="display:flex;flex-direction:column;align-items:center">${kad}${gr(18)}
      <div style="display:flex;justify-content:center">${anak.map((x, i) => `<div style="position:relative;padding:18px 8px 0;display:flex;flex-direction:column;align-items:center">
        ${anak.length > 1 ? `<div style="position:absolute;top:0;height:${t}px;background:${D.line};left:${i === 0 ? '50%' : '0'};right:${i === anak.length - 1 ? '50%' : '0'}"></div>` : ''}
        <div style="position:absolute;top:0;left:50%;width:${t}px;height:18px;margin-left:-${t / 2}px;background:${D.line}"></div>
        ${nod(x, aras + 1)}</div>`).join('')}</div></div>`;
  };
  return `<div style="display:flex;gap:40px;align-items:flex-start;justify-content:center">${anakCH(c, '').map(n => nod(n, 0)).join('')}</div>`;
}
function posterCH(c, w, h, muat) {
  const D = rekaCH(c);
  const isi = c.nodes.length ? `<div data-fit style="position:relative;flex:1;width:100%">
      <div data-pokok style="position:absolute;left:50%;top:${muat ? muat.top : 0}px;width:max-content;transform-origin:top center;transform:translateX(-50%) scale(${muat ? muat.s : 1})">${pokokCH(c, D)}</div></div>`
    : `<div style="text-align:center;color:${D.sub}">Carta masih kosong.</div>`;
  return posterShell(D, c.tajuk || 'Carta Organisasi Hal Ehwal Murid', esc(c.sub || ''), isi, w, h);
}
// Ukur saiz pokok pada kanvas 1123×794 dan kira skala supaya muat dalam poster (dipakai untuk pratonton, PNG & cetak)
function muatCH(c) {
  const hold = document.createElement('div');
  hold.style.cssText = 'position:fixed;left:-20000px;top:0;width:1123px;height:794px;visibility:hidden';
  hold.innerHTML = posterCH(c, '1123px', '794px', null);
  document.body.appendChild(hold);
  const box = hold.querySelector('[data-fit]'), p = hold.querySelector('[data-pokok]');
  let muat = { s: 1, top: 0 };
  if (box && p) {
    const W = box.clientWidth, H = box.clientHeight, pw = p.scrollWidth, ph = p.scrollHeight;
    const s = Math.min(1.25, W / Math.max(pw, 1), H / Math.max(ph, 1));
    muat = { s: Math.round(s * 1000) / 1000, top: Math.max(0, Math.round((H - ph * s) / 2)) };
  }
  hold.remove();
  return muat;
}

// Jadikan kotak id anak terakhir kepada induk (atau kotak teratas jika induk kosong)
function pindahCH(id, induk) {
  const c = CH.edit, i = c.nodes.findIndex(n => n.id === id); if (i < 0) return;
  const [n] = c.nodes.splice(i, 1); n.parent = induk; c.nodes.push(n);
}
function idBaruCH() { return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
async function tindakanCH(act) {
  const c = CH.edit, n = c.nodes.find(x => x.id === CH.pilih);
  const baru = parent => ({ id: idBaruCH(), parent, jawatan: '', ahli: [], susun: 'mendatar' });
  if (act === 'akar' || act === 'anak' || act === 'sebaris') {
    const x = baru(act === 'akar' ? '' : act === 'anak' ? n.id : n.parent || '');
    if (act === 'sebaris') c.nodes.splice(c.nodes.indexOf(n) + 1, 0, x); else c.nodes.push(x);
    if (c.nodes.length > 100) { c.nodes.splice(c.nodes.indexOf(x), 1); return toast('Maksimum 100 kotak dalam carta.', 'error'); }
    CH.pilih = x.id; ubahCH(); openNodCH(x.id, true); return;
  }
  if (!n) return;
  if (act === 'sunting') return openNodCH(n.id);
  const adik = anakCH(c, n.parent && c.nodes.some(x => x.id === n.parent) ? n.parent : ''), i = adik.indexOf(n);
  if (act === 'naik' || act === 'turun') {
    const lain = adik[act === 'naik' ? i - 1 : i + 1]; if (!lain) return;
    const a = c.nodes.indexOf(n), b = c.nodes.indexOf(lain);
    c.nodes[a] = lain; c.nodes[b] = n;
  } else if (act === 'kiri') {
    const induk = c.nodes.find(x => x.id === n.parent); if (!induk) return;
    c.nodes.splice(c.nodes.indexOf(n), 1);
    n.parent = induk.parent || '';
    c.nodes.splice(c.nodes.indexOf(induk) + 1, 0, n);
  } else if (act === 'kanan') {
    if (i < 1) return;
    pindahCH(n.id, adik[i - 1].id);
  } else if (act === 'padam') {
    const bawah = keturunanCH(c, n.id);
    if (!await confirmBox(bawah.size ? `Padam kotak "${n.jawatan || 'tanpa jawatan'}" dan ${bawah.size} kotak di bawahnya?` : `Padam kotak "${n.jawatan || 'tanpa jawatan'}"?`, 'Padam', true)) return;
    c.nodes = c.nodes.filter(x => x.id !== n.id && !bawah.has(x.id));
    CH.pilih = adik[i - 1] ? adik[i - 1].id : n.parent || (c.nodes[0] || {}).id || '';
  }
  ubahCH();
}

        ${a.idGuru ? '' : `<input data-k="nama" maxlength="100" class="inp py-1.5 text-xs flex-1 min-w-[160px]" placeholder="Nama penuh" value="${esc(a.nama)}">`}

        ${a.fotoId ? '<button type="button" data-k="buangFoto" class="btn btn-ghost py-1.5 text-[11px]" title="Guna gambar profil">Buang gambar</button>' : ''}
        <button type="button" data-k="padam" class="btn btn-ghost py-1.5" aria-label="Keluarkan guru"><i class="fa-solid fa-xmark text-rose-500"></i></button>
      </div>`;
    }).join('') : '<p class="text-xs text-slate-500">Belum ada guru. Kotak tanpa guru dipaparkan sebagai tajuk unit.</p>';
    hydrateFotos(box);
  };
  lukisAhli();
  const box = m.querySelector('#cnAhli');
  box.onchange = async e => {
    const r = e.target.closest('[data-i]'); if (!r) return;
    const a = ahli[Number(r.dataset.i)], k = e.target.dataset.k;
    if (k === 'idGuru') { a.idGuru = e.target.value; if (a.idGuru) a.nama = ''; lukisAhli(); }
    else if (k === 'nama') a.nama = e.target.value.trim();
    else if (k === 'foto') {
      const f = e.target.files[0]; if (!f) return;
      try { toast('Memuat naik gambar…', 'info'); a.fotoId = await uploadFoto(f, 'cartahem', 600); lukisAhli(); }
      catch (er) { toast(er.message, 'error'); }
    }
  };
  box.onclick = e => {
    const b = e.target.closest('button[data-k]'), r = e.target.closest('[data-i]'); if (!b || !r) return;
    if (b.dataset.k === 'padam') ahli.splice(Number(r.dataset.i), 1);
    if (b.dataset.k === 'buangFoto') ahli[Number(r.dataset.i)].fotoId = '';
    lukisAhli();
  };
  m.querySelector('#cnTambah').onclick = () => {
    if (ahli.length >= 12) return toast('Maksimum 12 guru dalam satu kotak.', 'error');
    ahli.push({ idGuru: '', nama: '', fotoId: '' }); lukisAhli();
    const s = box.querySelectorAll('select'); if (s.length) s[s.length - 1].focus();
  };
  m.querySelector('#cnSimpan').onclick = () => {
    box.querySelectorAll('input[data-k="nama"]').forEach(inp => { ahli[Number(inp.closest('[data-i]').dataset.i)].nama = inp.value.trim(); });
    const jawatan = m.querySelector('#cnJawatan').value.trim();
    if (!jawatan) return toast('Isi jawatan dahulu.', 'error');
    n.jawatan = jawatan; n.ahli = ahli.filter(a => a.idGuru || a.nama);
    n.susun = (m.querySelector('input[name="cnSusun"]:checked') || {}).value || 'mendatar';
    m.querySelector('[data-close]').click();
    ubahCH();
  };
  setTimeout(() => m.querySelector('#cnJawatan').focus(), 50);
}

async function simpanCH() {
  const c = CH.edit;
  const kosong = c.nodes.filter(n => !n.jawatan.trim());
  if (kosong.length) { CH.pilih = kosong[0].id; lukisEditorCH(); return toast('Ada kotak tanpa jawatan. Isi jawatan atau padam kotak itu.', 'error'); }
  const baru = await CH.ctx.simpan(c);
  CH.data = baru; CH.edit = salinCH(baru); CH.ubah = false;
  toast(`Carta organisasi ${CH.ctx.nama} disimpan.`, 'success');
  lukisCartaHem();
}

const IKON_UNIT = ['fa-scale-balanced', 'fa-comments', 'fa-shield-halved', 'fa-star', 'fa-broom', 'fa-kit-medical', 'fa-mosquito', 'fa-ban',

}
function lukisSenaraiUnit() {
  const v = $('#view-unit'), q = UH.q.trim().toLowerCase();
  const list = UH.list.filter(u => !q || (u.nama + ' ' + u.singkatan + ' ' + u.namaKetua).toLowerCase().includes(q));
  const aktif = list.filter(u => u.status !== 'Arkib'), arkib = list.filter(u => u.status === 'Arkib');
  const kad = (u, i) => `<div class="card p-4 flex gap-3 items-start ${u.status === 'Arkib' ? 'opacity-60' : ''} ${UH.susun ? '' : 'hover:shadow-md cursor-pointer transition'}" ${UH.susun ? '' : `onclick="bukaUnit('${jsq(u.id)}')"`}>
      ${ikonUnit(u)}
      <span class="min-w-0 flex-1"><span class="block font-bold text-sm text-slate-800">Unit ${esc(u.nama)}</span>
        <span class="block text-[11px] ${u.namaKetua ? 'text-slate-500' : 'text-rose-600'}"><i class="fa-solid fa-user-tie mr-1"></i>${esc(u.namaKetua || 'Ketua belum dilantik')}</span>
        <span class="flex flex-wrap gap-1.5 mt-2 text-[10px] font-semibold">
          <span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">${u.bilAhli} ahli</span>
          <span class="px-2 py-0.5 rounded-full ${u.bilOpr ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-600'}">${u.bilOpr} OPR ${esc(new Date().getFullYear())}</span>
          ${u.menunggu ? `<span class="px-2 py-0.5 rounded-full bg-amber-100 text-amber-800">${u.menunggu} menunggu semakan</span>` : ''}
          ${u.status === 'Arkib' ? '<span class="px-2 py-0.5 rounded-full bg-slate-200 text-slate-700">Arkib</span>' : ''}</span></span>
      ${UH.susun && u.status !== 'Arkib' ? `<span class="flex flex-col gap-1"><button class="btn btn-ghost py-1 px-2" onclick="gerakUnit('${jsq(u.id)}',-1)" ${i === 0 ? 'disabled' : ''} aria-label="Naik"><i class="fa-solid fa-arrow-up"></i></button>
        <button class="btn btn-ghost py-1 px-2" onclick="gerakUnit('${jsq(u.id)}',1)" ${i === aktif.length - 1 ? 'disabled' : ''} aria-label="Turun"><i class="fa-solid fa-arrow-down"></i></button></span>`
        : UH.susun ? '' : '<i class="fa-solid fa-chevron-right text-slate-300 mt-1"></i>'}
    </div>`;
  v.innerHTML = `<div class="card p-4 flex flex-wrap items-center gap-2">
      <div class="mr-auto"><h3 class="font-bold text-slate-800">Unit HEM</h3><p class="text-[11px] text-slate-500">${aktif.length} unit${arkib.length ? ` · ${arkib.length} diarkibkan` : ''}</p></div>
      <input id="uhCari" value="${esc(UH.q)}" placeholder="Cari unit atau ketua" class="inp w-56 py-1.5 text-xs" ${UH.susun ? 'disabled' : ''}>
      ${UH.urus ? (UH.susun ? '<button class="btn btn-primary" id="uhSusunSiap"><i class="fa-solid fa-check"></i> Simpan susunan</button>'
        : '<button class="btn btn-ghost" onclick="UH.susun=true;lukisSenaraiUnit()"><i class="fa-solid fa-arrow-down-short-wide"></i> Susun</button><button class="btn btn-primary" onclick="openUnitModal()"><i class="fa-solid fa-plus"></i> Tambah unit</button>') : ''}
    </div>
    ${aktif.length ? `<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">${aktif.map(kad).join('')}</div>` : `<div class="card">${emptyBox('fa-people-roof', q ? 'Tiada unit sepadan.' : 'Belum ada unit.')}</div>`}
    ${arkib.length && !UH.susun ? `<p class="text-xs font-bold text-slate-500 pt-2">Diarkibkan</p><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">${arkib.map(kad).join('')}</div>` : ''}`;
  $('#uhCari').oninput = debounce(e => { UH.q = e.target.value; lukisSenaraiUnit(); const i = $('#uhCari'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 200);
  if ($('#uhSusunSiap')) $('#uhSusunSiap').onclick = e => busy(e.currentTarget, async () => {
    await api('susunUnitHem', { ids: UH.list.map(u => u.id) });
    UH.susun = false; lukisSenaraiUnit(); toast('Susunan unit disimpan.', 'success');
  });
}
function gerakUnit(id, arah) {
  const aktif = UH.list.filter(u => u.status !== 'Arkib'), i = aktif.findIndex(u => u.id === id), j = i + arah;
  if (i < 0 || j < 0 || j >= aktif.length) return;
  [aktif[i], aktif[j]] = [aktif[j], aktif[i]];
  UH.list = aktif.concat(UH.list.filter(u => u.status === 'Arkib'));
  lukisSenaraiUnit();
}

        <p class="text-[11px] text-slate-500 mt-1">Ketua unit boleh menyunting carta & skop tugas dan mengesahkan laporan aktiviti unit ini.</p></div>
      <div><p class="lbl">Ikon</p><div class="flex flex-wrap gap-1.5" id="umIkon"></div></div>

    m.querySelector('#umWarna').innerHTML = WARNA_UNIT.map(w => `<button type="button" data-wr="${w}" aria-label="${w}" class="w-8 h-8 rounded-full ${w === pilih.warna ? 'ring-2 ring-offset-2 ring-slate-700' : ''}" style="background:${HEX_UNIT[w]}"></button>`).join('');

/* ---- Halaman unit ---- */
async function bukaUnit(id) {
  if (UH.id && UH.id !== id && CH.ubah && !await confirmBox('Perubahan carta belum disimpan. Tinggalkan perubahan?')) return;
  if (UH.id !== id) { UH.sub = UH.sub || 'carta'; UH.opr = null; UH.skopEdit = false; }
  UH.id = id;
  const v = $('#view-unit');
  v.innerHTML = `<div id="uhKepala" class="card p-4">${skel('h-12')}</div><div id="unitIsi" class="space-y-4"></div>`;
  try {
    const u = await api('getUnitHem', { id });
    if (UH.id !== id || !$('#uhKepala')) return;
    UH.unit = u; lukisKepalaUnit(); bukaSubUnit();
  } catch (e) { $('#uhKepala').innerHTML = errBox(e.message, `bukaUnit('${jsq(id)}')`); }
}
async function kembaliUnit() {
  if (CH.ubah && !await confirmBox('Perubahan carta belum disimpan. Tinggalkan perubahan?')) return;
  if (CH.ctx && CH.ctx.kunci.indexOf('unit:') === 0) Object.assign(CH, { sunting: false, edit: null, ubah: false });
  UH.id = ''; UH.unit = null; UH.sub = 'carta'; renderUnit();
}
function lukisKepalaUnit() {
  const u = UH.unit, a = u.akses;
  $('#uhKepala').innerHTML = `<div class="space-y-3">
    <div class="flex flex-wrap items-center gap-3">

        <p class="text-[11px] text-slate-500">Ketua unit: ${esc(u.namaKetua || 'belum dilantik')} · ${u.bilAhli} ahli${a.ketua ? ' · <b class="text-brand-700">Anda ketua unit</b>' : a.ahli ? ' · <b class="text-brand-700">Anda ahli unit</b>' : ''}</p></div>
      ${a.urus ? `<button class="btn btn-ghost" onclick="openUnitModal('${jsq(u.id)}')"><i class="fa-solid fa-gear"></i> Tetapan unit</button>` : ''}
    </div>
    <nav id="uhNav" class="flex flex-wrap gap-1.5">${[['carta', 'Carta organisasi', 'fa-sitemap'], ['skop', 'Skop tugas', 'fa-list-check'], ['opr', 'Laporan aktiviti (OPR)', 'fa-file-lines']].map(([k, l, ik]) =>

}
function bukaSubUnit() { ({ carta: paintCartaUnit, skop: paintSkopUnit, opr: paintOprUnit })[UH.sub](); }

function cartaUnitLalai(u) {
  const n = (id, parent, jawatan, ahli) => ({ id, parent, jawatan, ahli: ahli || [], susun: 'mendatar' });
  return { tajuk: 'Carta Organisasi Unit ' + u.nama, sub: 'Sesi ' + new Date().getFullYear(), reka: 'eksekutif', latar: '', kotak: '', utama: HEX_UNIT[u.warna] || '',
    nodes: [n('n1', '', 'Penasihat'), n('n2', 'n1', 'Ketua Unit', u.idKetua ? [{ idGuru: u.idKetua, nama: '', fotoId: '' }] : []), n('n3', 'n2', 'Setiausaha'), n('n4', 'n2', 'Ahli Jawatankuasa')] };
}
function paintCartaUnit() {
  const u = UH.unit;
  pasangKonteksCH({ kunci: 'unit:' + u.id, el: '#unitIsi', nama: 'Unit ' + u.nama, fail: 'Carta_Unit_' + (u.singkatan || u.nama).replace(/[^A-Za-z0-9]+/g, '_'),
    lalai: () => cartaUnitLalai(u), simpan: c => api('simpanCartaUnit', { id: u.id, carta: c }).then(r => {
      u.carta = r.carta; u.bilAhli = new Set(r.carta.nodes.flatMap(n => n.ahli.map(a => a.idGuru || a.nama))).size; lukisKepalaUnit();
      return r.carta;
    }) });
  CH.data = u.carta; CH.urus = u.akses.sunting;
  if (CH.sunting && !CH.edit) CH.sunting = false;
  lukisCartaHem();
}

/* ---- Skop tugas (ikut jawatan dalam carta unit) ---- */
function jawatanUnit(u) {
  const c = u.carta, out = [];
  if (!c || !Array.isArray(c.nodes)) return out;
  const jalan = (p, aras) => anakCH(c, p).forEach(n => { out.push({ n, aras }); jalan(n.id, aras + 1); });
  jalan('', 0);
  return out;
}
function paintSkopUnit() {
  const u = UH.unit, s = u.skop, jaw = jawatanUnit(u), ed = UH.skopEdit;
  const nama = n => n.ahli.map(a => orangCH(a).nama).join(', ');
  $('#unitIsi').innerHTML = `<div class="card p-4 space-y-4">
    <div class="flex flex-wrap items-center gap-2"><div class="mr-auto"><p class="text-sm font-bold text-slate-800">Skop tugas</p>

      ${ed ? '<button class="btn btn-ghost" id="skBatal">Batal</button><button class="btn btn-primary" id="skSimpanU"><i class="fa-solid fa-floppy-disk"></i> Simpan</button>'

    <div class="rounded-xl border border-slate-200 p-3"><p class="text-xs font-extrabold text-slate-700 uppercase mb-1">Skop umum unit</p>
      ${ed ? `<textarea id="skUmum" rows="4" maxlength="3000" class="inp" placeholder="Objektif, fungsi dan takwim utama unit">${esc(s.umum)}</textarea>`
        : s.umum ? `<p class="text-xs text-slate-700 whitespace-pre-line">${esc(s.umum)}</p>` : '<p class="text-xs text-slate-400">Belum diisi.</p>'}</div>
    ${jaw.length ? jaw.map(({ n, aras }) => {
      const t = (s.jawatan || {})[n.id] || [];
      return `<div class="rounded-xl border border-slate-200 p-3" style="margin-left:${Math.min(aras, 3) * 12}px">

/* ==================================================================
 *  REKOD KAWALAN KELAS: guru check in apabila masuk kelas
 *  Waktu & subjek ikut jadual waktu aSc; kehadiran murid & peratus daripada rekod kehadiran harian.
 * ================================================================== */
const KK = { id: '', tarikh: '', data: null, mod: 'kelas', saya: null, sayaMasa: 0 };
const minitJam = s => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(s || '')); return m ? Number(m[1]) * 60 + Number(m[2]) : null; };
const minitKini = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
// Susun ikut period jadual (period 1 hingga akhir). Rekod tanpa jadual diselitkan ikut masa mula ("7:40" sebelum "10:50").
function susunWaktu(a, b) {
  if (a.w >= 0 && b.w >= 0) return a.w - b.w;
  const x = minitJam(a.mula), y = minitJam(b.mula);
  return (x === null ? 1e4 : x) - (y === null ? 1e4 : y);
}
const pctHadir = h => h.jumlah ? Math.round(h.hadir / h.jumlah * 1000) / 10 : 0;
function teksHadir(h) { return h.direkod ? `${h.hadir} / ${h.jumlah} (${pctHadir(h)}%)` : 'Kehadiran belum direkod'; }
function waktuTeks(s) { return [s.label ? 'Waktu ' + s.label : '', s.mula ? `${s.mula}${s.tamat ? '–' + s.tamat : ''}` : ''].filter(Boolean).join(' · '); }
function badgeMasuk(r) {
  return `<span class="badge ${r.status === 'Lewat' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}">${esc(r.masuk)} · ${esc(r.namaGuru)}</span>` +
    (r.status === 'Lewat' ? ' <span class="badge bg-amber-50 text-amber-700">Lewat</span>' : '') + (r.ganti ? ' <span class="badge bg-violet-100 text-violet-800">Guru ganti</span>' : '');
}

async function lukisKawalanSaya(paksa) {
  const el = $('#dsbKawalan'); if (!el) return;
  if (paksa || !KK.saya || Date.now() - KK.sayaMasa > 60000) {
    try { KK.saya = await api('jadualSaya'); KK.sayaMasa = Date.now(); } catch (e) { return; }
    if (!$('#dsbKawalan')) return;
  }
  const d = KK.saya, kini = minitKini(), slot = d.slot;
  const status = s => s.masuk ? 'selesai' : kini >= minitJam(s.tamat) ? 'terlepas' : kini >= minitJam(s.mula) - 10 ? 'sekarang' : 'datang';
  const fokus = slot.find(s => status(s) === 'sekarang') || slot.find(s => status(s) === 'datang');
  const CHIP = { selesai: ['Sudah check in', 'bg-emerald-100 text-emerald-800'], terlepas: ['Tiada check in', 'bg-rose-100 text-rose-700'], sekarang: ['Sekarang', 'bg-sky-100 text-sky-800'], datang: ['Akan datang', 'bg-slate-100 text-slate-500'] };
  if (!slot.length) {
    $('#dsbKawalan').innerHTML = `<div class="card p-4 flex flex-wrap items-center gap-3"><span class="w-10 h-10 rounded-xl bg-teal-100 text-teal-700 flex items-center justify-center"><i class="fa-solid fa-door-open"></i></span>

      <div class="flex-1 min-w-0"><p class="text-[11px] font-semibold opacity-80">${status(fokus) === 'sekarang' ? 'KELAS ANDA SEKARANG' : 'KELAS SETERUSNYA'}</p>
        <p class="text-lg font-extrabold truncate">${esc(fokus.subjek)} · ${esc(fokus.namaKelas)}</p><p class="text-xs opacity-90">${esc(waktuTeks(fokus))}</p></div>
      ${status(fokus) === 'sekarang' ? `<button class="btn bg-emerald-500 hover:bg-emerald-600 text-white text-sm px-5 py-2.5" onclick="openCheckIn('${jsq(fokus.idKelas)}',${fokus.w})"><i class="fa-solid fa-right-to-bracket"></i> Check in</button>` : ''}
    </div>` : ''}
    <div class="p-4 space-y-1.5">
      <p class="text-xs font-bold text-slate-700">Jadual saya hari ini</p>
      ${slot.map(s => { const st = status(s); return `<div class="flex items-center gap-2 rounded-xl border border-slate-200 p-2 text-xs">
        <span class="w-24 shrink-0 text-slate-500">${esc(s.mula)}–${esc(s.tamat)}</span><b class="flex-1 min-w-0 truncate">${esc(s.subjek)} · ${esc(s.namaKelas)}</b>
        ${st === 'sekarang' || st === 'terlepas' ? `<button class="btn btn-ghost py-1 text-[11px]" onclick="openCheckIn('${jsq(s.idKelas)}',${s.w})">Check in</button>` : ''}
        <span class="badge ${CHIP[st][1]}">${st === 'selesai' ? esc(s.masuk) : CHIP[st][0]}</span></div>`; }).join('')}
      <button class="btn btn-ghost w-full justify-center mt-1" onclick="openCheckIn()"><i class="fa-solid fa-plus"></i> Check in kelas lain (guru ganti / relief)</button>
    </div></div>`;
}

/* ---- Tetingkap check in ---- */
async function openCheckIn(idKelas, waktu) {
  let id = idKelas || (S.tab === 'kelas' && K.id) || (S.user.kelasSaya || [])[0] || (S.kelas[0] || {}).id, d = null;
  const m = openModal({
    title: 'Check in kelas', size: 'max-w-lg', body: '<div id="ciIsi">' + skel('h-16', 3, 'mb-2') + '</div>',
    footer: '<button class="btn btn-ghost" data-close>Batal</button><button class="btn btn-success" id="ciOk" disabled><i class="fa-solid fa-right-to-bracket"></i> Check in</button>'
  });
  const lukis = () => {
    const kini = minitKini(), sudah = new Set(d.rekod.map(r => r.waktu));
    const boleh = d.slot.filter(s => !s.rehat && !sudah.has(s.w));
    if (waktu === undefined || waktu === null || !boleh.some(s => s.w === waktu)) {
      const s = boleh.find(x => kini >= minitJam(x.mula) - 10 && kini < minitJam(x.tamat)) || boleh.find(x => kini < minitJam(x.tamat)) || boleh[0];
      waktu = s ? s.w : -1;
    }
    const s = d.slot.find(x => x.w === waktu), h = d.kehadiran;
    const kotak = (l, v, w) => `<div class="rounded-xl ${w} p-2 text-center"><p class="text-[10px] font-semibold opacity-80">${l}</p><p class="text-xl font-extrabold">${v}</p></div>`;
    m.querySelector('#ciIsi').innerHTML = `<div class="space-y-3">
      <div class="grid grid-cols-2 gap-3">
        <div><label class="lbl" for="ciKelas">Kelas</label><select id="ciKelas" class="inp">${kelasOptions(id)}</select></div>
        <div><label class="lbl" for="ciWaktu">Waktu</label><select id="ciWaktu" class="inp">
          ${d.slot.filter(x => !x.rehat).map(x => `<option value="${x.w}" ${x.w === waktu ? 'selected' : ''} ${sudah.has(x.w) ? 'disabled' : ''}>${esc(waktuTeks(x))}${sudah.has(x.w) ? ' (sudah check in)' : ''}</option>`).join('')}
          <option value="-1" ${waktu === -1 ? 'selected' : ''}>Lain-lain (tiada dalam jadual)</option></select></div>
      </div>
      ${!d.adaJadual ? '<p class="text-[11px] text-amber-800 bg-amber-50 rounded-xl p-2">Jadual waktu kelas ini belum dimuat naik. Isi masa dan subjek sendiri.</p>' : ''}
      ${waktu === -1 ? `<div class="grid grid-cols-2 gap-3"><div><label class="lbl" for="ciMula">Masa mula</label><input id="ciMula" type="time" class="inp" value="${pad(new Date().getHours())}:${pad(new Date().getMinutes())}"></div>
        <div><label class="lbl" for="ciTamat">Masa tamat</label><input id="ciTamat" type="time" class="inp"></div></div>` : ''}
      <div><label class="lbl" for="ciSubjek">Subjek</label><input id="ciSubjek" maxlength="80" class="inp" value="${esc(s ? s.subjek : '')}" placeholder="cth Matematik"></div>
      ${s && s.guru ? `<p class="text-[11px] text-slate-500 -mt-1">Guru dalam jadual: <b>${esc(s.guru)}</b>. Jika anda bukan guru ini, rekod ditanda sebagai guru ganti secara automatik.</p>`
        : '<label class="flex items-center gap-2 text-xs font-semibold"><input type="checkbox" id="ciGanti"> Saya guru ganti / relief</label>'}
      <div class="grid grid-cols-3 gap-2">${kotak('Hadir', h.direkod ? h.hadir : '-', 'bg-emerald-50 text-emerald-800')}${kotak('Tidak hadir', h.direkod ? h.jumlah - h.hadir : '-', 'bg-rose-50 text-rose-800')}${kotak('Peratus', h.direkod ? pctHadir(h) + '%' : '-', 'bg-sky-50 text-sky-800')}</div>
      <p class="text-[11px] text-slate-500 -mt-1"><i class="fa-solid fa-circle-info"></i> ${h.direkod ? `Automatik daripada rekod kehadiran hari ini.${h.tidakHadir.length ? ' Tidak hadir: ' + esc(h.tidakHadir.join(', ')) + '.' : ''}` : 'Kehadiran hari ini belum direkod oleh guru kelas.'}</p>
      <div><label class="lbl" for="ciTajuk">Tajuk / aktiviti pembelajaran (pilihan)</label><input id="ciTajuk" maxlength="200" class="inp" placeholder="cth Pecahan: penambahan"></div>
      <div><label class="lbl" for="ciCatatan">Catatan</label><textarea id="ciCatatan" rows="2" maxlength="500" class="inp" placeholder="cth 3 murid tidak bawa buku latihan"></textarea></div>
    </div>`;
    m.querySelector('#ciOk').disabled = false;
    m.querySelector('#ciKelas').onchange = e => { id = e.target.value; waktu = null; muat(); };
    m.querySelector('#ciWaktu').onchange = e => { waktu = Number(e.target.value); lukis(); };
  };
  const muat = async () => {
    m.querySelector('#ciOk').disabled = true;
    m.querySelector('#ciIsi').innerHTML = skel('h-16', 3, 'mb-2');
    try { d = await api('getKawalan', { idKelas: id }); if (d.idKelas === id) lukis(); }
    catch (e) { m.querySelector('#ciIsi').innerHTML = errBox(e.message); }
  };
  m.querySelector('#ciOk').onclick = e => busy(e.currentTarget, async () => {
    const q = s => m.querySelector(s);
    const p = { idKelas: id, waktu, subjek: q('#ciSubjek').value.trim(), tajuk: q('#ciTajuk').value.trim(), catatan: q('#ciCatatan').value.trim(), ganti: !!(q('#ciGanti') && q('#ciGanti').checked) };
    if (waktu === -1) { p.mula = q('#ciMula').value; p.tamat = q('#ciTamat').value; if (!p.mula) return toast('Isi masa mula.', 'error'); }
    if (!p.subjek) return toast('Isi subjek.', 'error');
    const r = await api('checkIn', p);
    m.querySelector('[data-close]').click();
    toast(`Check in direkod pada ${r.masuk}${r.status === 'Lewat' ? ' (lewat)' : ''}.`, 'success');
    lukisKawalanSaya(true);
    if (S.tab === 'kelas' && K.sub === 'kawalan' && K.id === id) muatKawalan();
  }, 'Merekod…');
  muat();
}

/* ---- Tab Kawalan kelas (Pengurusan Kelas) ---- */
function paintKawalan() {
  const pantau = can('pantau_kawalan') && KK.mod === 'pantau';
  if (!KK.tarikh) KK.tarikh = todayStr();
  KK.id = K.id;
  $('#kBody').innerHTML = `<div id="kkBody" class="space-y-4">
    <div class="card p-3 flex flex-wrap items-center gap-2">
      ${can('pantau_kawalan') ? `<div class="flex gap-1 mr-1">${[['kelas', 'Kelas ini'], ['pantau', 'Pemantauan semua kelas']].map(([k, l]) =>
        `<button class="btn ${KK.mod === k ? 'btn-primary' : 'btn-ghost'} py-1.5" onclick="KK.mod='${k}';paintKawalan()">${l}</button>`).join('')}</div>` : ''}
      ${pantau ? '<button class="btn btn-ghost py-1.5 ml-auto" onclick="muatPantau()"><i class="fa-solid fa-rotate"></i> Muat semula</button>' : `
        <button class="btn btn-ghost py-1.5" onclick="tukarHariKK(-1)" aria-label="Hari sebelum"><i class="fa-solid fa-chevron-left"></i></button>
        <input type="date" id="kkTarikh" class="${TAPIS_CLS}" value="${esc(KK.tarikh)}" max="${todayStr()}" aria-label="Tarikh">
        <button class="btn btn-ghost py-1.5" onclick="tukarHariKK(1)" aria-label="Hari seterusnya"><i class="fa-solid fa-chevron-right"></i></button>
        <button class="btn btn-ghost py-1.5 text-xs" onclick="KK.tarikh=todayStr();paintKawalan()">Hari ini</button>
        <div class="ml-auto flex flex-wrap gap-2"><button class="btn btn-ghost" onclick="cetakKawalanMinggu(this)"><i class="fa-solid fa-print"></i> Cetak minggu</button>
          <button class="btn btn-success" onclick="openCheckIn('${jsq(K.id)}')"><i class="fa-solid fa-right-to-bracket"></i> Check in</button></div>`}
    </div>
    <div id="kkIsi">${skel('h-24', 3, 'mb-3')}</div></div>`;
  if ($('#kkTarikh')) $('#kkTarikh').onchange = e => { if (e.target.value) { KK.tarikh = e.target.value; muatKawalan(); } };
  pantau ? muatPantau() : muatKawalan();
}
function tukarHariKK(n) {
  const d = new Date(KK.tarikh + 'T12:00:00'); d.setDate(d.getDate() + n);
  if (n > 0 && isoTarikh(d) > todayStr()) return;
  KK.tarikh = isoTarikh(d); $('#kkTarikh').value = KK.tarikh; muatKawalan();
}
async function muatKawalan() {
  const id = K.id, t = KK.tarikh;
  if (!$('#kkIsi')) return;
  try {
    const d = await api('getKawalan', { idKelas: id, tarikh: t });
    if (K.id !== id || KK.tarikh !== t || !$('#kkIsi') || KK.mod === 'pantau' && can('pantau_kawalan')) return;
    KK.data = d; lukisKawalan();
  } catch (e) { if ($('#kkIsi')) $('#kkIsi').innerHTML = `<div class="card">${errBox(e.message, 'muatKawalan()')}</div>`; }
}
function lukisKawalan() {
  const d = KK.data, hariIni = d.tarikh === d.hariIni, kini = minitKini(), h = d.kehadiran;
  const ikutWaktu = new Map(d.rekod.filter(r => r.waktu >= 0).map(r => [r.waktu, r]));
  const baris = d.slot.map(s => ({ s, r: s.rehat ? null : ikutWaktu.get(s.w) || null }))
    .concat(d.rekod.filter(r => r.waktu < 0 || !d.slot.some(s => s.w === r.waktu)).map(r => ({ s: { w: -1, label: r.label, mula: r.mula, tamat: r.tamat, subjek: r.subjek, guru: r.guruJadual }, r })))
    .sort((a, b) => susunWaktu(a.s, b.s));
  const bermula = s => !hariIni || minitJam(s.mula) === null || kini >= minitJam(s.mula);
  const slotJalan = d.slot.filter(s => !s.rehat && bermula(s));
  const diisi = slotJalan.filter(s => ikutWaktu.has(s.w)).length, ganti = d.rekod.filter(r => r.ganti).length;
  const kad = (l, v, w, sub) => `<div class="card p-3"><p class="text-[11px] text-slate-500">${l}</p><p class="text-2xl font-extrabold ${w}">${v}</p>${sub ? `<p class="text-[10px] text-slate-500">${sub}</p>` : ''}</div>`;
  $('#kkIsi').innerHTML = `<div class="space-y-4">
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
      ${kad(hariIni ? 'Waktu ada guru (setakat ini)' : 'Waktu ada guru', `${diisi} / ${slotJalan.length}`, 'text-emerald-600')}
      ${kad('Belum check in', slotJalan.length - diisi, slotJalan.length - diisi ? 'text-rose-600' : 'text-slate-400')}
      ${kad('Guru ganti', ganti, 'text-violet-600')}
      ${kad('Kehadiran murid', h.direkod ? pctHadir(h) + '%' : '-', 'text-sky-700', h.direkod ? `${h.hadir} / ${h.jumlah} murid` : 'Belum direkod')}
    </div>
    ${!d.adaJadual ? `<p class="text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-xl p-3">Jadual waktu kelas ini belum dimuat naik. Guru masih boleh check in dengan memilih <b>Lain-lain</b> dan mengisi masa serta subjek.</p>` : ''}
    <div class="card overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-xs">
      <thead class="bg-slate-50 border-b border-slate-200"><tr><th class="th">Waktu</th><th class="th">Subjek</th><th class="th">Guru (jadual)</th><th class="th">Check in</th><th class="th">Hadir</th><th class="th">Tajuk & catatan</th><th class="th"></th></tr></thead>
      <tbody class="divide-y divide-slate-100">${baris.length ? baris.map(({ s, r }) => s.rehat
        ? `<tr><td colspan="7" class="p-1.5 text-center text-[10px] font-bold text-slate-400 bg-slate-50">${esc(s.label || 'REHAT')} · ${esc(s.mula)}–${esc(s.tamat)}</td></tr>`
        : `<tr class="hover:bg-slate-50/70">
          <td class="td whitespace-nowrap"><b>${esc(s.label || '-')}</b><div class="text-[10px] text-slate-500">${esc(s.mula)}${s.tamat ? '–' + esc(s.tamat) : ''}</div></td>
          <td class="td font-semibold text-slate-800">${esc(r ? r.subjek : s.subjek)}</td><td class="td">${esc(s.guru || '-')}</td>
          <td class="td">${r ? badgeMasuk(r) : bermula(s) ? '<span class="badge bg-rose-100 text-rose-700">Belum check in</span>' : '<span class="badge bg-slate-100 text-slate-500">Akan datang</span>'}</td>
          <td class="td whitespace-nowrap">${r ? (h.direkod ? `${h.hadir}/${h.jumlah} <span class="text-slate-500">(${pctHadir(h)}%)</span>` : '<span class="text-slate-400">Belum direkod</span>') : '-'}</td>
          <td class="td text-slate-600">${r ? [r.tajuk ? `<b>${esc(r.tajuk)}</b>` : '', esc(r.catatan)].filter(Boolean).join('<br>') || '-' : '-'}</td>
          <td class="td text-right whitespace-nowrap">${r && r.bolehUbah ? `<button class="btn btn-ghost py-1" onclick="ubahKawalan('${jsq(r.id)}')" aria-label="Ubah catatan"><i class="fa-solid fa-pen"></i></button><button class="btn btn-ghost py-1" onclick="padamKawalan('${jsq(r.id)}')" aria-label="Padam rekod"><i class="fa-solid fa-trash-can text-rose-500"></i></button>`
            : !r && hariIni && s.w >= 0 && kini >= minitJam(s.mula) - 10 ? `<button class="btn btn-ghost py-1 text-[11px]" onclick="openCheckIn('${jsq(d.idKelas)}',${s.w})">Check in</button>` : ''}</td>
        </tr>`).join('') : `<tr><td colspan="7">${emptyBox('fa-door-open', d.adaJadual ? 'Tiada waktu dalam jadual pada hari ini.' : 'Belum ada check in pada hari ini.')}</td></tr>`}</tbody></table></div></div>
    ${h.direkod && h.tidakHadir.length ? `<p class="text-[11px] text-slate-500">Tidak hadir hari ini: ${esc(h.tidakHadir.join(', '))}</p>` : ''}
  </div>`;
}
function ubahKawalan(id) {
  const r = KK.data.rekod.find(x => x.id === id); if (!r) return;
  const m = openModal({
    title: 'Tajuk & catatan', size: 'max-w-md',
    body: `<p class="text-xs text-slate-600">${esc(r.subjek)} · ${esc(waktuTeks(r))} · check in ${esc(r.masuk)}</p>
      <div><label class="lbl" for="ukTajuk">Tajuk / aktiviti pembelajaran</label><input id="ukTajuk" maxlength="200" class="inp" value="${esc(r.tajuk)}"></div>
      <div><label class="lbl" for="ukCatatan">Catatan</label><textarea id="ukCatatan" rows="3" maxlength="500" class="inp">${esc(r.catatan)}</textarea></div>`,
    footer: '<button class="btn btn-ghost" data-close>Batal</button><button class="btn btn-primary" id="ukSimpan">Simpan</button>'
  });
  m.querySelector('#ukSimpan').onclick = e => busy(e.currentTarget, async () => {
    await api('kemaskiniKawalan', { id, tajuk: m.querySelector('#ukTajuk').value, catatan: m.querySelector('#ukCatatan').value });
    m.querySelector('[data-close]').click(); toast('Catatan disimpan.', 'success'); muatKawalan();
  });
}
async function padamKawalan(id) {
  if (!await confirmBox('Padam rekod check in ini?', 'Padam', true)) return;
  try { await api('padamKawalan', { id }); toast('Rekod dipadam.', 'success'); muatKawalan(); lukisKawalanSaya(true); }
  catch (e) { toast(e.message, 'error'); }
}

/* ---- Cetakan buku rekod (seminggu) ---- */
function cetakKawalanMinggu(btn) {
  return busy(btn, async () => {
    const d = await api('kawalanMinggu', { idKelas: K.id, tarikh: KK.tarikh }), k = IDX.kelas.get(K.id);
    const td = 'border:1px solid #94a3b8;padding:3px 5px;font-size:9.5px;text-align:left;vertical-align:top';
    const baris = d.hari.flatMap(h => {
      const ikut = new Map(h.rekod.filter(r => r.waktu >= 0).map(r => [r.waktu, r]));
      const senarai = h.slot.filter(s => !s.rehat).map(s => ({ s, r: ikut.get(s.w) }))
        .concat(h.rekod.filter(r => r.waktu < 0 || !h.slot.some(s => s.w === r.waktu)).map(r => ({ s: r, r })))
        .sort((a, b) => susunWaktu(a.s, b.s));
      const hd = h.kehadiran.direkod ? `${h.kehadiran.hadir}/${h.kehadiran.jumlah} (${pctHadir(h.kehadiran)}%)` : '-';
      return senarai.map(({ s, r }, i) => `<tr>${i === 0 ? `<td style="${td}" rowspan="${senarai.length}"><b>${esc(h.hari)}</b><br>${esc(fmtPendek(h.tarikh))}<br>Hadir: ${hd}</td>` : ''}
        <td style="${td}">${esc(s.label || '')} ${esc(s.mula || '')}${s.tamat ? '–' + esc(s.tamat) : ''}</td><td style="${td}">${esc(r ? r.subjek : s.subjek)}</td>
        <td style="${td}">${r ? esc(r.namaGuru) + (r.ganti ? ' (ganti)' : '') : '<b style="color:#be123c">TIADA CHECK IN</b>'}</td>
        <td style="${td}">${r ? esc(r.masuk) + (r.status === 'Lewat' ? ' (lewat)' : '') : ''}</td><td style="${td}">${r ? esc([r.tajuk, r.catatan].filter(Boolean).join(' · ')) : ''}</td></tr>`);
    });
    printHTML(`<style>@page{size:A4 landscape;margin:10mm}</style><div style="font-family:Arial,sans-serif;color:#0f172a">
      <div style="text-align:center;margin-bottom:8px">${logoCetak('height:40px;display:block;margin:0 auto 4px')}
        <div style="font-size:13px;font-weight:800">${esc(S.tetapan.namaSekolah || '')}</div>
        <div style="font-size:12px;font-weight:700">BUKU REKOD KAWALAN KELAS · ${esc(namaKelasTajuk(k).toUpperCase())}</div>
        <div style="font-size:10px">Minggu ${esc(fmtPendek(d.minggu))} – ${esc(fmtPendek(d.hari[4].tarikh))} · Guru kelas: ${esc(k.namaGuruKelas || '-')}</div></div>
      <table style="width:100%;border-collapse:collapse"><tr>${['Hari / tarikh', 'Waktu', 'Subjek', 'Guru masuk', 'Masa masuk', 'Tajuk & catatan'].map(x => `<th style="${td};background:#f1f5f9">${x}</th>`).join('')}</tr>
        ${baris.join('') || `<tr><td style="${td}" colspan="6">Tiada rekod.</td></tr>`}</table>
      <table style="width:100%;margin-top:16px;font-size:10px"><tr><td>Disemak oleh guru kelas:<br><br>....................................</td><td>Disahkan oleh PK HEM:<br><br>....................................</td></tr></table></div>`);
  }, 'Menyediakan…');
}

/* ==================================================================
 *  IMBAS QR MURID: menu pantas (amalan baik, salah laku, hadir lewat, maklumat penjaga)
 *  Kod QR = pautan sistem + #murid=ID (sama seperti Kad ID), dicetak pada label meja dalam pelan tempat duduk.
 * ================================================================== */
const URL_H5QR = 'https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js';
const SEBAB_LEWAT = ['Bangun lewat', 'Kenderaan / pengangkutan', 'Hujan', 'Urusan keluarga', 'Sakit', 'Lain-lain'];
const QRC = new Map();
function qrMurid(id) { if (!QRC.has(id)) QRC.set(id, qrURL(urlProfil(id))); return QRC.get(id); }
// ID murid daripada teks QR: pautan "...#murid=ID" atau ID sahaja
function idDariQR(teks) {
  const s = String(teks || '').trim(), i = s.indexOf('#murid=');
  const id = i >= 0 ? decodeURIComponent(s.slice(i + 7)) : s;
  return IDX.murid.has(id) ? id : '';
}
function jamKini() { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }

async function bukaPengimbas() {
  let pengimbas = null, selesai = false;
  const m = openModal({
    title: 'Imbas QR murid', size: 'max-w-md',
    body: `<div id="qrKamera" class="w-full aspect-square bg-slate-900 rounded-2xl overflow-hidden flex items-center justify-center text-slate-300 text-xs text-center p-4"><span><i class="fa-solid fa-spinner fa-spin mr-1"></i> Membuka kamera…</span></div>
      <p class="text-[11px] text-slate-500 text-center">Halakan kamera ke kod QR pada meja atau Kad ID murid.</p>
      <div><input id="qrCari" class="inp" placeholder="Atau taip nama murid" autocomplete="off"><div id="qrHasil" class="mt-1 space-y-1"></div></div>
      <div class="border-t border-slate-100 pt-3">
        <button type="button" id="qrKelasBuka" class="btn btn-ghost w-full justify-center"><i class="fa-solid fa-users"></i> Murid tiada kad? Pilih ikut kelas</button>
        <div id="qrKelas" class="hidden space-y-2"><select id="qrKelasSel" class="inp" aria-label="Kelas"></select>
          <div id="qrGrid" class="grid grid-cols-3 sm:grid-cols-4 gap-2"></div></div>
      </div>`,
    footer: '<button class="btn btn-ghost" data-close>Tutup</button>'
  });
  // Murid tanpa kad: pilih kelas, kemudian tekan gambar murid (tanpa menaip)
  const lukisGrid = () => {
    const idK = m.querySelector('#qrKelasSel').value;
    try { localStorage.setItem('hem_imbas_kelas', idK); } catch (e) { /* abaikan */ }
    const ms = muridKelas(idK).slice().sort((a, b) => a.nama.localeCompare(b.nama));
    m.querySelector('#qrGrid').innerHTML = ms.map(x => `<button type="button" data-qid="${esc(x.id)}" class="flex flex-col items-center gap-1 p-2 rounded-xl border border-slate-200 hover:border-brand-500 hover:bg-brand-50">
      ${avatar(x.nama, x.fotoId, x.jantina, 'w-16 h-16', 'text-sm')}<span class="text-[10.5px] font-semibold text-center leading-tight line-clamp-2">${esc(namaPendek(x.nama))}</span></button>`).join('')
      || '<p class="col-span-full text-xs text-slate-500">Tiada murid dalam kelas ini.</p>';
    hydrateFotos(m.querySelector('#qrGrid'));
  };
  m.querySelector('#qrKelasBuka').onclick = () => {
    let lalai = ''; try { lalai = localStorage.getItem('hem_imbas_kelas') || ''; } catch (e) { /* abaikan */ }
    if (!IDX.kelas.has(lalai)) lalai = (S.user.kelasSaya || [])[0] || (S.kelas[0] || {}).id || '';
    m.querySelector('#qrKelasSel').innerHTML = kelasOptions(lalai);
    m.querySelector('#qrKelasBuka').classList.add('hidden'); m.querySelector('#qrKelas').classList.remove('hidden');
    m.querySelector('#qrKamera').classList.add('hidden'); henti();   // tutup kamera supaya grid kelihatan
    lukisGrid();
  };
  m.querySelector('#qrKelasSel').onchange = lukisGrid;
  m.querySelector('#qrGrid').onclick = e => { const b = e.target.closest('[data-qid]'); if (b) pilih(b.dataset.qid); };
  const henti = () => { if (pengimbas) { const p = pengimbas; pengimbas = null; p.stop().then(() => p.clear()).catch(() => {}); } };
  const jaga = setInterval(() => { if (!document.body.contains(m)) { clearInterval(jaga); henti(); } }, 400);
  const pilih = id => {
    if (selesai) return; selesai = true;
    if (navigator.vibrate) try { navigator.vibrate(40); } catch (e) { /* abaikan */ }
    henti(); m.querySelector('[data-close]').click(); openMenuMurid(id);
  };
  m.querySelector('#qrCari').oninput = debounce(e => {
    const q = e.target.value.trim().toLowerCase();
    const hasil = q.length < 2 ? [] : S.murid.filter(x => x.nama.toLowerCase().includes(q)).slice(0, 8);
    m.querySelector('#qrHasil').innerHTML = hasil.map(x => `<button type="button" data-qid="${esc(x.id)}" class="w-full flex items-center gap-2 p-2 rounded-xl hover:bg-slate-50 text-left">
      ${avatar(x.nama, x.fotoId, x.jantina, 'w-8 h-8', 'text-[10px]')}<span class="min-w-0"><span class="block text-xs font-bold truncate">${esc(x.nama)}</span><span class="block text-[11px] text-slate-500">${esc(x.namaKelas)}</span></span></button>`).join('');
    hydrateFotos(m.querySelector('#qrHasil'));
  }, 150);
  m.querySelector('#qrHasil').onclick = e => { const b = e.target.closest('[data-qid]'); if (b) pilih(b.dataset.qid); };
  try {
    await muatSkrip(URL_H5QR);
    if (!document.body.contains(m)) return;
    m.querySelector('#qrKamera').innerHTML = '';
    pengimbas = new Html5Qrcode('qrKamera');
    await pengimbas.start({ facingMode: 'environment' }, { fps: 10, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.7); return { width: s, height: s }; } },
      teks => { const id = idDariQR(teks); if (id) pilih(id); else toast('Kod QR ini bukan QR murid sistem ini.', 'error'); }, () => {});
    if (!document.body.contains(m)) henti();
  } catch (e) {
    pengimbas = null;
    if (document.body.contains(m)) m.querySelector('#qrKamera').innerHTML = `<span><i class="fa-solid fa-camera-slash text-2xl block mb-2"></i>Kamera tidak dapat dibuka. Benarkan akses kamera dalam tetapan pelayar, atau taip nama murid di bawah.</span>`;
  }
}
