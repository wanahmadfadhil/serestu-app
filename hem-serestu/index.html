function pasangTetapanAsas() {
  const kad = $('#kadAsas'); if (!kad) return;
  kad.querySelector('#asSimpan').onclick = e => busy(e.currentTarget, async () => {
    const namaApp = $('#asNamaApp').value.trim(), namaSekolah = $('#asNamaSekolah').value.trim();
    if (!namaApp || !namaSekolah) throw new Error('Nama aplikasi dan nama sekolah wajib diisi.');
    await api('simpanTetapan', { nilai: { NAMA_APP: namaApp, NAMA_SEKOLAH: namaSekolah } });
    simpanJenama({ namaApp, namaSekolah });
    S.tetapan.namaSekolah = namaSekolah; S.tetapan.namaApp = namaApp;
    toast('Nama disimpan.', 'success');
    refreshBoot().catch(() => {});
  });
  kad.querySelector('#asFail').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      toast('Memproses logo…', 'info');
      const dataUrl = await prosesLogo(f);
      $('#asLogo').innerHTML = `<img src="${dataUrl}" alt="Logo" class="max-w-full max-h-full object-contain">`;
      const r = await api('simpanLogo', { dataUrl });
      simpanJenama({ logoVersi: r.logoVersi, logo: dataUrl });
      kad.outerHTML = tetapanAsasHTML($('#asNamaApp').value, $('#asNamaSekolah').value); pasangTetapanAsas();
      toast('Logo disimpan. Latar putih telah dibuang.', 'success');
    } catch (err) { toast(err.message, 'error'); }
  };
  const bb = kad.querySelector('#asBuang');
  if (bb) bb.onclick = async () => {
    if (!await confirmBox('Buang logo sekolah?', 'Buang', true)) return;
    try {
      await api('simpanLogo', { buang: true });
      simpanJenama({ logoVersi: '', logo: '' });
      const k = $('#kadAsas'); k.outerHTML = tetapanAsasHTML($('#asNamaApp').value, $('#asNamaSekolah').value); pasangTetapanAsas();
      toast('Logo dibuang.', 'success');
    } catch (err) { toast(err.message, 'error'); }
  };
}

// Proses logo di pelayar: buang latar putih (flood-fill dari tepi sahaja, jadi putih DI DALAM logo kekal),
// lembutkan tepi, potong ruang kosong, kecilkan ≤ 400px, keluarkan PNG telus
function prosesLogo(file) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('Sila pilih fail gambar (PNG atau JPG).'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Gambar tidak dapat dibaca.')); };
    img.onload = () => {
      URL.revokeObjectURL(url);
      const s0 = Math.min(1, 800 / Math.max(img.width, img.height));
      const W = Math.max(1, Math.round(img.width * s0)), H = Math.max(1, Math.round(img.height * s0));
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      const x = c.getContext('2d'); x.drawImage(img, 0, 0, W, H);
      const d = x.getImageData(0, 0, W, H), p = d.data;
      const putih = i => { const r = p[i], g = p[i + 1], b = p[i + 2], mn = Math.min(r, g, b), mx = Math.max(r, g, b); return p[i + 3] < 20 || (mn >= 225 && mx - mn <= 30); };
      // Flood-fill dari semua piksel tepi
      const buang = new Uint8Array(W * H), tindan = [];
      for (let i = 0; i < W; i++) { tindan.push(i, (H - 1) * W + i); }
      for (let j = 0; j < H; j++) { tindan.push(j * W, j * W + W - 1); }
      while (tindan.length) {
        const n = tindan.pop();
        if (buang[n] || !putih(n * 4)) continue;
        buang[n] = 1;
        const cx = n % W, cy = (n - cx) / W;
        if (cx > 0) tindan.push(n - 1); if (cx < W - 1) tindan.push(n + 1);
        if (cy > 0) tindan.push(n - W); if (cy < H - 1) tindan.push(n + W);
      }
      for (let n = 0; n < W * H; n++) if (buang[n]) p[n * 4 + 3] = 0;
      // Tepi lembut: piksel cerah bersebelahan kawasan dibuang dijadikan separa telus (elak "halo" putih)
      for (let n = 0; n < W * H; n++) {
        if (buang[n]) continue;
        const cx = n % W, cy = (n - cx) / W;
        const jiran = (cx > 0 && buang[n - 1]) || (cx < W - 1 && buang[n + 1]) || (cy > 0 && buang[n - W]) || (cy < H - 1 && buang[n + W]);
        if (!jiran) continue;
        const mn = Math.min(p[n * 4], p[n * 4 + 1], p[n * 4 + 2]);
        if (mn > 170) p[n * 4 + 3] = Math.min(p[n * 4 + 3], Math.round((255 - mn) / 85 * 255));
      }
      x.putImageData(d, 0, 0);
      // Potong ruang telus di sekeliling
      let x0 = W, y0 = H, x1 = -1, y1 = -1;
      for (let y = 0; y < H; y++) for (let xx = 0; xx < W; xx++) if (p[(y * W + xx) * 4 + 3] > 12) { if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      if (x1 < 0) return rej(new Error('Logo kelihatan kosong selepas latar putih dibuang. Cuba gambar lain.'));
      const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
      const keluar = maks => {
        const sk = Math.min(1, maks / Math.max(cw, ch));
        const o = document.createElement('canvas'); o.width = Math.max(1, Math.round(cw * sk)); o.height = Math.max(1, Math.round(ch * sk));
        const ox = o.getContext('2d'); ox.imageSmoothingQuality = 'high'; ox.drawImage(c, x0, y0, cw, ch, 0, 0, o.width, o.height);
        return o.toDataURL('image/png');
      };
      let out = keluar(400);
      if (out.length > 520000) out = keluar(300);
      if (out.length > 520000) out = keluar(220);
      res(out);
    };
    img.src = url;
  });
}

/* ---- Import murid dari fail Excel ---- */
// Hanya lajur ini dihantar ke pelayan (no. akaun bank, kaum, agama dan lain-lain tidak dihantar)
const LAJUR_IMPORT = ['ID MURID', 'NAMA', 'NAMA KELAS', 'JANTINA', 'TAHUN / TINGKATAN', 'TAHUN/TINGKATAN', 'TAHUN', 'NAMA GURU KELAS',
  'STATUS PENGAJIAN', 'TARIKH LAHIR', 'WARGANEGARA', 'NEGARA ASAL', 'STATUS OKU', 'KATEGORI KETIDAKUPAYAAN', 'STATUS YATIM', 'TANGGUNGAN',
  'NO. PENGENALAN', 'JENIS PENGENALAN', 'PENJAGA 1', 'HUBUNGAN PENJAGA 1', 'NO. TEL. BIMBIT PENJAGA 1', 'NO. TEL. PEJABAT PENJAGA 1', 'PENDAPATAN PENJAGA 1',
  'PENJAGA 2', 'HUBUNGAN PENJAGA 2', 'NO. TEL. BIMBIT PENJAGA 2', 'NO. TEL. PEJABAT PENJAGA 2', 'PENDAPATAN PENJAGA 2',
  'ALAMAT 1', 'ALAMAT 2', 'ALAMAT 3', 'POSKOD', 'BANDAR', 'DAERAH', 'NEGERI'];
// Nama lajur alternatif (fail Excel buatan sendiri) → nama lajur IDME
const ALIAS_IMPORT = { 'NAMA MURID': 'NAMA', 'NAMA PENUH': 'NAMA', 'KELAS': 'NAMA KELAS', 'TINGKATAN': 'TAHUN / TINGKATAN', 'NO KP': 'NO. PENGENALAN', 'NO. KP': 'NO. PENGENALAN',
  'MYKID': 'NO. PENGENALAN', 'NO MYKID': 'NO. PENGENALAN', 'NO. MYKID': 'NO. PENGENALAN', 'NO SIJIL LAHIR': 'NO. PENGENALAN', 'NAMA PENJAGA': 'PENJAGA 1',
  'NO TEL PENJAGA': 'NO. TEL. BIMBIT PENJAGA 1', 'NO. TEL PENJAGA': 'NO. TEL. BIMBIT PENJAGA 1', 'TELEFON PENJAGA': 'NO. TEL. BIMBIT PENJAGA 1', 'ID': 'ID MURID' };
const IMP = { data: null, namaFail: '' };

function importExcelHTML() {
  return `
    <div class="card p-5 space-y-4 max-w-3xl">
      <div class="border-b border-slate-100 pb-3">
        <h3 class="font-bold text-slate-800"><i class="fa-solid fa-file-excel text-emerald-600 mr-1"></i> Import murid dari Excel</h3>
        <p class="text-xs text-slate-500">Muat naik fail eksport IDME (.xlsx, .xls atau .csv). Murid dipadankan ikut <b>ID MURID</b>: murid baharu ditambah, murid sedia ada dikemas kini, dan mata merit, foto serta lokasi rumah tidak terpadam. Hanya lajur yang diperlukan dihantar ke pelayan.</p>
      </div>
      <div class="flex flex-wrap gap-2">
        <label class="btn btn-primary cursor-pointer"><i class="fa-solid fa-upload"></i> Pilih fail Excel<input id="impFail" type="file" accept=".xlsx,.xls,.csv" class="hidden"></label>
        <button class="btn btn-ghost" onclick="muatTurunTemplat(this)"><i class="fa-solid fa-download"></i> Templat Excel</button>
      </div>
      <p class="text-[11px] text-slate-500"><i class="fa-solid fa-lightbulb text-amber-500 mr-1"></i> Gunakan fail <b>.xlsx asal</b> dari IDME. Fail .csv yang pernah dibuka dan disimpan dalam Excel mungkin mempunyai ID rosak (cth 2.51E+11).</p>
      <div id="impPratonton"></div>
    </div>`;
}

function selNilai(v) {
  if (v === null || v === undefined) return '';
  if (v instanceof Date) return `${v.getFullYear()}-${pad(v.getMonth() + 1)}-${pad(v.getDate())}`;
  if (typeof v === 'number') return Number.isInteger(v) ? v.toFixed(0) : String(v);
  return String(v).trim();
}

async function bacaFailImport(file) {
  const box = $('#impPratonton');
  box.innerHTML = `<p class="text-xs text-slate-500"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Membaca ${esc(file.name)}…</p>`;
  try {
    if (file.size > 20 * 1024 * 1024) throw new Error('Fail melebihi 20MB.');
    await muatXLSX();
    const buf = await file.arrayBuffer();
    const csv = /\.csv$/i.test(file.name);
    const wb = XLSX.read(buf, { type: 'array', cellDates: true, raw: csv });
    // Pilih helaian pertama yang mengandungi lajur ID MURID
    let rows = null, namaHelaian = '';
    for (const n of wb.SheetNames) {
      const r = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '', blankrows: false });
      if (r.slice(0, 20).some(b => b.some(c => normH(c) === 'ID MURID' || ALIAS_IMPORT[normH(c)] === 'ID MURID'))) { rows = r; namaHelaian = n; break; }
      if (!rows) { rows = r; namaHelaian = n; }
    }
    if (!rows || !rows.length) throw new Error('Fail kosong.');
    sediakanImport(rows, file.name, wb.SheetNames.length > 1 ? namaHelaian : '');
  } catch (e) { box.innerHTML = `<p class="text-xs text-rose-600 bg-rose-50 border border-rose-200 rounded-xl p-3"><i class="fa-solid fa-triangle-exclamation mr-1"></i> ${esc(e.message)}</p>`; }
}

function normH(c) { return String(c || '').toUpperCase().replace(/\s+/g, ' ').trim(); }

function sediakanImport(rows, namaFail, helaian) {
  const box = $('#impPratonton');
  const h = rows.slice(0, 20).findIndex(b => b.some(c => normH(c) === 'ID MURID' || ALIAS_IMPORT[normH(c)] === 'ID MURID'));
  if (h < 0) throw new Error('Lajur "ID MURID" tidak dijumpai. Gunakan eksport IDME atau templat Excel.');
  const H = rows[h].map(c => { const n = normH(c); return LAJUR_IMPORT.indexOf(n) >= 0 ? n : (ALIAS_IMPORT[n] || ''); });
  const ambil = []; const guna = new Set();
  H.forEach((n, i) => { if (n && !guna.has(n)) { guna.add(n); ambil.push(i); } });
  const ix = n => H.indexOf(n);
  const wajib = ['ID MURID', 'NAMA', 'NAMA KELAS', 'JANTINA'].filter(n => ix(n) < 0);
  if (wajib.length) throw new Error('Lajur wajib tiada: ' + wajib.join(', '));
  const iT = ['TAHUN / TINGKATAN', 'TAHUN/TINGKATAN', 'TAHUN'].map(ix).find(i => i >= 0);

  const data = rows.slice(h + 1).map(r => r.map(selNilai)).filter(r => selNilai(r[ix('ID MURID')]) !== '');
  if (!data.length) throw new Error('Tiada baris murid di bawah baris tajuk.');
  const rosak = data.filter(r => /e\+/i.test(r[ix('ID MURID')])).length;
  const ids = data.map(r => r[ix('ID MURID')]);
  const ulang = ids.length - new Set(ids).size;
  const tahun = {};
  data.forEach(r => { const t = (iT !== undefined ? r[iT] : '') || '(tiada tahun)'; tahun[t] = (tahun[t] || 0) + 1; });
  const kelas = new Set(data.map(r => r[ix('NAMA KELAS')] + '|' + (iT !== undefined ? r[iT] : ''))).size;
  const baru = ids.filter(id => !IDX.murid.has(id)).length;

  IMP.data = [ambil.map(i => H[i])].concat(data.map(r => ambil.map(i => r[i] === undefined ? '' : r[i])));
  IMP.namaFail = namaFail;
  const boleh = !rosak && !ulang;
  box.innerHTML = `
    <div class="border border-slate-200 rounded-2xl p-4 space-y-3">
      <p class="text-sm font-bold text-slate-800"><i class="fa-regular fa-file-lines mr-1"></i> ${esc(namaFail)}${helaian ? ` <span class="text-xs font-normal text-slate-500">(helaian "${esc(helaian)}")</span>` : ''}</p>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center">
        <div class="bg-slate-50 rounded-xl p-2"><p class="text-[11px] text-slate-500">Murid dalam fail</p><p class="text-lg font-extrabold">${data.length}</p></div>
        <div class="bg-emerald-50 rounded-xl p-2"><p class="text-[11px] text-emerald-700">Murid baharu</p><p class="text-lg font-extrabold text-emerald-700">${baru}</p></div>
        <div class="bg-sky-50 rounded-xl p-2"><p class="text-[11px] text-sky-700">Akan dikemas kini</p><p class="text-lg font-extrabold text-sky-700">${data.length - baru}</p></div>
        <div class="bg-slate-50 rounded-xl p-2"><p class="text-[11px] text-slate-500">Kelas</p><p class="text-lg font-extrabold">${kelas}</p></div>
      </div>
      <div class="flex flex-wrap gap-1.5">${Object.keys(tahun).sort((a, b) => tahunSort(a) - tahunSort(b)).map(t => `<span class="badge bg-slate-100 text-slate-700">${esc(tahunLabel(t))}: ${tahun[t]}</span>`).join('')}</div>
      <p class="text-[11px] text-slate-500">${ambil.length} lajur dikenal pasti${ix('NO. PENGENALAN') < 0 ? ', <span class="text-amber-700">tiada lajur No. Pengenalan</span>' : ''}${ix('ALAMAT 1') < 0 ? ', <span class="text-amber-700">tiada lajur alamat</span>' : ''}${ix('PENJAGA 1') < 0 ? ', <span class="text-amber-700">tiada lajur penjaga</span>' : ''}.</p>
      ${rosak ? `<p class="text-xs text-rose-700 bg-rose-50 border border-rose-200 rounded-xl p-2.5"><i class="fa-solid fa-triangle-exclamation mr-1"></i> ${rosak} ID MURID rosak (notasi saintifik). Muat turun semula dari IDME dan gunakan fail .xlsx asal.</p>` : ''}
      ${ulang ? `<p class="text-xs text-rose-700 bg-rose-50 border border-rose-200 rounded-xl p-2.5"><i class="fa-solid fa-triangle-exclamation mr-1"></i> ${ulang} ID MURID berulang dalam fail. Semak fail sebelum import.</p>` : ''}
      <div class="flex justify-end gap-2">
        <button class="btn btn-ghost" onclick="IMP.data=null;$('#impPratonton').innerHTML='';$('#impFail').value=''">Batal</button>
        <button class="btn btn-success" onclick="jalankanImport(this)" ${boleh ? '' : 'disabled'}><i class="fa-solid fa-file-import"></i> Import ${data.length} murid</button>
      </div>
    </div>`;
}

async function jalankanImport(btn) {
  if (!IMP.data) return;
  await busy(btn, async () => {
    const r = await api('importMuridExcel', { rows: IMP.data, namaFail: IMP.namaFail });
    IMP.data = null; $('#impFail').value = '';
    $('#impPratonton').innerHTML = `<div class="text-xs text-emerald-900 bg-emerald-50 border border-emerald-200 rounded-xl p-3 whitespace-pre-line"><i class="fa-solid fa-circle-check mr-1 text-emerald-600"></i>${esc(r.mesej)}</div>`;
    PROFIL.clear(); DB.del('dash');
    await refreshBoot();
    const kad = $('#tpBody [data-kad-sesi]');   // kemas kini kiraan kelas dalam kad sesi
    if (kad) renderTetapanSesiSahaja(kad);
    toast('Import murid selesai.', 'success');
  }, 'Mengimport…');
}

async function renderTetapanSesiSahaja(kad) {
  try { const t = (await api('getTetapan')).find(r => r.kunci === 'SESI_TAHUN'); kad.outerHTML = sesiTahunHTML(parseJSONSelamat(t ? t.nilai : '{}')); } catch (e) { /* abaikan */ }
}

async function muatTurunTemplat(btn) {
  await busy(btn, async () => {
    await muatXLSX();
    const h = ['ID MURID', 'NAMA', 'JANTINA', 'TARIKH LAHIR', 'NO. PENGENALAN', 'TAHUN / TINGKATAN', 'NAMA KELAS', 'NAMA GURU KELAS', 'STATUS PENGAJIAN', 'WARGANEGARA',
      'PENJAGA 1', 'HUBUNGAN PENJAGA 1', 'NO. TEL. BIMBIT PENJAGA 1', 'PENDAPATAN PENJAGA 1', 'PENJAGA 2', 'HUBUNGAN PENJAGA 2', 'NO. TEL. BIMBIT PENJAGA 2', 'PENDAPATAN PENJAGA 2',
      'ALAMAT 1', 'ALAMAT 2', 'ALAMAT 3', 'POSKOD', 'BANDAR', 'NEGERI'];
    const contoh = ['251001000001', 'NAMA MURID CONTOH', 'LELAKI', '2019-01-15', '190115100001', 'TAHUN 1', 'UKM', '', 'BERSEKOLAH', 'WARGANEGARA',
      'NAMA BAPA', 'BAPA', '0123456789', '3000', 'NAMA IBU', 'IBU', '0198765432', '1500', 'NO 1 JALAN CONTOH', 'TAMAN CONTOH', '', '48000', 'RAWANG', 'SELANGOR'];
    const ws = XLSX.utils.aoa_to_sheet([h, contoh]);
    ws['!cols'] = h.map(x => ({ wch: Math.max(12, x.length + 2) }));
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Murid');
    XLSX.writeFile(wb, 'Templat_Import_Murid_HEM.xlsx');
  }, 'Menyediakan…');
}

/* ---- Sesi persekolahan ikut tahun ---- */
function parseJSONSelamat(t) { try { return JSON.parse(t || '{}') || {}; } catch (e) { return {}; } }
const kunciTahun = t => String(t || '').toUpperCase().replace(/[^A-Z0-9]/g, '');

function senaraiTahunTetapan() {
  // Tahun sebenar daripada kelas (label IDME), dilengkapkan dengan Prasekolah & Tahun 1–6
  const ada = senaraiTahun();
  const kunciAda = new Set(ada.map(kunciTahun));
  const piawai = ['PRASEKOLAH', 'TAHUN 1', 'TAHUN 2', 'TAHUN 3', 'TAHUN 4', 'TAHUN 5', 'TAHUN 6'].filter(t => !kunciAda.has(kunciTahun(t)));
  return ada.concat(piawai).sort((a, b) => tahunSort(a) - tahunSort(b));
}

function sesiTahunHTML(peta) {
  const pk = {}; Object.keys(peta).forEach(k => { pk[kunciTahun(k)] = peta[k]; });
  return `
    <div class="card p-5 space-y-4 max-w-3xl" data-kad-sesi>
      <div class="border-b border-slate-100 pb-3">
        <h3 class="font-bold text-slate-800"><i class="fa-solid fa-sun text-amber-500 mr-1"></i> Sesi persekolahan ikut tahun</h3>
        <p class="text-xs text-slate-500">Tetapkan sesi bagi setiap tahun. Semua kelas dalam tahun itu akan mengikut sesi ini, termasuk kelas baharu daripada import IDME. Pilih <b>Ikut kelas</b> jika sesuatu tahun ada kelas pagi dan petang; sesi kelas itu kemudian ditetapkan satu persatu dalam Pengurusan Kelas.</p>
      </div>
      <div class="divide-y divide-slate-100 border border-slate-200 rounded-xl">
        ${senaraiTahunTetapan().map(t => {
          const ks = S.kelas.filter(k => kunciTahun(k.tahun) === kunciTahun(t));
          const pg = ks.filter(k => k.sesi === 'Pagi').length, pt = ks.filter(k => k.sesi === 'Petang').length, x = ks.length - pg - pt;
          const v = pk[kunciTahun(t)] || '';
          return `<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 p-3">
            <div class="min-w-0">
              <p class="text-sm font-bold text-slate-800">${esc(tahunLabel(t))}</p>
              <p class="text-[11px] text-slate-500">${ks.length ? `${ks.length} kelas: ${[pg ? pg + ' pagi' : '', pt ? pt + ' petang' : '', x ? `<span class="text-rose-600">${x} belum ditetapkan</span>` : ''].filter(Boolean).join(', ')}` : 'Tiada kelas dalam sistem'}</p>
            </div>
            <div class="flex bg-slate-100 p-1 rounded-xl text-xs font-semibold shrink-0" role="radiogroup" aria-label="Sesi ${esc(tahunLabel(t))}">
              ${[['', 'Ikut kelas'], ['Pagi', 'Pagi'], ['Petang', 'Petang']].map(([val, l]) => `
                <label class="cursor-pointer"><input type="radio" class="sr-only peer" name="sesi-${esc(kunciTahun(t))}" data-tahun="${esc(t)}" value="${val}" ${v === val ? 'checked' : ''}>
                <span class="block px-3 py-1.5 rounded-lg text-slate-600 peer-checked:bg-white peer-checked:shadow-sm ${val === 'Pagi' ? 'peer-checked:text-amber-700' : val === 'Petang' ? 'peer-checked:text-indigo-700' : 'peer-checked:text-slate-800'}">${val === 'Pagi' ? '<i class="fa-solid fa-sun mr-1"></i>' : val === 'Petang' ? '<i class="fa-solid fa-cloud-sun mr-1"></i>' : ''}${l}</span></label>`).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>
      <div class="flex justify-end"><button class="btn btn-primary" onclick="simpanSesiTahun(this)"><i class="fa-solid fa-floppy-disk"></i> Simpan sesi</button></div>
    </div>`;
}

async function simpanSesiTahun(btn) {
  const peta = {};
  $$('#view-tetapan input[data-tahun]:checked').forEach(i => { if (i.value) peta[i.dataset.tahun] = i.value; });
  const bil = S.kelas.filter(k => { const v = peta[Object.keys(peta).find(t => kunciTahun(t) === kunciTahun(k.tahun))]; return v && k.sesi !== v; }).length;
  if (bil && !await confirmBox(`Sesi ${bil} kelas akan ditukar mengikut tetapan tahun. Teruskan?`)) return;
  await busy(btn, async () => {
    const r = await api('simpanSesiTahun', { peta });
    S.kelas.forEach(k => { const t = Object.keys(r.peta).find(x => kunciTahun(x) === kunciTahun(k.tahun)); if (t) k.sesi = r.peta[t]; });
    snapshotBoot(); DB.del('dash');
    toast(r.kelasDikemaskini ? `Sesi disimpan. ${r.kelasDikemaskini} kelas dikemas kini.` : 'Sesi disimpan.', 'success');
    const kad = $('#tpBody [data-kad-sesi]'); if (kad) kad.outerHTML = sesiTahunHTML(r.peta);
    refreshBoot().catch(() => {});
  });
}

async function simpanTetapan(btn) {
  await busy(btn, async () => {
    const nilai = {};
    $$('#view-tetapan [data-k]').forEach(i => { nilai[i.dataset.k] = i.value.trim(); });
    await api('simpanTetapan', { nilai });
    toast('Tetapan disimpan.', 'success');
    refreshBoot().catch(() => {});
  });
}
