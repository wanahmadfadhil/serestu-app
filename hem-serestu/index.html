// Amalan baik / salah laku dengan satu tekan kategori
function openRekodPantas(id, jenis) {
  const m = IDX.murid.get(id), merit = jenis === 'Merit';
  const kat = S.katDisiplin.filter(k => k.jenis === jenis);
  let pilih = kat[0] ? kat[0].id : '';
  const md = openModal({
    title: `${merit ? 'Amalan baik' : 'Salah laku'} · ${esc(namaPendek(m.nama))}`, size: 'max-w-md',
    body: `<div id="rpKat" class="space-y-1.5">${kat.map(k => `<button type="button" data-k="${esc(k.id)}" class="w-full flex items-center justify-between gap-2 rounded-xl border-2 p-2.5 text-left text-xs font-semibold"><span>${esc(k.nama)}</span><span class="font-extrabold ${merit ? 'text-emerald-700' : 'text-rose-700'}">${merit ? '+' : '-'}${k.mata}</span></button>`).join('') || '<p class="text-xs text-slate-500">Tiada kategori. Tambah kategori dalam menu Disiplin & Merit.</p>'}</div>
      <div><label class="lbl" for="rpDesc">Catatan (pilihan)</label><textarea id="rpDesc" rows="2" maxlength="500" class="inp"></textarea></div>
      <div id="rpSejarah">${skel('h-12', 2, 'mb-2')}</div>`,
    footer: `<button class="btn btn-ghost" id="rpLagi"><i class="fa-solid fa-qrcode"></i> Rekod & imbas seterusnya</button><button class="btn ${merit ? 'btn-success' : 'btn-danger'}" id="rpOk">Rekod</button>`
  });
  // Semua rekod merit & salah laku murid ini sebelum ini (jenis yang dipilih dipaparkan dahulu)
  api('senaraiDisiplin', { idMurid: id, had: 200, imbas: true }).then(list => {
    const box = md.querySelector('#rpSejarah'); if (!box) return;
    const sama = list.filter(k => merit ? k.mata > 0 : k.mata < 0), lain = list.length - sama.length;
    const tambah = list.filter(k => k.mata > 0).reduce((a, k) => a + k.mata, 0), tolak = list.filter(k => k.mata < 0).reduce((a, k) => a + k.mata, 0);
    box.innerHTML = `<div class="border-t border-slate-100 pt-3 space-y-2">
      <div class="flex items-center justify-between"><p class="text-xs font-bold text-slate-700">${merit ? 'Amalan baik' : 'Salah laku'} sebelum ini (${sama.length})</p>
        <span class="text-[11px] text-slate-500"><b class="text-emerald-600">+${tambah}</b> / <b class="text-rose-600">${tolak}</b> · baki ${m.merit}</span></div>
      <div class="space-y-1.5 max-h-56 overflow-y-auto">${sama.length ? sama.map(k => `<div class="flex items-start gap-2 rounded-xl bg-slate-50 p-2 text-[11px]">
        <span class="w-8 shrink-0 text-center font-extrabold ${k.mata < 0 ? 'text-rose-600' : 'text-emerald-600'}">${k.mata > 0 ? '+' : ''}${k.mata}</span>
        <span class="min-w-0"><b class="text-slate-800">${esc(k.kategori)}</b>${k.deskripsi ? `<span class="text-slate-600"> · ${esc(k.deskripsi)}</span>` : ''}
          <span class="block text-[10px] text-slate-400">${fmtMasa(k.tarikhMasa)} · ${esc(k.pelapor)}</span></span></div>`).join('')
        : `<p class="text-[11px] text-slate-500">Tiada rekod ${merit ? 'amalan baik' : 'salah laku'} sebelum ini.</p>`}</div>
      ${lain ? `<button type="button" class="text-[11px] font-semibold text-brand-700 hover:underline" onclick="sejarahMurid('${jsq(id)}')">Lihat semua ${list.length} rekod (termasuk ${merit ? 'salah laku' : 'amalan baik'})</button>` : ''}
    </div>`;
  }).catch(e => { const box = md.querySelector('#rpSejarah'); if (box) box.innerHTML = `<p class="text-[11px] text-rose-600">Sejarah tidak dapat dimuat: ${esc(e.message)}</p>`; });
  const lukis = () => md.querySelectorAll('[data-k]').forEach(b => {
    const on = b.dataset.k === pilih;
    b.className = `w-full flex items-center justify-between gap-2 rounded-xl border-2 p-2.5 text-left text-xs font-semibold ${on ? (merit ? 'border-emerald-500 bg-emerald-50' : 'border-rose-500 bg-rose-50') : 'border-slate-200 bg-white'}`;
  });
  lukis();
  md.querySelector('#rpKat').onclick = e => { const b = e.target.closest('[data-k]'); if (b) { pilih = b.dataset.k; lukis(); } };
  const simpan = (btn, lagi) => busy(btn, async () => {
    if (!pilih) throw new Error('Pilih kategori.');
    const r = await api('simpanDisiplin', { idMurid: id, idKategori: pilih, deskripsi: md.querySelector('#rpDesc').value.trim() });
    m.merit = r.baki; m.statusMerit = r.statusMerit; snapshotBoot(); DB.del('dash');
    md.querySelector('[data-close]').click();
    toast(r.statusMerit === 'Kritikal' ? `Disimpan. Baki merit ${namaPendek(m.nama)} kini ${r.baki} (kritikal).` : `Disimpan. Baki merit ${namaPendek(m.nama)}: ${r.baki}.`, r.statusMerit === 'Kritikal' ? 'warn' : 'success');
    if (S.tab === 'disiplin' && $('#dBody')) { paintMeritTable(); loadLogDisiplin(); }
    const kat = S.katDisiplin.find(k => k.id === pilih) || {};
    if (lagi) bukaPengimbas(); else bukaMesejPenjaga(id, merit ? 'merit' : 'demerit', { kategori: kat.nama || '', catatan: md.querySelector('#rpDesc').value.trim() });
  });
  md.querySelector('#rpOk').onclick = e => simpan(e.currentTarget, false);
  md.querySelector('#rpLagi').onclick = e => simpan(e.currentTarget, true);
}

const JENIS_MESEJ = [['lewat', 'Hadir lewat'], ['tidakHadir', 'Tidak hadir'], ['demerit', 'Salah laku'], ['merit', 'Amalan baik'], ['umum', 'Umum']];
function templatMesej(jenis, m, x) {
  const k = IDX.kelas.get(m.idKelas), kelas = k ? namaKelasTajuk(k) : m.namaKelas, guru = (IDX.guru.get(S.user.id) || {}).nama || S.user.nama || '';
  const tarikh = fmtTarikh(todayStr()), sekolah = S.tetapan.namaSekolah || 'pihak sekolah', anak = `anak tuan/puan, ${m.nama} (${kelas})`;
  const isi = {
    lewat: `dimaklumkan bahawa ${anak}, hadir lewat ke sekolah pada ${tarikh}${x.jam ? ' jam ' + x.jam : ''}.${x.sebab ? ' Sebab: ' + x.sebab + '.' : ''} Mohon kerjasama tuan/puan memastikan anak hadir sebelum waktu perhimpunan.`,
    tidakHadir: `dimaklumkan bahawa ${anak}, tidak hadir ke sekolah pada ${tarikh}. Mohon tuan/puan memaklumkan sebab ketidakhadiran dan menyerahkan surat/sijil sakit jika berkaitan.`,
    demerit: `dimaklumkan bahawa ${anak}, telah direkodkan atas salah laku: ${x.kategori || '-'}${x.catatan ? ' (' + x.catatan + ')' : ''} pada ${tarikh}. Mohon kerjasama tuan/puan untuk menasihati anak.`,
    merit: `tahniah! ${m.nama} (${kelas}) telah menerima merit atas amalan baik: ${x.kategori || '-'}${x.catatan ? ' (' + x.catatan + ')' : ''} pada ${tarikh}. Terima kasih atas didikan tuan/puan.`,
    umum: `ini adalah makluman berkenaan ${anak}. `

  return `Assalamualaikum / Salam sejahtera tuan/puan, ${isi}\n\nSekian, terima kasih.\n${guru}\n${sekolah}`;

function cadanganNaik(k) {
  const n = tahunSort(k.tahun);
  if (n >= 6) return 'TAMAT';
  const nama = namaKelasSahaja(k.nama).toUpperCase();
  const c = S.kelas.find(x => tahunSort(x.tahun) === n + 1 && namaKelasSahaja(x.nama).toUpperCase() === nama);
  return c ? c.id : '';
}

  const kelas = S.kelas.slice().sort((a, b) => tahunSort(b.tahun) - tahunSort(a.tahun) || a.nama.localeCompare(b.nama));
  const peta = {}; kelas.forEach(k => { peta[k.id] = cadanganNaik(k); });
  const bil = id => muridKelas(id).length;
  $('#tpBody').innerHTML = `<div class="card p-5 space-y-4">
    <div class="flex items-start gap-3"><div class="w-11 h-11 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-lg shrink-0"><i class="fa-solid fa-arrow-up-right-dots"></i></div>

    <div class="overflow-x-auto"><table class="w-full text-xs"><thead class="bg-slate-50"><tr><th class="th">Kelas sekarang</th><th class="th">Murid</th><th class="th">Pindah ke</th></tr></thead>
      <tbody class="divide-y divide-slate-100">${kelas.map(k => `<tr><td class="td font-semibold">${esc(namaKelasTajuk(k))}</td><td class="td">${bil(k.id)}</td>
        <td class="td"><select data-naik="${esc(k.id)}" class="inp py-1.5 text-xs ${peta[k.id] ? '' : 'border-amber-400'}">
          <option value="" ${!peta[k.id] ? 'selected' : ''}>— Pilih —</option><option value="KEKAL" ${peta[k.id] === 'KEKAL' ? 'selected' : ''}>Kekal (tidak diubah)</option><option value="TAMAT" ${peta[k.id] === 'TAMAT' ? 'selected' : ''}>Tamat sekolah</option>
          ${kelasOptions(peta[k.id] && peta[k.id] !== 'TAMAT' ? peta[k.id] : '').replace(/<option value="">[^<]*<\/option>/, '')}</select></td></tr>`).join('')}</tbody></table></div>

    <div class="flex flex-wrap items-center gap-2 border-t border-slate-100 pt-3"><span id="nkRingkas" class="text-xs text-slate-600 mr-auto"></span>
      <button class="btn btn-primary" id="nkJalan"><i class="fa-solid fa-play"></i> Naikkan kelas</button></div>
  </div>`;
  const ringkas = () => {
    let naik = 0, tamat = 0, belum = 0;
    $$('#tpBody [data-naik]').forEach(s => { const n = bil(s.dataset.naik); if (!s.value) belum++; else if (s.value === 'TAMAT') tamat += n; else if (s.value !== 'KEKAL') naik += n; });

/* ==================================================================
 *  JADUAL WAKTU KELAS (import XML aSc Timetables)
 *  aSc: File → Export → "aSc Timetables 2012 XML". Struktur yang dibaca: <periods>, <daysdefs>, <subjects>,
 *  <teachers>, <classrooms>, <classes>, <lessons> (classids, subjectid, teacherids, periodspercard) dan
 *  <cards> (lessonid, period, days = bitmask hari, cth "10000" = hari pertama).
 * ================================================================== */
const JW = { id: '', tahun: '', data: null, kelasAda: [], warnaSubjek: 'pelbagai', guru: true };
try { Object.assign(JW, JSON.parse(localStorage.getItem('hem_jw') || '{}')); JW.data = null; } catch (e) { /* abaikan */ }
function simpanJW() { try { localStorage.setItem('hem_jw', JSON.stringify({ warnaSubjek: JW.warnaSubjek, guru: JW.guru })); } catch (e) { /* abaikan */ } }

const HARI_EN = { MONDAY: 'Isnin', TUESDAY: 'Selasa', WEDNESDAY: 'Rabu', THURSDAY: 'Khamis', FRIDAY: 'Jumaat', SATURDAY: 'Sabtu', SUNDAY: 'Ahad' };
const HARI_LALAI = ['Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu', 'Ahad'];
const PALET_SUBJEK = ['#fde68a', '#bfdbfe', '#bbf7d0', '#fbcfe8', '#ddd6fe', '#fed7aa', '#a5f3fc', '#fecaca', '#d9f99d', '#e9d5ff', '#99f6e4', '#fef08a', '#c7d2fe', '#fbd5d5'];

function hhmm(v) { const m = String(v || '').match(/(\d{1,2}):(\d{2})/); return m ? `${Number(m[1])}:${m[2]}` : ''; }
function minit(v) { const m = String(v || '').match(/(\d{1,2}):(\d{2})/); return m ? Number(m[1]) * 60 + Number(m[2]) : null; }

// Hurai teks XML aSc → { kelas: [{ idAsc, nama, jadual }], ringkasan }
function huraiAsc(teks) {
  const doc = new DOMParser().parseFromString(teks, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('Fail XML tidak sah atau rosak.');
  const semua = tag => Array.from(doc.getElementsByTagName(tag));
  const at = (el, n) => el ? (el.getAttribute(n) || '').trim() : '';
  const peta = tag => new Map(semua(tag).map(e => [at(e, 'id'), e]));
  const subjek = peta('subject'), guru = peta('teacher'), bilik = peta('classroom'), kelas = peta('class'), lesson = peta('lesson');
  const kad = semua('card');
  if (!kelas.size || !kad.length || !lesson.size) throw new Error('Fail ini bukan eksport XML aSc Timetables (tiada <class>, <lesson> atau <card>). Dalam aSc pilih File → Export → aSc Timetables XML.');

  // Waktu (period) + lajur REHAT automatik jika ada jurang ≥ 10 minit antara dua waktu
  const periods = semua('period').map(e => ({ no: Number(at(e, 'period') || at(e, 'name')), label: at(e, 'short') || at(e, 'name') || at(e, 'period'), mula: hhmm(at(e, 'starttime')), tamat: hhmm(at(e, 'endtime')) }))
    .filter(p => !isNaN(p.no)).sort((a, b) => a.no - b.no);
  const noKad = Array.from(new Set(kad.map(c => Number(at(c, 'period'))).filter(n => !isNaN(n))));
  if (!periods.length) noKad.sort((a, b) => a - b).forEach(n => periods.push({ no: n, label: String(n), mula: '', tamat: '' }));
  const waktu = [], lajur = {};
  periods.forEach((p, i) => {
    const prev = periods[i - 1];
    if (prev && minit(prev.tamat) != null && minit(p.mula) != null && minit(p.mula) - minit(prev.tamat) >= 10) {
      waktu.push({ label: 'REHAT', mula: prev.tamat, tamat: p.mula, rehat: true });
    }
    lajur[p.no] = waktu.length;
    waktu.push({ label: p.label, mula: p.mula, tamat: p.tamat, rehat: false });
  });

  // Hari: panjang bitmask "days" dalam kad; nama daripada <daysdef> yang mewakili satu hari sahaja
  const bilHari = Math.max(...kad.map(c => at(c, 'days').length), 0) || 5;
  const hari = HARI_LALAI.slice(0, bilHari);
  semua('daysdef').forEach(d => {
    const b = at(d, 'days');
    if (b.length === bilHari && b.split('1').length === 2) {
      const nm = at(d, 'name'), i = b.indexOf('1');
      hari[i] = HARI_EN[nm.toUpperCase()] || tahunLabel(nm) || hari[i];
    }
  });

  const namaGuru = e => at(e, 'name') || `${at(e, 'firstname')} ${at(e, 'lastname')}`.trim() || at(e, 'short');
  const sel = new Map();   // idKelasAsc → Map("h|w" → sel)
  kad.forEach(c => {
    const L = lesson.get(at(c, 'lessonid')); if (!L) return;
    const pNo = Number(at(c, 'period')), w = lajur[pNo]; if (w === undefined) return;
    const ppc = Number(at(L, 'periodspercard')) || 1;
    const akhir = lajur[pNo + ppc - 1];
    const n = akhir === undefined ? 1 : akhir - w + 1;
    const S1 = subjek.get(at(L, 'subjectid'));
    const s = {
      k: at(S1, 'short') || at(S1, 'name') || '?', nm: at(S1, 'name') || at(S1, 'short'),
      g: at(L, 'teacherids').split(',').filter(Boolean).map(id => namaGuru(guru.get(id))).filter(Boolean).join(', '),
      b: (at(c, 'classroomids') || at(L, 'classroomids')).split(',').filter(Boolean).map(id => at(bilik.get(id), 'short') || at(bilik.get(id), 'name')).filter(Boolean).join(', ')
    };
    const days = at(c, 'days');
    at(L, 'classids').split(',').filter(id => kelas.has(id)).forEach(idK => {
      if (!sel.has(idK)) sel.set(idK, new Map());
      const m = sel.get(idK);
      for (let h = 0; h < days.length; h++) {
        if (days[h] !== '1') continue;
        const key = h + '|' + w, ada = m.get(key);
        if (!ada) m.set(key, { h, w, n, s: [Object.assign({}, s)] });
        else {
          ada.n = Math.max(ada.n, n);
          if (!ada.s.some(x => x.k === s.k && x.g === s.g)) ada.s.push(Object.assign({}, s));
        }
      }
    });
  });

  const out = Array.from(sel.keys()).map(idK => {
    const e = kelas.get(idK);
    const j = { hari, waktu, sel: Array.from(sel.get(idK).values()) };
    j.sel = gabungSel(j);
    return { idAsc: idK, nama: at(e, 'name') || at(e, 'short'), pendek: at(e, 'short'), jadual: j };
  }).sort((a, b) => a.nama.localeCompare(b.nama, 'ms', { numeric: true }));
  if (!out.length) throw new Error('Tiada kad jadual yang dipadankan kepada mana-mana kelas dalam fail ini.');
  return { kelas: out, ringkasan: { bilKelas: out.length, bilWaktu: periods.length, bilHari: hari.length, bilSubjek: subjek.size, bilGuru: guru.size } };
}

// Normalkan sel jadual supaya setiap waktu diisi sekali sahaja, kemudian gabungkan waktu bersebelahan yang sama.
// aSc mengeksport SATU kad bagi setiap waktu walaupun pelajaran berkembar (periodspercard="2"); jika setiap kad
// dipanjangkan n waktu, subjek muncul berganda dan baris tertolak ke kanan. Eksport lama (satu kad bagi pelajaran
// berkembar) juga disokong. Turut membetulkan jadual yang sudah disimpan sebelum pembetulan ini.
function gabungSel(j) {
  const bilW = j.waktu.length, sig = c => c.s.map(s => s.k + '|' + s.g).sort().join('#');
  const sel = (j.sel || []).map(c => Object.assign({}, c, { n: Math.max(1, c.n || 1), sig: sig(c) }));
  // Kad satu-per-waktu: ada sel sama bermula pada waktu sebelumnya (melangkau lajur rehat) atau di dalam
  // julatnya → kad itu hanya mewakili satu waktu
  const sebelum = w => { let p = w - 1; while (p >= 0 && j.waktu[p].rehat) p--; return p; };
  sel.forEach(c => {
    if (c.n > 1 && sel.some(x => x !== c && x.h === c.h && x.sig === c.sig && (x.w === sebelum(c.w) || (x.w > c.w && x.w < c.w + c.n)))) c.n = 1;
  });
  // Isi grid satu waktu (lajur rehat dilangkau); subjek berbeza dalam waktu sama digabung (cth PI / PM)
  const grid = j.hari.map(() => new Array(bilW).fill(null));
  sel.sort((a, b) => a.h - b.h || a.w - b.w).forEach(c => {
    if (!grid[c.h]) return;
    for (let i = 0; i < c.n && c.w + i < bilW; i++) {
      const w = c.w + i;
      if (i > 0 && j.waktu[w].rehat) continue;
      const ada = grid[c.h][w];
      if (!ada) grid[c.h][w] = { s: c.s.map(s => Object.assign({}, s)) };
      else c.s.forEach(s => { if (!ada.s.some(x => x.k === s.k && x.g === s.g)) ada.s.push(Object.assign({}, s)); });
    }
  });
  // Gabung waktu bersebelahan dengan subjek & guru yang sama menjadi satu kotak
  const out = [];
  grid.forEach((baris, h) => {
    let akhir = null;
    baris.forEach((c, w) => {
      if (!c) { akhir = null; return; }
      const s = sig(c);
      if (akhir && akhir.sig === s && akhir.w + akhir.n === w) { akhir.n++; return; }
      akhir = { h, w, n: 1, s: c.s, sig: s };
      out.push(akhir);
    });
  });
  return out.map(({ h, w, n, s }) => ({ h, w, n, s }));
}

// Padankan nama kelas aSc dengan kelas sistem (cth "3 Arif", "3 ARIF", "Tahun 3 Arif", "3A" ikut nama pendek)
function padanKelasAsc(x) {
  const n = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const calon = [n(x.nama), n(x.pendek)].filter(Boolean);
  const kunci = k => {
    const nm = namaKelasSahaja(k.nama), t = tahunSort(k.tahun);
    return [n(k.nama), n(tahunNama(k.tahun) + nm), n((t === 0 ? 'PRA' : t) + nm), n((t === 0 ? 'PRASEKOLAH' : 'TAHUN' + t) + nm)];
  };
  let k = S.kelas.find(k => kunci(k).some(v => calon.indexOf(v) >= 0));
  if (k) return k.id;
  // Cubaan longgar: nombor tahun sama dan nama kelas terkandung dalam nama aSc
  const digit = (String(x.nama).match(/\d+/) || [''])[0], hur = n(String(x.nama).replace(/\d+/g, ''));
  k = S.kelas.find(k => {
    const t = tahunSort(k.tahun), nm = n(namaKelasSahaja(k.nama));
    return nm && hur.indexOf(nm) >= 0 && (digit ? Number(digit) === t : t === 0 && /PRA/.test(hur));
  });
  return k ? k.id : '';
}

// Swatch warna generik: setiap [data-warna="kunciPST"] ditukar ke PST[kunci], kemudian onUbah() dipanggil
function pasangPilihanWarna(root, onUbah) {
  root.querySelectorAll('[data-warna]').forEach(box => {

      const ganti = baru.firstElementChild; box.replaceWith(ganti);
      pasangPilihanWarna(ganti.parentElement, onUbah); onUbah();
    };
    box.querySelectorAll('[data-w]').forEach(b => { b.onclick = () => set(b.dataset.w); });

    if (inp) inp.onchange = () => set(inp.value);
  });
}

  const k = IDX.kelas.get(JW.id), j = JW.data.jadual;

function isiJadualWaktu(D, j0) {
  const j = Object.assign({}, j0, { sel: gabungSel(j0) });     // betulkan juga jadual lama yang disimpan
  const bilW = j.waktu.length, bilH = j.hari.length;
  // Warna subjek tetap (ikut susunan abjad singkatan) supaya sama setiap kali dicetak
  const subjek = Array.from(new Set(j.sel.flatMap(c => c.s.map(s => s.k)))).sort();
  const nama = {}; j.sel.forEach(c => c.s.forEach(s => { nama[s.k] = s.nm || s.k; }));
  const warna = {}; subjek.forEach((s, i) => { warna[s] = PALET_SUBJEK[i % PALET_SUBJEK.length]; });
  const pelbagai = JW.warnaSubjek !== 'seragam';
  const kecil = bilW > 12, fK = kecil ? 12 : 14, fG = kecil ? 8 : 9;
  const tinggiBaris = Math.max(52, Math.floor((bilH > 5 ? 430 : 455) / bilH));
  const bd = `${D.bw || 2}px ${D.dashed ? 'dashed' : 'solid'} ${D.cardBd}`;
  const rad = parseInt(D.radius, 10) > 12 ? '12px' : D.radius;
  const headSel = `background:${D.head};color:${D.headTx};font-weight:800;text-align:center;border-radius:${rad};${D.headBd ? 'border:' + D.headBd + ';' : ''}`;

  // Grid penghunian: sel bersambung (colspan) & lajur rehat (rowspan jika tiada kelas merentasinya)
  const grid = j.hari.map(() => new Array(bilW).fill(null));
  j.sel.forEach(c => { if (grid[c.h]) { grid[c.h][c.w] = c; for (let i = 1; i < c.n; i++) grid[c.h][c.w + i] = 'tutup'; } });
  const rehatPenuh = j.waktu.map((x, wi) => x.rehat && grid.every(r => !r[wi]));

  const thWaktu = j.waktu.map(x => `<th style="padding:2px">${x.rehat
    ? `<div style="${headSel};opacity:.75;font-size:9px;padding:4px 2px">REHAT<div style="font-weight:600;font-size:8px">${esc(x.mula)}</div></div>`
    : `<div style="${headSel};padding:4px 2px"><div style="font-size:13px">${esc(x.label)}</div><div style="font-size:8px;font-weight:600;opacity:.9">${esc(x.mula)}${x.tamat ? '–' + esc(x.tamat) : ''}</div></div>`}</th>`).join('');

  const baris = j.hari.map((hNama, hi) => {
    let tds = `<th style="padding:2px;width:74px"><div style="${headSel};height:${tinggiBaris - 4}px;display:flex;align-items:center;justify-content:center;font-size:13px">${esc(hNama.toUpperCase())}</div></th>`;
    for (let wi = 0; wi < bilW; wi++) {
      const c = grid[hi][wi];
      if (c === 'tutup') continue;
      const x = j.waktu[wi];
      if (!c && x.rehat) {
        if (!rehatPenuh[wi]) { tds += `<td style="padding:2px"></td>`; continue; }
        if (hi > 0) continue;
        tds += `<td rowspan="${bilH}" style="padding:2px"><div style="height:${bilH * tinggiBaris - 4}px;border-radius:${rad};background:${D.line};opacity:.35;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;line-height:1.6;color:${D.cardTx};text-align:center">${'REHAT'.split('').join('<br>')}</div></td>`;
        continue;
      }
      if (!c) { tds += `<td style="padding:2px"><div style="height:${tinggiBaris - 4}px;border-radius:${rad};border:1px dashed ${D.cardBd};opacity:.35"></div></td>`; continue; }
      const latar = pelbagai ? warna[c.s[0].k] : D.card;
      const tx = pelbagai ? '#1f2937' : D.cardTx;
      const isi = c.s.map(s => `<div style="font-weight:800;font-size:${c.s.length > 1 ? fK - 2 : fK}px;line-height:1.1">${esc(s.k)}</div>${JW.guru && s.g ? `<div style="font-size:${fG}px;line-height:1.15;opacity:.85;margin-top:1px">${esc(s.g.split(',').map(g => namaPendek(g)).join(', '))}</div>` : ''}`).join('<div style="height:3px"></div>');
      tds += `<td colspan="${c.n}" style="padding:2px"><div style="height:${tinggiBaris - 4}px;box-sizing:border-box;border-radius:${rad};border:${bd};background:${latar};color:${tx};display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2px 3px;overflow:hidden">${isi}</div></td>`;
    }
    return `<tr>${tds}</tr>`;
  }).join('');

  const petunjuk = subjek.map(s => `<span style="display:inline-flex;align-items:center;gap:4px;margin:2px 8px 2px 0;font-size:10px;color:${D.sub}"><span style="width:12px;height:12px;border-radius:3px;border:1px solid ${D.cardBd};background:${pelbagai ? warna[s] : D.card}"></span><b>${esc(s)}</b> ${s !== nama[s] ? esc(nama[s]) : ''}</span>`).join('');
  return `<table style="width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed">
      <thead><tr><th style="width:78px"></th>${thWaktu}</tr></thead><tbody>${baris}</tbody></table>
    <div style="margin-top:8px;text-align:center;line-height:1.3">${petunjuk}</div>`;
}

  const m = openModal({
    title: 'Muat naik jadual waktu (aSc Timetables XML)', size: 'max-w-3xl',
    body: `
      <div class="text-xs text-slate-600 bg-slate-50 border border-slate-200 rounded-xl p-3 space-y-1">

        <p>Kelas dalam fail dipadankan secara automatik dengan kelas sistem. Semak padanan sebelum menyimpan.</p>
      </div>
      <input type="file" id="ascFail" accept=".xml,text/xml,application/xml" class="block w-full text-sm file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-brand-600 file:text-white file:font-semibold">
      <div id="ascHasil"></div>`,
    footer: '<button class="btn btn-ghost" data-close>Batal</button><button class="btn btn-primary" id="ascSimpan" disabled><i class="fa-solid fa-floppy-disk"></i> Simpan jadual</button>'
  });
  let hasil = null, namaFail = '';

    m.querySelector('#ascSimpan').disabled = true;

      if (f.size > 15 * 1024 * 1024) throw new Error('Fail terlalu besar (maksimum 15MB).');

      const r = hasil.ringkasan;
      box.innerHTML = `
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center">
          ${[['Kelas', r.bilKelas], ['Waktu sehari', r.bilWaktu], ['Hari', r.bilHari], ['Subjek', r.bilSubjek]].map(([l, v]) => `<div class="bg-brand-50 rounded-xl p-2"><p class="text-lg font-extrabold text-brand-700">${v}</p><p class="text-[11px] text-slate-600">${l}</p></div>`).join('')}
        </div>
        <div class="max-h-80 overflow-y-auto border border-slate-200 rounded-xl">
          <table class="w-full text-xs"><thead class="bg-slate-50 sticky top-0"><tr><th class="th text-left">Kelas dalam aSc</th><th class="th text-left">Kelas sistem</th><th class="th">Waktu</th></tr></thead>
          <tbody>${hasil.kelas.map((x, i) => {
            const auto = padanKelasAsc(x);
            return `<tr class="border-t border-slate-100"><td class="td font-semibold">${esc(x.nama)}${x.pendek && x.pendek !== x.nama ? ` <span class="text-slate-400">(${esc(x.pendek)})</span>` : ''}</td>
              <td class="td"><select class="inp py-1 text-xs ${auto ? '' : 'border-amber-400'}" data-asc="${i}"><option value="">— Abaikan —</option>${kelasOptions(auto, null, '')}</select></td>
              <td class="td text-center">${x.jadual.sel.reduce((a, c) => a + c.n, 0)}</td></tr>`;
          }).join('')}</tbody></table>
        </div>
        <p class="text-[11px] text-amber-700" id="ascAmaran"></p>
        <label class="flex items-start gap-2 text-xs text-slate-700"><input type="checkbox" id="ascGanti" class="mt-0.5"> Gantikan semua jadual sedia ada (jadual kelas yang tiada dalam fail ini akan dipadam)</label>`;
      const kemas = () => {
        const tiada = Array.from(box.querySelectorAll('[data-asc]')).filter(s => !s.value).length;
        box.querySelector('#ascAmaran').textContent = tiada ? `${tiada} kelas aSc tidak dipadankan dan akan diabaikan.` : '';
      };
      box.querySelectorAll('[data-asc]').forEach(s => s.addEventListener('change', kemas));
      kemas();
      m.querySelector('#ascSimpan').disabled = false;

      hasil = null;

    }
  };
  m.querySelector('#ascSimpan').onclick = e => busy(e.currentTarget, async () => {

    if (jwAktif()) muatJadualWaktu();
    if (S.tab === 'tetapan' && TP.sub === 'waktu') paintJadualWaktuAdmin();
  }, 'Menyimpan…');
}

function qrURL(teks) { const q = qrcode(0, 'M'); q.addData(teks); q.make(); return q.createDataURL(6, 2); }

/* ---- Kad ID: 5 reka bentuk baharu (Moden Gelombang, Formal Rasmi, Ceria Pelangi, Minimalis Putih, Gradien Premium) ----
 * Ukuran dalam mm supaya cetakan tepat 54 × 85.6 mm. Gambar 3:4 di kedudukan tetap; saiz nama mengecil untuk nama panjang. */
const KAD_REKA = {
  gelombang: { label: 'Moden Gelombang', bg: '#15803d', head: '#facc15' },
  rasmi: { label: 'Formal Rasmi', bg: '#1e3a5f', head: '#b8860b' },
  pelangi: { label: 'Ceria Pelangi', bg: 'linear-gradient(160deg,#fef9c3,#fce7f3 45%,#e0f2fe)', head: '#ec4899' },
  minimalis: { label: 'Minimalis Putih', bg: '#ffffff', head: '#15803d' },
  premium: { label: 'Gradien Premium', bg: 'linear-gradient(150deg,#1e3a8a,#4338ca 50%,#7c3aed)', head: '#a5b4fc' }
};
const KAD_ASAS = 'width:54mm;height:85.6mm;box-sizing:border-box;border-radius:3mm;overflow:hidden;position:relative;-webkit-print-color-adjust:exact;print-color-adjust:exact;';
let fontKadSedia = null;
// Fon tambahan untuk reka bentuk Ceria (Fredoka) & Formal (Playfair Display); dimuat sekali
function pastiFontKad() {
  if (!fontKadSedia) {
    const l = document.createElement('link'); l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Playfair+Display:wght@700;800&display=swap';
    document.head.appendChild(l);
    fontKadSedia = new Promise(res => { l.onload = () => Promise.all([document.fonts.load('600 10pt Fredoka'), document.fonts.load('800 10pt "Playfair Display"')]).then(res, res); l.onerror = res; setTimeout(res, 4000); });
  }
  return fontKadSedia;
}
function dataKad(m) {
  const k = IDX.kelas.get(m.idKelas) || {}, n = tahunSort(k.tahun || m.tahun), sekolah = S.tetapan.namaSekolah || '';
  return { k, sekolah, ringkas: sekolah.replace(/^SEKOLAH KEBANGSAAN\s+/i, 'SK ').replace(/^SEKOLAH JENIS KEBANGSAAN\s+/i, 'SJK '),
    kelas: (k.id ? namaKelasTajuk(k) : m.namaKelas).toUpperCase(), kelasPendek: `${n === 0 ? 'PRA' : n || ''} ${namaKelasSahaja(k.nama || m.namaKelas)}`.trim().toUpperCase(),
    sesi: String(new Date().getFullYear()), tel: KAD.telefon && m.telPenjaga ? m.telPenjaga : '' };
}
// Saiz huruf nama ikut panjang supaya muat maksimum 2 baris
function saizNama(nama, asas) { const n = String(nama).length; return (n <= 20 ? asas : n <= 30 ? asas * 0.9 : n <= 40 ? asas * 0.8 : asas * 0.7).toFixed(2) + 'pt'; }
function fotoKad(m, w, h, gaya) {
  const f = m.fotoId && FOTO.get(m.fotoId);
  return f ? `<div style="width:${w};height:${h};flex-shrink:0;background:#e2e8f0 url('${f}') center/cover no-repeat;${gaya}"></div>`
    : `<div style="width:${w};height:${h};flex-shrink:0;background:linear-gradient(135deg,#bfdbfe,#bbf7d0);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15pt;color:#334155;${gaya}">${esc(initials(m.nama))}</div>`;
}
function logoKad(warna, saiz = '7mm') {
  const isi = JENAMA.logo ? logoCetak('max-width:78%;max-height:78%') : `<i class="fa-solid fa-graduation-cap" style="color:${warna};font-size:3.4mm"></i>`;
  return `<div style="width:${saiz};height:${saiz};border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 0 .4mm ${warna}">${isi}</div>`;
}

async function cetakKad(senarai, btn) {
  if (!senarai.length) return toast('Pilih sekurang-kurangnya seorang murid.', 'error');
  await busy(btn, async () => {
    await Promise.all([muatSkrip(URL_QR), pastiFoto(senarai.map(m => m.fotoId)), pastiFontKad()]);
    const SEH = 9, LAJ = 3;
    const halaman = [];
    for (let i = 0; i < senarai.length; i += SEH) {
      const set = senarai.slice(i, i + SEH);
      halaman.push(set.map(m => kadDepanPilih(m)));
      if (KAD.dua) {
        // Belakang: setiap baris diterbalikkan supaya sejajar dengan depan bila dicetak dua muka (flip sisi panjang)
        const back = [];
        for (let r = 0; r < Math.ceil(set.length / LAJ); r++) {
          const row = set.slice(r * LAJ, r * LAJ + LAJ).map(m => kadBelakangPilih(m));
          while (row.length < LAJ) row.push('<div style="width:54mm;height:85.6mm"></div>');
          back.push(...row.reverse());
        }
        halaman.push(back);
      } else halaman.push(set.map(m => kadBelakangPilih(m)));
    }
    printHTML(`<style>@page{size:A4 portrait;margin:10mm}#printArea{padding:0!important}.kadpg{display:grid;grid-template-columns:repeat(3,54mm);grid-auto-rows:85.6mm;gap:6mm 8mm;justify-content:center;page-break-after:always;break-after:page}.kadpg:last-child{page-break-after:auto;break-after:auto}</style>
      ${halaman.map(h => `<div class="kadpg">${h.join('')}</div>`).join('')}`);
  }, 'Menyediakan…');
}

  await cetakKad([m], null);

// Potong ke nisbah 4:5 (pasport), kecilkan ke 600×750
function potongPasport(sumber, sw, sh) {
  const r = 4 / 5;
  let w = sw, h = sw / r; if (h > sh) { h = sh; w = h * r; }
  const c = document.createElement('canvas'); c.width = Math.min(600, Math.round(w)); c.height = Math.round(c.width / r);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(sumber, (sw - w) / 2, (sh - h) / 2, w, h, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.85);
}
function failKeDataURL(file) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('Bukan fail gambar.'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const d = potongPasport(img, img.naturalWidth, img.naturalHeight); URL.revokeObjectURL(url); res(d); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Gambar tidak dapat dibaca.')); };
    img.src = url;
  });
}

// Baris gilir muat naik (2 serentak) supaya guru boleh terus ambil gambar seterusnya
function giliranFoto(id, dataUrl) {
  GP.status[id] = 'naik'; paintStatusGP();
  GP.q.push({ id, dataUrl }); jalanGiliran();
}
function jalanGiliran() {
  while (GP.aktif < 2 && GP.q.length) {
    const t = GP.q.shift(); GP.aktif++;
    api('fotoMurid', { idMurid: t.id, dataUrl: t.dataUrl }).then(r => {
      FOTO.set(r.fotoId, t.dataUrl); DB.set('foto:' + r.fotoId, t.dataUrl);
      const m = IDX.murid.get(t.id); if (m) m.fotoId = r.fotoId;
      const p = PROFIL.get(t.id); if (p) p.fotoId = r.fotoId;
      GP.status[t.id] = 'ok';
    }).catch(e => { GP.status[t.id] = 'gagal'; GP.ralat = e.message; })
      .finally(() => { GP.aktif--; paintStatusGP(); if (!GP.q.length && !GP.aktif) { snapshotBoot(); } jalanGiliran(); });
  }
}
function ringkasGP() {
  const v = Object.values(GP.status);
  return { ok: v.filter(x => x === 'ok').length, naik: v.filter(x => x === 'naik').length, gagal: v.filter(x => x === 'gagal').length };
}

            <button class="btn btn-ghost" id="gpSemula"><i class="fa-solid fa-rotate-left"></i> Ambil semula</button>
            <button class="btn btn-success px-5" id="gpSimpan"><i class="fa-solid fa-check"></i> Simpan & seterusnya</button>` : `
            ${adaKamera ? '<button class="btn btn-ghost" id="gpPusing" title="Tukar kamera depan/belakang"><i class="fa-solid fa-camera-rotate"></i></button>' : ''}
            ${adaKamera ? '<button class="btn btn-primary px-6 py-3 text-sm" id="gpSnap"><i class="fa-solid fa-camera"></i> Ambil gambar</button>' : ''}
            <label class="btn btn-ghost cursor-pointer"><i class="fa-solid fa-mobile-screen"></i> Kamera telefon<input type="file" accept="image/*" capture="environment" class="hidden" id="gpCap"></label>
            <label class="btn btn-ghost cursor-pointer"><i class="fa-solid fa-folder-open"></i> Fail<input type="file" accept="image/*" class="hidden" id="gpFail"></label>
            <button class="btn btn-ghost" id="gpLangkau">Langkau <i class="fa-solid fa-forward"></i></button>`}
        </div>` : emptyBox('fa-circle-check', 'Semua murid dalam senarai ini sudah mempunyai gambar.')}
      </div>
      <div class="md:col-span-2 space-y-2">
        <label class="flex items-center gap-2 text-xs font-semibold text-slate-700 cursor-pointer"><input type="checkbox" id="gpTiada" ${GP.hanyaTiada ? 'checked' : ''} class="w-4 h-4" style="accent-color:rgb(var(--b600))"> Murid tanpa gambar sahaja</label>
        <div class="border border-slate-200 rounded-xl max-h-[52vh] overflow-y-auto divide-y divide-slate-100">${GP.senarai.map((x, i) => `
          <button type="button" data-gpi="${i}" class="w-full flex items-center gap-2 px-2.5 py-1.5 text-left text-xs ${i === GP.idx ? 'bg-brand-50' : 'hover:bg-slate-50'}">
            <span class="text-slate-400 w-5 text-right">${i + 1}</span>${avatar(x.nama, x.fotoId, x.jantina, 'w-8 h-8', 'text-[10px]')}
            <span class="flex-1 truncate font-semibold ${i === GP.idx ? 'text-brand-700' : 'text-slate-700'}">${esc(namaPendek(x.nama))}</span>
            <span data-gp-st="${esc(x.id)}" class="w-4"></span>
          </button>`).join('') || '<p class="p-3 text-xs text-slate-500">Tiada murid.</p>'}</div>
        <p class="text-[11px] text-slate-500"><i class="fa-solid fa-lightbulb text-amber-500 mr-1"></i>Gambar dipotong ke saiz pasport (4:5). Gunakan latar dinding cerah dan pastikan muka di dalam bulatan.</p>
      </div>
    </div>`;
  hydrateFotos(box); paintStatusGP();
  const lukis = () => paintKameraGP(modal);
  const ke = i => { GP.idx = Math.max(0, Math.min(GP.senarai.length - 1, i)); GP.tangkap = null; lukis(); };
  box.querySelectorAll('[data-gpi]').forEach(b => b.addEventListener('click', () => ke(Number(b.dataset.gpi))));
  const on = (id, fn) => { const e = box.querySelector('#' + id); if (e) e.addEventListener(e.tagName === 'INPUT' ? 'change' : 'click', fn); };
  on('gpPrev', () => ke(GP.idx - 1));
  on('gpNext', () => ke(GP.idx + 1));
  on('gpLangkau', () => ke(GP.idx + 1));
  on('gpTiada', e => { GP.hanyaTiada = e.target.checked; GP.idx = 0; susunSenaraiGP(); GP.tangkap = null; lukis(); });
  on('gpSemula', () => { GP.tangkap = null; lukis(); });
  on('gpSimpan', () => {
    giliranFoto(m.id, GP.tangkap); GP.tangkap = null;
    if (GP.idx < GP.senarai.length - 1) GP.idx++; else toast('Murid terakhir dalam senarai.', 'info');
    lukis();
  });
  on('gpPusing', () => { GP.depan = !GP.depan; hentiKamera(); lukis(); });
  on('gpSnap', () => {
    const v = box.querySelector('#gpVid'); if (!v || !v.videoWidth) return toast('Kamera belum sedia.', 'error');
    const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
    const ctx = c.getContext('2d');
    if (GP.depan) { ctx.translate(c.width, 0); ctx.scale(-1, 1); }
    ctx.drawImage(v, 0, 0);
    GP.tangkap = potongPasport(c, c.width, c.height);
    lukis();
  });
  const dariFail = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { GP.tangkap = await failKeDataURL(f); lukis(); } catch (err) { toast(err.message, 'error'); }
  };
  on('gpCap', dariFail); on('gpFail', dariFail);

  // Mulakan kamera langsung
  const vid = box.querySelector('#gpVid');
  if (vid && adaKamera && m) {
    try {
      if (!GP.stream) GP.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: GP.depan ? 'user' : 'environment', width: { ideal: 1280 }, height: { ideal: 1600 } }, audio: false });
      if (!document.body.contains(vid)) return;
      vid.srcObject = GP.stream;
      const info = box.querySelector('#gpKamInfo'); if (info) info.textContent = '';
    } catch (e) {
      const info = box.querySelector('#gpKamInfo');
      if (info) info.textContent = e.name === 'NotAllowedError' ? 'Akses kamera ditolak. Benarkan kamera dalam tetapan pelayar, atau guna butang Kamera telefon.' : 'Kamera tidak dapat dibuka (perlu https). Guna butang Kamera telefon atau Fail.';
    }
  }
}

/* Mod fail: pilih banyak gambar, padankan dengan murid */
function padankanFail(nama, ms, guna) {
  const n = nama.replace(/\.[^.]+$/, '').toUpperCase();
  const kunci = n.replace(/[^A-Z0-9]/g, '');
  let m = ms.find(x => !guna.has(x.id) && kunci.indexOf(String(x.id).toUpperCase().replace(/[^A-Z0-9]/g, '')) >= 0 && String(x.id).length >= 4);
  if (!m) m = ms.find(x => !guna.has(x.id) && x.nama.toUpperCase().replace(/[^A-Z0-9]/g, '') === kunci);
  if (!m) m = ms.find(x => !guna.has(x.id) && kunci.length >= 4 && x.nama.toUpperCase().replace(/[^A-Z0-9]/g, '').indexOf(kunci) === 0);
  return m ? m.id : '';
}

function paintFailGP(modal) {
  const box = modal.querySelector('#gpBody'); if (!box) return;
  const ms = muridKelas(K.id);
  box.innerHTML = `
    <div class="space-y-3">
      <div class="flex flex-wrap items-center gap-2">
        <label class="btn btn-primary cursor-pointer"><i class="fa-solid fa-images"></i> Pilih banyak gambar<input type="file" accept="image/*" multiple class="hidden" id="gpBanyak"></label>
        <p class="text-[11px] text-slate-500">Gambar dipadankan automatik jika nama fail mengandungi <b>ID murid</b> atau <b>nama murid</b>. Selebihnya pilih murid secara manual.</p>
      </div>
      <div id="gpGrid" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-5 gap-3"></div>
      <div class="flex justify-end ${GP.fail.length ? '' : 'hidden'}" id="gpNaikBox"><button class="btn btn-success" id="gpNaik"><i class="fa-solid fa-cloud-arrow-up"></i> Simpan <span id="gpBilNaik">0</span> gambar</button></div>
    </div>`;
  const opsi = sel => '<option value="">Pilih murid…</option>' + ms.map(x => `<option value="${esc(x.id)}" ${x.id === sel ? 'selected' : ''}>${esc(namaPendek(x.nama))}${x.fotoId ? ' ✓' : ''}</option>`).join('');
  const lukisGrid = () => {
    const g = box.querySelector('#gpGrid');
    g.innerHTML = GP.fail.map((f, i) => `
      <div class="border ${f.id ? 'border-emerald-300' : 'border-amber-300'} rounded-xl overflow-hidden bg-white">
        <div class="relative" style="position:relative;aspect-ratio:4/5"><img src="${f.data}" class="absolute inset-0 w-full h-full object-cover" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" alt="">
          <button type="button" data-gp-buang="${i}" class="absolute top-1 right-1 w-7 h-7 rounded-full bg-black/60 text-white text-xs" aria-label="Buang"><i class="fa-solid fa-xmark"></i></button>
          ${f.st ? `<span class="absolute bottom-1 left-1 badge ${f.st === 'ok' ? 'bg-emerald-600 text-white' : f.st === 'gagal' ? 'bg-rose-600 text-white' : 'bg-amber-500 text-white'}">${f.st === 'ok' ? 'Disimpan' : f.st === 'gagal' ? 'Gagal' : 'Memuat naik'}</span>` : ''}</div>
        <div class="p-1.5"><p class="text-[10px] text-slate-400 truncate" title="${esc(f.nama)}">${esc(f.nama)}</p>
          <select class="inp py-1 text-[11px]" data-gp-pilih="${i}" ${f.st ? 'disabled' : ''}>${opsi(f.id)}</select></div>
      </div>`).join('');
    g.querySelectorAll('[data-gp-pilih]').forEach(s => s.addEventListener('change', () => { GP.fail[Number(s.dataset.gpPilih)].id = s.value; lukisGrid(); }));
    g.querySelectorAll('[data-gp-buang]').forEach(b => b.addEventListener('click', () => { GP.fail.splice(Number(b.dataset.gpBuang), 1); lukisGrid(); }));
    const sedia = GP.fail.filter(f => f.id && !f.st);
    box.querySelector('#gpBilNaik').textContent = sedia.length;
    box.querySelector('#gpNaikBox').classList.toggle('hidden', !GP.fail.length);
    box.querySelector('#gpNaik').disabled = !sedia.length;
    const dup = sedia.map(f => f.id).filter((v, i, a) => a.indexOf(v) !== i);
    if (dup.length) toast('Ada murid dipilih untuk lebih daripada satu gambar; gambar terakhir akan digunakan.', 'warn');
  };
  box.querySelector('#gpBanyak').addEventListener('change', async e => {
    const files = Array.from(e.target.files).slice(0, 60); e.target.value = '';
    const guna = new Set(GP.fail.map(f => f.id).filter(Boolean));
    for (const f of files) {
      try { const data = await failKeDataURL(f); const id = padankanFail(f.name, ms, guna); if (id) guna.add(id); GP.fail.push({ nama: f.name, data, id, st: '' }); }
      catch (err) { toast(`${f.name}: ${err.message}`, 'error'); }
    }
    lukisGrid();
  });
  box.querySelector('#gpNaik').addEventListener('click', () => {
    GP.fail.filter(f => f.id && !f.st).forEach(f => { f.st = 'naik'; giliranFoto(f.id, f.data); });
    lukisGrid();
    const pantau = setInterval(() => {
      if (!document.body.contains(box)) return clearInterval(pantau);
      let ubah = false;
      GP.fail.forEach(f => { if (f.st === 'naik' && GP.status[f.id] && GP.status[f.id] !== 'naik') { f.st = GP.status[f.id]; ubah = true; } });
      if (ubah) lukisGrid();
      if (!GP.fail.some(f => f.st === 'naik')) clearInterval(pantau);
    }, 500);
  });
  lukisGrid();
}

async function tukarFotoMurid(id, input) {
  const f = input.files[0]; if (!f) return;
  const lbl = input.parentElement; lbl.classList.add('opacity-50', 'pointer-events-none');
  try {
    const fid = await uploadFoto(f, 'murid', 400);
    const r = await api('kemaskiniMurid', { idMurid: id, fotoId: fid });
    const m = IDX.murid.get(id); if (m) m.fotoId = r.fotoId;
    const p = PROFIL.get(id); if (p) p.fotoId = r.fotoId;
    snapshotBoot();
    const av = $('#pfAv'); if (av) { av.querySelector('span').outerHTML = avatar(m.nama, r.fotoId, m.jantina, 'w-20 h-20', 'text-xl'); hydrateFotos(av); }
    if (S.tab === 'kelas') paintKelasBody();
    toast('Gambar murid dikemas kini.', 'success');
  } catch (e) { toast(e.message, 'error'); }
  finally { lbl.classList.remove('opacity-50', 'pointer-events-none'); input.value = ''; }
}

/* ==================================================================
 *  KEHADIRAN (Hadir / Lewat / Tidak Hadir, rekod lepas, analisis murid)
 * ================================================================== */
const A = { tarikh: '', tahun: '', idKelas: '', rekod: {}, sudah: false, dirty: false, meta: null, sub: 'harian', bulan: '', bln: null };
const ST_KH = [['Hadir', 'Hadir', 'bg-emerald-600'], ['Lewat', 'Lewat', 'bg-amber-500'], ['Tidak Hadir', 'Tidak hadir', 'bg-rose-600']];
const isHadir = s => s === 'Hadir' || s === 'Lewat';

function geserTarikh(t, arah) {
  const d = toDate(t);
  do { d.setDate(d.getDate() + arah); } while (d.getDay() === 0 || d.getDay() === 6);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function renderKehadiran() {
  const el = $('#view-kehadiran');
  if (!S.kelas.length) { el.innerHTML = `<div class="card">${emptyBox('fa-chalkboard', 'Belum ada kelas. Import data IDME terlebih dahulu.')}</div>`; return; }
  if (!A.tarikh) A.tarikh = todayStr();
  if (!A.bulan) A.bulan = A.tarikh.slice(0, 7);
  if (!A.idKelas || !IDX.kelas.has(A.idKelas)) A.idKelas = defaultKelas();
  A.idKelas = selarasKelas(A.idKelas, A.tahun, true);
  el.innerHTML = `
    <div class="card p-4 space-y-4">
      <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
        <div class="flex flex-wrap items-center gap-2">
          <select id="aTahun" class="inp w-auto py-1.5" aria-label="Tahun">${tahunOptions(A.tahun)}</select>
          <select id="aKelas" class="inp w-auto py-1.5 font-bold" aria-label="Kelas">${kelasOptions(A.idKelas, null, A.tahun)}</select>
        </div>
        <div class="flex items-center bg-slate-100 p-1 rounded-xl w-fit">
          <button class="subtab ${A.sub === 'harian' ? 'active' : ''}" data-asub="harian"><i class="fa-solid fa-calendar-day mr-1"></i>Harian</button>
          <button class="subtab ${A.sub === 'bulanan' ? 'active' : ''}" data-asub="bulanan"><i class="fa-solid fa-calendar-days mr-1"></i>Rekod bulanan</button>
        </div>
      </div>
      <div id="aTop"></div>
    </div>
    <div id="aMain"></div>`;
  const tinggal = async () => !(A.dirty && A.sudah) || await confirmBox('Perubahan kehadiran belum disimpan. Tinggalkan?');
  $('#aKelas').addEventListener('change', async e => { if (!await tinggal()) { e.target.value = A.idKelas; return; } A.idKelas = e.target.value; A.dirty = false; muatSubKehadiran(); });
  $('#aTahun').addEventListener('change', async e => { if (!await tinggal()) { e.target.value = A.tahun; return; } A.tahun = e.target.value; A.dirty = false; renderKehadiran(); });
  el.querySelectorAll('[data-asub]').forEach(b => b.addEventListener('click', async () => {
    if (b.dataset.asub === A.sub || !await tinggal()) return;
    A.sub = b.dataset.asub; A.dirty = false;
    el.querySelectorAll('[data-asub]').forEach(x => x.classList.toggle('active', x === b));
    muatSubKehadiran();
  }));
  muatSubKehadiran();
}

function muatSubKehadiran() { if (A.sub === 'bulanan') renderBulanan(); else renderHarian(); }

/* ---- Harian ---- */
function renderHarian() {
  const hariIni = todayStr(), lepas = A.tarikh < hariIni;
  $('#aTop').innerHTML = `
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
      <div class="flex flex-wrap items-center gap-2">
        <button class="btn btn-ghost px-2.5" id="aPrev" title="Hari persekolahan sebelum" aria-label="Hari sebelum"><i class="fa-solid fa-chevron-left"></i></button>
        <input type="date" id="aTarikh" value="${A.tarikh}" max="${hariIni}" class="inp w-auto py-1.5" aria-label="Tarikh">
        <button class="btn btn-ghost px-2.5" id="aNext" ${A.tarikh >= hariIni ? 'disabled' : ''} title="Hari persekolahan seterusnya" aria-label="Hari seterusnya"><i class="fa-solid fa-chevron-right"></i></button>
        ${lepas ? '<button class="btn btn-ghost" id="aKini">Hari ini</button>' : ''}
        <span class="text-xs font-semibold text-slate-600">${fmtPanjang(toDate(A.tarikh))}</span>
        ${lepas ? '<span class="badge bg-violet-100 text-violet-700"><i class="fa-solid fa-clock-rotate-left"></i> Rekod lepas</span>' : ''}
      </div>
      <div class="flex gap-2">
        <button class="btn btn-success" onclick="semuaHadir()"><i class="fa-solid fa-check-double"></i> Semua hadir</button>
        <button class="btn btn-primary" id="aSave" onclick="simpanKehadiran(this)"><i class="fa-solid fa-floppy-disk"></i> Simpan</button>
      </div>
    </div>
    <div id="aBanner"></div>
    <div id="aStats" class="grid grid-cols-2 sm:grid-cols-5 gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200/60 text-center"></div>`;
  $('#aMain').innerHTML = `
    <div class="card overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-xs">
      <thead class="bg-slate-50 border-b border-slate-200"><tr><th class="th w-10 text-center">#</th><th class="th">Murid <span class="font-normal text-slate-400">(klik nama untuk analisis)</span></th><th class="th text-center">Status</th><th class="th">Catatan</th><th class="th text-center">Waris</th></tr></thead>
      <tbody id="aBody" class="divide-y divide-slate-100"></tbody></table></div></div>`;
  const tukar = async t => {
    if (A.dirty && A.sudah && !await confirmBox('Perubahan kehadiran belum disimpan. Tinggalkan?')) { $('#aTarikh').value = A.tarikh; return; }
    A.tarikh = t > todayStr() ? todayStr() : t; A.dirty = false; renderHarian();
  };
  $('#aTarikh').addEventListener('change', e => tukar(e.target.value || todayStr()));
  $('#aPrev').onclick = () => tukar(geserTarikh(A.tarikh, -1));
  $('#aNext').onclick = () => tukar(geserTarikh(A.tarikh, 1));
  const k = $('#aKini'); if (k) k.onclick = () => tukar(todayStr());
  $('#aBody').addEventListener('click', e => {
    const nm = e.target.closest('[data-analisis]'); if (nm) return openAnalisisMurid(nm.dataset.analisis);
    const b = e.target.closest('[data-st]'); if (!b) return;
    const id = b.closest('tr').dataset.id;
    A.rekod[id].status = b.dataset.st; if (b.dataset.st === 'Hadir') A.rekod[id].sebab = '';
    A.dirty = true; paintKehadiranRow(id); paintKehadiranStats();
  });
  $('#aBody').addEventListener('input', e => {
    if (!e.target.classList.contains('aSebab')) return;
    A.rekod[e.target.closest('tr').dataset.id].sebab = e.target.value; A.dirty = true;
  });
  loadKehadiran();
}

async function loadKehadiran() {
  const key = A.idKelas + '|' + A.tarikh;
  $('#aBody').innerHTML = `<tr><td colspan="5" class="p-4">${skel('h-10', 6, 'mb-2')}</td></tr>`;
  $('#aBanner').innerHTML = ''; $('#aStats').innerHTML = '';
  try {
    const r = await api('getKehadiran', { tarikh: A.tarikh, idKelas: A.idKelas });
    if (key !== A.idKelas + '|' + A.tarikh || A.sub !== 'harian') return;
    A.rekod = {}; A.sudah = r.sudahDirekod; A.meta = r;
    muridKelas(A.idKelas).forEach(m => { A.rekod[m.id] = r.rekod[m.id] ? { ...r.rekod[m.id] } : { status: 'Hadir', sebab: '' }; });
    A.dirty = !r.sudahDirekod;
    const g = r.perekod && IDX.guru.get(r.perekod);
    $('#aBanner').innerHTML = r.sudahDirekod
      ? `<p class="text-xs text-emerald-800 bg-emerald-50 border border-emerald-200 rounded-xl p-2.5"><i class="fa-solid fa-circle-check mr-1"></i> Direkod oleh <b>${esc(g ? g.nama : r.perekod)}</b> pada ${fmtMasa(r.masa)}. Anda boleh membetulkan dan simpan semula.</p>`
      : `<p class="text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-xl p-2.5"><i class="fa-solid fa-circle-info mr-1"></i> Kehadiran ${fmtTarikh(A.tarikh)} belum direkod. Semua murid ditanda hadir; tukar yang lewat atau tidak hadir, kemudian tekan <b>Simpan</b>.</p>`;
    paintKehadiranTable(); paintKehadiranStats();
  } catch (e) {
    $('#aBody').innerHTML = `<tr><td colspan="5">${errBox(e.message, 'loadKehadiran()')}</td></tr>`;
  }
}

function rowKehadiran(m, i) {
  const r = A.rekod[m.id];
  const b = (st, label, on) => `<button type="button" data-st="${st}" class="px-2.5 py-1 rounded-lg transition ${r.status === st ? on + ' text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}">${label}</button>`;
  const bg = r.status === 'Tidak Hadir' ? 'bg-rose-50/50' : r.status === 'Lewat' ? 'bg-amber-50/50' : '';
  return `<tr data-id="${esc(m.id)}" class="${bg}">
    <td class="td text-center font-bold text-slate-400">${i + 1}</td>

function paintKehadiranTable() {
  const ms = muridKelas(A.idKelas);
  $('#aBody').innerHTML = ms.length ? ms.map(rowKehadiran).join('') : `<tr><td colspan="5">${emptyBox('fa-users', 'Tiada murid aktif dalam kelas ini.')}</td></tr>`;
  hydrateFotos($('#aBody'));
}
function paintKehadiranRow(id) {
  const ms = muridKelas(A.idKelas); const i = ms.findIndex(m => m.id === id);
  const tr = $('#aBody').querySelector(`tr[data-id="${CSS.escape(id)}"]`);

function paintKehadiranStats() {
  const v = Object.values(A.rekod);
  const h = v.filter(r => r.status === 'Hadir').length, l = v.filter(r => r.status === 'Lewat').length, x = v.length - h - l;
  const pct = v.length ? ((h + l) / v.length * 100).toFixed(1) : '0.0';
  const c = (label, val, tone) => `<div><span class="text-[11px] font-semibold ${tone}">${label}</span><p class="text-lg font-bold ${tone}">${val}</p></div>`;
  $('#aStats').innerHTML = c('Jumlah murid', v.length, 'text-slate-700') + c('Hadir', h, 'text-emerald-600') + c('Lewat', l, 'text-amber-600') +
    c('Tidak hadir', x, 'text-rose-600') + c('Peratus kehadiran', pct + '%', 'text-brand-600');
}

function semuaHadir() {
  Object.keys(A.rekod).forEach(id => { A.rekod[id] = { status: 'Hadir', sebab: '' }; });
  A.dirty = true; paintKehadiranTable(); paintKehadiranStats();
}

async function simpanKehadiran(btn) {
  const rekod = Object.keys(A.rekod).map(id => ({ idMurid: id, status: A.rekod[id].status, sebab: A.rekod[id].sebab }));
  if (!rekod.length) return toast('Tiada murid untuk direkod.', 'error');
  await busy(btn, async () => {
    const r = await api('simpanKehadiran', { tarikh: A.tarikh, idKelas: A.idKelas, rekod });
    A.dirty = false; A.sudah = true; A.bln = null; DB.del('dash');
    toast(`Kehadiran ${IDX.kelas.get(A.idKelas).nama} (${fmtPendek(A.tarikh)}) disimpan: ${r.baru} baharu, ${r.dikemaskini} dibetulkan.`, 'success');
    $('#aBanner').innerHTML = `<p class="text-xs text-emerald-800 bg-emerald-50 border border-emerald-200 rounded-xl p-2.5"><i class="fa-solid fa-circle-check mr-1"></i> Direkod oleh <b>${esc(S.user.nama)}</b> sebentar tadi.</p>`;
  });
}

function waWaris(id) {
  const m = IDX.murid.get(id), r = A.rekod[id];
  const status = r.status === 'Lewat' ? 'hadir lewat ke sekolah' : 'tidak hadir ke sekolah';
  const msg = `Assalamualaikum / Salam sejahtera Tuan/Puan ${m.namaPenjaga || 'Penjaga'},\n\n` +
    `Dimaklumkan bahawa anak jagaan tuan/puan, ${m.nama} (${m.namaKelas}), ${status} pada ${fmtTarikh(A.tarikh)}.` +
    `${r.sebab ? `\nCatatan: ${r.sebab}` : ''}\n\n${r.status === 'Lewat' ? 'Mohon kerjasama tuan/puan memastikan anak tiba di sekolah tepat pada masanya.' : 'Mohon kemukakan surat atau maklum balas kepada guru kelas.'}\n\nTerima kasih.\n${S.tetapan.namaSekolah || ''}`;

/* ---- Rekod bulanan (semak kehadiran lepas sekelas) ---- */

    <div class="flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2">

      </div>
      <div class="flex items-center gap-3 text-[11px] text-slate-600">
        <span><span class="inline-block w-3 h-3 rounded bg-emerald-500 align-middle"></span> Hadir</span>
        <span><span class="inline-block w-3 h-3 rounded bg-amber-400 align-middle"></span> Lewat</span>
        <span><span class="inline-block w-3 h-3 rounded bg-rose-500 align-middle"></span> Tidak hadir</span>

function paintBulanan(d) {
  const ms = muridKelas(A.idKelas);
  const [y, mo] = d.bulan.split('-').map(Number);
  if (!d.hari.length) { $('#aMain').innerHTML = `<div class="card">${emptyBox('fa-calendar-xmark', `Tiada rekod kehadiran ${esc(IDX.kelas.get(A.idKelas).nama)} bagi ${BULAN[mo - 1]} ${y}.`)}</div>`; return; }
  const sel = st => st === 'Hadir' ? '<span class="inline-block w-5 h-5 rounded-md bg-emerald-500" title="Hadir"></span>'
    : st === 'Lewat' ? '<span class="inline-flex w-5 h-5 rounded-md bg-amber-400 text-white text-[10px] font-bold items-center justify-center" title="Lewat">L</span>'
    : st === 'Tidak Hadir' ? '<span class="inline-flex w-5 h-5 rounded-md bg-rose-500 text-white text-[10px] font-bold items-center justify-center" title="Tidak hadir">✕</span>'
    : '<span class="text-slate-300">·</span>';
  let jH = 0, jL = 0, jX = 0;
  const baris = ms.map((m, i) => {
    const r = d.rekod[m.id] || {};

    jH += h; jL += l; jX += x;
    const n = h + l + x, p = n ? Math.round((h + l) / n * 1000) / 10 : null;
    return `<tr class="hover:bg-slate-50/70">
      <td class="td sticky left-0 bg-white z-10 min-w-[180px]"><span class="text-slate-400 mr-1">${i + 1}.</span><button type="button" onclick="openAnalisisMurid('${jsq(m.id)}')" class="font-semibold text-slate-800 hover:text-brand-600 hover:underline text-left">${esc(namaPendek(m.nama))}</button></td>

      <td class="td text-center font-bold text-amber-700">${l}</td>
      <td class="td text-center font-bold text-rose-700">${x}</td>

    <div class="card overflow-hidden">
      <div class="p-4 border-b border-slate-100 grid grid-cols-2 sm:grid-cols-5 gap-3 text-center">
        <div><p class="text-[11px] text-slate-500">Hari direkod</p><p class="text-lg font-bold">${d.hari.length}</p></div>
        <div><p class="text-[11px] text-emerald-700">Hadir</p><p class="text-lg font-bold text-emerald-700">${jH}</p></div>
        <div><p class="text-[11px] text-amber-700">Lewat</p><p class="text-lg font-bold text-amber-700">${jL}</p></div>
        <div><p class="text-[11px] text-rose-700">Tidak hadir</p><p class="text-lg font-bold text-rose-700">${jX}</p></div>
        <div><p class="text-[11px] text-brand-700">Purata kehadiran</p><p class="text-lg font-bold ${warnaPeratus(n ? (jH + jL) / n * 100 : null)}">${n ? ((jH + jL) / n * 100).toFixed(1) + '%' : '-'}</p></div>
      </div>
      <div class="overflow-x-auto"><table class="text-xs w-full">
        <thead class="bg-slate-50 border-b border-slate-200"><tr>
          <th class="th sticky left-0 bg-slate-50 z-10">Murid</th>
          ${d.hari.map(t => { const dt = toDate(t); return `<th class="px-1 py-2 text-center"><button type="button" onclick="bukaHariKehadiran('${jsq(t)}')" class="rounded-md px-1 hover:bg-brand-100 hover:text-brand-700" title="Buka ${fmtTarikh(t)}"><span class="block text-[11px] font-bold text-slate-700">${dt.getDate()}</span><span class="block text-[9px] text-slate-400">${HARI[dt.getDay()].slice(0, 3)}</span></button></th>`; }).join('')}
          <th class="th text-center border-l border-slate-200">H</th><th class="th text-center">L</th><th class="th text-center">TH</th><th class="th text-center">%</th>
        </tr></thead>
        <tbody class="divide-y divide-slate-100">${baris}</tbody>
      </table></div>
    </div>`;
}

function bukaHariKehadiran(t) {
  A.tarikh = t; A.sub = 'harian'; A.dirty = false;

}

/* ---- Analisis kehadiran seorang murid ---- */
async function openAnalisisMurid(id) {
  const mu = IDX.murid.get(id); if (!mu) return;
  const tahun = (A.tarikh || todayStr()).slice(0, 4);
  const m = openModal({ title: 'Analisis kehadiran murid', size: 'max-w-2xl', body: `<div id="amBox">${skel('h-16', 1)}${skel('h-24', 1, 'mt-3')}${skel('h-40', 1, 'mt-3')}</div>` });
  try {
    const d = await api('kehadiranMurid', { idMurid: id, tahun });
    m._am = { d, mu, tempoh: 'bulan', bulan: (A.tarikh || todayStr()).slice(0, 7) };
    paintAnalisisMurid(m);
  } catch (e) { const b = m.querySelector('#amBox'); if (b) b.innerHTML = errBox(e.message); }
}

function paintAnalisisMurid(m) {
  const box = m.querySelector('#amBox'); if (!box) return;
  const { d, mu, tempoh, bulan } = m._am;
  const [yy, mm] = bulan.split('-').map(Number);
  const rek = tempoh === 'bulan' ? d.rekod.filter(r => r.tarikh.slice(0, 7) === bulan) : d.rekod;
  const kira = list => { const h = list.filter(r => r.status === 'Hadir').length, l = list.filter(r => r.status === 'Lewat').length, x = list.filter(r => r.status === 'Tidak Hadir').length; const n = h + l + x; return { h, l, x, n, p: n ? Math.round((h + l) / n * 1000) / 10 : null }; };
  const k = kira(rek);
  const kad = (label, val, tone, sub = '') => `<div class="rounded-xl p-3 ${tone}"><p class="text-[11px] font-semibold opacity-80">${label}</p><p class="text-2xl font-extrabold">${val}</p>${sub ? `<p class="text-[10px] opacity-70">${sub}</p>` : ''}</div>`;
  const bulanan = BULAN.map((b, i) => {
    const ki = kira(d.rekod.filter(r => Number(r.tarikh.slice(5, 7)) === i + 1));
    return ki.n ? `<tr><td class="td font-semibold">${b}</td><td class="td text-center text-emerald-700 font-bold">${ki.h}</td><td class="td text-center text-amber-700 font-bold">${ki.l}</td><td class="td text-center text-rose-700 font-bold">${ki.x}</td>
      <td class="td w-40"><div class="h-2 rounded-full bg-rose-400 overflow-hidden flex"><div class="h-full bg-emerald-500" style="width:${ki.h / ki.n * 100}%"></div><div class="h-full bg-amber-400" style="width:${ki.l / ki.n * 100}%"></div></div></td>
      <td class="td text-center font-extrabold ${warnaPeratus(ki.p)}">${ki.p}%</td></tr>` : '';
  }).join('');
  const isu = rek.filter(r => r.status !== 'Hadir').slice().reverse();
  box.innerHTML = `
    <div class="flex items-center gap-3">
      ${avatar(mu.nama, mu.fotoId, mu.jantina, 'w-12 h-12', 'text-sm')}
      <div class="min-w-0 flex-1"><p class="font-extrabold text-slate-900 truncate">${esc(mu.nama)}</p><p class="text-xs text-slate-500">${esc(mu.namaKelas)}, ${esc(tahunLabel(mu.tahun))}</p></div>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <div class="flex bg-slate-100 p-1 rounded-xl">
        <button class="subtab ${tempoh === 'bulan' ? 'active' : ''}" data-tempoh="bulan">Bulan</button>
        <button class="subtab ${tempoh === 'tahun' ? 'active' : ''}" data-tempoh="tahun">Tahun ${d.tahun}</button>
      </div>
      ${tempoh === 'bulan' ? `<select class="inp w-auto py-1.5 text-xs" data-pilih-bulan>${BULAN.map((b, i) => { const v = `${d.tahun}-${pad(i + 1)}`; return v <= todayStr().slice(0, 7) ? `<option value="${v}" ${v === bulan ? 'selected' : ''}>${b} ${d.tahun}</option>` : ''; }).join('')}</select>` : ''}
    </div>
    ${k.n ? `
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
      ${kad('Hadir', k.h, 'bg-emerald-50 text-emerald-800', 'tepat masa')}
      ${kad('Lewat', k.l, 'bg-amber-50 text-amber-800', 'dikira hadir')}
      ${kad('Tidak hadir', k.x, 'bg-rose-50 text-rose-800')}
      ${kad('Peratus kehadiran', k.p + '%', 'bg-brand-50 text-brand-800', `${k.h + k.l} daripada ${k.n} hari`)}
    </div>` : emptyBox('fa-calendar-xmark', tempoh === 'bulan' ? `Tiada rekod kehadiran bagi ${BULAN[mm - 1]} ${yy}.` : `Tiada rekod kehadiran bagi tahun ${d.tahun}.`)}
    ${tempoh === 'tahun' && bulanan ? `
      <div><p class="text-xs font-bold text-slate-700 mb-2">Pecahan bulanan</p>
      <div class="overflow-x-auto border border-slate-200 rounded-xl"><table class="w-full text-xs">
        <thead class="bg-slate-50"><tr><th class="th">Bulan</th><th class="th text-center">Hadir</th><th class="th text-center">Lewat</th><th class="th text-center">Tidak hadir</th><th class="th"></th><th class="th text-center">%</th></tr></thead>
        <tbody class="divide-y divide-slate-100">${bulanan}</tbody></table></div></div>` : ''}
    ${isu.length ? `
      <div><p class="text-xs font-bold text-slate-700 mb-2">Tarikh lewat dan tidak hadir (${isu.length})</p>
      <div class="max-h-56 overflow-y-auto border border-slate-200 rounded-xl divide-y divide-slate-100">${isu.map(r => `
        <div class="px-3 py-2 flex items-center gap-3 text-xs">
          <span class="badge ${r.status === 'Lewat' ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800'} w-20 justify-center">${r.status === 'Lewat' ? 'Lewat' : 'Tidak hadir'}</span>
          <span class="font-semibold text-slate-700 w-36 shrink-0">${HARI[toDate(r.tarikh).getDay()]}, ${fmtPendek(r.tarikh)}</span>
          <span class="text-slate-500 truncate">${esc(r.sebab || '-')}</span>
        </div>`).join('')}</div></div>` : ''}`;
  hydrateFotos(box);
  box.querySelectorAll('[data-tempoh]').forEach(b => b.addEventListener('click', () => { m._am.tempoh = b.dataset.tempoh; paintAnalisisMurid(m); }));
  const pb = box.querySelector('[data-pilih-bulan]'); if (pb) pb.addEventListener('change', e => { m._am.bulan = e.target.value; paintAnalisisMurid(m); });
}

const B = { tahun: '', kat: '', list: null, fTahun: '', fKelas: '', fQ: '', mula: false };
const STATUS_AGIHAN = ['Dalam Proses', 'Layak', 'Selesai Agihan', 'Tidak Layak'];
// Sub menu jenis bantuan: ikon ikut kod, warna ikut susunan
const IKON_SKIM = { RMT: 'fa-utensils', KWAMP: 'fa-sack-dollar', SPBT: 'fa-book', BAP: 'fa-school', ZAKAT: 'fa-hand-holding-dollar' };
const WARNA_SKIM = ['bg-orange-100 text-orange-700', 'bg-emerald-100 text-emerald-700', 'bg-sky-100 text-sky-700', 'bg-violet-100 text-violet-700', 'bg-pink-100 text-pink-700', 'bg-amber-100 text-amber-700', 'bg-cyan-100 text-cyan-700', 'bg-rose-100 text-rose-700'];
function jubinSkim(id, tajuk, sub, pic, n, ikon, warna, saya) {
  const on = B.kat === id;
  return `<button type="button" data-skim="${esc(id)}" aria-pressed="${on}" class="flex items-center gap-3 p-3 rounded-2xl border-2 text-left transition min-w-0 ${on ? 'border-brand-600 bg-brand-50 shadow-sm' : 'border-slate-100 bg-slate-50/60 hover:border-slate-200 hover:bg-white'}">
    <span class="w-11 h-11 rounded-xl flex items-center justify-center text-lg shrink-0 ${on ? 'bg-brand-600 text-white' : warna}"><i class="fa-solid ${ikon}"></i></span>
    <span class="min-w-0 flex-1">
      <span class="flex items-center justify-between gap-2"><span class="text-xs font-extrabold truncate ${on ? 'text-brand-800' : 'text-slate-800'}">${esc(tajuk)}</span><span class="badge bg-white text-slate-700 border border-slate-200 shrink-0">${n}</span></span>
      <span class="block text-[11px] text-slate-500 truncate">${esc(sub)}</span>
      ${pic === null ? '' : `<span class="block text-[10.5px] truncate ${saya ? 'text-brand-700 font-bold' : pic ? 'text-slate-600' : 'text-rose-600'}"><i class="fa-solid fa-user-tie mr-1"></i>${saya ? 'Anda PIC' : pic ? 'PIC: ' + esc(namaPendek(pic)) : 'PIC belum dilantik'}</span>`}
    </span></button>`;
}
// Pendapatan murid untuk menilai kelayakan. Pentadbir sudah memilikinya; PIC memintanya bagi skimnya sahaja.
async function calonSkim(idKat) {
  if (can('lihat_sensitif_semua')) return new Map(S.murid.filter(m => m.sensitif).map(m => [m.id, m.sensitif]));
  return new Map((await api('calonSkim', { idKategori: idKat })).map(x => [x.id, x]));
}

function badgeAgihan(s) {
  const c = { 'Selesai Agihan': 'bg-emerald-100 text-emerald-800', 'Layak': 'bg-sky-100 text-sky-800', 'Dalam Proses': 'bg-amber-100 text-amber-800', 'Tidak Layak': 'bg-slate-200 text-slate-600' }[s] || 'bg-slate-100 text-slate-600';
  return `<span class="badge ${c}">${esc(s)}</span>`;
}
function badgePendapatan(k) {
  const c = { B40: 'bg-amber-100 text-amber-800', M40: 'bg-sky-100 text-sky-800', T20: 'bg-slate-200 text-slate-700' }[k] || 'bg-slate-100 text-slate-500';
  return `<span class="badge ${c}">${esc(k || 'Tiada maklumat')}</span>`;
}
// Pendapatan isi rumah + per kapita dalam satu sel
function selPendapatan(p, pk, kat) {
  return `${badgePendapatan(kat)} <span class="text-slate-600 ml-1">${fmtRM(p)}</span>${pk != null ? `<div class="text-[11px] text-slate-500 mt-0.5">Per kapita ${fmtRM(pk)}</div>` : ''}`;
}
// Semua bantuan untuk warganegara sahaja; BAP & SPBT tanpa syarat pendapatan (sama seperti di pelayan)
const SKIM_SEMUA_LAYAK = ['BAP', 'SPBT'];
function semuaLayakSkim(k) { return !!k && SKIM_SEMUA_LAYAK.indexOf(String(k.kod).toUpperCase()) >= 0; }
function wargaNegara(m) { const v = String(m.warganegara || '').toUpperCase(); return /WARGANEGARA|MALAYSIA/.test(v) && !/BUKAN/.test(v); }
// Kelayakan ikut had skim (sama seperti layakSkim_ di pelayan): true / false / null (skim tiada had)
function layakSkim(p, pk, k) {
  if (semuaLayakSkim(k)) return true;
  const s = [];
  if (k.hadIsiRumah > 0) s.push(p != null && p <= k.hadIsiRumah);
  if (k.hadPerKapita > 0) s.push(pk != null && pk <= k.hadPerKapita);
  if (!s.length) return null;
  return k.syarat === 'SALAH_SATU' ? s.some(Boolean) : s.every(Boolean);
}
function teksHad(k) {
  if (semuaLayakSkim(k)) return 'semua murid warganegara';
  const h = [];
  if (k.hadIsiRumah > 0) h.push(`isi rumah ≤ ${fmtRM(k.hadIsiRumah)}`);
  if (k.hadPerKapita > 0) h.push(`per kapita ≤ ${fmtRM(k.hadPerKapita)}`);
  return h.join(k.syarat === 'SALAH_SATU' ? ' ATAU ' : ' DAN ');
}

function renderBantuan() {

    B.mula = true;
    if (saya.length && !can('urus_bantuan')) B.kat = saya[0].id;

        <button class="btn bg-amber-100 hover:bg-amber-200 text-amber-900" onclick="openTiadaPendapatan()"><i class="fa-solid fa-circle-exclamation"></i> Tiada maklumat pendapatan <span class="badge bg-white/70 text-amber-900">${muridTiadaPendapatan().length}</span></button>
        ${can('urus_bantuan') ? '<button class="btn btn-ghost" onclick="openSkimModal()"><i class="fa-solid fa-plus"></i> Jenis bantuan baharu</button>' : ''}

          <select id="bfTahun" class="${TAPIS_CLS}" aria-label="Tapis tahun">${tahunOptions(B.fTahun)}</select>
          <select id="bfKelas" class="${TAPIS_CLS}" aria-label="Tapis kelas">${kelasOptions(B.fKelas, 'Semua kelas', B.fTahun)}</select>
          <input id="bfQ" value="${esc(B.fQ)}" placeholder="Cari nama murid" class="inp w-48 py-1.5 text-xs">
        </div>

        <thead class="bg-slate-50 border-b border-slate-200"><tr><th class="th">Murid</th><th class="th">Kelas</th><th class="th">Skim</th><th class="th">Pendapatan isi rumah</th><th class="th">Status</th><th class="th">Tarikh serahan</th><th class="th">Amaun</th>${urus ? '<th class="th"></th>' : ''}</tr></thead>
