<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>e-HEM Pintar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'Segoe UI', 'Roboto', 'sans-serif'] },
          colors: {
            brand: Object.fromEntries([50, 100, 200, 300, 500, 600, 700, 800, 900].map(k => [k, `rgb(var(--b${k}) / <alpha-value>)`])),
            side: 'rgb(var(--side) / <alpha-value>)'
          }
        }
      }
    };
  </script>

  <style type="text/tailwindcss">
    @layer components {
      .inp { @apply w-full border border-slate-200 rounded-xl px-3 py-2 text-sm bg-slate-50 outline-none transition focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 disabled:opacity-60; }
      .lbl { @apply block text-xs font-semibold text-slate-600 mb-1; }
      .btn { @apply inline-flex items-center justify-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold transition whitespace-nowrap disabled:opacity-50 disabled:cursor-not-allowed; }
      .btn-primary { @apply bg-brand-600 hover:bg-brand-700 text-white shadow-sm; }
      .btn-ghost { @apply bg-slate-100 hover:bg-slate-200 text-slate-700; }
      .btn-danger { @apply bg-rose-600 hover:bg-rose-700 text-white shadow-sm; }
      .btn-success { @apply bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm; }
      .card { @apply bg-white rounded-2xl border border-slate-200/80 shadow-sm; }
      .badge { @apply inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold whitespace-nowrap; }
      .th { @apply p-3 text-left text-[11px] font-semibold text-slate-500 whitespace-nowrap; }
      .td { @apply p-3 align-middle; }
      .navbtn { @apply w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:text-white hover:bg-white/10 transition; }
      .navbtn.active { @apply bg-brand-600 text-white shadow-sm; }
      .subtab { @apply px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition; }
      .subtab.active { @apply bg-white shadow-sm text-brand-700; }
      .pill { @apply px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap border transition; }
    }
  </style>

  <style>
    /* Tema lalai (Biru Institusi); ditukar oleh pakaiTema() */
    :root { --b50: 240 249 255; --b100: 224 242 254; --b200: 186 230 253; --b300: 125 211 252; --b500: 14 165 233; --b600: 2 132 199; --b700: 3 105 161; --b800: 7 89 133; --b900: 12 74 110; --side: 15 23 42; }
    /* Latar belakang (mengikut warna tema) */
    [data-latar="polos"] { background: #f1f5f9; }
    [data-latar="lembut"] { background: linear-gradient(180deg, rgb(var(--b100) / .7) 0, #f1f5f9 360px), #f1f5f9; }
    [data-latar="aurora"] { background: radial-gradient(900px 420px at 0% 0%, rgb(var(--b300) / .45), transparent 65%), radial-gradient(800px 480px at 100% 0%, rgb(var(--b500) / .25), transparent 60%), radial-gradient(700px 400px at 50% 100%, rgb(var(--b200) / .4), transparent 60%), #f1f5f9; }
    [data-latar="titik"] { background-color: #f8fafc; background-image: radial-gradient(rgb(var(--b500) / .28) 1.1px, transparent 1.6px); background-size: 18px 18px; }
    [data-latar="garis"] { background-color: #f8fafc; background-image: repeating-linear-gradient(135deg, rgb(var(--b300) / .3) 0 1px, transparent 1px 14px); }
    html, body { height: 100%; }
    /* Menu bawah hanya untuk telefon/tablet kecil */
    @media (min-width: 768px) { #bottomNav { display: none !important; } }
    body { background: #f1f5f9; -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid #0284c7; outline-offset: 2px; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .desk { transition: transform .15s ease, box-shadow .15s ease; }
    .desk:hover { transform: translateY(-2px); box-shadow: 0 6px 12px -6px rgba(15, 23, 42, .25); }
    .desk.sel { outline: 2px dashed #0284c7; background: #eff6ff; }
    .skel { background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: .75rem; }
    @keyframes sk { to { background-position: -200% 0; } }
    input[type=range] { accent-color: #0284c7; }
    #printArea { display: none; }
    @media print {
      @page { size: A4; margin: 14mm; }
      body { background: #fff; }
      body > *:not(#printArea) { display: none !important; }
      #printArea { display: block !important; color: #0f172a; font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body class="text-slate-800 antialiased font-sans">

  <!-- ================= SKRIN MEMUAT ================= -->
  <div id="splash" class="fixed inset-0 flex flex-col items-center justify-center gap-3 bg-side text-white z-50">

  <!-- ================= LOG MASUK ================= -->
  <div id="loginScreen" class="hidden min-h-full flex items-center justify-center p-4 bg-side" data-latar-login>

        <div data-logo class="w-12 h-12 rounded-2xl bg-brand-600 text-white flex items-center justify-center text-xl shrink-0"><i class="fa-solid fa-graduation-cap"></i></div>
        <div>
          <h1 data-nama-app class="text-lg font-extrabold text-slate-900 leading-tight">e-HEM Pintar</h1>
          <p id="loginSekolah" data-nama-sekolah class="text-xs text-slate-500">Hal Ehwal Murid</p>
        </div>
      </div>
      <div>
        <label class="lbl" for="loginEmel">Emel guru</label>
        <input id="loginEmel" type="email" required autocomplete="username" class="inp" placeholder="nama@moe-dl.edu.my">
      </div>
      <div>
        <label class="lbl" for="loginPin">Kata laluan</label>
        <div class="relative"><input id="loginPin" type="password" required maxlength="64" autocomplete="current-password" class="inp pr-10" placeholder="Sekurang-kurangnya 8 aksara"><button type="button" onclick="lihatKataLaluan('loginPin',this)" class="absolute right-2 top-1.5 p-1 text-slate-400 hover:text-slate-700" aria-label="Papar kata laluan"><i class="fa-regular fa-eye"></i></button></div>
      </div>
      <p id="loginErr" class="hidden text-xs text-rose-600 font-medium"></p>
      <button id="loginBtn" type="submit" class="btn btn-primary w-full py-3 text-sm">Log masuk</button>
      <p class="text-center"><button type="button" onclick="bukaLupa()" class="text-xs font-semibold text-brand-700 hover:underline">Lupa kata laluan?</button></p>
      <div class="border-t border-slate-100 pt-4 text-center">
        <p class="text-xs text-slate-500">Belum ada akaun?</p>
        <button type="button" onclick="bukaDaftar()" class="btn btn-ghost w-full mt-2"><i class="fa-solid fa-user-plus"></i> Daftar akaun guru</button>
      </div>
    </form>

    <form id="daftarForm" class="hidden w-full max-w-md bg-white rounded-3xl p-6 sm:p-7 shadow-2xl space-y-4" autocomplete="off" novalidate>
      <div class="flex items-center gap-3">
        <button type="button" onclick="tutupDaftar()" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center" aria-label="Kembali"><i class="fa-solid fa-arrow-left"></i></button>
        <div><h1 class="text-lg font-extrabold text-slate-900 leading-tight">Daftar akaun guru</h1><p id="dfSekolah" data-nama-sekolah class="text-xs text-slate-500">e-HEM Pintar</p></div>
      </div>
      <div id="dfBody" class="space-y-4"><div class="skel h-10"></div><div class="skel h-10"></div><div class="skel h-10"></div></div>
    </form>

    <form id="lupaForm" class="hidden w-full max-w-sm bg-white rounded-3xl p-7 shadow-2xl space-y-4" autocomplete="off" novalidate>
      <div class="flex items-center gap-3">
        <button type="button" onclick="tutupLupa()" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center" aria-label="Kembali"><i class="fa-solid fa-arrow-left"></i></button>

  <!-- ================= APLIKASI ================= -->
  <div id="app" class="hidden h-full flex overflow-hidden">
    <aside id="sidebar" class="bg-side text-slate-300 w-64 flex-shrink-0 flex flex-col z-30 fixed inset-y-0 left-0 md:static -translate-x-full md:translate-x-0 transition-transform duration-200 shadow-xl md:shadow-none">
      <div class="p-5 border-b border-white/10 flex items-center justify-between">
        <div class="flex items-center gap-3 min-w-0">
          <div data-logo class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white text-lg shrink-0"><i class="fa-solid fa-graduation-cap"></i></div>
          <div class="min-w-0">
            <p data-nama-app class="font-bold text-white text-base leading-tight truncate">e-HEM Pintar</p>
            <p id="brandSekolah" class="text-[11px] text-slate-400 truncate">Hal Ehwal Murid</p>
          </div>
        </div>
        <button onclick="toggleSidebar(false)" class="md:hidden text-slate-400 hover:text-white p-1" aria-label="Tutup menu"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <nav id="nav" class="flex-1 overflow-y-auto p-3 space-y-1"></nav>
      <div class="p-3 border-t border-white/10 flex items-center gap-3">
        <span id="userAvatar"></span>
        <div class="flex-1 min-w-0">
          <p id="userNama" class="text-xs font-semibold text-white truncate"></p>
          <p id="userPeranan" class="text-[11px] text-slate-400 truncate"></p>
        </div>
        <button onclick="openPinModal(false)" class="text-slate-400 hover:text-white p-1.5" title="Tukar kata laluan" aria-label="Tukar kata laluan"><i class="fa-solid fa-key text-sm"></i></button>
        <button onclick="logout()" class="text-slate-400 hover:text-rose-400 p-1.5" title="Log keluar" aria-label="Log keluar"><i class="fa-solid fa-arrow-right-from-bracket text-sm"></i></button>

    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

            <h2 id="topTitle" class="text-base sm:text-lg font-bold text-slate-800 truncate">Dashboard</h2>

        <div class="flex items-center gap-2 shrink-0">

          </div>
          <button onclick="bukaPengimbas()" class="hidden md:flex items-center gap-2 text-xs bg-brand-600 hover:bg-brand-700 text-white px-3 py-1.5 rounded-lg font-semibold" title="Imbas QR murid"><i class="fa-solid fa-qrcode"></i><span class="hidden lg:inline">Imbas QR murid</span></button>
          <button onclick="openKritikal()" class="relative p-2 text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-lg" title="Murid merit kritikal" aria-label="Murid merit kritikal">

  <!-- Menu bawah (telefon) -->

  <div id="toastRoot" class="fixed bottom-24 md:bottom-4 right-4 left-4 sm:left-auto z-[70] flex flex-col items-end gap-2 pointer-events-none"></div>
  <div id="printArea"></div>

<script>
/* ==================================================================
 *  e-HEM Pintar — Frontend
 *  Tukar GAS_URL kepada URL Web App (/exec) daripada Deploy Code.gs.
 * ================================================================== */
const CONFIG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbxkfYUH1Pt5bLA-74GvzbEOWFUjVhKDam_pLXmlzPOtrOJtxTbdmawiDKwyD_EuWo0oMA/exec',
  TIMEOUT_MS: 30000
};

/* ---------------- Utiliti asas ---------------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Untuk nilai dalam rentetan JS di dalam atribut on*="fn('…')". esc() TIDAK selamat di sini kerana pelayar
// menyahkod &#39; kembali kepada ' sebelum JS dijalankan. Escape \uXXXX tidak dinyahkod oleh penghurai HTML.
const JSQ_RE = new RegExp('[\\\\\'"<>&`\\n\\r' + String.fromCharCode(0x2028, 0x2029) + ']', 'g');
const jsq = v => String(v == null ? '' : v).replace(JSQ_RE, c => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0'));
const pad = n => String(n).padStart(2, '0');
const debounce = (fn, ms = 200) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const HARI = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
const BULAN = ['Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun', 'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'];
const HARI_SEKOLAH = ['Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat'];

function todayStr() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function toDate(v) {
  if (!v) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) { const [y, m, d] = v.split('-').map(Number); return new Date(y, m - 1, d); }
  const d = new Date(v); return isNaN(d) ? null : d;
}
function fmtTarikh(v) { const d = toDate(v); return d ? `${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}` : '-'; }
function fmtPendek(v) { const d = toDate(v); return d ? `${d.getDate()} ${BULAN[d.getMonth()].slice(0, 3)} ${d.getFullYear()}` : '-'; }
function fmtMasa(v) { const d = toDate(v); return d ? `${fmtPendek(v)}, ${pad(d.getHours())}:${pad(d.getMinutes())}` : '-'; }
function fmtPanjang(d) { return `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`; }
function fmtRM(n) { return n == null || n === '' ? '-' : 'RM ' + Number(n).toLocaleString('ms-MY'); }
function initials(n) { return String(n || '?').replace(/\b(bin|binti|bt|b|a\/l|a\/p|al|ap)\b\.?/gi, '').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || '?'; }
// Nilai IDME seperti "TIDAK"/"BUKAN OKU" bermaksud tiada status
function adaStatus(v) { const s = String(v || '').trim(); return !!s && !/^(TIDAK|BUKAN|BUKAN OKU|TIADA|-|N|NO)$/i.test(s); }
function namaPendek(n) { return String(n || '').split(/\s+(bin|binti|bt|a\/l|a\/p)\s+/i)[0].split(/\s+/).slice(0, 2).join(' '); }

/* ---------------- Tema paparan (9 warna, 5 latar — sama seperti STMS) ---------------- */
const TEMA = {
  biru: { label: 'Biru Institusi', side: '#0f172a', p: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e' } },
  zamrud: { label: 'Zamrud', side: '#022c22', p: { 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7', 500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b' } },
  lautan: { label: 'Lautan', side: '#083344', p: { 50: '#ecfeff', 100: '#cffafe', 200: '#a5f3fc', 300: '#67e8f9', 500: '#06b6d4', 600: '#0891b2', 700: '#0e7490', 800: '#155e75', 900: '#164e63' } },
  lavender: { label: 'Lavender', side: '#2e1065', p: { 50: '#f5f3ff', 100: '#ede9fe', 200: '#ddd6fe', 300: '#c4b5fd', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9', 800: '#5b21b6', 900: '#4c1d95' } },
  senja: { label: 'Senja', side: '#431407', p: { 50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa', 300: '#fdba74', 500: '#f97316', 600: '#ea580c', 700: '#c2410c', 800: '#9a3412', 900: '#7c2d12' } },
  marun: { label: 'Marun Emas', side: '#3b0a14', p: { 50: '#fdf6ec', 100: '#fbe9cf', 200: '#f3cf94', 300: '#e7b25a', 500: '#b8324f', 600: '#9f1239', 700: '#881337', 800: '#6b0f2b', 900: '#4c0519' } },
  // Tiga tema berikut sudah sah di pelayan (TEMA_SAH) tetapi sebelum ini tiada di frontend
  sakura: { label: 'Sakura', side: '#500724', p: { 50: '#fdf2f8', 100: '#fce7f3', 200: '#fbcfe8', 300: '#f9a8d4', 500: '#ec4899', 600: '#db2777', 700: '#be185d', 800: '#9d174d', 900: '#831843' } },
  hutan: { label: 'Hutan', side: '#052e16', p: { 50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 300: '#86efac', 500: '#22c55e', 600: '#16a34a', 700: '#15803d', 800: '#166534', 900: '#14532d' } },
  grafit: { label: 'Grafit', side: '#09090b', p: { 50: '#fafafa', 100: '#f4f4f5', 200: '#e4e4e7', 300: '#d4d4d8', 500: '#71717a', 600: '#52525b', 700: '#3f3f46', 800: '#27272a', 900: '#18181b' } }
};
const LATAR = { lembut: 'Lembut', aurora: 'Aurora', titik: 'Titik', garis: 'Garis', polos: 'Polos' };

function hexRGB(h) { const n = parseInt(h.slice(1), 16); return `${n >> 16 & 255} ${n >> 8 & 255} ${n & 255}`; }
function pakaiTema(tema, latar) {
  const k = TEMA[tema] ? tema : 'biru', t = TEMA[k], l = LATAR[latar] ? latar : 'lembut';
  const st = document.documentElement.style;
  Object.keys(t.p).forEach(n => st.setProperty('--b' + n, hexRGB(t.p[n])));
  st.setProperty('--side', hexRGB(t.side));
  const main = document.getElementById('main'); if (main) main.dataset.latar = l;
  const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = t.side;

/* ---------------- IndexedDB (cache data & foto) ---------------- */
const DB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('hem-pintar', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('kv', mode); const req = fn(t.objectStore('kv'));
      t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error);
    });
  };
  return {
    get: k => tx('readonly', s => s.get(k)).catch(() => undefined),
    set: (k, v) => tx('readwrite', s => s.put(v, k)).catch(() => {}),
    del: k => tx('readwrite', s => s.delete(k)).catch(() => {}),
    clear: () => tx('readwrite', s => s.clear()).catch(() => {})
  };
})();

/* ---------------- Status sambungan ---------------- */
let pending = 0, lastErr = false;
function setSync(state, text) {
  const dot = $('#syncDot'), tx = $('#syncText'); if (!dot) return;
  const map = {
    sync: ['bg-amber-400 animate-pulse', 'Menyegerak…'],
    ok: ['bg-emerald-500', 'Tersambung'],
    offline: ['bg-rose-500', 'Luar talian'],
    error: ['bg-rose-500', 'Ralat pelayan']
  };
  const [cls, label] = map[state] || map.ok;
  dot.className = 'w-2 h-2 rounded-full ' + cls;
  tx.textContent = text || label;
}

/* ---------------- Panggilan API ---------------- */
async function api(action, payload = {}, cubaan = 0) {
  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(CONFIG.GAS_URL)) {
    throw new Error('URL Web App belum ditetapkan. Isi CONFIG.GAS_URL dalam kod frontend.');
  }
  pending++; setSync('sync');
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), CONFIG.TIMEOUT_MS);
  try {
    const res = await fetch(CONFIG.GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, token: S.token, payload }),
      signal: ctrl.signal
    });
    let j;
    try { j = await res.json(); } catch (e) { throw Object.assign(new Error('Respons pelayan tidak sah. Pastikan Web App di-deploy dengan akses "Anyone".'), { srv: true }); }
    // Pelayan sibuk (kunci tidak diperoleh): tindakan belum dijalankan, jadi selamat dicuba semula
    if (!j.ok && j.kod === 'SIBUK' && cubaan < 2) { await new Promise(r => setTimeout(r, 1500 * (cubaan + 1))); return api(action, payload, cubaan + 1); }
    if (!j.ok) {
      const e = new Error(j.ralat || 'Ralat pelayan.'); e.kod = j.kod; e.srv = true;
      if (j.kod === 'AUTH' && action !== 'login') forceLogout(e.message);
      // Pelayan menolak semua tindakan sehingga kata laluan sementara ditukar
      if (j.kod === 'TUKAR_PIN' && !document.getElementById('pinSave')) openPinModal(true, () => refreshBoot(true));
      throw e;
    }
    lastErr = false;
    return j.data;
  } catch (e) {
    lastErr = true;
    if (e.name === 'AbortError') { setSync('offline', 'Lambat / tiada talian'); throw new Error('Pelayan mengambil masa terlalu lama. Semak internet dan cuba lagi.'); }
    if (e.srv) { setSync('error'); throw e; }
    setSync('offline'); throw new Error('Tiada sambungan ke pelayan. Semak internet.');
  } finally {
    clearTimeout(timer);
    pending--;
    if (pending <= 0) { pending = 0; if (!lastErr) setSync('ok'); }
  }
}

const HAD_REHAT_MIN = 60;
let rehatTimer = null;
function tandaAktif() { try { localStorage.setItem('hem_aktif', String(Date.now())); } catch (e) { /* abaikan */ } }
function melepasiHadRehat() {
  let t = 0; try { t = Number(localStorage.getItem('hem_aktif') || 0); } catch (e) { /* abaikan */ }
  return t > 0 && Date.now() - t > HAD_REHAT_MIN * 60000;
}
const tandaAktifJarang = debounce(tandaAktif, 1000);
function mulaPemantauRehat() {
  tandaAktif();
  if (rehatTimer) return;
  ['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(ev => window.addEventListener(ev, tandaAktifJarang, { passive: true, capture: true }));
  // Disemak setiap minit; masa aktiviti dikongsi antara tab melalui localStorage
  rehatTimer = setInterval(() => {
    if (S.token && melepasiHadRehat()) forceLogout('Sesi ditamatkan kerana tiada aktiviti selama ' + HAD_REHAT_MIN + ' minit.');
  }, 60000);
}

async function doLogin(ev) {
  ev.preventDefault();
  const btn = $('#loginBtn'), err = $('#loginErr');
  err.classList.add('hidden');
  btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyemak…';
  try {
    const r = await api('login', { emel: $('#loginEmel').value.trim(), pin: $('#loginPin').value });
    S.token = r.token; localStorage.setItem('hem_token', r.token);
    await DB.clear();
    $('#loginPin').value = '';
    mulaPemantauRehat();
    // Kata laluan sementara: tukar dahulu (pelayan menolak bootstrap sehingga ditukar)
    if (r.user && r.user.tukarPin) { S.user = r.user; openPinModal(true, () => refreshBoot()); return; }
    await refreshBoot();
  } catch (e) {
    err.textContent = e.message; err.classList.remove('hidden');
  } finally {
    btn.disabled = false; btn.textContent = 'Log masuk';
  }
}

function forceLogout(msg) {
  S.token = null; localStorage.removeItem('hem_token'); DB.clear();
  try { localStorage.removeItem('hem_aktif'); } catch (e) { /* abaikan */ }
  closeAllModals(); showLogin(msg);
}
function logout() {
  if (S.token) api('logout').catch(() => {});
  forceLogout();
}

/* ---- Tapisan tahun & kelas (digunakan di semua tapisan murid) ---- */
// Susunan tahun: Pra Sekolah (0), Tahun 1–6, kemudian lain-lain (cth PPKI) di hujung
const TAHUN_KATA = { SATU: 1, DUA: 2, TIGA: 3, EMPAT: 4, LIMA: 5, ENAM: 6 };
function tahunSort(t) {
  const s = String(t || '').toUpperCase().trim();
  if (/^PRA/.test(s.replace(/[\s-]+/g, ''))) return 0;
  const m = s.match(/\d+/); if (m) return Number(m[0]);
  const w = Object.keys(TAHUN_KATA).find(k => new RegExp('\\b' + k + '\\b').test(s));
  return w ? TAHUN_KATA[w] : 99;
}
function tahunLabel(t) { const s = String(t || '').toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); }
// Label tahun seragam: "PRASEKOLAH" → "Pra Sekolah", "TAHUN 3" / "3" → "Tahun 3"
function tahunNama(t) {
  const n = tahunSort(t);
  if (n === 0) return 'Pra Sekolah';
  if (n >= 1 && n <= 6) return 'Tahun ' + n;
  return tahunLabel(t);
}
// Nama kelas tanpa awalan tahun: "3 ARIF" → "ARIF", "PRASEKOLAH ALTI" → "ALTI"
// Buang semua perkataan tahun di hadapan: "TAHUN LIMA 5 IKRAM" → "IKRAM", "PRA SEKOLAH ALTI" → "ALTI"
function namaKelasSahaja(nama) {
  const n = String(nama || '').trim();
  const kata = n.split(/\s+/);
  while (kata.length > 1 && /^(TAHUN|TINGKATAN|PRA|PRASEKOLAH|PRA-SEKOLAH|SEKOLAH|SATU|DUA|TIGA|EMPAT|LIMA|ENAM|\d+)$/i.test(kata[0])) kata.shift();
  return kata.join(' ') || n;
}
// Nama kelas ringkas untuk tajuk: "TAHUN LIMA 5 IKRAM" → "Tahun 5 IKRAM", "PRASEKOLAH ALTI" → "Pra Sekolah ALTI"
function namaKelasTajuk(k) { return k ? `${tahunNama(k.tahun)} ${namaKelasSahaja(k.nama)}`.trim() : ''; }
function senaraiTahun() {
  return Array.from(new Set(S.kelas.map(k => k.tahun).filter(Boolean))).sort((a, b) => tahunSort(a) - tahunSort(b) || a.localeCompare(b));
}
function tahunOptions(sel, semua = 'Semua tahun') {
  return `<option value="">${esc(semua)}</option>` + senaraiTahun().map(t => `<option value="${esc(t)}" ${t === sel ? 'selected' : ''}>${esc(tahunNama(t))}</option>`).join('');
}
function kelasDalamTahun(t) { return S.kelas.filter(k => !t || k.tahun === t); }
// Pastikan kelas dipilih berada dalam tahun dipilih; jika tidak, pilih kelas pertama (wajib) atau kosong (tapisan)
function selarasKelas(idKelas, tahun, wajib) {
  const k = IDX.kelas.get(idKelas);
  if (k && (!tahun || k.tahun === tahun)) return idKelas;
  if (!wajib) return '';
  const mine = (S.user.kelasSaya || []).find(id => { const x = IDX.kelas.get(id); return x && (!tahun || x.tahun === tahun); });
  return mine || (kelasDalamTahun(tahun)[0] || {}).id || '';
}
function muridLulus(m, tahun, kelas) { return (!tahun || m.tahun === tahun) && (!kelas || m.idKelas === kelas); }
const TAPIS_CLS = 'inp w-auto py-1.5 text-xs';

function kelasOptions(selected, semua, tahun) {
  // Dikumpul ikut tahun (Pra Sekolah, Tahun 1–6); setiap pilihan papar nama kelas sahaja
  const g = {};
  kelasDalamTahun(tahun).forEach(k => { (g[k.tahun] = g[k.tahun] || []).push(k); });
  const order = Object.keys(g).sort((a, b) => tahunSort(a) - tahunSort(b) || a.localeCompare(b));
  return (semua ? `<option value="">${esc(semua)}</option>` : '') + order.map(t =>
    `<optgroup label="${esc(tahunNama(t))}">${g[t].slice().sort((a, b) => namaKelasSahaja(a.nama).localeCompare(namaKelasSahaja(b.nama))).map(k =>
      `<option value="${esc(k.id)}" ${k.id === selected ? 'selected' : ''}>${esc(namaKelasSahaja(k.nama))}</option>`).join('')}</optgroup>`
  ).join('');
}

async function busy(btn, fn, label = 'Menyimpan…') {
  const html = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ${label}`; }
  try { return await fn(); }
  catch (e) { toast(e.message, 'error'); }
  finally { if (btn && document.body.contains(btn)) { btn.disabled = false; btn.innerHTML = html; } }
}

/* ---------------- Toast ---------------- */
function toast(msg, type = 'info') {
  const colors = { success: 'bg-emerald-600', error: 'bg-rose-600', info: 'bg-slate-900', warn: 'bg-amber-600' };
  const icons = { success: 'fa-circle-check', error: 'fa-triangle-exclamation', info: 'fa-circle-info', warn: 'fa-bell' };
  const el = document.createElement('div');
  el.setAttribute('role', 'status');
  el.className = `${colors[type] || colors.info} text-white px-4 py-3 rounded-2xl shadow-xl flex items-start gap-2 text-xs font-semibold pointer-events-auto max-w-sm transition-all duration-300 opacity-0 translate-y-2`;
  el.innerHTML = `<i class="fa-solid ${icons[type] || icons.info} text-sm mt-0.5"></i><span class="flex-1">${esc(msg)}</span>`;
  $('#toastRoot').appendChild(el);
  requestAnimationFrame(() => el.classList.remove('opacity-0', 'translate-y-2'));
  setTimeout(() => { el.classList.add('opacity-0'); setTimeout(() => el.remove(), 300); }, type === 'error' ? 6000 : 3500);
}

        <h4 class="font-bold text-sm">${title}</h4>
        ${locked ? '' : '<button data-close class="text-slate-400 hover:text-white p-1" aria-label="Tutup"><i class="fa-solid fa-xmark"></i></button>'}
      </div>

    </div>`;
  if (!locked) {
    wrap.addEventListener('click', e => { if (e.target === wrap || e.target.closest('[data-close]')) closeModal(); });
  }
  $('#modalRoot').appendChild(wrap);
  MODALS.push(wrap);
  hydrateFotos(wrap);
  return wrap;
}
function closeModal() { const m = MODALS.pop(); if (m) m.remove(); }
function closeAllModals() { while (MODALS.length) closeModal(); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && MODALS.length && MODALS[MODALS.length - 1].querySelector('[data-close]')) closeModal();
});

function confirmBox(msg, okLabel = 'Teruskan', danger = false) {

/* ---------------- Foto: mampat, muat naik, cache ---------------- */
const FOTO = new Map();
const fotoQ = new Set();
let fotoTimer = null;

function hydrateFotos(root) {
  (root || document).querySelectorAll('img[data-foto]').forEach(img => {
    if (img.src) return;
    const id = img.dataset.foto;
    if (FOTO.has(id)) setFoto(img, FOTO.get(id)); else fotoQ.add(id);
  });
  clearTimeout(fotoTimer);
  fotoTimer = setTimeout(flushFotos, 60);
}
function setFoto(img, url) {
  img.onload = () => img.classList.remove('opacity-0');
  img.src = url;
}
function paintFoto(id) {
  $$('img[data-foto]').forEach(img => { if (img.dataset.foto === id && !img.src) setFoto(img, FOTO.get(id)); });
}
async function flushFotos() {
  const ids = Array.from(fotoQ); fotoQ.clear();
  if (!ids.length) return;
  const miss = [];
  for (const id of ids) {
    const v = await DB.get('foto:' + id);
    if (v) { FOTO.set(id, v); paintFoto(id); } else miss.push(id);
  }
  for (let i = 0; i < miss.length; i += 20) {
    const chunk = miss.slice(i, i + 20);
    api('lihatFotoPukal', { fileIds: chunk }).then(r => {
      chunk.forEach(id => { if (r && r[id]) { FOTO.set(id, r[id]); DB.set('foto:' + id, r[id]); paintFoto(id); } });
      // Pelayan mengehadkan saiz respons; foto yang belum dihantar diminta semula
      if (r && Array.isArray(r._baki) && r._baki.length) { r._baki.forEach(id => fotoQ.add(id)); flushFotos(); }
    }).catch(() => {});
  }
}

function compressImage(file, maxDim = 1024, q = 0.8) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('Sila pilih fail gambar (JPG atau PNG).'));
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.round(img.width * s), h = Math.round(img.height * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Gambar tidak dapat dibaca. Cuba format JPG atau PNG.')); };
    img.src = url;
  });
}

async function uploadFoto(file, jenis, maxDim) {
  const dataUrl = await compressImage(file, maxDim);
  const r = await api('muatNaikFoto', { dataUrl, jenis });
  FOTO.set(r.fileId, dataUrl); DB.set('foto:' + r.fileId, dataUrl);
  return r.fileId;
}

function previewInput(input, imgSel) {
  const f = input.files && input.files[0];
  const img = document.querySelector(imgSel);
  if (!f || !img) return;
  const url = URL.createObjectURL(f);
  img.src = url; img.classList.remove('hidden');
}

async function lihatFoto(fileId) {
  const m = openModal({ title: 'Bukti bergambar', size: 'max-w-2xl', body: `<div class="flex justify-center py-6" id="fotoBox"><i class="fa-solid fa-spinner fa-spin text-2xl text-slate-400"></i></div>` });
  try {
    let url = FOTO.get(fileId) || await DB.get('foto:' + fileId);
    if (!url) { url = (await api('lihatFoto', { fileId })).dataUrl; DB.set('foto:' + fileId, url); }
    FOTO.set(fileId, url);
    m.querySelector('#fotoBox').innerHTML = `<img src="${url}" alt="Bukti" class="max-h-[70vh] rounded-xl">`;
  } catch (e) { m.querySelector('#fotoBox').innerHTML = `<p class="text-sm text-rose-600">${esc(e.message)}</p>`; }

function bindPicker(p, onPick, filterFn) {
  const q = $('#' + p + 'Q'), list = $('#' + p + 'List'), hid = $('#' + p + 'Id'), info = $('#' + p + 'Info');
  const ft = $('#' + p + 'FT'), fk = $('#' + p + 'FK');

    if (s.length < 2 && !k) { list.classList.add('hidden'); return; }
    const res = S.murid.filter(m => muridLulus(m, t, k) && (!filterFn || filterFn(m)) && (!s || m.nama.toLowerCase().includes(s) || m.id.includes(s)))
      .sort((a, b) => a.nama.localeCompare(b.nama)).slice(0, k ? 80 : 15);

  }, 120);

}

const MIN_KATA_LALUAN = 8;
function lihatKataLaluan(id, btn) {
  const i = document.getElementById(id); const tunjuk = i.type === 'password';
  i.type = tunjuk ? 'text' : 'password';
  btn.innerHTML = `<i class="fa-regular ${tunjuk ? 'fa-eye-slash' : 'fa-eye'}"></i>`;
}
function kuatKataLaluan(v) {
  let s = 0;
  if (v.length >= MIN_KATA_LALUAN) s++;
  if (v.length >= 12) s++;
  if (/[a-z]/i.test(v) && /\d/.test(v)) s++;
  if (/[^a-z0-9]/i.test(v) || (/[a-z]/.test(v) && /[A-Z]/.test(v))) s++;
  return s;
}
// selepas: dipanggil selepas kata laluan berjaya ditukar (cth muat data aplikasi selepas log masuk pertama)

        <button type="button" onclick="lihatKataLaluan('pinBaru',this)" class="absolute right-2 top-1.5 p-1 text-slate-400 hover:text-slate-700" aria-label="Papar kata laluan"><i class="fa-regular fa-eye"></i></button></div>

      <div><label class="lbl">Ulang kata laluan baharu</label><input id="pinBaru2" type="password" maxlength="64" autocomplete="new-password" class="inp"></div>`,
    footer: `${wajib ? '<button class="btn btn-ghost" onclick="logout()">Log keluar</button>' : '<button class="btn btn-ghost" data-close>Batal</button>'}<button class="btn btn-primary" id="pinSave">Simpan kata laluan</button>`
  });
  m.querySelector('#pinBaru').addEventListener('input', e => {
    const v = e.target.value, s = kuatKataLaluan(v);
    const warna = ['bg-rose-500', 'bg-amber-500', 'bg-sky-500', 'bg-emerald-500'];
    m.querySelectorAll('[data-kuat]').forEach((el, i) => { el.className = 'h-1 flex-1 rounded ' + (v && i < Math.max(s, 1) ? warna[Math.max(s, 1) - 1] : 'bg-slate-200'); });

  });
  m.querySelector('#pinSave').onclick = e => busy(e.currentTarget, async () => {

    if (selepas) await selepas(); else snapshotBoot();
  });
}

          ${bolehLihatBantuan() ? '<button onclick="go(\'bantuan\')" class="text-xs text-brand-600 hover:underline font-semibold">Urus bantuan</button>' : ''}
        </div>
        <div class="p-4 space-y-2">
          ${S.katBantuan.length ? S.katBantuan.map(k => {
            const n = (d.bantuanTahunIni || {})[k.kod] || 0;
            return `<div class="flex items-center justify-between p-2.5 bg-slate-50 rounded-xl border border-slate-100">
              <div class="flex items-center gap-2.5 min-w-0"><span class="px-2 h-7 min-w-[2.5rem] bg-brand-600 text-white rounded-lg flex items-center justify-center text-[10px] font-bold">${esc(k.kod)}</span><span class="text-xs font-semibold text-slate-700 truncate">${esc(k.nama)}</span></div>
              <span class="text-xs font-bold text-brand-700 whitespace-nowrap">${n} murid</span></div>`;
          }).join('') : emptyBox('fa-box-open', 'Belum ada skim bantuan.')}
        </div>
      </div>
    </div>
    <p class="text-[11px] text-slate-400 text-right">Dikira pada ${fmtMasa(d.dikira)}. Data dashboard dikemas kini setiap 5 minit.</p>`;

  drawDashCharts(d);
  if (AH.data && AH.data.tarikh === AH.tarikh) paintAH();
}

function drawDashCharts(d) {
  if (!window.Chart) { setTimeout(() => drawDashCharts(d), 200); return; }
  Object.values(S.charts).forEach(c => c.destroy()); S.charts = {};
  const et = d.enrolmenTahun || [];
  const c1 = $('#chEnrol');
  if (c1) S.charts.enrol = new Chart(c1, {
    type: 'bar',
    data: { labels: et.map(x => x.tahun), datasets: [
      { label: 'Lelaki', data: et.map(x => x.lelaki), backgroundColor: '#0284c7', borderRadius: 6 },
      { label: 'Perempuan', data: et.map(x => x.perempuan), backgroundColor: '#ec4899', borderRadius: 6 }] },
    options: { responsive: true, maintainAspectRatio: false, animation: false,
      onClick: (ev, els) => { if (els.length && et[els[0].index]) openEnrolmenTahun(et[els[0].index].tahun); },
      onHover: (ev, els) => { ev.native.target.style.cursor = els.length ? 'pointer' : 'default'; },
      plugins: { legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } } },
      scales: { y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#f1f5f9' } }, x: { grid: { display: false } } } }
  });
  const ss = d.kehadiranSesiMinggu || [];
  const c2 = $('#chSesi');
  if (c2) S.charts.sesi = new Chart(c2, {
    type: 'bar',
    data: { labels: ss.map(x => 'Sesi ' + x.sesi), datasets: [{ label: 'Kehadiran (%)', data: ss.map(x => x.peratus), backgroundColor: ['#0284c7', '#6366f1', '#94a3b8'], borderRadius: 8 }] },
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, animation: false,
      plugins: { legend: { display: false } }, scales: { x: { min: 0, max: 100, grid: { color: '#f1f5f9' } }, y: { grid: { display: false } } } }
  });
}

/* ---- Analisis kehadiran harian ---- */
const AH = { tarikh: '', data: null, tab: 'hari' };

async function loadAH() {
  if (!AH.tarikh) AH.tarikh = todayStr();
  const t = AH.tarikh;
  const box = $('#ahBox');
  if (box && AH.data && AH.data.tarikh !== t) box.querySelectorAll('.ahIsi').forEach(e => e.classList.add('opacity-50'));
  try {
    const d = await api('analisisKehadiran', { tarikh: t });
    if (t !== AH.tarikh) return;
    AH.data = d; paintAH();
  } catch (e) { const b = $('#ahBox'); if (b) b.innerHTML = errBox(e.message, 'loadAH()'); }
}

function warnaPeratus(p) {
  if (p == null) return 'text-slate-400';
  return p >= 95 ? 'text-emerald-600' : p >= 90 ? 'text-sky-600' : p >= 80 ? 'text-amber-600' : 'text-rose-600';
}
function telWA(t) {
  const d = String(t || '').replace(/\D/g, ''); if (d.length < 8) return '';
  return d.indexOf('60') === 0 ? d : d.indexOf('0') === 0 ? '6' + d : '60' + d;
}

function paintAH() {
  const box = $('#ahBox'); if (!box || !AH.data) return;
  const d = AH.data, dt = toDate(d.tarikh), hariIni = d.tarikh === todayStr();
  const cuti = dt.getDay() === 0 || dt.getDay() === 6;
  const sk = d.sekolah;
  const bulanLabel = `${BULAN[dt.getMonth()]} ${dt.getFullYear()}`;
  const senarai = AH.tab === 'hari' ? d.terbaikHari : d.terbaikBulan;
  const pingat = ['bg-amber-400 text-white', 'bg-slate-300 text-slate-800', 'bg-orange-300 text-orange-900'];

  box.innerHTML = `
    <div class="card p-5 space-y-5">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h4 class="font-bold text-slate-800">Analisis kehadiran harian</h4>

        </div>
        <div class="flex items-center gap-2">
          <input type="date" id="ahTarikh" value="${d.tarikh}" max="${todayStr()}" class="inp w-auto py-1.5 text-xs" aria-label="Pilih tarikh">

        <div class="bg-slate-50 rounded-2xl p-4"><p class="text-xs text-slate-500">Murid direkod</p><p class="text-lg font-bold"><span class="text-emerald-600">${sk.hadir} hadir</span> <span class="text-slate-300">/</span> <span class="text-amber-600">${sk.lewat || 0} lewat</span> <span class="text-slate-300">/</span> <span class="text-rose-600">${sk.tidakHadir} tidak</span></p></div>
        <div class="bg-slate-50 rounded-2xl p-4"><p class="text-xs text-slate-500">Kelas telah merekod</p><p class="text-lg font-bold">${sk.kelasDirekod} / ${sk.jumlahKelas} kelas</p>
          <div class="h-1.5 bg-slate-200 rounded-full mt-1.5 overflow-hidden"><div class="h-full bg-brand-600" style="width:${sk.jumlahKelas ? Math.round(sk.kelasDirekod / sk.jumlahKelas * 100) : 0}%"></div></div></div>
      </div>

      <div class="ahIsi">
        <p class="text-xs font-bold text-slate-700 mb-2">Kehadiran ikut tahun <span class="font-normal text-slate-500">(klik untuk pecahan kelas)</span></p>
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-7 gap-3">
          ${d.perTahun.map(t => `
            <button type="button" onclick="openAHTahun('${jsq(t.tahun)}')" class="text-left bg-white hover:bg-brand-50 border border-slate-200 hover:border-brand-300 rounded-2xl p-3.5 transition">
              <p class="text-xs font-bold text-slate-600">${esc(tahunLabel(t.tahun))}</p>
              <p class="text-2xl font-extrabold ${warnaPeratus(t.peratus)} mt-1">${t.peratus == null ? '—' : t.peratus + '%'}</p>
              <p class="text-[11px] text-slate-500">${t.kelasDirekod ? `${t.hadir + t.lewat} hadir${t.lewat ? ` (${t.lewat} lewat)` : ''}, ${t.tidakHadir} tidak` : 'Belum direkod'}</p>
              <div class="h-1.5 bg-slate-200 rounded-full mt-1.5 overflow-hidden"><div class="h-full ${t.kelasDirekod === t.kelas ? 'bg-emerald-500' : 'bg-amber-400'}" style="width:${Math.round(t.kelasDirekod / t.kelas * 100)}%"></div></div>
              <p class="text-[10px] text-slate-400 mt-0.5">${t.kelasDirekod}/${t.kelas} kelas direkod</p>
            </button>`).join('')}
        </div>
      </div>

      <div class="ahIsi grid grid-cols-1 lg:grid-cols-2 gap-5">
        <div class="border border-slate-200 rounded-2xl overflow-hidden">
          <div class="p-3 border-b border-slate-100 flex flex-wrap items-center justify-between gap-2">
            <p class="text-sm font-bold text-slate-800"><i class="fa-solid fa-trophy text-amber-500 mr-1"></i> Kelas kehadiran terbaik</p>
            <div class="flex bg-slate-100 p-1 rounded-xl">
              <button class="subtab ${AH.tab === 'hari' ? 'active' : ''}" onclick="AH.tab='hari';paintAH()">${hariIni ? 'Hari ini' : fmtPendek(d.tarikh)}</button>
              <button class="subtab ${AH.tab === 'bulan' ? 'active' : ''}" onclick="AH.tab='bulan';paintAH()">${hariIni ? 'Bulan ini' : bulanLabel}</button>
            </div>
          </div>
          <div class="divide-y divide-slate-100">
            ${senarai.length ? senarai.slice(0, 5).map((k, i) => `
              <div class="p-3 flex items-center gap-3">
                <span class="w-7 h-7 rounded-full ${pingat[i] || 'bg-slate-100 text-slate-600'} flex items-center justify-center text-xs font-bold shrink-0">${i + 1}</span>
                <div class="flex-1 min-w-0"><p class="text-sm font-bold text-slate-800 truncate">${esc(k.nama)}</p>
                  <p class="text-[11px] text-slate-500 truncate">${k.sesi ? 'Sesi ' + esc(k.sesi) + ', ' : ''}${esc(k.guruKelas || 'Tiada guru kelas')}</p></div>
                <div class="text-right shrink-0">
                  <p class="text-base font-extrabold ${warnaPeratus(AH.tab === 'hari' ? k.peratus : k.bulanPeratus)}">${AH.tab === 'hari' ? k.peratus : k.bulanPeratus}%</p>
                  <p class="text-[10px] text-slate-400">${AH.tab === 'hari' ? `${k.hadir + k.lewat}/${k.hadir + k.lewat + k.tidakHadir} hadir` : `${k.bulanHari} hari direkod`}</p>
                </div>
              </div>`).join('') : emptyBox('fa-chart-simple', AH.tab === 'hari' ? 'Belum ada kelas merekod kehadiran pada tarikh ini.' : 'Belum ada rekod kehadiran bulan ini.')}
          </div>
          ${AH.tab === 'bulan' && senarai.length ? `<p class="px-3 pb-3 text-[10px] text-slate-400">Purata dari 1 hingga ${dt.getDate()} ${BULAN[dt.getMonth()]}. Kelas yang lebih kerap merekod didahulukan jika peratus sama.</p>` : ''}
        </div>

        <div class="border ${d.belumIsi.length && !cuti ? 'border-rose-200' : 'border-slate-200'} rounded-2xl overflow-hidden">
          <div class="p-3 border-b border-slate-100 flex items-center justify-between gap-2">
            <p class="text-sm font-bold text-slate-800"><i class="fa-solid fa-clipboard-question text-rose-500 mr-1"></i> Belum isi kehadiran <span class="badge ${d.belumIsi.length ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'} ml-1">${d.belumIsi.length}</span></p>
            ${d.belumIsi.length ? '<button class="btn btn-ghost py-1 text-[11px]" onclick="salinBelumIsi()"><i class="fa-regular fa-copy"></i> Salin senarai</button>' : ''}
          </div>
          <div class="divide-y divide-slate-100 max-h-80 overflow-y-auto">
            ${d.belumIsi.length ? d.belumIsi.map(k => {
              const g = IDX.guru.get(k.idGuruKelas), wa = g && telWA(g.tel);
              const msg = `Assalamualaikum / Salam sejahtera ${k.guruKelas || 'Cikgu'},\n\nPeringatan mesra: kehadiran kelas ${k.nama} bagi ${fmtTarikh(d.tarikh)} belum direkod dalam ${JENAMA.namaApp}.\n\nTerima kasih.`;
              return `<div class="p-3 flex items-center gap-3">
                <div class="flex-1 min-w-0"><p class="text-sm font-bold text-slate-800">${esc(k.nama)} <span class="text-[11px] font-normal text-slate-400">${k.enrolmen} murid${k.sesi ? ', sesi ' + esc(k.sesi.toLowerCase()) : ''}</span></p>
                  <p class="text-[11px] ${k.guruKelas ? 'text-slate-500' : 'text-rose-500'} truncate">${esc(k.guruKelas || 'Tiada guru kelas ditetapkan')}</p></div>
                <div class="flex gap-1.5 shrink-0">
                  ${wa ? `<a href="https://wa.me/${wa}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener" class="btn bg-emerald-100 hover:bg-emerald-200 text-emerald-800 py-1 text-[11px]" title="Peringatan WhatsApp kepada guru kelas"><i class="fa-brands fa-whatsapp text-sm"></i> Ingatkan</a>` : ''}
                  <button class="btn btn-ghost py-1 text-[11px]" onclick="bukaKehadiran('${jsq(k.idKelas)}')">Rekod</button>
                </div>
              </div>`;
            }).join('') : emptyBox('fa-circle-check', cuti ? 'Hujung minggu, tiada kehadiran perlu direkod.' : 'Semua kelas telah merekod kehadiran. Syabas!')}
          </div>
          ${d.belumIsi.length && cuti ? '<p class="px-3 pb-3 text-[11px] text-amber-700">Tarikh ini hujung minggu; abaikan jika tiada persekolahan.</p>' : ''}
        </div>
      </div>
    </div>`;
  $('#ahTarikh').addEventListener('change', e => { AH.tarikh = e.target.value || todayStr(); loadAH(); });
}

function bukaKehadiran(idKelas) {
  closeAllModals();
  A.tarikh = AH.tarikh || todayStr(); A.idKelas = idKelas; A.tahun = ''; A.dirty = false; A.sub = 'harian';
  go('kehadiran');
}

function salinBelumIsi() {
  const d = AH.data;
  const teks = `Kelas belum isi kehadiran ${JENAMA.namaApp} (${fmtTarikh(d.tarikh)}):\n` +
    d.belumIsi.map((k, i) => `${i + 1}. ${k.nama}${k.guruKelas ? ' (' + k.guruKelas + ')' : ''}`).join('\n');
  navigator.clipboard.writeText(teks).then(() => toast('Senarai disalin. Tampal dalam kumpulan WhatsApp guru.', 'success'), () => toast('Gagal menyalin.', 'error'));
}

function openAHTahun(tahun) {
  const d = AH.data; if (!d) return;
  const m = openModal({ title: `Kehadiran ${esc(tahunLabel(tahun))}, ${fmtTarikh(d.tarikh)}`, size: 'max-w-3xl', body: '<div id="ahtBox"></div>', footer: '<button class="btn btn-ghost" data-close>Tutup</button>' });
  paintAHKelasKad(m, tahun);
}

// Paparan 1: kad setiap kelas dalam tahun
function paintAHKelasKad(m, tahun) {
  const d = AH.data, box = m.querySelector('#ahtBox'); if (!box) return;
  const ks = d.perKelas.filter(k => k.tahun === tahun);
  const t = d.perTahun.find(x => x.tahun === tahun) || {};
  box.innerHTML = `
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center">
      <div class="bg-slate-50 rounded-xl p-3"><p class="text-[11px] text-slate-500">Peratus</p><p class="text-xl font-extrabold ${warnaPeratus(t.peratus)}">${t.peratus == null ? '—' : t.peratus + '%'}</p></div>
      <div class="bg-emerald-50 rounded-xl p-3"><p class="text-[11px] text-emerald-700">Hadir</p><p class="text-xl font-extrabold text-emerald-700">${t.hadir || 0}</p></div>
      <div class="bg-amber-50 rounded-xl p-3"><p class="text-[11px] text-amber-700">Lewat</p><p class="text-xl font-extrabold text-amber-700">${t.lewat || 0}</p></div>
      <div class="bg-rose-50 rounded-xl p-3"><p class="text-[11px] text-rose-700">Tidak hadir</p><p class="text-xl font-extrabold text-rose-700">${t.tidakHadir || 0}</p></div>
    </div>
    <p class="text-xs text-slate-500">Klik kad kelas untuk melihat senarai murid tidak hadir.</p>
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
      ${ks.map(k => `
        <button type="button" data-ahk="${esc(k.idKelas)}" class="text-left rounded-2xl p-3.5 border transition ${k.direkod ? 'bg-white border-slate-200 hover:border-brand-300 hover:bg-brand-50' : 'bg-rose-50/60 border-rose-200 hover:bg-rose-50'}">
          <div class="flex items-center justify-between gap-1"><p class="text-sm font-extrabold text-slate-800 truncate">${esc(k.nama)}</p><i class="fa-solid fa-chevron-right text-[10px] text-slate-300"></i></div>
          <p class="text-[10px] text-slate-400 truncate">${k.sesi ? 'Sesi ' + esc(k.sesi) + ' · ' : ''}${esc(k.guruKelas || 'Tiada guru kelas')}</p>
          ${k.direkod ? `
            <p class="text-2xl font-extrabold ${warnaPeratus(k.peratus)} mt-1">${k.peratus}%</p>
            <div class="flex gap-2 text-[11px] font-semibold mt-0.5">
              <span class="text-emerald-700">${k.hadir} H</span><span class="text-amber-700">${k.lewat} L</span><span class="text-rose-700">${k.tidakHadir} TH</span>
            </div>` : `<p class="mt-2"><span class="badge bg-rose-100 text-rose-700">Belum direkod</span></p><p class="text-[11px] text-slate-500 mt-1">${k.enrolmen} murid</p>`}
        </button>`).join('') || '<p class="col-span-full text-sm text-slate-500">Tiada kelas.</p>'}
    </div>`;
  box.querySelectorAll('[data-ahk]').forEach(b => b.addEventListener('click', () => paintAHTidakHadir(m, tahun, b.dataset.ahk)));
}

// Paparan 2: senarai murid tidak hadir (dan lewat) bagi kelas dipilih
async function paintAHTidakHadir(m, tahun, idKelas) {
  const d = AH.data, box = m.querySelector('#ahtBox'); if (!box) return;
  const k = d.perKelas.find(x => x.idKelas === idKelas) || {};
  const atas = `
    <div class="flex items-center gap-2">
      <button type="button" id="ahBack" class="btn btn-ghost px-2.5" aria-label="Kembali"><i class="fa-solid fa-arrow-left"></i></button>
      <div class="min-w-0"><p class="text-sm font-extrabold text-slate-800">${esc(k.nama || '')}</p><p class="text-[11px] text-slate-500">${esc(k.guruKelas || 'Tiada guru kelas')}${k.sesi ? ' · Sesi ' + esc(k.sesi) : ''}</p></div>
    </div>`;
  const pasang = () => { const b = box.querySelector('#ahBack'); if (b) b.onclick = () => paintAHKelasKad(m, tahun); };
  if (!k.direkod) {
    box.innerHTML = atas + emptyBox('fa-clipboard-question', 'Kehadiran kelas ini belum direkod pada tarikh ini.',
      `<button class="btn btn-primary mt-3" onclick="bukaKehadiran('${jsq(idKelas)}')">Rekod kehadiran</button>`);
    return pasang();
  }
  box.innerHTML = atas + skel('h-12', 3, 'mb-2'); pasang();
  try {
    const r = await api('getKehadiran', { tarikh: d.tarikh, idKelas });
    if (!document.body.contains(box)) return;
    const senarai = Object.keys(r.rekod).filter(id => r.rekod[id].status !== 'Hadir')
      .map(id => ({ m: IDX.murid.get(id) || { id, nama: id, jantina: '', telPenjaga: '' }, ...r.rekod[id] }))
      .sort((a, b) => (a.status === 'Tidak Hadir' ? 0 : 1) - (b.status === 'Tidak Hadir' ? 0 : 1) || a.m.nama.localeCompare(b.m.nama));
    const th = senarai.filter(x => x.status === 'Tidak Hadir'), lw = senarai.filter(x => x.status === 'Lewat');
    const baris = x => `
      <div class="p-3 flex items-center gap-3">
        ${avatar(x.m.nama, x.m.fotoId, x.m.jantina, 'w-9 h-9', 'text-[10px]')}
        <div class="flex-1 min-w-0">
          <button type="button" class="text-sm font-bold text-slate-800 hover:text-brand-600 hover:underline text-left" onclick="openAnalisisMurid('${jsq(x.m.id)}')">${esc(x.m.nama)}</button>
          <p class="text-[11px] text-slate-500 truncate">${esc(x.sebab || 'Tiada catatan')}</p>
        </div>
        ${x.m.telPenjaga ? `<a href="https://wa.me/${esc(x.m.telPenjaga)}?text=${encodeURIComponent(`Assalamualaikum / Salam sejahtera Tuan/Puan ${x.m.namaPenjaga || 'Penjaga'},\n\nDimaklumkan bahawa ${x.m.nama} (${x.m.namaKelas}) ${x.status === 'Lewat' ? 'hadir lewat' : 'tidak hadir'} ke sekolah pada ${fmtTarikh(d.tarikh)}.\n\nTerima kasih.\n${S.tetapan.namaSekolah || ''}`)}" target="_blank" rel="noopener" class="btn bg-emerald-100 hover:bg-emerald-200 text-emerald-800 py-1 text-[11px] shrink-0"><i class="fa-brands fa-whatsapp text-sm"></i> Waris</a>` : ''}
      </div>`;
    box.innerHTML = atas + `
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="bg-emerald-50 rounded-xl p-2"><p class="text-[11px] text-emerald-700">Hadir</p><p class="text-lg font-extrabold text-emerald-700">${k.hadir}</p></div>
        <div class="bg-amber-50 rounded-xl p-2"><p class="text-[11px] text-amber-700">Lewat</p><p class="text-lg font-extrabold text-amber-700">${k.lewat}</p></div>
        <div class="bg-rose-50 rounded-xl p-2"><p class="text-[11px] text-rose-700">Tidak hadir</p><p class="text-lg font-extrabold text-rose-700">${k.tidakHadir}</p></div>
      </div>
      <div class="border border-rose-200 rounded-xl overflow-hidden">
        <p class="px-3 py-2 bg-rose-50 text-xs font-bold text-rose-800"><i class="fa-solid fa-user-xmark mr-1"></i> Tidak hadir (${th.length})</p>
        <div class="divide-y divide-slate-100">${th.length ? th.map(baris).join('') : '<p class="p-3 text-xs text-slate-500">Tiada murid tidak hadir. Syabas!</p>'}</div>
      </div>
      ${lw.length ? `<div class="border border-amber-200 rounded-xl overflow-hidden">

/* ---- Analisis enrolmen ikut tahun ---- */
function enrolmenLokal() {
  const map = {};
  S.murid.forEach(m => {
    const t = m.tahun || '-';
    const x = map[t] = map[t] || { tahun: t, L: 0, P: 0, kelas: {} };
    if (m.jantina === 'L') x.L++; else x.P++;
    const k = x.kelas[m.idKelas] = x.kelas[m.idKelas] || { id: m.idKelas, L: 0, P: 0 };
    if (m.jantina === 'L') k.L++; else k.P++;
  });
  return Object.values(map).sort((a, b) => tahunSort(a.tahun) - tahunSort(b.tahun) || a.tahun.localeCompare(b.tahun));
}

/* ---- Muat turun Excel (senarai nama & No. KP) ---- */
let xlsxJanji = null;
function muatXLSX() {
  if (window.XLSX) return Promise.resolve();
  return xlsxJanji || (xlsxJanji = new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = () => res();
    sc.onerror = () => { xlsxJanji = null; rej(new Error('Modul Excel gagal dimuat. Semak sambungan internet.')); };
    document.head.appendChild(sc);
  }));
}

function namaHelaian(n, guna) {
  let b = String(n || 'Kelas').replace(/[\[\]:*?\/\\]/g, ' ').trim().slice(0, 31) || 'Kelas', i = 2;
  while (guna.has(b)) { const tambah = ' (' + i++ + ')'; b = b.slice(0, 31 - tambah.length) + tambah; }
  guna.add(b); return b;
}

async function muatTurunSenarai(tahun, idKelas, btn) {
  await busy(btn, async () => {
    const [data] = await Promise.all([api('senaraiNamaKP', { tahun, idKelas }), muatXLSX()]);
    if (!data.length) throw new Error('Tiada kelas untuk dimuat turun.');
    const wb = XLSX.utils.book_new(), guna = new Set();
    const sekolah = S.tetapan.namaSekolah || '';
    const tarikh = fmtTarikh(todayStr());

    if (data.length > 1) {
      const ring = [[sekolah], [`RINGKASAN ENROLMEN ${tahun ? tahunLabel(tahun).toUpperCase() : 'SEMUA TAHUN'}`], [`Dicetak: ${tarikh}`], [],
        ['Bil', 'Tahun', 'Kelas', 'Sesi', 'Guru Kelas', 'Lelaki', 'Perempuan', 'Jumlah']];
      let L = 0, P = 0;
      data.forEach((k, i) => {
        const l = k.murid.filter(x => x.jantina === 'L').length, p = k.murid.length - l; L += l; P += p;
        ring.push([i + 1, tahunLabel(k.tahun), k.namaKelas, k.sesi, k.guruKelas, l, p, l + p]);
      });
      ring.push(['', '', 'JUMLAH', '', '', L, P, L + P]);
      const ws = XLSX.utils.aoa_to_sheet(ring);
      ws['!cols'] = [{ wch: 5 }, { wch: 12 }, { wch: 22 }, { wch: 8 }, { wch: 34 }, { wch: 8 }, { wch: 10 }, { wch: 8 }];
      XLSX.utils.book_append_sheet(wb, ws, namaHelaian('Ringkasan', guna));
    }

    data.forEach(k => {
      const aoa = [[sekolah], [`SENARAI MURID ${k.namaKelas}`], [`Guru kelas: ${k.guruKelas || '-'}${k.sesi ? '   |   Sesi ' + k.sesi : ''}   |   Dicetak: ${tarikh}`], [],
        ['Bil', 'Nama Murid', 'No. KP / MyKid', 'Jantina']];
      k.murid.forEach((x, i) => aoa.push([i + 1, x.nama, k.kpDibenarkan ? (x.noKP || 'Tiada') : '-', x.jantina === 'L' ? 'Lelaki' : 'Perempuan']));
      const l = k.murid.filter(x => x.jantina === 'L').length;
      aoa.push([], ['', `Lelaki: ${l}   Perempuan: ${k.murid.length - l}   Jumlah: ${k.murid.length}`]);
      if (!k.kpDibenarkan) aoa.push(['', 'No. KP hanya untuk guru kelas, guru disiplin dan PK HEM.']);
      const ws = XLSX.utils.aoa_to_sheet(aoa);   // No. KP disimpan sebagai TEKS (tidak jadi 2.5E+11 dalam Excel)
      ws['!cols'] = [{ wch: 5 }, { wch: 46 }, { wch: 16 }, { wch: 11 }];
      XLSX.utils.book_append_sheet(wb, ws, namaHelaian(k.namaKelas, guna));
    });

    const label = idKelas ? data[0].namaKelas : tahun ? tahunLabel(tahun) : 'Semua';
    XLSX.writeFile(wb, `Senarai_Murid_${label.replace(/[^A-Za-z0-9]+/g, '_')}_${todayStr()}.xlsx`);
    const tanpaKP = data.filter(k => !k.kpDibenarkan).length;
    toast(tanpaKP ? `Fail dimuat turun. No. KP tidak disertakan bagi ${tanpaKP} kelas yang bukan kelas jagaan anda.` : 'Senarai murid dimuat turun.', tanpaKP ? 'warn' : 'success');
  }, 'Menyediakan…');
}

function pasangJagaan(root, g) {
  const JG = new Set(g ? S.kelas.filter(k => k.idGuruKelas === g.id).map(k => k.id) : []);
  const asal = Array.from(JG).sort().join('|');
  const box = root.querySelector('.jgList');
  const paint = () => {
    if (!box) return;
    const t = root.querySelector('.jgTahun').value;
    const list = kelasDalamTahun(t).slice().sort((a, b) => tahunSort(a.tahun) - tahunSort(b.tahun) || a.nama.localeCompare(b.nama));
    box.innerHTML = list.length ? list.map(k => {
      const lain = k.idGuruKelas && k.idGuruKelas !== g.id;
      const kunci = lain && !can('urus_kelas_semua');
      return `<label class="flex items-center gap-3 px-3 py-2 text-xs ${kunci ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer hover:bg-slate-50'}">
        <input type="checkbox" value="${esc(k.id)}" ${JG.has(k.id) ? 'checked' : ''} ${kunci ? 'disabled' : ''} class="w-4 h-4" style="accent-color:rgb(var(--b600))">
        <span class="flex-1 min-w-0"><b class="text-slate-800">${esc(k.nama)}</b> <span class="text-slate-400">${k.sesi ? 'Sesi ' + esc(k.sesi) : ''}</span></span>
        <span class="text-[11px] ${lain ? 'text-amber-700' : 'text-slate-400'} truncate max-w-[45%]">${lain ? esc(k.namaGuruKelas) : k.idGuruKelas === g.id ? 'Kelas jagaan' : 'Tiada guru kelas'}</span>
      </label>`;
    }).join('') : '<p class="p-3 text-xs text-slate-500">Tiada kelas.</p>';
    const pilih = Array.from(JG).map(id => (IDX.kelas.get(id) || {}).nama).filter(Boolean);
    root.querySelector('.jgPilih').innerHTML = pilih.length ? 'Dipilih: <b>' + pilih.map(esc).join(', ') + '</b>' : 'Tiada kelas jagaan dipilih.';
  };
  if (box) {
    root.querySelector('.jgTahun').addEventListener('change', paint);
    box.addEventListener('change', e => {
      const cb = e.target; if (cb.type !== 'checkbox') return;
      if (cb.checked) {
        if (!can('urus_kelas_semua') && JG.size >= 2) { cb.checked = false; return toast('Maksimum 2 kelas jagaan.', 'error'); }
        JG.add(cb.value);
      } else JG.delete(cb.value);
      paint();
    });
    paint();
  }
  return {
    async simpan(namaGuru) {
      if (!box || Array.from(JG).sort().join('|') === asal) return false;
      await api('simpanKelasJagaan', { idGuru: g.id, kelas: Array.from(JG) });
      S.kelas.forEach(k => {
        if (JG.has(k.id)) { k.idGuruKelas = g.id; k.namaGuruKelas = namaGuru || g.nama; }
        else if (k.idGuruKelas === g.id) { k.idGuruKelas = ''; k.namaGuruKelas = ''; }
      });
      if (g.id === S.user.id) S.user.kelasSaya = Array.from(JG);
      refreshBoot().catch(() => {});   // muat semula akses maklumat murid kelas jagaan
      return true;
    }
  };
}

// Potong ke nisbah 3:1 (tengah) dan kecilkan ke 1500×500
function potongHeader(file) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('Sila pilih fail gambar.'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const W = 1500, H = 500, r = W / H;
      let sw = img.width, sh = img.width / r;
      if (sh > img.height) { sh = img.height; sw = sh * r; }
      const sx = (img.width - sw) / 2, sy = (img.height - sh) / 2;
      const c = document.createElement('canvas'); c.width = Math.min(W, Math.round(sw)); c.height = Math.round(c.width / r);
      c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Gambar tidak dapat dibaca.')); };
    img.src = url;
  });
}

function lihatJadualKelas(id) {
  const k = IDX.kelas.get(id); if (!k) return;
  K.id = id; K.tahun = ''; K.sub = 'waktu'; go('kelas');
}

async function padamJadualAdmin(id) {
  const semua = !id;
  if (!await confirmBox(semua ? 'Padam jadual waktu <b>semua kelas</b>? Tindakan ini tidak boleh dibatalkan.' : `Padam jadual waktu ${esc(namaKelasTajuk(IDX.kelas.get(id)))}?`, 'Padam', true)) return;
  try {
    const r = await api('padamJadualWaktu', semua ? { semua: true } : { idKelas: id });
    if (semua) S.kelas.forEach(k => DB.del('jw:' + k.id)); else DB.del('jw:' + id);
    toast(`${r.dipadam} jadual waktu dipadam.`, 'success');
    paintJadualWaktuAdmin();
  } catch (e) { toast(e.message, 'error'); }
}

async function muatPengguna(paksa) {
  if (G.list && !paksa) return G.list;
  G.list = await api('senaraiPengguna');
  return G.list;
}
function penggunaById(id) { return (G.list || []).find(x => x.id === id) || IDX.guru.get(id); }

async function putusDaftar(id, lulus, btn) {
  if (!lulus && !await confirmBox('Tolak pendaftaran ini? Akaun tidak akan diaktifkan.', 'Tolak', true)) return;
  await busy(btn, async () => {
    const r = await api('putusPendaftaran', { id, lulus });
    if (lulus) {
      simpanGuruLokal(r.guru);
      toast(`${r.guru.nama} diluluskan${r.kelasDiberi.length ? ' sebagai guru kelas' : ''}.`, 'success');
      if (r.kelasDiberi.length) refreshBoot().catch(() => {});
    } else toast('Pendaftaran ditolak.', 'info');
    loadPendaftaran(); muatPengguna(true).then(paintGuruGrid).catch(() => {});
  }, lulus ? 'Meluluskan…' : 'Menolak…');
}

    (!q || [g.nama, g.emel, g.jawatan, g.subjek, g.labelPeranan].join(' ').toLowerCase().includes(q)))
    .sort((a, b) => a.nama.localeCompare(b.nama));
  const bil = $('#guruBil'); if (bil) bil.textContent = `${semua.filter(g => g.status === 'Aktif').length} pengguna aktif${semua.some(g => g.status !== 'Aktif') ? `, ${semua.filter(g => g.status !== 'Aktif').length} tidak aktif` : ''}`;

  S.kelas.forEach(k => { if (k.idGuruKelas) (kelasGuru[k.idGuruKelas] = kelasGuru[k.idGuruKelas] || []).push(k.nama); });
  grid.innerHTML = list.length ? list.map(g => `

            <span class="badge ${g.peranan === 'guru' ? 'bg-slate-100 text-slate-600' : 'bg-violet-100 text-violet-700'}">${esc(g.labelPeranan)}</span>
            ${g.sesi ? `<span class="badge bg-amber-50 text-amber-700">${esc(g.sesi)}</span>` : ''}
            ${g.status !== 'Aktif' ? '<span class="badge bg-rose-100 text-rose-700">Tidak aktif</span>' : ''}
          </div>
          <h4 class="font-bold text-slate-800 text-sm mt-1 truncate">${esc(g.nama)}</h4>
          ${g.emel ? `<p class="text-[11px] text-slate-400 truncate">${esc(g.emel)}</p>` : ''}
          <p class="text-xs text-brand-600 font-medium truncate">${esc(g.jawatan || '-')}</p>
          ${g.subjek ? `<p class="text-[11px] text-slate-500 mt-0.5 truncate"><i class="fa-solid fa-book-open mr-1 text-slate-400"></i>${esc(g.subjek)}</p>` : ''}
          ${kelasGuru[g.id] ? `<p class="text-[11px] text-slate-500 truncate"><i class="fa-solid fa-chalkboard-user mr-1 text-slate-400"></i>Guru kelas ${esc(kelasGuru[g.id].join(', '))}</p>` : ''}

          ${g.emel ? `<a href="mailto:${esc(g.emel)}" class="p-1.5 hover:text-brand-600" title="Emel"><i class="fa-solid fa-envelope"></i></a>` : ''}
        </div>
        <button onclick="${g.id === S.user.id ? "G.sub='maklumat';go('guru')" : `openGuruModal('${esc(g.id)}')`}" class="btn btn-ghost py-1 text-[11px]"><i class="fa-solid fa-pen"></i> ${g.id === S.user.id ? 'Profil saya' : 'Edit'}</button>

    </div>`).join('') : `<div class="card md:col-span-2 xl:col-span-3">${emptyBox('fa-user-slash', 'Tiada guru sepadan dengan carian.')}</div>`;

function openGuruModal(id) {
  if (!can('urus_guru')) return;
  const g = id ? penggunaById(id) : null;
  const opt = (v, cur) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${v || '-'}</option>`;
  const peranan = [['guru', 'Guru'], ['gurubertugas', 'Guru Bertugas'], ['gurudisiplin', 'Guru Disiplin / UBK'], ['pkhem', 'PK HEM']]
    .concat(S.user.peranan === 'superadmin' ? [['superadmin', 'Super Admin']] : []);
  const m = openModal({
    title: g ? 'Kemas kini guru' : 'Tambah guru baharu', size: 'max-w-lg',
    body: `
      <div class="flex items-center gap-4">
        <div class="relative">
          ${avatar(g ? g.nama : '?', g ? g.fotoId : '', '', 'w-16 h-16', 'text-lg')}
          <img id="gFotoPrev" class="hidden absolute inset-0 w-16 h-16 rounded-full object-cover" alt="">
        </div>
        <label class="btn btn-ghost cursor-pointer"><i class="fa-solid fa-camera"></i> Tukar foto
          <input id="gFoto" type="file" accept="image/*" class="hidden" onchange="previewInput(this,'#gFotoPrev')"></label>
      </div>
      <div><label class="lbl">Nama penuh</label><input id="gNama" class="inp" value="${esc(g ? g.nama : '')}"></div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div><label class="lbl">Emel (untuk log masuk)</label><input id="gEmel" type="email" class="inp" value="${esc(g ? g.emel : '')}"></div>
        <div><label class="lbl">No. telefon</label><input id="gTel" class="inp" value="${esc(g ? g.tel : '')}" inputmode="tel"></div>
        <div><label class="lbl">Jawatan</label><input id="gJawatan" class="inp" value="${esc(g ? g.jawatan : 'Guru')}"></div>
        <div><label class="lbl">Gred</label><input id="gGred" class="inp" value="${esc(g ? g.gred : '')}" placeholder="DG41"></div>
        <div><label class="lbl">Subjek utama</label><input id="gSubjek" class="inp" value="${esc(g ? g.subjek : '')}"></div>
        <div><label class="lbl">Sesi</label><select id="gSesi" class="inp">${['', 'Pagi', 'Petang', 'Kedua-dua'].map(v => opt(v, g ? g.sesi : '')).join('')}</select></div>
        <div><label class="lbl">Peranan dalam sistem</label><select id="gPeranan" class="inp" ${g && g.peranan === 'superadmin' && S.user.peranan !== 'superadmin' ? 'disabled' : ''}>
          ${peranan.map(([v, l]) => `<option value="${v}" ${(g ? g.peranan : 'guru') === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        ${g ? `<div><label class="lbl">Status</label><select id="gStatus" class="inp"><option value="Aktif">Aktif</option><option value="Tidak Aktif" ${g.status === 'Tidak Aktif' ? 'selected' : ''}>Tidak aktif (tidak boleh log masuk)</option></select></div>` : ''}
      </div>
      ${g && can('urus_kelas_semua') ? jagaanHTML() : ''}`,
    footer: `
      ${g ? `<div class="mr-auto flex flex-wrap gap-2"><button class="btn btn-ghost" id="gReset"><i class="fa-solid fa-key"></i> Reset kata laluan</button>${g.id !== S.user.id ? '<button class="btn btn-ghost text-rose-600" id="gPadam"><i class="fa-solid fa-trash-can"></i> Padam</button>' : ''}</div>` : ''}
      <button class="btn btn-ghost" data-close>Batal</button>
      <button class="btn btn-primary" id="gSave">${g ? 'Simpan perubahan' : 'Daftar guru'}</button>`
  });
  const JGU = g ? pasangJagaan(m, g) : null;

  m.querySelector('#gSave').onclick = e => busy(e.currentTarget, async () => {
    const p = { tel: $('#gTel').value.trim(), subjek: $('#gSubjek').value.trim(), nama: $('#gNama').value.trim(), emel: $('#gEmel').value.trim(),
      jawatan: $('#gJawatan').value.trim(), gred: $('#gGred').value.trim(), sesi: $('#gSesi').value };
    if (g) p.id = g.id;
    if (!$('#gPeranan').disabled) p.peranan = $('#gPeranan').value;
    if (g && $('#gStatus')) p.status = $('#gStatus').value;
    if (!p.nama || !p.emel) throw new Error('Nama dan emel wajib diisi.');
    const f = $('#gFoto').files[0];
    if (f) p.fotoId = await uploadFoto(f, 'guru', 400);
    const r = await api('simpanGuru', p);
    if (JGU) await JGU.simpan(r.nama);
    if (p.status === 'Tidak Aktif') { S.guru = S.guru.filter(x => x.id !== r.id); reindex(); snapshotBoot(); }
    else simpanGuruLokal(r);
    if (G.list) {
      const baru = Object.assign({}, r, { status: p.status || 'Aktif' });

    } else toast('Maklumat guru disimpan.', 'success');
  });

  const pb = m.querySelector('#gPadam');

function setKelasData(d) {
  K.data = d;
  const ids = muridKelas(K.id).map(m => m.id), ada = new Set(ids);
  const pm = d.pelanMeja;
  let lajur = 6, meja = [];
  if (pm && !Array.isArray(pm) && Array.isArray(pm.meja)) { lajur = pm.lajur || 6; meja = pm.meja.map(x => ada.has(x) ? x : ''); }
  else if (Array.isArray(pm)) meja = pm.filter(x => ada.has(x));
  const guna = new Set(meja.filter(Boolean));
  const baki = ids.filter(x => !guna.has(x));
  // Isi murid yang belum ada tempat ke meja kosong
  for (let i = 0; i < meja.length && baki.length; i++) if (!meja[i]) meja[i] = baki.shift();
  meja = meja.concat(baki);
  K.lajur = Math.max(1, Math.min(12, lajur));
  K.baris = Math.max(pm && pm.baris ? pm.baris : 1, Math.ceil(meja.length / K.lajur) || 1);
  K.pelan = padMeja(meja, K.lajur * K.baris);
}
function padMeja(m, n) { const a = m.slice(0, Math.max(n, m.length)); while (a.length < n) a.push(''); return a; }

function paintKelasBody() {
  if (!K.data) return;

function ubahGrid(jenis, d) {
  const n = K.pelan.filter(Boolean).length;
  if (jenis === 'lajur') {
    const baru = Math.max(1, Math.min(12, K.lajur + d)); if (baru === K.lajur) return;
    const ms = K.pelan.filter(Boolean);   // susun semula ikut turutan bila lajur berubah
    K.lajur = baru; K.baris = Math.max(Math.ceil(n / baru), Math.min(K.baris, 15));
    K.pelan = padMeja(ms, K.lajur * K.baris);
  } else {
    const min = Math.ceil(n / K.lajur) || 1;
    const baru = Math.max(1, Math.min(15, K.baris + d));
    if (baru < min) return toast(`Sekurang-kurangnya ${min} baris diperlukan untuk ${n} murid. Rapatkan atau tambah lajur.`, 'info');
    if (baru < K.baris) {
      // Buang baris terakhir: pindahkan murid di situ ke meja kosong lain
      const keluar = K.pelan.slice(baru * K.lajur).filter(Boolean);
      K.pelan = K.pelan.slice(0, baru * K.lajur);
      for (let i = 0; i < K.pelan.length && keluar.length; i++) if (!K.pelan[i]) K.pelan[i] = keluar.shift();
    } else K.pelan = padMeja(K.pelan, baru * K.lajur);
    K.baris = baru;
  }
  K.dirty = true; K.sel = null;
  $('#pv-lajur').textContent = K.lajur; $('#pv-baris').textContent = K.baris;
  paintPelanGrid();
}

function paintPelanGrid() {

      <span class="pointer-events-none">${avatar(m.nama, m.fotoId, m.jantina, 'w-11 h-11', 'text-xs')}</span>
      <p class="font-bold text-slate-800 text-[11px] leading-tight w-full mt-1.5 line-clamp-2 pointer-events-none">${esc(namaPendek(m.nama))}</p>

}

function klikMeja(i) {
  if (K.sel === null) { if (!K.pelan[i]) return; K.sel = i; }
  else {
    if (K.sel !== i) { [K.pelan[K.sel], K.pelan[i]] = [K.pelan[i], K.pelan[K.sel]]; K.dirty = true; }
    K.sel = null;
  }
  paintPelanGrid();
}

// Seret & lepas dengan pointer (tetikus serta-merta; skrin sentuh selepas tekan lama 250ms)
function pasangSeret() {
  const g = $('#pelanGrid'); if (!g || g._seret) return; g._seret = true;
  let st = null;
  const seatDi = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest('#pelanGrid .seat'); };
  const tamat = () => {
    if (!st) return;
    clearTimeout(st.timer);
    if (st.ghost) st.ghost.remove();
    if (st.src) st.src.classList.remove('opacity-30');
    g.querySelectorAll('.seat').forEach(s => s.classList.remove('ring-2', 'ring-brand-500'));
    st = null;
  };
  const mula = () => {
    const r = st.src.getBoundingClientRect();
    st.ghost = st.src.cloneNode(true);
    Object.assign(st.ghost.style, { position: 'fixed', left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px',
      pointerEvents: 'none', zIndex: 80, transform: 'rotate(3deg) scale(1.05)', boxShadow: '0 12px 24px -8px rgba(15,23,42,.4)', opacity: '.95' });
    st.dx = st.x0 - r.left; st.dy = st.y0 - r.top;
    document.body.appendChild(st.ghost);
    st.src.classList.add('opacity-30');
    st.drag = true;
    if (navigator.vibrate) try { navigator.vibrate(15); } catch (e) { /* abaikan */ }
  };
  g.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    const info = e.target.closest('[data-info]');
    if (info) return;
    const src = e.target.closest('.seat'); if (!src) return;
    st = { src, i: Number(src.dataset.i), x0: e.clientX, y0: e.clientY, drag: false, touch: e.pointerType !== 'mouse', id: e.pointerId };
    if (st.touch && K.pelan[st.i]) st.timer = setTimeout(() => { if (st && !st.drag) mula(); }, 250);
  });
  window.addEventListener('pointermove', e => {
    if (!st || e.pointerId !== st.id) return;
    const jauh = Math.hypot(e.clientX - st.x0, e.clientY - st.y0) > 6;
    if (!st.drag) {
      if (!jauh) return;
      if (st.touch || !K.pelan[st.i]) { tamat(); return; }   // sentuhan bergerak sebelum tekan lama = tatal
      mula();
    }
    st.ghost.style.left = (e.clientX - st.dx) + 'px'; st.ghost.style.top = (e.clientY - st.dy) + 'px';
    g.querySelectorAll('.seat').forEach(s => s.classList.remove('ring-2', 'ring-brand-500'));
    const t = seatDi(e.clientX, e.clientY); if (t && t !== st.src) t.classList.add('ring-2', 'ring-brand-500');
  });
  window.addEventListener('pointerup', e => {
    if (!st || e.pointerId !== st.id) return;
    const s = st;
    if (s.drag) {
      const t = seatDi(e.clientX, e.clientY);
      tamat();
      if (t) { const j = Number(t.dataset.i); if (j !== s.i) { [K.pelan[s.i], K.pelan[j]] = [K.pelan[j], K.pelan[s.i]]; K.dirty = true; K.sel = null; paintPelanGrid(); } }
    } else { tamat(); klikMeja(s.i); }
  });
  window.addEventListener('pointercancel', tamat);
  g.addEventListener('touchmove', e => { if (st && st.drag) e.preventDefault(); }, { passive: false });
  g.addEventListener('click', e => { const info = e.target.closest('[data-info]'); if (info) { e.stopPropagation(); openProfilMurid(info.dataset.info); } });
  g.addEventListener('contextmenu', e => { if (st) e.preventDefault(); });
}

function susunPelan(cara) {
  const ms = K.pelan.filter(Boolean).map(id => IDX.murid.get(id)).filter(Boolean);
  let out;
  if (cara === 'rapat') out = ms;
  else {
    ms.sort((a, b) => a.nama.localeCompare(b.nama));
    if (cara === 'lp') {
      const L = ms.filter(m => m.jantina === 'L'), P = ms.filter(m => m.jantina !== 'L'); out = [];
      while (L.length || P.length) { if (L.length) out.push(L.shift()); if (P.length) out.push(P.shift()); }
    } else out = ms;
  }
  K.pelan = padMeja(out.map(m => m.id), K.lajur * K.baris);
  K.dirty = true; K.sel = null; paintPelanGrid();
}

async function simpanPelan(btn) {
  await busy(btn, async () => {
    const d = await api('simpanKelas', { idKelas: K.id, pelanMeja: { lajur: K.lajur, baris: K.baris, meja: K.pelan } });
    K.dirty = false; K.data = d; DB.set('kelas:' + K.id, d);
    toast('Pelan tempat duduk disimpan.', 'success');
  });
  paintPelanGrid();
}
