<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#145C43">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="e-Kurikulum">
<title>e-Kurikulum | Sistem Pengurusan Panitia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C2B39; --ink-2:#44545F; --muted:#66736D;
  --paper:#E9EEEA; --surface:#FFFFFF; --surface-2:#F4F7F4; --line:#D3DBD5;
  --green:#145C43; --green-deep:#0C3F2E; --green-soft:#DCEBE3;
  --yellow:#F2B705; --yellow-soft:#FFF4CC;
  --red:#B83A2B; --red-soft:#F9E3DF; --ok:#1E7F4F;
  --wood:#8A6A44; --wood-dark:#6E5234;
  --nav-h:66px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5;color:var(--ink);background:var(--paper);min-height:100dvh;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--green)}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.ik{flex:none;display:block}
.muted{color:var(--muted);font-size:13px}

/* ---------- Kerangka ---------- */
.app{max-width:680px;margin:0 auto;min-height:100dvh;padding-bottom:calc(var(--nav-h) + 96px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;background:var(--green);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:12px}
.t-teks{flex:1;min-width:0}
.t-sek{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar h1{font-size:19px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-av{border-radius:50%;box-shadow:0 0 0 2px var(--yellow)}
.banner{background:var(--yellow-soft);color:#6B4F00;font-size:13px;padding:8px 16px;border-bottom:1px solid #EAD38A}
main{padding:16px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:680px;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
.nav button{height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11.5px;color:var(--muted);position:relative}
.nav button[aria-current="page"]{color:var(--green);font-weight:600}
.nav button[aria-current="page"]::before{content:'';position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--yellow)}
.fab{position:fixed;z-index:31;right:max(16px,calc(50% - 340px + 16px));bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;background:var(--yellow);color:var(--ink);display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(12,63,46,.55)}
.muat-bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--yellow);z-index:100;transition:width .4s,opacity .3s;opacity:0}
.muat-bar.aktif{width:75%;opacity:1;transition:width 8s cubic-bezier(.1,.7,.2,1)}

/* ---------- Umum ---------- */
.blok{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.blok-kepala{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.blok h3,.sek-t{font-size:16px;font-weight:600}
.sek-t{margin:22px 4px 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;color:var(--ink);text-decoration:none;min-height:44px;cursor:pointer}
.btn.utama{background:var(--green);border-color:var(--green);color:#fff}
.btn.kuning{background:var(--yellow);border-color:var(--yellow)}
.btn.merah{background:var(--red);border-color:var(--red);color:#fff}
.btn.bahaya{color:var(--red);border-color:#E7C3BD}
.btn.kecil{min-height:36px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn.penuh{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);flex:none;text-decoration:none}
.ib:hover{background:var(--surface-2)}
.ib.wa{color:#128C4A}
.baris-btn{display:flex;gap:10px;flex-wrap:wrap}
.baris-btn>.btn{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--green-soft);color:var(--green);white-space:nowrap}
.chip.kp{background:var(--yellow);color:var(--ink)}
.chip.tunggu{background:var(--yellow-soft);color:#7A5A00}
.chip.merah{background:var(--red-soft);color:var(--red)}
.chip.kelabu{background:var(--surface-2);color:var(--muted)}
.kosong{text-align:center;padding:32px 20px;color:var(--ink-2)}
.kosong .ik{margin:0 auto 10px;color:var(--muted)}
.kosong p{margin-bottom:14px}
.kosong-kecil{font-size:13.5px;color:var(--ink-2);background:var(--surface-2);padding:12px;border-radius:12px}
.rangka{height:120px;border-radius:18px;background:linear-gradient(90deg,#E1E7E2 25%,#EDF1EE 50%,#E1E7E2 75%);background-size:200% 100%;animation:kilau 1.2s infinite;margin-bottom:14px}
@keyframes kilau{to{background-position:-200% 0}}

/* Avatar */
.av{--s:40px;width:var(--s);height:var(--s);border-radius:50%;position:relative;overflow:hidden;background:var(--green);color:#fff;display:inline-grid;place-items:center;flex:none;font-weight:600;font-size:calc(var(--s) * .36)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av img:not([src]){display:none}

/* ---------- Log masuk ---------- */
.auth{min-height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.auth-atas{background:var(--green);color:#fff;padding:calc(env(safe-area-inset-top) + 34px) 24px 26px;border-radius:0 0 28px 28px}
.auth-rak{display:flex;align-items:flex-end;gap:5px;height:64px;margin-bottom:18px}
.auth-rak span{width:16px;border-radius:3px 3px 1px 1px;position:relative}
.auth-rak span::after{content:'';position:absolute;left:50%;bottom:8px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:rgba(0,0,0,.25)}
.auth-rak i{display:block;height:6px;width:120px;background:var(--wood);position:absolute}
.auth-atas h1{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.auth-atas p{opacity:.85;margin-top:6px}
.auth-panel{padding:20px 20px 40px;flex:1}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:18px}
.seg button{padding:10px;border-radius:10px;font-weight:500;color:var(--ink-2)}
.seg button[aria-selected="true"]{background:var(--green);color:#fff}
.seg.tiga{grid-template-columns:repeat(3,1fr)}

/* ---------- Borang ---------- */
.borang{display:flex;flex-direction:column;gap:14px}
.medan{display:flex;flex-direction:column;gap:6px}
.medan>span{font-size:13px;font-weight:500;color:var(--ink-2)}
.medan i{font-style:normal;font-weight:400;color:var(--muted)}
.dua{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input:not([type=checkbox]):not([type=file]),select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:16px;line-height:1.4}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
input[type=file]{width:100%;font-size:14px;padding:12px;border:1.5px dashed #AFC0B5;border-radius:12px;background:var(--surface-2)}
.nota{font-size:12.5px;color:var(--muted)}
.kl-wrap{position:relative;display:block}
.kl-wrap input{padding-right:48px!important}
.kl-mata{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:42px;height:42px;display:grid;place-items:center;border:0;background:none;color:var(--muted);border-radius:10px;cursor:pointer}
.kl-mata[aria-pressed=true]{color:var(--green)}
.medan-atas{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.medan-atas>span{font-size:13px;font-weight:500;color:var(--ink-2)}
.pautan-teks{background:none;border:0;padding:4px 0;color:var(--green);font-weight:600;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.kod-input{text-align:center;letter-spacing:.5em;font-size:24px!important;font-weight:600}
.langkah{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.ralat-kotak{background:var(--red-soft);color:var(--red);padding:10px 12px;border-radius:12px;font-size:13.5px}
.ok-kotak{background:#DCEBE3;color:#145C43;padding:10px 12px;border-radius:12px;font-size:13.5px}
.subjek{border:0}
.subjek legend{font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:4px}
.sj{border:1.5px solid var(--line);border-radius:12px;margin-top:8px;background:#fff}
.sj.on{border-color:var(--green);background:#F6FBF8}
.sj-cek{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer}
.sj-cek input{width:20px;height:20px;accent-color:var(--green)}
.sj-tahun{display:none;gap:6px;padding:0 12px 12px 42px;flex-wrap:wrap}
.sj.on .sj-tahun{display:flex}
.sj-tahun::before{content:'Tahun';font-size:12px;color:var(--muted);align-self:center;margin-right:2px}
.th{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px}
.th.on{background:var(--green);border-color:var(--green);color:#fff}

/* ---------- Laman utama ---------- */
.hero{padding:6px 4px 4px}
.hero-hari{font-size:13px;color:var(--muted)}
.hero h2{font-size:24px;font-weight:600;letter-spacing:-.015em;line-height:1.25;margin-top:2px}
.hero-sub{color:var(--ink-2);margin-top:4px}
.ingat{display:flex;gap:12px;align-items:flex-start;background:var(--yellow-soft);border:1px solid #EFD98C;border-radius:16px;padding:14px;margin-top:16px}
.ingat .ik{color:#8A6500;margin-top:2px}
.ingat b{display:block;font-weight:600}
.ingat p{font-size:13.5px;color:#5E4A12}
.ingat .btn{margin-top:10px}
.senarai-p{display:flex;flex-direction:column;gap:10px}
.kp-kad{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.kp-kad:hover{border-color:#A9BDB1}
.kp-kod{width:50px;height:50px;border-radius:12px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;border-left:5px solid var(--green)}
.kp-isi{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.kp-isi b{font-weight:600;line-height:1.3}
.kp-meta{font-size:12.5px;color:var(--muted)}
.admin-kad{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--ink);color:#fff;border-radius:16px;padding:16px;margin-top:16px}
.admin-kad small{display:block;opacity:.75;font-size:12.5px}

/* ---------- Papan pemuka ---------- */
.kepala{background:var(--green-deep);color:#fff;border-radius:20px;padding:18px 18px 16px;position:relative;overflow:hidden}
.kepala::after{content:'';position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;border:14px solid rgba(242,183,5,.18)}
.kepala-atas{display:flex;align-items:center;gap:10px;margin-bottom:6px;position:relative;z-index:1}
.kepala-kod{background:var(--yellow);color:var(--ink);font-weight:700;font-size:12px;padding:3px 9px;border-radius:7px}
.kepala select{margin-left:auto;width:auto;max-width:55%;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff;padding:6px 10px;font-size:13px}
.kepala select option{color:var(--ink)}
.kepala h2{font-size:23px;font-weight:600;line-height:1.2;letter-spacing:-.01em;position:relative;z-index:1}
.kepala-kp{opacity:.85;font-size:13.5px;margin-top:4px}
.kepala-stat{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:8px;margin-top:14px}
.kepala-stat div{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 10px}
.kepala-stat dt{font-size:11.5px;opacity:.75}
.kepala-stat dd{font-size:20px;font-weight:600;line-height:1.2}
.kepala-stat dd.kecil{font-size:13.5px;font-weight:500;padding-top:4px}
.kepala .chip{position:relative;z-index:1;margin-top:12px;background:rgba(255,255,255,.14);color:#fff}

/* Rak fail — tulang fail kotak */
.rak-luar{margin:0 -16px;padding:0 0 4px}
.rak{display:flex;gap:6px;overflow-x:auto;padding:16px 16px 0;scrollbar-width:none;scroll-snap-type:x proximity}
.rak::-webkit-scrollbar{display:none}
.tulang{flex:0 0 58px;height:236px;background:var(--w);border-radius:5px 5px 2px 2px;display:flex;flex-direction:column;align-items:center;padding:8px 0 12px;color:#fff;scroll-snap-align:start;box-shadow:inset -7px 0 0 rgba(0,0,0,.13),inset 1px 0 0 rgba(255,255,255,.2);transition:transform .15s ease}
.tulang:hover,.tulang:focus-visible{transform:translateY(-7px)}
.tulang-label{background:#fff;color:var(--ink);border-radius:3px;width:42px;padding:4px 0 3px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.tulang-label b{font-size:15px;font-weight:700}
.tulang-label small{font-size:11px;color:var(--muted);height:13px;display:flex;align-items:center}
.tulang-tajuk{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;font-weight:500;line-height:1.15;flex:1;margin:10px 0;overflow:hidden;max-height:150px;text-align:left}
.tulang-lubang{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.85);background:rgba(0,0,0,.22);flex:none}
.tulang.kunci{filter:saturate(.35);opacity:.7}
.rak-papan{height:12px;margin:0 10px;background:var(--wood);border-radius:2px;box-shadow:0 4px 0 var(--wood-dark)}
.rak-tip{font-size:12px;color:var(--muted);text-align:right;margin-top:10px}
@media (min-width:660px){.tulang{flex:1 1 0}.rak-tip{display:none}}

/* Carta organisasi */
details.blok>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
details.blok>summary::-webkit-details-marker{display:none}
details.blok>summary .ik{transition:transform .2s}
details[open].blok>summary .ik{transform:rotate(90deg)}
.carta-alat{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.carta-nota{font-size:12.5px;color:var(--ink-2);background:var(--yellow-soft);padding:10px 12px;border-radius:12px;margin-top:8px}
.carta{padding:4px 0 6px}
.tahap{position:relative;padding:12px 0 14px}
.tahap+.tahap::before{content:'';position:absolute;top:-4px;left:50%;width:2px;height:16px;margin-left:-1px;background:var(--green)}
.tahap-label{display:flex;align-items:center;gap:8px;justify-content:center;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.tahap-no{width:20px;height:20px;border-radius:50%;background:var(--green-soft);color:var(--green);font-weight:600;font-size:11px;display:grid;place-items:center}
.tahap-nod{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;min-height:44px;border-radius:14px}
.nod{width:124px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 8px 10px;text-align:center;position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;user-select:none;-webkit-user-select:none}
.tahap[data-tahap="1"] .nod,.tahap[data-tahap="2"] .nod{background:#fff}
.tahap[data-tahap="3"] .nod{border-color:var(--green);background:var(--green-soft)}
.nod-nama{font-size:12.5px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nod-jaw{font-size:11px;color:var(--muted);line-height:1.3}
.nod-kosong{font-size:12.5px;color:var(--muted);align-self:center;padding:8px}
.edit .tahap-drop{border:2px dashed #AFC0B5;padding:10px;background:rgba(244,247,244,.7)}
.edit .tahap-drop .nod-kosong{pointer-events:none}
.grip,.nod-ubah{position:absolute;top:3px;width:30px;height:30px;display:grid;place-items:center;color:var(--ink-2);border-radius:9px}
.grip{left:3px;touch-action:none;cursor:grab;background:#fff;border:1px solid var(--line)}
.nod-ubah{right:3px}
.nod.seret{opacity:.3}
.hantu{position:fixed;z-index:200;pointer-events:none;transform:rotate(-2deg) scale(1.05);box-shadow:0 14px 30px -8px rgba(0,0,0,.4);margin:0}

/* Senarai ahli, log, semakan */
.ahli{list-style:none;display:flex;flex-direction:column}
.ahli li{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line);padding:6px 0}
.ahli li:first-child{border-top:0}
.ahli-btn{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;padding:4px 0}
.ahli-btn span{display:flex;flex-direction:column;min-width:0}
.ahli-btn b{font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ahli-btn small{font-size:12px;color:var(--muted)}
.calon-senarai{max-height:46dvh;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:0 12px}
.calon{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.calon:first-child{border-top:0}
.calon input{width:22px;height:22px;accent-color:var(--green);flex:none}
.calon .isi{flex:1;min-width:0;display:flex;flex-direction:column}
.calon b{font-weight:500;font-size:14.5px}
.calon small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tahun-semua{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ib.foto{cursor:pointer}
.antri{position:fixed;z-index:32;left:max(16px,calc(50% - 340px + 16px));bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;border-radius:999px;padding:9px 14px 9px 10px;display:flex;align-items:center;gap:8px;font-size:13px;box-shadow:0 10px 24px -8px rgba(0,0,0,.4)}
.pusing.kecil{width:16px;height:16px;border-width:2px}
.antri .pusing{border-color:rgba(255,255,255,.25);border-top-color:var(--yellow)}
.fail.menunggu{opacity:.8;border-style:dashed}
.fail.menunggu .fail-meta{display:flex;align-items:center;gap:6px}
.jw-atas{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.jw-ringkas b{font-size:24px;font-weight:600;letter-spacing:-.01em}
.jw-ringkas span{color:var(--ink-2);font-size:13.5px}
.jw-padan{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.5}
.jw-padan .ik{display:inline-block;vertical-align:-2px;margin-right:4px;color:var(--ok)}
.jw-padan button{color:var(--green);font-size:12px;font-weight:500;text-decoration:underline}
.jw-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pil{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px}
.pil button{padding:6px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink-2)}
.pil button[aria-pressed="true"]{background:var(--green);color:#fff}
.jw-hari{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none;padding-bottom:2px}
.jw-hari::-webkit-scrollbar{display:none}
.jw-hari button{flex:1 0 auto;min-width:58px;padding:8px 6px 6px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:1px}
.jw-hari button small{font-weight:400;color:var(--muted);font-size:11px}
.jw-hari button[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.jw-hari button i{width:5px;height:5px;border-radius:50%;background:transparent;margin-top:2px}
.jw-hari button.hariini i{background:var(--yellow)}
.jw-senarai{list-style:none;display:flex;flex-direction:column;gap:6px}
.jw-senarai li{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface-2);border-left:4px solid var(--c)}
.jw-senarai .masa{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;line-height:1.3}
.jw-senarai .masa b{display:block;font-size:13.5px;color:var(--ink);font-weight:600}
.jw-senarai .isi b{font-weight:600;font-size:14px;display:block}
.jw-senarai .isi small{font-size:12px;color:var(--muted)}
.jw-senarai li.kini{background:var(--yellow-soft);box-shadow:inset 0 0 0 2px var(--yellow)}
.jw-senarai li.kini .isi small::after{content:' • Sedang berlangsung';color:#7A5A00;font-weight:500}
.jw-senarai li.kosong-slot{background:none;border-left-color:transparent;padding:2px 12px;font-size:12px;color:var(--muted);grid-template-columns:70px 1fr}
.jw-minggu-luar{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.jw-minggu{border-collapse:collapse;font-size:11px;min-width:440px;width:100%;table-layout:fixed}
.jw-minggu col.m{width:54px}
.jw-minggu th,.jw-minggu td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:5px 4px;text-align:center;vertical-align:top}
.jw-minggu thead th{background:var(--surface-2);font-size:11.5px;font-weight:600;position:sticky;top:0}
.jw-minggu th.m{font-size:10.5px;line-height:1.25;font-weight:500;color:var(--ink-2);position:sticky;left:0;background:#fff;z-index:1;font-variant-numeric:tabular-nums}
.jw-minggu td.ada{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--c)}
.jw-minggu td.ada b{display:block;font-weight:600;font-size:11px;line-height:1.2}
.jw-minggu td.ada small{color:var(--muted);font-size:10.5px}
.jw-lampiran{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.jw-lampiran summary{cursor:pointer;font-size:13px;color:var(--ink-2);font-weight:500;list-style:none;display:flex;align-items:center;gap:6px}
.jw-lampiran summary::-webkit-details-marker{display:none}
.jw-lampiran[open] summary{margin-bottom:10px}
.pentadbir-foto{display:flex;align-items:center;gap:12px;margin-top:4px}
.pentadbir-foto .btn{min-height:36px}
.pentadbir-foto small{font-size:12px;color:var(--muted);flex:1}
.mohon li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #EFD98C;flex-wrap:wrap}
.mohon li:first-child{border-top:0}
.mohon .isi{flex:1;min-width:140px;display:flex;flex-direction:column}
.mohon small{color:var(--muted);font-size:12px}
.blok.amaran{background:var(--yellow-soft);border-color:#EFD98C}
.log{list-style:none}
.log li{display:grid;grid-template-columns:10px 1fr;gap:10px;padding:8px 0}
.log li::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--green);margin-top:7px;box-shadow:0 0 0 3px var(--green-soft)}
.log b{font-weight:500}
.log small{display:block;color:var(--muted);font-size:12px}
.tugasan-senarai{list-style:none;margin-bottom:12px}
.tugasan-senarai li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.tugasan-senarai li:first-child{border-top:0}
.tg-no{width:26px;height:26px;border-radius:8px;background:var(--surface-2);font-size:12px;font-weight:600;display:grid;place-items:center;flex:none}
.tg-isi{flex:1;min-width:0;display:flex;flex-direction:column}
.tg-isi b{font-weight:500;font-size:14px}
.tg-isi small{font-size:12px;color:var(--muted)}
.tg-kira{font-size:13px;font-weight:600;color:var(--green)}
.jadual-skrol{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.semak{border-collapse:collapse;width:100%;font-size:13px}
.semak th,.semak td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.semak th:first-child,.semak td:first-child{text-align:left;position:sticky;left:0;background:#fff;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.semak thead th{background:var(--surface-2);font-weight:600;font-size:12px}
.semak tr:last-child td{border-bottom:0}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle}
.dot.ok{background:var(--ok)}
.dot.belum{background:var(--red)}
.legend{font-size:12px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.legend .dot{width:10px;height:10px}
.pemantau-senarai{list-style:none;margin-top:10px}
.pemantau-senarai li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.pemantau-senarai .isi{flex:1;min-width:0}
.pemantau-senarai small{display:block;color:var(--muted);font-size:12px}

/* ---------- Folder & fail ---------- */
.folder-senarai{display:flex;flex-direction:column;gap:8px}
.folder-baris{display:flex;align-items:stretch;gap:0;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.folder-baris .tl{width:46px;background:var(--w);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px;flex:none}
.folder-baris .tl i{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.85)}
.folder-baris .isi{flex:1;min-width:0;padding:12px 12px;display:flex;flex-direction:column}
.folder-baris b{font-weight:600}
.folder-baris small{font-size:12.5px;color:var(--muted)}
.folder-baris .kira{align-self:center;padding-right:12px;display:flex;align-items:center;gap:4px;color:var(--ink-2);font-size:13px;font-weight:600}
.folder-baris.kunci{opacity:.6}
.folder-kepala{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.folder-kepala .tl{width:10px;align-self:stretch;border-radius:5px;background:var(--w)}
.folder-kepala h2{font-size:20px;font-weight:600;line-height:1.25}
.folder-kepala p{font-size:13px;color:var(--muted)}
.cari{position:relative;margin:4px 0 12px}
.cari .ik{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.cari input{padding-left:40px!important}
.fail{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.fail-ikon{width:46px;height:54px;border-radius:6px 12px 6px 6px;background:var(--c);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;flex:none}
.fail-isi{flex:1;min-width:0}
.fail-isi h4{font-size:14.5px;font-weight:600;line-height:1.3;word-break:break-word}
.fail-isi p{font-size:13px;color:var(--ink-2);margin-top:2px}
.fail-isi .fail-meta{font-size:12px;color:var(--muted)}
.fail-aksi{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.fail-aksi .btn{min-height:34px;padding:5px 10px;font-size:12.5px;border-radius:9px;gap:5px}

/* ---------- Profil ---------- */
.profil-kad{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 16px 18px;text-align:center}
.profil-foto{position:relative;width:max-content;margin:0 auto 12px}
.profil-foto .av{box-shadow:0 0 0 4px #fff,0 0 0 7px var(--yellow)}
.foto-ubah{position:absolute;right:-4px;bottom:-4px;width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;border:3px solid #fff;cursor:pointer}
.profil-kad h2{font-size:20px;font-weight:600;line-height:1.25}
.profil-kad>p{color:var(--ink-2);font-size:14px}
.hubungi{display:flex;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.hb{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);text-decoration:none;color:var(--ink);font-size:13.5px;font-weight:500}
.hb-wa{background:#E3F6EA;border-color:#B6E2C6;color:#0F6B38}
dl.info{display:grid;grid-template-columns:1fr;gap:0}
dl.info div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line)}
dl.info div:first-child{border-top:0}
dl.info dt{color:var(--muted);font-size:13.5px}
dl.info dd{font-weight:500;text-align:right;font-size:14px;word-break:break-word}
.menu-senarai{display:flex;flex-direction:column}
.menu-senarai button,.menu-senarai a{display:flex;align-items:center;gap:12px;padding:13px 2px;border-top:1px solid var(--line);text-align:left;width:100%;text-decoration:none;color:var(--ink)}
.menu-senarai>:first-child{border-top:0}
.menu-senarai span{flex:1}
.menu-senarai .merah{color:var(--red)}

/* ---------- Sheet, toast, zoom ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:60}
.sheet-bg{position:absolute;inset:0;background:rgba(14,30,24,.5);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:680px;max-height:92dvh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom));transition:transform .26s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sheet-wrap.buka .sheet{transform:translate(-50%,0)}
.sheet-wrap.buka .sheet-bg{opacity:1}
.sheet.penuh{height:94dvh;display:flex;flex-direction:column}
.sheet-handle{width:42px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 14px}
.sheet-t{font-size:18px;font-weight:600;margin-bottom:6px}
.sheet-p{color:var(--ink-2);margin-bottom:16px}
.pilihan{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.pilihan button{display:flex;gap:14px;align-items:flex-start;text-align:left;padding:14px;border:1.5px solid var(--line);border-radius:14px}
.pilihan button:hover{border-color:var(--green)}
.pilihan .ik{color:var(--green);margin-top:2px}
.pilihan b{display:block;font-weight:600}
.pilihan small{color:var(--muted);font-size:12.5px}
.prev-kepala{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.prev-kepala h3{flex:1;font-size:16px;font-weight:600;line-height:1.3}
.prev-badan{flex:1;min-height:0;border-radius:14px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;border:1px solid var(--line)}
.prev-badan iframe{width:100%;height:100%;border:0;background:#fff}
.prev-img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}
.prev-tiada{text-align:center;padding:30px;color:var(--ink-2)}
.prev-tiada .ik{margin:0 auto 10px;color:var(--muted)}
.prev-aksi{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.prev-aksi .btn{flex:1;min-width:120px}
.slot-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{aspect-ratio:4/3;border:1.5px dashed #AFC0B5;border-radius:12px;background:var(--surface-2) center/cover no-repeat;display:grid;place-items:center;cursor:pointer;font-size:12.5px;color:var(--muted)}
.slot span{display:flex;flex-direction:column;align-items:center;gap:4px}
.slot.ada{border-style:solid;border-color:var(--green)}
.slot.ada span{display:none}
.rahsia{background:var(--ink);color:#fff;border-radius:14px;padding:14px;font-size:13.5px;word-break:break-all}
.rahsia b{display:block;font-size:26px;letter-spacing:.12em;margin:4px 0}
.rahsia small{opacity:.7}
.toast-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 86px + env(safe-area-inset-bottom));z-index:120;display:flex;flex-direction:column;gap:8px;width:min(92vw,440px);pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;box-shadow:0 10px 24px -8px rgba(0,0,0,.4);transition:opacity .3s,transform .3s}
.toast.ralat{background:var(--red)}
.toast.pergi{opacity:0;transform:translateY(8px)}
.sibuk{position:fixed;inset:0;z-index:150;background:rgba(14,30,24,.45);display:grid;place-items:center;padding:24px}
.sibuk-kad{background:#fff;border-radius:18px;padding:22px 24px;display:flex;align-items:center;gap:14px;max-width:320px}
.pusing{width:26px;height:26px;border-radius:50%;border:3px solid var(--green-soft);border-top-color:var(--green);animation:pusing .8s linear infinite;flex:none}
@keyframes pusing{to{transform:rotate(360deg)}}
.zoom{position:fixed;inset:0;z-index:170;background:#0E1A15;display:grid;place-items:center;overflow:hidden;touch-action:none}
.zoom img{max-width:100vw;max-height:100dvh;transform-origin:center;touch-action:none;user-select:none;-webkit-user-drag:none}
.zoom-tutup{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:12px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;z-index:2}
.zoom-tip{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 16px);left:0;right:0;text-align:center;color:rgba(255,255,255,.7);font-size:12.5px}
.admin-baris{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.admin-baris:first-child{border-top:0}
.admin-baris .isi{flex:1;min-width:0;display:flex;flex-direction:column}
.admin-baris small{font-size:12px;color:var(--muted)}
.admin-baris button.isi{text-align:left}
body.mod-pemantau .app{padding-bottom:40px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
@media print{.nav,.fab,.topbar,.carta-alat{display:none!important}}

/* ---------- Laporan Aktiviti (OPR) ---------- */
:root{--carta:#13875A}
.lap-kepala{background:var(--green-deep);color:#fff;border-radius:20px;padding:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.lap-kepala small{opacity:.75;font-size:12.5px}
.lap-kepala h2{font-size:22px;margin:2px 0 4px}
.lap-kepala p{font-size:13px;opacity:.8}
.lap-penapis{display:flex;gap:8px;margin-bottom:12px}
.lap-penapis select{flex:1;min-width:0}
.lap-senarai{display:grid;gap:10px}
@media(min-width:720px){.lap-senarai{grid-template-columns:1fr 1fr}}
.lap-kad{display:flex;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;width:100%;align-items:flex-start}
.lap-kad:hover{border-color:var(--green)}
.lap-kad.menunggu{opacity:.75}
.lap-gambar{flex:none;width:96px;aspect-ratio:4/3;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;color:var(--muted)}
.lap-gambar img{width:100%;height:100%;object-fit:cover}
.lap-gambar.kecil{width:60px}
.lap-isi{display:flex;flex-direction:column;gap:3px;min-width:0}
.lap-isi b{font-size:14.5px;line-height:1.3}
.lap-isi small{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:4px}
.lap-isi .chip{align-self:flex-start}
.lap-isi .lap-oleh{color:var(--muted)}
.lap-mini{list-style:none;display:grid;gap:4px}
.lap-mini button{display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:6px;border-radius:12px}
.lap-mini button:hover{background:var(--surface-2)}
.lap-mini b{display:block;font-size:14px;line-height:1.3}
.lap-mini small{font-size:12px;color:var(--muted)}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat-kad{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat-kad b{display:block;font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat-kad span{font-size:12.5px;color:var(--ink-2)}
.stat-kad small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.carta-bar{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:2px;height:160px;align-items:end;border-bottom:1px solid var(--line)}
.cb-kol{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.cb-bar{width:min(72%,30px);background:var(--carta);border-radius:4px 4px 0 0;display:block}
.cb-nilai{font-size:11.5px;color:var(--ink-2);margin-bottom:3px;font-variant-numeric:tabular-nums}
.cb-paksi{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:2px;margin-top:5px}
.cb-paksi span{font-size:11px;color:var(--muted);text-align:center}
.hbar{list-style:none;display:grid;gap:9px}
.hbar li{display:grid;grid-template-columns:minmax(90px,36%) 1fr 30px;align-items:center;gap:8px;font-size:13px}
.hbar.ahli-bar li{grid-template-columns:30px minmax(80px,32%) 1fr 30px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.hb-trek{height:12px;display:block}
.hb-bar{display:block;height:100%;background:var(--carta);border-radius:0 4px 4px 0;min-width:2px}
.hb-bar.sifar{background:var(--line);min-width:3px}
.hbar li>b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.tip{position:fixed;z-index:300;background:var(--ink);color:#fff;font-size:12.5px;padding:6px 9px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .12s;max-width:240px}
.tip.on{opacity:1}
.jadual-data{margin-top:12px;font-size:13px}
.jadual-data summary{cursor:pointer;color:var(--green);font-weight:500}
.jadual-data table{margin-top:8px;width:100%}
.opr{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:12px}
.opr header{background:var(--green);color:#fff;text-align:center;padding:12px}
.opr header small{display:block;font-size:11.5px;letter-spacing:.04em;opacity:.85}
.opr header b{display:block;font-size:16px;margin:2px 0}
.opr header span{font-size:11px;letter-spacing:.18em;color:var(--yellow);font-weight:600}
.opr-info{display:grid;grid-template-columns:1fr 1fr}
.opr-info>div{border-bottom:1px solid var(--line);padding:9px 12px;min-width:0}
.opr-info>div:nth-child(odd):not(.penuh){border-right:1px solid var(--line)}
.opr-info .penuh{grid-column:1/-1}
.opr-info dt{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--green)}
.opr-info dd{font-size:14px;margin-top:2px;line-height:1.5;overflow-wrap:anywhere}
.opr-foto{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.opr-foto figure{margin:0}
.opr-foto img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:var(--surface-2);cursor:zoom-in;display:block}
.opr-foto figcaption{font-size:11px;font-weight:600;color:var(--green);text-align:center;margin-top:3px}
.opr-oleh{padding:0 12px 14px}
.opr-oleh small{display:block;font-size:11px;font-weight:600;color:var(--green);letter-spacing:.06em;text-transform:uppercase}
.opr-badan{overflow:auto}
#oprAksi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
#oprAksi .btn{white-space:nowrap;min-width:0}
#oprAksi .btn.utama{grid-column:1/-1}
.slot-opr{position:relative}
.slot-buang{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:rgba(28,43,57,.82);color:#fff;display:grid;place-items:center}
.slot-buang[hidden]{display:none}

/* ---------- e-Kurikulum Fasa 1 ---------- */
.seg.empat{grid-template-columns:repeat(4,1fr)}
.seg.empat button{padding:9px 2px;font-size:13px}
.sub-panitia select{margin-bottom:10px}
.sub-panitia .seg{margin-bottom:14px}
.tugas-saya,.notis{list-style:none;display:grid;gap:10px}

const tarikhPendek = x => { const d = new Date(x); return isNaN(d) ? String(x || '') : d.toLocaleDateString('ms-MY', { day: 'numeric', month: 'short', year: 'numeric' }); };

/** Terjemah halaman ralat HTML Google kepada punca sebenar */
function diagnosisHTML(t) {
  const teks = String(t || '').replace(/<style[\s\S]*?<\/style>|<script[\s\S]*?<\/script>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  if (/authori[sz]|kebenaran|permission|izin/i.test(teks)) return 'Pelayan memerlukan kebenaran baharu. Pemilik skrip perlu buka editor Apps Script, jalankan ujiJadual() atau setupSistem(), klik benarkan, kemudian Manage deployments > Edit > New version.';
  if (/sign in|log masuk|accounts\.google/i.test(teks)) return 'Web App meminta log masuk Google. Tukar "Who has access" kepada "Anyone" dan "Execute as" kepada "Me", kemudian deploy New version.';
  if (/not found|tidak dijumpai|could not be found|404/i.test(teks)) return 'URL Web App tidak dijumpai. Semak API_URL dalam index.html sama dengan URL deployment terkini.';
  if (/exceeded|melebihi|timed? ?out/i.test(teks)) return 'Pelayan mengambil masa terlalu lama. Cuba lagi sebentar.';
  return 'Pelayan memulangkan jawapan tidak sah' + (teks ? ': "' + teks.slice(0, 140) + '"' : '.') + ' Semak tetapan Web App (Execute as "Me", Who has access "Anyone").';
}

function call(action, data = {}, opt = {}) {

    p = new Promise((res, rej) => google.script.run
      .withSuccessHandler(res)
      .withFailureHandler(e => { const er = new Error('Pelayan tidak dapat dihubungi. ' + ((e && e.message) || '')); er.offline = !navigator.onLine; rej(er); })
      .api(body));
  } else if (!API_URL || API_URL.startsWith('TAMPAL')) {
    p = Promise.reject(new Error('API_URL belum diisi dalam index.html.'));
  } else {
    const ctl = window.AbortController ? new AbortController() : null;
    const tamat = ctl ? setTimeout(() => ctl.abort(), opt.masa || 120000) : null;
    p = fetch(API_URL, { method: 'POST', body: JSON.stringify(body), signal: ctl ? ctl.signal : undefined })
      .then(r => r.text())
      .then(t => {
        try { return JSON.parse(t); }
        catch (e) { throw new Error(diagnosisHTML(t)); }
      })
      .catch(e => {
        if (e && e.name === 'AbortError') { const er = new Error('Pelayan mengambil masa terlalu lama dan tidak dapat dihubungi. Cuba lagi.'); er.offline = !navigator.onLine; er.sibuk = true; throw er; }
        if (e instanceof TypeError) { const er = new Error('Tiada sambungan internet atau pelayan tidak dapat dihubungi.'); er.offline = true; throw er; }
        throw e;
      })
      .finally(() => { if (tamat) clearTimeout(tamat); });
  }
  return p.then(r => {
    if (!r || !r.ok) {
      const msg = (r && r.error) || 'Ralat tidak diketahui.';
      if (msg === 'SESI_TAMAT') { tamatSesi(); throw new Error('Sesi anda telah tamat. Sila log masuk semula.'); }
      if (/^PELAYAN_SIBUK/.test(msg)) { const er = new Error(msg.replace(/^PELAYAN_SIBUK:\s*/, '')); er.sibuk = true; throw er; }
      throw new Error(msg);
    }
    return r.data;
  }).finally(() => { if (!opt.senyap) muatTamat(); });
}

/* ---------- Cache gambar (IndexedDB + proksi Apps Script) ---------- */
const IMG = {};
const IMG_TUNGGU = {};
const idb = (() => {
  let p = null;
  const open = () => p || (p = new Promise((res, rej) => {
    try {
      const r = indexedDB.open('epanitia', 2);
      r.onupgradeneeded = () => { const db = r.result; ['img', 'data'].forEach(n => { if (!db.objectStoreNames.contains(n)) db.createObjectStore(n); }); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  }));
  const tx = (st, mode, fn) => open().then(db => new Promise(res => {
    const t = db.transaction(st, mode); const q = fn(t.objectStore(st));
    t.oncomplete = () => res(q && q.result); t.onerror = () => res(undefined); t.onabort = () => res(undefined);
  })).catch(() => undefined);
  return {
    get: (k, st = 'img') => tx(st, 'readonly', s => s.get(k)),
    set: (k, v, st = 'img') => tx(st, 'readwrite', s => s.put(v, k)),
    del: (k, st = 'img') => tx(st, 'readwrite', s => s.delete(k)),
    kosong: st => tx(st, 'readwrite', s => s.clear()),
    semua: st => open().then(db => new Promise(res => {
      const out = {}; const t = db.transaction(st, 'readonly'); const c = t.objectStore(st).openCursor();
      c.onsuccess = () => { const cur = c.result; if (cur) { out[cur.key] = cur.value; cur.continue(); } };
      t.oncomplete = () => res(out); t.onerror = () => res(out);
    })).catch(() => ({}))
  };
})();
/** Pangkalan data tempatan: dibaca sekali ke memori semasa buka (IndexedDB), ditulis tanpa menyekat skrin */
const store = {
  mem: {},
  async muat() {
    const d = await idb.semua('data');
    if (!Object.keys(d).length) { // pindah data lama dari localStorage
      Object.keys(localStorage).filter(k => /^ep_(init|d_|jw_)/.test(k)).forEach(k => { const v = ls.get(k); if (v != null) { d[k] = v; idb.set(k, v, 'data'); } ls.del(k); });
    }
    this.mem = d;
  },
  get(k) { return this.mem[k] === undefined ? null : this.mem[k]; },
  set(k, v) { this.mem[k] = v; idb.set(k, v, 'data'); },
  del(k) { delete this.mem[k]; idb.del(k, 'data'); },
  kosong() { this.mem = {}; return idb.kosong('data'); }
};
async function muatImej(ids) {
  ids = [...new Set(ids.filter(Boolean))];
  const belum = ids.filter(id => !IMG[id]);
  const dariIdb = await Promise.all(belum.map(id => idb.get(id)));
  const perlu = [];
  belum.forEach((id, i) => { if (dariIdb[i]) IMG[id] = dariIdb[i]; else if (!IMG_TUNGGU[id]) perlu.push(id); });
  const kump = [];
  for (let i = 0; i < perlu.length; i += 20) kump.push(perlu.slice(i, i + 20));
  kump.flat().forEach(id => { IMG_TUNGGU[id] = 1; });
  // Maksimum 2 permintaan serentak supaya tidak menyekat panggilan lain ke pelayan
  const pekerja = async () => {
    while (kump.length) {
      const k = kump.shift();
      try {
        const r = await call('imej', { ids: k, pemantau: S.pemantau || undefined }, { senyap: true });
        Object.keys(r).forEach(x => { IMG[x] = r[x]; idb.set(x, r[x]); });
        $$('img[data-img]:not([src])').forEach(el => { if (IMG[el.dataset.img]) el.src = IMG[el.dataset.img]; }); // papar sebaik tiba
      } catch (e) { /* inisial dipaparkan */ }
      finally { k.forEach(id => delete IMG_TUNGGU[id]); }
    }
  };
  await Promise.all([pekerja(), pekerja()]);
}
async function hydrateImgs(root = document) {
  const els = $$('img[data-img]:not([src])', root);
  if (!els.length) return;
  await muatImej(els.map(e => e.dataset.img));
  $$('img[data-img]:not([src])').forEach(el => { if (IMG[el.dataset.img]) el.src = IMG[el.dataset.img]; });
}

const bacaFail = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(f); });
function gambarKe(file, w, h, q = 0.8) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const sr = img.width / img.height, dr = w / h;
      let sw, sh, sx, sy;
      if (sr > dr) { sh = img.height; sw = sh * dr; sx = (img.width - sw) / 2; sy = 0; }
      else { sw = img.width; sh = sw / dr; sx = 0; sy = (img.height - sh) / 2; }
      const x = c.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
      x.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => rej(new Error('Gambar tidak dapat dibaca. Cuba format JPEG atau PNG.'));
    img.src = URL.createObjectURL(file);
  });
}
function gambarMaks(file, maks = 2400, q = 0.85) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, maks / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
      x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => rej(new Error('Gambar tidak dapat dibaca.'));
    img.src = URL.createObjectURL(file);
  });
}
function simpanFail(b64, mime, nama) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([arr], { type: mime }));
  const a = document.createElement('a');
  a.href = url; a.download = nama || 'fail'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

/* ---------- Cache memori + ninja fetch ---------- */
const MEM = {};       // cache memori butiran panitia (paling laju)
const INFLIGHT = {};  // elak permintaan berganda serentak
const SEGAR_MS = 300000; // panitia sendiri dikemas kini oleh sync berkala
const tandatangan = d => { try { return JSON.stringify(Object.assign({}, d, { dimuat: 0 })); } catch (e) { return Math.random(); } };
function simpanLS(id) {
  const d = MEM[id]; if (!d) return;
  store.set('ep_d_' + id, Object.assign({}, d, {
    fail: d.fail.filter(f => !f._pending),
    laporan: (d.laporan || []).filter(r => !String(r.id).startsWith('tmp_')).map(r => r._pending ? Object.assign({}, r, { _pending: false }) : r)
  }));
}
function simpanDetail(d) {
  const id = d.panitia.id;
  const pending = ((MEM[id] && MEM[id].fail) || []).filter(f => f._pending);
  if (pending.length) d.fail = pending.concat(d.fail);
  const lapTmp = ((MEM[id] && MEM[id].laporan) || []).filter(r => String(r.id).startsWith('tmp_'));
  if (lapTmp.length) d.laporan = lapTmp.concat(d.laporan || []);
  MEM[id] = d; S.masaMuat[id] = Date.now();
  if (S.panitiaId === id) S.detail = d;
  simpanLS(id);
  return d;
}
function detailTempatan(id) {
  if (MEM[id]) return MEM[id];
  const c = store.get('ep_d_' + id);
  if (c && c.panitia && c.panitia.id === id) { MEM[id] = c; return c; }
  return null;
}
async function muatDetail(id, paksa, senyap) {
  if (!paksa && MEM[id] && Date.now() - (S.masaMuat[id] || 0) < SEGAR_MS) { if (S.panitiaId === id) S.detail = MEM[id]; return MEM[id]; }
  if (INFLIGHT[id]) return INFLIGHT[id];
  INFLIGHT[id] = call('panitiaDetail', { id }, { senyap: senyap || !!MEM[id] })
    .then(simpanDetail)
    .finally(() => { delete INFLIGHT[id]; });
  return INFLIGHT[id];
}
/* ---------- SYNC: satu panggilan, ETag, berkala ---------- */
let SYNC_JALAN = false;
async function sync() {
  if (!S.token || SYNC_JALAN || OUTBOX_JALAN || outbox().length) return; // outbox akan membawa data terkini sendiri
  SYNC_JALAN = true;
  try {
    const r = await call('sync', { etag: store.get('ep_etag') || '', aktif: S.panitiaId }, { senyap: true });
    terimaSync(r);
    setLuar(false);
  } catch (e) { if (e.offline) setLuar(true); }
  finally { SYNC_JALAN = false; }
}
/** Terima pakej sync. paksa = guna walaupun ada perubahan tempatan belum dihantar */
function terimaSync(r, paksa) {
  if (!r) return false;
  if (r.sama) { Object.keys(MEM).forEach(k => { S.masaMuat[k] = Date.now(); }); return false; }
  if (!paksa && (OUTBOX_JALAN || outbox().length)) return false; // jangan tindih perubahan optimistik
  const sebelum = tandatangan(S.data) + (S.detail ? tandatangan(S.detail) : '') + tandatangan(S.kur);
  if (r.kur) { S.kur = r.kur; store.set('ep_kur', r.kur); }
  setInit(r.init);
  Object.keys(r.detail || {}).forEach(id => simpanDetail(r.detail[id]));
  store.set('ep_etag', r.etag);
  const ids = [];
  Object.keys(r.detail || {}).forEach(id => r.detail[id].ahli.forEach(a => ids.push(a.fotoId)));
  muatImej(ids);
  const selepas = tandatangan(S.data) + (S.detail ? tandatangan(S.detail) : '') + tandatangan(S.kur);
  if (sebelum !== selepas && !S.cartaEdit && !S.pemantau && S.tab !== 'admin') render();
  return true;
}
let syncTimer = null;
function mulaSyncBerkala() {
  if (syncTimer) return;
  syncTimer = setInterval(() => { if (document.visibilityState === 'visible') { hantarOutbox(); sync(); } }, 45000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { hantarOutbox(); sync(); } });
}

/* ---------- OUTBOX: simpan serta-merta, hantar di latar dalam satu batch ---------- */
const OB = 'ep_outbox';
const ADMIN_OPS = ['simpanPanitia', 'padamPanitia', 'lantikKP', 'kemaskiniPengguna', 'simpanTetapan', 'luluskanPengguna'];
const bilMenunggu = () => (S.adm && S.adm.pengguna ? S.adm.pengguna.filter(u => u.status === 'MENUNGGU').length : 0);
let OUTBOX_JALAN = false, obTimer = null, obCuba = 0;
const outbox = () => (store.get(OB) || []).filter(o => S.user && o.u === S.user.id);
function antri(action, data, label) {
  const q = store.get(OB) || [];
  q.push({ id: 'op_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8), u: S.user.id, action, data, label, t: Date.now() });
  store.set(OB, q);
  paparAntri();
  clearTimeout(obTimer);
  obTimer = setTimeout(hantarOutbox, 300); // kumpul beberapa perubahan dalam satu permintaan
}
function buangOp(pred) { store.set(OB, (store.get(OB) || []).filter(o => !pred(o))); paparAntri(); }
async function hantarOutbox() {
  if (OUTBOX_JALAN || !S.token || !S.user) return;
  const q = outbox();
  if (!q.length) return;
  if (!navigator.onLine) { paparAntri(); return; }
  OUTBOX_JALAN = true; paparAntri();
  const kump = q.slice(0, 25);
  const ids = new Set(kump.map(o => o.id));
  try {
    const r = await call('batch', { ops: kump.map(o => ({ id: o.id, action: o.action, data: o.data })), aktif: S.panitiaId }, { senyap: true });
    const ulang = new Set((r.hasil || []).filter(x => !x.ok && /^PELAYAN_SIBUK/.test(x.error || '')).map(x => x.id));
    buangOp(o => ids.has(o.id) && !ulang.has(o.id));
    obCuba = ulang.size ? obCuba + 1 : 0;
    (r.hasil || []).filter(x => !x.ok && !ulang.has(x.id)).forEach(x => { const o = kump.find(k => k.id === x.id); toast(`${o ? o.label : 'Perubahan'} gagal: ${x.error}`, 'ralat'); });
    OUTBOX_JALAN = false;
    if (ulang.size) setTimeout(hantarOutbox, Math.min(30000, 2000 * Math.pow(2, obCuba)));
    else if (outbox().length) hantarOutbox();
    else {
      terimaSync(r.sync, true); // keadaan sebenar pelayan (membetulkan perubahan yang gagal)
      if (kump.some(o => ADMIN_OPS.includes(o.action))) { admMasa = 0; if (S.tab === 'admin') muatAdmin(true); }
    }
  } catch (e) {
    OUTBOX_JALAN = false;
    if (e.offline || e.sibuk || /sambungan|internet|dihubungi/i.test(e.message)) {
      obCuba++; setLuar(true);
      setTimeout(hantarOutbox, Math.min(30000, 2000 * Math.pow(2, obCuba)));
    } else {
      buangOp(o => ids.has(o.id));
      toast('Perubahan gagal disimpan: ' + e.message, 'ralat');
      store.set('ep_etag', ''); sync();
    }
  } finally { paparAntri(); }
}
function renderSemasa() {
  if (S.pemantau || S.cartaEdit || !S.detail) return;
  if (S.tab === 'dash' || S.tab === 'ahli') renderDash(); else if (S.tab === 'folder') renderFolder(); else if (S.tab === 'laporan') renderLaporan();
  hydrateImgs();

function kemasKiraan(pid) {
  const d = MEM[pid], p = S.data && S.data.panitia.find(x => x.id === pid);
  if (!d || !p) return;
  const aktif = d.fail.filter(f => !f._pending);

/* ---------- Muat naik latar belakang (tidak menyekat skrin) ---------- */
const ANTRI = { n: 0 };
function paparAntri() {
  const n = ANTRI.n + outbox().length;
  let el = $('#antri');
  if (!n || !S.token) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'antri'; el.className = 'antri'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.innerHTML = navigator.onLine ? `<span class="pusing kecil"></span>Menyimpan ${n} perubahan…` : `${ic('refresh', 16)}${n} perubahan menunggu internet`;
}
function pemegangTempat(pid, no, meta) {
  return Object.assign({
    id: 'tmp_' + Date.now() + Math.random().toString(36).slice(2, 7), panitiaId: pid, folderNo: Number(no),
    pemilikId: S.user.id, pemilikNama: S.user.nama, dicipta: new Date().toISOString(), status: 'AKTIF', _pending: true
  }, meta);
}
async function kerjaLatar(pid, ph, pekerja, mesejOk) {
  ANTRI.n++;
  const d = MEM[pid];
  if (d) d.fail.unshift(ph);
  paparAntri(); renderSemasa();
  try {
    const rec = await pekerja();
    const dd = MEM[pid];
    if (dd) { const i = dd.fail.findIndex(f => f.id === ph.id); if (i >= 0) dd.fail[i] = rec; else dd.fail.unshift(rec); }
    simpanLS(pid); kemasKiraan(pid);
    toast(mesejOk);
  } catch (e) {
    const dd = MEM[pid];
    if (dd) dd.fail = dd.fail.filter(f => f.id !== ph.id);
    toast(`Gagal: ${ph.tajuk}. ${e.message}`, 'ralat');
  } finally {
    ANTRI.n--; paparAntri(); renderSemasa();
  }
}

/** Mampatkan gambar besar sebelum dihantar — gambar telefon 4–8MB jadi ~0.5MB */
async function sediakanFail(file) {
  if (/^image\/(jpeg|png|webp)$/.test(file.type) && file.size > 1.2 * 1048576) {
    const data = await gambarMaks(file, 2000, 0.82);
    return { data, mime: 'image/jpeg', nama: file.name.replace(/\.[^.]+$/, '') + '.jpg', saiz: Math.round(data.length * 0.75) };
  }
  if (file.size > MAKS_MB * 1048576) throw new Error(`Saiz fail melebihi ${MAKS_MB}MB. Muat naik ke Drive dan tampal pautannya.`);
  return { data: await bacaFail(file), mime: file.type || 'application/octet-stream', nama: file.name, saiz: file.size };
}

/* Seret-dan-lepas mesra sentuhan (Pointer Events) */
function aktifSeret(root) {
  let drag = null;
  const kemasKosong = () => $$('.tahap-drop', root).forEach(z => { const k = $('.nod-kosong', z); if (k) k.hidden = !!$('.nod', z); });
  const gerak = e => {
    if (!drag) return;
    e.preventDefault();
    drag.hantu.style.left = (e.clientX - drag.dx) + 'px';
    drag.hantu.style.top = (e.clientY - drag.dy) + 'px';
    if (e.clientY < 90) window.scrollBy(0, -12); else if (e.clientY > innerHeight - 110) window.scrollBy(0, 12);
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const zon = el && el.closest('.tahap-drop');
    if (!zon || !root.contains(zon)) return;
    const atas = el.closest('.nod');
    if (atas && atas !== drag.nod && zon.contains(atas)) {
      const r = atas.getBoundingClientRect();
      const selepas = (e.clientX - r.left) > r.width / 2;
      zon.insertBefore(drag.nod, selepas ? atas.nextSibling : atas);
    } else if (!atas && drag.nod.parentElement !== zon) {
      zon.insertBefore(drag.nod, $('.nod-kosong', zon));
    }
    kemasKosong();
  };
  const lepas = () => {
    if (!drag) return;
    const zon = drag.nod.closest('.tahap-drop');
    const t = zon ? Number(zon.dataset.tahap) : 5;
    const id = drag.nod.dataset.user;
    let j = S.cartaJaw[id] || drag.nod.dataset.jaw;
    if (t === 4 && j === 'Ahli Panitia') j = 'Setiausaha Panitia';
    if (t === 5 && j === 'Setiausaha Panitia') j = 'Ahli Panitia';
    S.cartaJaw[id] = j; drag.nod.dataset.jaw = j; $('.nod-jaw', drag.nod).textContent = j;
    drag.hantu.remove(); drag.nod.classList.remove('seret');
    document.removeEventListener('pointermove', gerak);
    drag = null;
  };
  root.addEventListener('pointerdown', e => {
    const g = e.target.closest('.grip');
    if (!g) return;
    const nod = g.closest('.nod');
    e.preventDefault();
    const r = nod.getBoundingClientRect();
    const hantu = nod.cloneNode(true);
    hantu.classList.add('hantu');
    Object.assign(hantu.style, { width: r.width + 'px', left: r.left + 'px', top: r.top + 'px' });
    document.body.appendChild(hantu);
    nod.classList.add('seret');
    drag = { nod, hantu, dx: e.clientX - r.left, dy: e.clientY - r.top };
    document.addEventListener('pointermove', gerak, { passive: false });
    document.addEventListener('pointerup', lepas, { once: true });
    document.addEventListener('pointercancel', lepas, { once: true });
  });
}

function bungkus(x, t, maxW, maxL) {
  const kata = String(t || '').split(/\s+/); const out = []; let cur = '';
  kata.forEach(k => { const cuba = cur ? cur + ' ' + k : k; if (x.measureText(cuba).width <= maxW) cur = cuba; else { if (cur) out.push(cur); cur = k; } });
  if (cur) out.push(cur);
  if (out.length > maxL) { const o = out.slice(0, maxL); o[maxL - 1] = o[maxL - 1].replace(/.{0,2}$/, '') + '…'; return o; }
  return out;
}
function kadKanvas(x, X, Y, w, h, n, im, utama) {
  x.fillStyle = utama ? '#DCEBE3' : '#F4F7F4'; x.strokeStyle = utama ? '#145C43' : '#D3DBD5'; x.lineWidth = 2;
  x.beginPath(); if (x.roundRect) x.roundRect(X, Y, w, h, 18); else x.rect(X, Y, w, h); x.fill(); x.stroke();
  const cx = X + w / 2, cy = Y + 80, r = 56;
  x.save(); x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.closePath(); x.clip();
  if (im) { const s = Math.min(im.width, im.height); x.drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, cx - r, cy - r, r * 2, r * 2); }
  else { x.fillStyle = '#145C43'; x.fillRect(cx - r, cy - r, r * 2, r * 2); x.fillStyle = '#fff'; x.font = '600 36px Lexend, sans-serif'; x.fillText(inisial(n.nama), cx, cy + 12); }
  x.restore();
  x.fillStyle = '#1C2B39'; x.font = '600 20px Lexend, sans-serif';
  const bn = bungkus(x, n.nama, w - 24, 2);
  bn.forEach((l, i) => x.fillText(l, cx, Y + 170 + i * 25));
  x.fillStyle = '#44545F'; x.font = '400 16px Lexend, sans-serif';
  bungkus(x, n.jawatanCarta, w - 24, 2).forEach((l, i) => x.fillText(l, cx, Y + 172 + bn.length * 25 + 8 + i * 20));
}
async function eksportPng() {
  const d = S.detail;
  sibuk('Menyediakan PNG carta…');
  try {
    const L = cartaLevels(d);
    const ids = L.flatMap(l => l.nod.map(n => n.fotoId)).filter(Boolean);

    try { await document.fonts.ready; } catch (e) { /* */ }
    const imgs = {};
    await Promise.all(ids.map(id => new Promise(r => { if (!IMG[id]) return r(); const im = new Image(); im.onload = () => { imgs[id] = im; r(); }; im.onerror = () => r(); im.src = IMG[id]; })));
    const W = 1600, cw = 250, ch = 272, gx = 26, gy = 26, per = 5, M = 70;
    const baris = L.map(l => Math.max(1, Math.ceil(l.nod.length / per)));
    let H = M + 170; L.forEach((l, i) => { H += 56 + baris[i] * (ch + gy) + 24; }); H += 60;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
    x.fillStyle = '#145C43'; x.fillRect(0, 0, W, 14);
    x.textAlign = 'center';
    x.fillStyle = '#1C2B39'; x.font = '600 26px Lexend, sans-serif'; x.fillText(d.sekolah || '', W / 2, M + 20);
    x.font = '700 44px Lexend, sans-serif'; x.fillText('Carta Organisasi Panitia ' + d.panitia.nama, W / 2, M + 80);
    x.font = '400 24px Lexend, sans-serif'; x.fillStyle = '#44545F'; x.fillText('Tahun ' + new Date().getFullYear(), W / 2, M + 120);
    let y = M + 170;
    L.forEach((l, i) => {
      x.fillStyle = '#145C43'; x.font = '600 22px Lexend, sans-serif'; x.fillText(`Tahap ${l.tahap}: ${l.label}`, W / 2, y + 26); y += 56;
      if (!l.nod.length) { x.fillStyle = '#66736D'; x.font = '400 20px Lexend, sans-serif'; x.fillText(l.kosong.replace(/^Seret.*/, 'Belum dilantik'), W / 2, y + ch / 2); }
      for (let r = 0; r < baris[i]; r++) {
        const row = l.nod.slice(r * per, (r + 1) * per);
        let sx = (W - (row.length * cw + (row.length - 1) * gx)) / 2;
        row.forEach(n => { kadKanvas(x, sx, y, cw, ch, n, imgs[n.fotoId], l.tahap === 3); sx += cw + gx; });
        y += ch + gy;
      }
      if (i < L.length - 1) { x.strokeStyle = '#145C43'; x.lineWidth = 3; x.beginPath(); x.moveTo(W / 2, y - gy + 4); x.lineTo(W / 2, y + 22); x.stroke(); }
      y += 24;
    });
    x.fillStyle = '#66736D'; x.font = '400 18px Lexend, sans-serif';
    x.fillText('Dijana melalui e-Kurikulum pada ' + new Date().toLocaleDateString('ms-MY'), W / 2, H - 28);
    simpanFail(c.toDataURL('image/png').split(',')[1], 'image/png', `Carta Organisasi Panitia ${d.panitia.nama}.png`);
    toast('PNG carta dimuat turun');
  } catch (e) { toast('PNG gagal dijana: ' + e.message, 'ralat'); } finally { sibuk(false); }
}

function jenisFail(f) {

  if (/pdf/.test(m)) return ['PDF', '#B83A2B'];

function paparZoom(src) {
  const w = document.createElement('div');
  w.className = 'zoom';
  w.innerHTML = `<button class="zoom-tutup" data-act="tutupZoom" aria-label="Tutup">${ic('x', 22)}</button><img src="${src}" alt="Paparan zum"><p class="zoom-tip">Cubit dengan dua jari untuk zum. Ketik dua kali untuk set semula.</p>`;
  document.body.appendChild(w);
  const img = $('img', w);
  let sc = 1, tx = 0, ty = 0, d0 = 0, s0 = 1, akhir = null, ketik = 0;
  const pts = new Map();
  const guna = () => { img.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`; };
  img.addEventListener('pointerdown', e => {
    img.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) { const [a, b] = [...pts.values()]; d0 = Math.hypot(a.x - b.x, a.y - b.y); s0 = sc; }
    akhir = { x: e.clientX, y: e.clientY };
    const t = Date.now(); if (t - ketik < 300) { sc = 1; tx = ty = 0; guna(); } ketik = t;
  });
  img.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) { const [a, b] = [...pts.values()]; sc = Math.min(6, Math.max(1, s0 * Math.hypot(a.x - b.x, a.y - b.y) / (d0 || 1))); }
    else if (sc > 1 && akhir) { tx += e.clientX - akhir.x; ty += e.clientY - akhir.y; }
    akhir = { x: e.clientX, y: e.clientY };
    guna();
  });
  const naik = e => { pts.delete(e.pointerId); akhir = pts.size ? [...pts.values()][0] : null; };
  img.addEventListener('pointerup', naik); img.addEventListener('pointercancel', naik);
  w.addEventListener('wheel', e => { e.preventDefault(); sc = Math.min(6, Math.max(1, sc * (e.deltaY < 0 ? 1.12 : 0.9))); guna(); }, { passive: false });
}

/* ---------- Jadual waktu guru (dari Google Sheet CSV) ---------- */
const HARI_JW = ['ISNIN', 'SELASA', 'RABU', 'KHAMIS', 'JUMAAT', 'SABTU', 'AHAD'];
const HARI_PENDEK = { ISNIN: 'Isn', SELASA: 'Sel', RABU: 'Rab', KHAMIS: 'Kha', JUMAAT: 'Jum', SABTU: 'Sab', AHAD: 'Ahd' };
const JWDATA = {}, JWUI = {};
const minit = t => { const m = String(t || '').match(/(\d{1,2}):(\d{2})/); return m ? Number(m[1]) * 60 + Number(m[2]) : 0; };
const julatMasa = masa => { const [a, b] = String(masa || '').split('-'); return [minit(a), minit(b)]; };
const hariIni = () => ['AHAD', 'ISNIN', 'SELASA', 'RABU', 'KHAMIS', 'JUMAAT', 'SABTU'][new Date().getDay()];
const tajukSubjek = s => String(s || '').toLowerCase().split(' ').map(w => w.length <= 3 ? w.toUpperCase() : w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
function warnaSubjek(s) { let x = 0; for (const c of String(s)) x = (x * 31 + c.charCodeAt(0)) >>> 0; return FOLDERS[x % FOLDERS.length].warna; }
function jwSlot(d) {
  // Gabung baris sama (hari + masa + subjek) dan susun ikut masa
  const peta = {};
  (d.slot || []).forEach(s => {
    const o = { sesi: s[0] || 'sesi', hari: s[1], period: Number(s[2]) || 0, masa: s[3], kelas: s[4], subjek: s[5] };
    const k = o.sesi + '|' + o.hari + '|' + o.masa + '|' + o.subjek;
    if (peta[k]) { if (o.kelas && !peta[k].kelas.includes(o.kelas)) peta[k].kelas.push(o.kelas); }
    else peta[k] = Object.assign(o, { kelas: o.kelas ? [o.kelas] : [], m: julatMasa(o.masa) });
  });
  return Object.values(peta).sort((a, b) => a.m[0] - b.m[0]);
}
function jadualHTML(key) {
  const d = JWDATA[key];
  if (!d) return '<p class="muted">Memuatkan jadual waktu…</p>';
  if (d._ralat) return `<p class="ralat-kotak">${esc(d._ralat)}</p><button class="btn kecil" style="margin-top:10px" data-act="jwCubaLagi" data-key="${key}">${ic('refresh', 16)}Cuba lagi</button>`;
  if (d.tiadaSumber) return '<p class="kosong-kecil">Pentadbir sistem belum menetapkan pautan jadual waktu sekolah.</p>';
  const ui = JWUI[key] || (JWUI[key] = {});
  if (!d.padan || ui.pilih) {
    if (!d.bolehPilih) return '<p class="kosong-kecil">Jadual waktu guru ini tidak dijumpai dalam jadual sekolah.</p>';
    return `<p class="kosong-kecil" style="margin-bottom:10px">${d.padan ? 'Pilih nama anda seperti yang tertulis dalam jadual waktu sekolah.' : 'Nama anda tidak dijumpai secara automatik dalam jadual waktu sekolah. Pilih nama anda seperti yang tertulis dalam jadual.'}</p>
      <label class="medan"><span>Nama dalam jadual waktu</span><select id="jwPilih-${key}"><option value="">— Pilih nama —</option>${(d.calon || []).map(n => `<option ${n === d.namaJadual ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></label>
      <div class="baris-btn" style="margin-top:10px"><button class="btn utama" data-act="jwSimpanNama" data-key="${key}">Guna nama ini</button>${d.padan ? `<button class="btn" data-act="jwBatalPilih" data-key="${key}">Batal</button>` : ''}</div>`;
  }
  const semua = jwSlot(d);
  const sesiAda = [...new Set(semua.map(s => s.sesi))].sort();
  if (!ui.sesi || !sesiAda.includes(ui.sesi)) {
    const kini = new Date().getHours() * 60 + new Date().getMinutes();
    ui.sesi = sesiAda.length > 1 ? (kini < 12 * 60 + 50 && sesiAda.includes('pagi') ? 'pagi' : (sesiAda.includes('petang') ? 'petang' : sesiAda[0])) : sesiAda[0];
  }
  const sl = semua.filter(s => s.sesi === ui.sesi);
  const hariAda = HARI_JW.filter(h => sl.some(s => s.hari === h));
  if (!ui.hari || !hariAda.includes(ui.hari)) ui.hari = hariAda.includes(hariIni()) ? hariIni() : hariAda[0];
  ui.mod = ui.mod || 'hari';
  const jumMinit = semua.reduce((t, s) => t + Math.max(0, s.m[1] - s.m[0]), 0);
  const jam = Math.round(jumMinit / 6) / 10;
  const kiniMinit = new Date().getHours() * 60 + new Date().getMinutes();
  let badan = '';
  if (ui.mod === 'hari') {
    const hariSl = sl.filter(s => s.hari === ui.hari);
    const baris = [];
    hariSl.forEach((s, i) => {
      if (i > 0 && s.m[0] - hariSl[i - 1].m[1] >= 30) baris.push(`<li class="kosong-slot"><span>${esc(hariSl[i - 1].masa.split('-')[1] || '')}</span><span>Tiada kelas, ${s.m[0] - hariSl[i - 1].m[1]} minit</span></li>`);
      const kini = ui.hari === hariIni() && kiniMinit >= s.m[0] && kiniMinit < s.m[1];

    <p class="jw-padan">${ic('check', 14)}Dipadankan dengan "${esc(d.namaJadual)}"${d.padan === 'hampir' ? ' (padanan hampir)' : ''}${d.bolehPilih ? ` <button data-act="jwTukarNama" data-key="${key}">Bukan nama saya?</button>` : ''}</p>

function lukisJadual(key) { $$(`[data-jw="${key}"]`).forEach(el => { el.innerHTML = jadualHTML(key); }); }
async function muatJadual(key, userId, opt = {}) {
  if (!JWDATA[key]) { const c = store.get('ep_jw_' + key); if (c) JWDATA[key] = c; }
  lukisJadual(key);
  try {
    const d = await call('jadualGuru', Object.assign({ userId }, opt), { senyap: true });
    JWDATA[key] = d;
    store.set('ep_jw_' + key, d);
    lukisJadual(key);
    return d;
  } catch (e) {
    if (!JWDATA[key]) { JWDATA[key] = { _ralat: e.message }; lukisJadual(key); }
    else if (opt.segar) toast(e.message, 'ralat');
  }
}

/* Data pentadbiran: cache IndexedDB + ETag + satu permintaan sahaja pada satu masa */
let ADM_JALAN = null, admMasa = 0;
function setAdm(r) { S.adm = r; admMasa = Date.now(); store.set('ep_adm', r); }
function muatAdmin(paksa) {
  if (!S.user || S.user.peranan !== 'SUPER_ADMIN') return Promise.resolve(null);
  if (ADM_JALAN) return ADM_JALAN;
  if (!paksa && S.adm && Date.now() - admMasa < 30000) return Promise.resolve(S.adm);
  const ada = !!S.adm;
  ADM_JALAN = call('senaraiPengguna', { etagAdm: (ada && S.adm.etag) || '' }, { senyap: ada })
    .then(r => {
      if (r.sama) { admMasa = Date.now(); return S.adm; }
      const lama = ada ? tandatangan(S.adm) : '';
      setAdm(r);
      if (S.tab === 'admin' && tandatangan(r) !== lama) renderAdmin();
      return r;
    })
    .catch(e => {
      if (!ada && S.tab === 'admin') $('#main').innerHTML = `<div class="blok">${kosongHTML('x', esc(e.message))}<div class="baris-btn"><button class="btn utama" data-act="keAdmin">Cuba lagi</button></div></div>`;
      else if (!e.offline) toast(e.message, 'ralat');
    })
    .finally(() => { ADM_JALAN = null; });
  return ADM_JALAN;
}

function pautanPemantau(kod) {
  const asas = DI_GAS() ? (S.data && S.data.urlApp) || '' : location.origin + location.pathname;
  return asas + (asas.includes('?') ? '&' : '?') + 'pemantau=' + kod;
}

/* ---------- Penghantaran borang ---------- */
const SUB = {

  },
  hantarMuatNaik: f => {
    const file = f.fail.files[0];

    const pid = S.panitiaId, no = Number(f.folderNo.value);

      const d = await call('pemantauData', Object.assign({ catat: true }, cred));

      $('#auth').innerHTML = '';

    } catch (e) { toast(e.message, 'ralat'); } finally { sibuk(false); }

  hantarProfil: f => {
    const profil = {};
    ['nama', 'noKP', 'telefon', 'emel', 'jawatan', 'opsyen', 'gred', 'kelulusan', 'pengalaman'].forEach(k => { profil[k] = f[k].value.trim(); });
    if (profil.nama.length < 3) return toast('Isi nama penuh.', 'ralat');
    if (!/^\d{12}$/.test(profil.noKP.replace(/\D/g, ''))) return toast('No. Kad Pengenalan mesti 12 digit.', 'ralat');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(profil.emel)) return toast('Format emel tidak sah.', 'ralat');
    const subjek = bacaSubjek(f);
    Object.assign(S.user, profil, { noKP: profil.noKP.replace(/\D/g, ''), emel: profil.emel.toLowerCase() });
    S.data.subjek = subjek.map(s => { const lama = S.data.subjek.find(x => x.panitiaId === s.panitiaId); return { panitiaId: s.panitiaId, tahun: s.tahun, status: lama ? lama.status : (S.user.peranan === 'SUPER_ADMIN' ? 'SAH' : 'MENUNGGU') }; });

    tutupSheet(); render(); toast('Profil disimpan');
    antri('kemaskiniProfil', { profil, subjek }, 'Kemas kini profil');

  hantarTambahAhli: f => {
    const userIds = $$('input[name=uid]:checked', f).map(x => x.value);

    const tahun = $$('#tahunSemua .th.on', f).map(b => b.textContent).join(',');
    const pid = S.panitiaId, d = MEM[pid] || S.detail;
    userIds.forEach(id => {
      const c = (S.calon || []).find(x => x.id === id); if (!c || d.ahli.some(a => a.id === id)) return;
      d.ahli.push({ id, nama: c.nama, emel: c.emel, opsyen: c.opsyen, fotoId: c.fotoId, tahun, jawatan: '' });
      d.carta.push({ userId: id, tahap: 5, susunan: 999, jawatan: 'Ahli Panitia' });

  hantarPanitia: f => {

    if (S.adm.panitia.some(p => p.nama.toLowerCase() === nama.toLowerCase() && p.id !== id)) return toast('Panitia dengan nama ini sudah wujud.', 'ralat');

  },
  hantarLantikKP: f => {

    if (p.setiausahaId === p.ketuaId) p.setiausahaId = '';

    store.set('ep_adm', S.adm);
    antri('lantikKP', { panitiaId: p.id, userId: f.userId.value }, 'Lantik Ketua Panitia');
  },
  hantarTetapan: f => {
    const tetapan = {};
    ['namaSekolah', 'kodSekolah', 'domainEmel', 'emelPeringatan', 'benamkan', 'gbId', 'gbNama', 'pkId', 'pkNama', 'sukId', 'sukNama', 'jadualCsvUrl'].forEach(k => { tetapan[k] = f[k].value.trim(); });

    if (tetapan.jadualCsvUrl && !/^https:\/\/\S+$/i.test(tetapan.jadualCsvUrl)) return toast('Pautan CSV jadual mesti bermula dengan https://', 'ralat');
    Object.assign(S.adm.tetapan, tetapan);
    S.data.tetapan.namaSekolah = tetapan.namaSekolah; $('#tSek').textContent = tetapan.namaSekolah; store.set('ep_init', S.data);
    toast('Tetapan disimpan');
    store.set('ep_adm', S.adm);
    antri('simpanTetapan', { tetapan }, 'Simpan tetapan');
  },
};
