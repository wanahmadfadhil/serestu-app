const CHG = {
  sjToggle: el => el.closest('.sj').classList.toggle('on', el.checked),
  tukarPanitia: el => { S.panitiaId = el.value; S.detail = detailTempatan(el.value); S.folder = null; S.cartaEdit = false; ls.set('ep_panitia', el.value); render(); },
  fotoSaya: async el => {
    const file = el.files[0]; if (!file) return;
    try { fotoLatar(S.user.id, await gambarKe(file, 400, 400, 0.85)); } catch (e) { toast(e.message, 'ralat'); }
    el.value = '';
  },
  fotoGuru: async el => {
    const file = el.files[0]; if (!file) return;
    try {
      const data = await gambarKe(file, 400, 400, 0.85);
      tutupSheet();
      if (S.tab === 'admin') {
        sibuk('Memuat naik foto guru…');
        const r = await call('muatNaikFoto', { data, userId: el.dataset.id });
        IMG[r.fotoId] = data; idb.set(r.fotoId, data);
        setAdm(await call('senaraiPengguna')); renderAdmin(); toast('Foto guru dikemas kini');
      } else fotoLatar(el.dataset.id, data);
    } catch (e) { toast(e.message, 'ralat'); } finally { sibuk(false); el.value = ''; }
  },
  fotoPentadbir: async el => {
    const file = el.files[0]; if (!file) return;
    sibuk('Memuat naik gambar…');
    try {
      const data = await gambarKe(file, 400, 400, 0.85);
      const r = await call('muatNaikFotoPentadbir', { peranan: el.dataset.p, data });
      IMG[r.fotoBaharu] = data; idb.set(r.fotoBaharu, data);
      setAdm(r);
      Object.keys(S.masaMuat).forEach(k => { S.masaMuat[k] = 0; }); // carta panitia dimuat semula
      renderAdmin();
      toast('Gambar dikemas kini. Ia akan muncul dalam carta organisasi semua panitia.');
    } catch (e) { toast(e.message, 'ralat'); } finally { sibuk(false); el.value = ''; }
  },
  kiraCalon: el => {
    const f = el.closest('form'); const n = $$('input[name=uid]:checked', f).length;
    const b = $('#btnTambahAhli'); b.disabled = !n; b.textContent = n ? `Tambah ${n} guru sebagai ahli` : 'Pilih guru untuk ditambah';
  },
  jadualSaya: async el => {
    const file = el.files[0]; if (!file) return;
    sibuk('Memuat naik jadual waktu…');
    try {
      let data, mime = file.type;
      if (/^image\//.test(mime)) { data = file.size > 3 * 1048576 ? await gambarMaks(file, 2600) : await bacaFail(file); if (file.size > 3 * 1048576 || !/png|jpeg|webp/.test(mime)) mime = 'image/jpeg'; }
      else if (mime === 'application/pdf') { if (file.size > MAKS_MB * 1048576) throw new Error(`PDF melebihi ${MAKS_MB}MB.`); data = await bacaFail(file); }
      else throw new Error('Jadual waktu mesti PDF atau gambar.');
      const r = await call('muatNaikJadual', { data, mime });
      Object.assign(S.user, r); Object.assign(S.data.user, r); store.set('ep_init', S.data);
      render(); toast('Jadual waktu dimuat naik');
    } catch (e) { toast(e.message, 'ralat'); } finally { sibuk(false); }
  },
  slotGambar: async el => {
    const file = el.files[0]; if (!file) return;
    const i = Number(el.dataset.i);
    try {
      const data = await gambarKe(file, 1000, 750, 0.78);
      S.laporanGambar[i] = data;
      const slot = el.closest('.slot'); slot.style.backgroundImage = `url(${data})`; slot.classList.add('ada');
    } catch (e) { toast(e.message, 'ralat'); }
  }
};
const INP = {
  cariFail: el => {
    S.cari = el.value;
    const d = S.detail, q = S.cari.toLowerCase();
    const fail = d.fail.filter(f => f.folderNo === S.folder && (!q || (f.tajuk + ' ' + f.penerangan + ' ' + f.pemilikNama).toLowerCase().includes(q)));
    $('#senaraiFail').innerHTML = fail.length ? fail.map(f => failHTML(f, d)).join('') : `<div class="blok">${kosongHTML('search', 'Tiada fail sepadan dengan carian.')}</div>`;
  },
  cariCalon: el => {
    const q = el.value.toLowerCase().trim();
    $$('.calon', el.closest('form')).forEach(c => { c.hidden = !!q && !c.dataset.cari.includes(q); });
  },
  cariPengguna: el => {
    S.admCari = el.value;
    const pos = el.selectionStart;
    renderAdmin();
    const n = $('[data-inp="cariPengguna"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); }
  }
};


/* =====================================================================
   LAPORAN AKTIVITI — ONE PAGE REPORT (OPR)
   ===================================================================== */
const KATEGORI_OPR = ['LAPORAN', 'PROGRAM', 'PERTANDINGAN', 'KURSUS / LDP', 'MESYUARAT', 'BENGKEL', 'LAWATAN', 'LAIN-LAIN'];
const BULAN_PENDEK = ['Jan', 'Feb', 'Mac', 'Apr', 'Mei', 'Jun', 'Jul', 'Ogo', 'Sep', 'Okt', 'Nov', 'Dis'];
const OPRCACHE = {};
const tarikhLap = r => String(r.tarikhMula || r.tarikh || r.dicipta || '');
const tahunLap = r => Number(tarikhLap(r).slice(0, 4)) || 0;
const bulanLap = r => Number(tarikhLap(r).slice(5, 7)) || 0;
const ayatTarikh = t => String(t || '').toLowerCase().replace(/(^|\s)([a-z])/g, (m, a, b) => a + b.toUpperCase());
const tarikhDMY = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? `${+m[3]}/${+m[2]}/${m[1]}` : ''; };
const senaraiLap = d => (d && d.laporan) || [];

function viewLaporan() { pastikanDetail(renderLaporan); }

function lapTapis(d) {
  const q = (S.lapCari || '').toLowerCase();
  return senaraiLap(d).filter(r => (r._pending || !S.lapTahun || String(tahunLap(r)) === S.lapTahun) && (!S.lapKat || r.kategori === S.lapKat) &&
    (!q || `${r.tajuk} ${r.tempat || ''} ${r.disediakanOleh || ''} ${r.kategori || ''}`.toLowerCase().includes(q)));
}

function lapRingkasHTML(d) {
  const L = senaraiLap(d).filter(r => !r._pending), th = new Date().getFullYear();
  const n = L.filter(r => tahunLap(r) === th).length;
  return `<section class="blok"><div class="blok-kepala"><h3>Laporan Aktiviti</h3><span class="muted">${n} laporan tahun ${th}</span></div>
    ${L.length ? `<ul class="lap-mini">${L.slice(0, 3).map(r => `<li><button data-act="lihatOPR" data-id="${r.id}"><span class="lap-gambar kecil">${r.lakaranId ? `<img data-img="${esc(r.lakaranId)}" alt="">` : ic('image', 18)}</span>
      <span><b>${esc(r.tajuk)}</b><small>${esc(r.kategori)}, ${esc(ayatTarikh(r.tarikhProgram))}</small></span></button></li>`).join('')}</ul>`
      : '<p class="kosong-kecil">Belum ada laporan aktiviti. Sediakan One Page Report (OPR) pertama panitia anda.</p>'}
    <div class="baris-btn" style="margin-top:10px">${S.pemantau ? '' : `<button class="btn kecil utama" data-act="borangOPR">${ic('plus', 16)}Laporan baharu</button>`}
      <button class="btn kecil" data-act="keLaporan">${ic('report', 16)}Semua laporan</button><button class="btn kecil" data-act="keLaporan" data-t="analisis">${ic('dash', 16)}Analisis</button></div></section>`;
}

function renderLaporan() {
  const d = S.detail, ro = !!S.pemantau, L = senaraiLap(d);
  tajuk('Laporan Aktiviti');
  const kini = new Date().getFullYear();
  if (S.lapTahun == null) S.lapTahun = L.some(r => tahunLap(r) === kini) || !L.length ? String(kini) : '';
  const tahun = [...new Set(L.map(tahunLap).filter(Boolean).concat(kini))].sort((a, b) => b - a);
  const kat = [...new Set(L.map(r => r.kategori).filter(Boolean))].sort();
  const tab = S.lapTab || 'senarai';
  $('#main').innerHTML = `
    ${ro ? `<button class="btn kecil" data-act="tutupLapPemantau" style="margin-bottom:12px">${ic('back', 16)}Kembali</button>` : subPanitiaHTML(d)}
    <section class="lap-kepala"><div><small>Panitia ${esc(d.panitia.nama)}</small><h2>Laporan Aktiviti</h2><p>One Page Report (OPR) program dan aktiviti panitia</p></div>
      ${ro ? '' : `<button class="btn kuning" data-act="borangOPR">${ic('plus', 18)}Laporan baharu</button>`}</section>
    <div class="seg" role="tablist" style="margin:14px 0 12px">${[['senarai', 'Senarai laporan'], ['analisis', 'Analisis']].map(([k, l]) => `<button role="tab" aria-selected="${tab === k}" data-act="lapTab" data-t="${k}">${l}</button>`).join('')}</div>
    <div class="lap-penapis">
      <select data-chg="lapTahun" aria-label="Tahun"><option value="">Semua tahun</option>${tahun.map(t => `<option ${String(t) === S.lapTahun ? 'selected' : ''}>${t}</option>`).join('')}</select>
      ${tab === 'senarai' ? `<select data-chg="lapKat" aria-label="Kategori"><option value="">Semua kategori</option>${kat.map(k => `<option ${k === S.lapKat ? 'selected' : ''}>${esc(k)}</option>`).join('')}</select>` : ''}
    </div>
    ${tab === 'senarai'
      ? `${L.length > 4 ? `<label class="cari">${ic('search', 18)}<input type="search" data-inp="cariLap" value="${esc(S.lapCari || '')}" placeholder="Cari tajuk, tempat atau nama guru" aria-label="Cari laporan"></label>` : ''}<div id="lapSenarai">${lapSenaraiHTML(d)}</div>`
      : lapAnalisisHTML(d)}`;
  hydrateImgs();
}

function lapSenaraiHTML(d) {
  const L = lapTapis(d);
  if (!L.length) return `<div class="blok">${kosongHTML('report', senaraiLap(d).length ? 'Tiada laporan sepadan dengan penapis.' : 'Belum ada laporan aktiviti.' + (S.pemantau ? '' : ' Tekan "Laporan baharu" untuk menyediakan OPR pertama.'))}</div>`;
  return `<p class="muted" style="margin:0 4px 8px">${L.length} laporan</p><div class="lap-senarai">${L.map(r => r._pending
    ? `<div class="lap-kad menunggu"><span class="lap-gambar"><span class="pusing"></span></span><span class="lap-isi"><span class="chip">${esc(r.kategori || 'LAPORAN')}</span><b>${esc(r.tajuk)}</b><small>Sedang menjana OPR…</small></span></div>`
    : `<button class="lap-kad" data-act="lihatOPR" data-id="${r.id}"><span class="lap-gambar">${r.lakaranId ? `<img data-img="${esc(r.lakaranId)}" alt="">` : ic('image', 26)}</span>
      <span class="lap-isi"><span class="chip">${esc(r.kategori)}</span><b>${esc(r.tajuk)}</b><small>${ic('calendar', 13)}${esc(ayatTarikh(r.tarikhProgram))}</small>
      ${r.tempat ? `<small>${esc(ayatTarikh(r.tempat))}</small>` : ''}<small class="lap-oleh">Disediakan oleh ${esc(namaPendek(r.disediakanOleh))}</small></span></button>`).join('')}</div>`;
}

/** Analisis: kad statistik, carta lajur bulanan / tahunan, kategori dan sumbangan ahli (satu siri, satu warna) */
function lapAnalisisHTML(d) {
  const semua = senaraiLap(d).filter(r => !r._pending), th = S.lapTahun;
  const L = semua.filter(r => !th || String(tahunLap(r)) === th);
  const kini = new Date();
  if (!L.length) return `<div class="blok">${kosongHTML('dash', th ? `Tiada laporan bagi tahun ${th}.` : 'Belum ada laporan untuk dianalisis.')}</div>`;
  const ahli = d.ahli || [];
  const kira = {}; L.forEach(r => { kira[r.disediakanId] = (kira[r.disediakanId] || 0) + 1; });
  const kat = {}; L.forEach(r => { const k = r.kategori || 'LAIN-LAIN'; kat[k] = (kat[k] || 0) + 1; });
  const katS = Object.entries(kat).sort((a, b) => b[1] - a[1]);
  const bulanIni = L.filter(r => tahunLap(r) === kini.getFullYear() && bulanLap(r) === kini.getMonth() + 1).length;
  const penyumbang = ahli.filter(m => kira[m.id]).length;
  const tile = (v, l, s) => `<div class="stat-kad"><b>${v}</b><span>${l}</span>${s ? `<small>${s}</small>` : ''}</div>`;

  // Carta lajur: ikut bulan (tahun dipilih) atau ikut tahun (semua tahun)
  let label, nilai, tajukCarta;
  if (th) {
    label = BULAN_PENDEK; nilai = Array(12).fill(0);
    L.forEach(r => { const m = bulanLap(r); if (m) nilai[m - 1]++; });
    tajukCarta = `Laporan mengikut bulan, ${th}`;
  } else {
    const thn = [...new Set(L.map(tahunLap).filter(Boolean))].sort();
    label = thn.map(String); nilai = thn.map(t => L.filter(r => tahunLap(r) === t).length);
    tajukCarta = 'Laporan mengikut tahun';
  }
  const maks = Math.max(1, ...nilai);
  const ringkas = label.map((l, i) => `${l} ${nilai[i]}`).join(', ');
  const carta = `<section class="blok"><div class="blok-kepala"><h3>${tajukCarta}</h3></div>
    <div class="carta-bar" style="--n:${label.length}" role="img" aria-label="${esc(tajukCarta)}: ${esc(ringkas)}">${nilai.map((n, i) =>
      `<div class="cb-kol" data-tip="${esc(label[i])}${th ? ' ' + th : ''}: ${n} laporan"><span class="cb-nilai">${n || ''}</span><span class="cb-bar" style="height:${n ? Math.max(3, n / maks * 88) : 0}%"></span></div>`).join('')}</div>
    <div class="cb-paksi" style="--n:${label.length}" aria-hidden="true">${label.map(l => `<span>${esc(l)}</span>`).join('')}</div>
    <details class="jadual-data"><summary>Lihat jadual data</summary><table class="semak"><thead><tr><th>${th ? 'Bulan' : 'Tahun'}</th><th>Bilangan laporan</th></tr></thead>
      <tbody>${label.map((l, i) => `<tr><td>${esc(l)}</td><td>${nilai[i]}</td></tr>`).join('')}</tbody></table></details></section>`;

  const maksK = Math.max(1, ...katS.map(x => x[1]));
  const kategori = `<section class="blok"><div class="blok-kepala"><h3>Mengikut kategori</h3></div>
    <ul class="hbar">${katS.map(([k, n]) => `<li data-tip="${esc(k)}: ${n} laporan (${Math.round(n / L.length * 100)}%)"><span class="hb-l">${esc(ayatTarikh(k))}</span><span class="hb-trek"><span class="hb-bar" style="width:${n / maksK * 100}%"></span></span><b>${n}</b></li>`).join('')}</ul></section>`;

  const senaraiAhli = ahli.map(m => ({ m, n: kira[m.id] || 0 })).sort((a, b) => b.n - a.n || a.m.nama.localeCompare(b.m.nama));
  const maksA = Math.max(1, ...senaraiAhli.map(x => x.n));
  const belum = senaraiAhli.filter(x => !x.n);
  const sumbangan = `<section class="blok"><div class="blok-kepala"><h3>Sumbangan ahli</h3><span class="muted">${penyumbang}/${ahli.length} ahli menyediakan laporan</span></div>
    <ul class="hbar ahli-bar">${senaraiAhli.map(({ m, n }) => `<li data-tip="${esc(m.nama)}: ${n} laporan">${avatar(m, 30)}<span class="hb-l">${esc(namaPendek(m.nama))}</span><span class="hb-trek"><span class="hb-bar ${n ? '' : 'sifar'}" style="width:${n ? n / maksA * 100 : 0}%"></span></span><b>${n}</b></li>`).join('')}</ul>
    ${belum.length && belum.length < ahli.length ? `<p class="nota" style="margin-top:10px">Belum menyediakan laporan${th ? ' tahun ' + th : ''}: ${esc(belum.map(x => namaPendek(x.m.nama)).join(', '))}.</p>` : ''}</section>`;

  const katTerbanyak = katS[0] && katS[0][1] > ((katS[1] || [])[1] || 0) ? katS[0] : null;
  return `<div class="stat-grid">
      ${tile(L.length, th ? `Laporan tahun ${th}` : 'Jumlah laporan')}
      ${tile(th && Number(th) === kini.getFullYear() ? bulanIni : (th ? (L.length / 12).toFixed(1) : new Set(L.map(tahunLap)).size), th && Number(th) === kini.getFullYear() ? 'Bulan ini' : (th ? 'Purata sebulan' : 'Tahun direkod'))}
      ${tile(`${penyumbang}<span style="font-size:15px;color:var(--muted)">/${ahli.length}</span>`, 'Ahli menyumbang')}
      ${tile(L.reduce((t, r) => t + (r.bilFoto || 0), 0), 'Foto aktiviti', katTerbanyak ? `Kategori utama: ${ayatTarikh(katTerbanyak[0])}` : '')}
    </div>${carta}${kategori}${sumbangan}`;
}

    <dl class="opr-info">
      <div><dt>Panitia</dt><dd>PANITIA ${esc(String(x.panitia || '').toUpperCase())}</dd></div>

      <div><dt>Kategori</dt><dd>${esc(x.kategori)}</dd></div>
      <div><dt>Tarikh program</dt><dd>${esc(x.tarikhProgram)}</dd></div>
      <div class="penuh"><dt>Tajuk bahan</dt><dd><b>${esc(String(x.tajuk || '').toUpperCase())}</b></dd></div>

    </dl>
    <div class="opr-foto">${(x.fotoIds || []).map((id, i) => id ? `<figure><img data-img="${esc(id)}" alt="Foto ${i + 1}: ${esc(x.tajuk)}" data-act="zoomImg"><figcaption>FOTO ${i + 1}</figcaption></figure>` : '').join('')}</div>
    <p class="opr-oleh"><small>Disediakan oleh</small><b>${esc(String(x.disediakanOleh || '').toUpperCase())}</b></p></article>`;

function oprAksiHTML(r, x) {
  return `<button class="btn utama" data-act="muatTurun" data-id="${r.failId}">${ic('download', 18)}Muat turun PDF</button>
    <button class="btn" data-act="pratonton" data-id="${r.failId}">${ic('eye', 18)}Lihat PDF</button>
    ${S.pemantau ? '' : `<button class="btn" data-act="kongsiOPR" data-id="${r.id}">${ic('share', 18)}Kongsi</button>`}
    ${x && x.bolehUbah ? `<button class="btn" data-act="ubahOPR" data-id="${r.id}">${ic('edit', 18)}Ubah</button><button class="btn bahaya" data-act="padamOPR" data-id="${r.id}">${ic('trash', 18)}Padam</button>` : ''}`;
}
async function lihatOPR(id) {
  const r = senaraiLap(S.detail).find(x => x.id === id); if (!r) return;
  const c = OPRCACHE[id];
  const w = bukaSheet(`<div class="prev-kepala"><h3>${esc(r.tajuk)}</h3><button class="ib" data-act="tutupSheet" aria-label="Tutup">${ic('x')}</button></div>
    <div class="prev-badan opr-badan" id="oprBadan">${c ? oprHTML(c) : '<p class="muted" style="padding:16px">Memuatkan laporan…</p>'}</div>
    <div class="prev-aksi" id="oprAksi">${oprAksiHTML(r, c)}</div>`, { penuh: true });
  try {
    const x = await call('laporanDetail', { id, pemantau: S.pemantau || undefined }, { senyap: !!c });
    OPRCACHE[id] = x;
    if (!document.body.contains(w)) return;
    $('#oprBadan').innerHTML = oprHTML(x); $('#oprAksi').innerHTML = oprAksiHTML(r, x);
    hydrateImgs(w);
  } catch (e) {
    const b = $('#oprBadan');
    if (b && !c) b.innerHTML = `<div class="prev-tiada"><p>${esc(e.message)}</p></div>`; else toast(e.message, 'ralat');
  }
}

/* ---------- Borang OPR ---------- */
function slotOPRHTML(i) {
  return `<div class="slot-opr"><label class="slot" data-slot="${i}"><input type="file" accept="image/*" data-chg="slotOPR" data-i="${i}" hidden><span>${ic('image', 22)}Foto ${i + 1}</span></label>
    <button type="button" class="slot-buang" data-act="buangFotoOPR" data-i="${i}" aria-label="Buang foto ${i + 1}" hidden>${ic('x', 14)}</button></div>`;
}
function kemasSlotOPR(i) {
  const g = S.opr && S.opr.gambar[i], slot = $(`.slot-opr .slot[data-slot="${i}"]`);
  if (!slot) return;
  const src = g ? (g.data || IMG[g.id] || '') : '';
  slot.style.backgroundImage = src ? `url(${src})` : '';
  slot.classList.toggle('ada', !!g);
  const b = slot.parentElement.querySelector('.slot-buang'); if (b) b.hidden = !g;
}
function borangOPR(x, awal) {
  if (!perluPanitia()) return;
  awal = awal || {};
  const t = new Date(), hariIni = `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`;
  S.opr = { id: x ? x.id : '', programId: awal.programId || '', gambar: [0, 1, 2, 3].map(i => x && x.fotoIds && x.fotoIds[i] ? { id: x.fotoIds[i] } : null), pertamaAsal: x ? (x.fotoIds || []).find(Boolean) || '' : '' };
  const v = k => esc(x ? x[k] || '' : (awal[k] || ''));
  const tempatLalai = awal.tempat ? esc(String(awal.tempat).toUpperCase()) : esc(String(S.detail.sekolah || (S.data && S.data.tetapan.namaSekolah) || '').toUpperCase());
  bukaSheet(`<h3 class="sheet-t">${x ? 'Ubah laporan aktiviti' : 'Laporan aktiviti baharu'}</h3>

function lakaranDari(src) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      const c = document.createElement('canvas'); c.width = 360; c.height = 270;
      const x = c.getContext('2d'), sr = im.width / im.height, dr = 4 / 3;
      let sw, sh, sx, sy;
      if (sr > dr) { sh = im.height; sw = sh * dr; sx = (im.width - sw) / 2; sy = 0; } else { sw = im.width; sh = sw / dr; sx = 0; sy = (im.height - sh) / 2; }
      x.fillStyle = '#fff'; x.fillRect(0, 0, 360, 270); x.drawImage(im, sx, sy, sw, sh, 0, 0, 360, 270);
      res(c.toDataURL('image/jpeg', 0.72));
    };
    im.onerror = () => res('');
    im.src = src;
  });
}
/** Jana OPR di latar belakang — pengguna boleh teruskan kerja lain */
function simpanOPRLatar(data) {
  const pid = data.panitiaId, d = MEM[pid];
  const tmp = { id: 'tmp_' + Date.now().toString(36), tajuk: data.tajuk, kategori: data.kategori, tarikhMula: data.tarikhMula, _pending: true };
  if (d) {
    d.laporan = d.laporan || [];
    if (data.id) { const r = d.laporan.find(x => x.id === data.id); if (r) r._pending = true; } else d.laporan.unshift(tmp);
  }
  ANTRI.n++; paparAntri(); renderSemasa();
  toast('OPR sedang dijana. Anda boleh teruskan kerja lain.');
  call('simpanLaporan', data, { senyap: true, masa: 300000 }).then(r => {
    const dd = MEM[pid];
    if (dd) {
      dd.laporan = (dd.laporan || []).filter(x => x.id !== tmp.id && x.id !== r.laporan.id);
      dd.laporan.unshift(r.laporan);
      dd.laporan.sort((a, b) => (tarikhLap(b) > tarikhLap(a) ? 1 : -1));
      dd.fail = dd.fail.filter(x => x.id !== r.fail.id); dd.fail.unshift(r.fail);

    toast(data.id ? 'OPR dikemas kini' : 'OPR siap dan disimpan dalam Folder 10');
  }).catch(e => {
    const dd = MEM[pid];
    if (dd) { dd.laporan = (dd.laporan || []).filter(x => x.id !== tmp.id); dd.laporan.forEach(x => { if (x.id === data.id) x._pending = false; }); }

}

/* Tooltip ringan untuk carta (data-tip) */
(() => {
  let tip = null;
  const sorok = () => { if (tip) tip.classList.remove('on'); };
  document.addEventListener('pointerover', e => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (!el) return sorok();
    if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; tip.setAttribute('role', 'tooltip'); document.body.appendChild(tip); }
    tip.textContent = el.dataset.tip;
    const r = el.getBoundingClientRect();
    tip.style.left = Math.min(innerWidth - 8 - tip.offsetWidth, Math.max(8, r.left + r.width / 2 - tip.offsetWidth / 2)) + 'px';
    tip.style.top = Math.max(8, r.top - tip.offsetHeight - 8) + 'px';
    tip.classList.add('on');
  });
  document.addEventListener('scroll', sorok, true);
})();

/** Buka panitia dan borang muat naik untuk dokumen wajib (panitia atau sekolah) */
async function hantarTugasanKe(pid, tug, no) {
  tutupSheet();
  S.panitiaId = pid; ls.set('ep_panitia', pid); S.folder = null;
  S.detail = detailTempatan(pid);
  if (!S.detail) { sibuk('Memuatkan panitia…'); try { await muatDetail(pid, true); } catch (e) { sibuk(false); return toast(e.message, 'ralat'); } sibuk(false); }
  pergi('dash');
  ACT.borangMuatNaik({ dataset: { no: String(no), tug } });
}

Object.assign(ACT, {
  subPanitia: el => { const t = el.dataset.t; S.cartaEdit = false; if (t === 'folder') { S.folder = null; S.cari = ''; } pergi(t); },
  keKurikulum: el => { S.kurTab = el.dataset.t || S.kurTab; pergi('kurikulum'); },
  kurTab: el => { S.kurTab = el.dataset.t; viewKurikulum(); },
  tkBulan: el => { const [y, m] = S.tkBulan.split('-').map(Number); const t = new Date(y, m - 1 + Number(el.dataset.v), 1); S.tkBulan = `${t.getFullYear()}-${pad(t.getMonth() + 1)}`; S.tkHari = null; viewTakwim(); },
  tkHari: el => { S.tkHari = el.dataset.v && S.tkHari !== el.dataset.v ? el.dataset.v : null; viewTakwim(); },
  lihatAcara: el => lihatAcara(el.dataset.id, el.dataset.jenis),
  borangProgram: el => { const x = el.dataset.id ? (K_().program || []).find(p => p.id === el.dataset.id) : null; tutupSheet(); borangProgram(x); },
  padamProgram: async el => {
    if (!await sahkan('Padam program?', 'Program akan dibuang daripada takwim.', 'Padam', true)) return;
    const K = K_(), x = K.program.find(p => p.id === el.dataset.id);
    K.program = K.program.filter(p => p.id !== el.dataset.id); simpanKur(); renderKurSemasa(); toast('Program dipadam');
    antri('padamProgram', { id: el.dataset.id }, 'Padam program ' + (x ? x.tajuk : ''));
  },
  jadikanOPR: async el => {
    const x = (K_().program || []).find(p => p.id === el.dataset.id); if (!x) return;
    tutupSheet();
    S.panitiaId = x.panitiaId; ls.set('ep_panitia', x.panitiaId);
    S.detail = detailTempatan(x.panitiaId);
    if (!S.detail) { sibuk('Memuatkan panitia…'); try { await muatDetail(x.panitiaId, true); } catch (e) { sibuk(false); return toast(e.message, 'ralat'); } sibuk(false); }
    borangOPR(null, { tajuk: x.tajuk, kategori: x.kategori || 'PROGRAM', tarikhMula: x.tarikhMula, tarikhTamat: x.tarikhTamat, tempat: x.tempat, programId: x.id });
  },
  bukaOPRProgram: async el => {
    const x = (K_().program || []).find(p => p.id === el.dataset.id); if (!x) return;
    tutupSheet();
    S.panitiaId = x.panitiaId; ls.set('ep_panitia', x.panitiaId);
    S.detail = detailTempatan(x.panitiaId);
    if (!S.detail) { sibuk('Memuatkan panitia…'); try { await muatDetail(x.panitiaId, true); } catch (e) { sibuk(false); return toast(e.message, 'ralat'); } sibuk(false); }
    S.lapTab = 'senarai'; pergi('laporan'); lihatOPR(x.laporanId);
  },
  lihatMesyuarat: el => mesyuaratSheet(el.dataset.id),
  borangMesyuarat: el => { const m = el.dataset.id ? (K_().mesyuarat || []).find(x => x.id === el.dataset.id) : null; tutupSheet(); borangMesyuarat(m); },
  padamMesyuarat: async el => {
    if (!await sahkan('Padam mesyuarat?', 'Mesyuarat dan tindakan susulannya dibuang daripada senarai.', 'Padam', true)) return;
    const K = K_(), id = el.dataset.id, m = K.mesyuarat.find(x => x.id === id);
    K.mesyuarat = K.mesyuarat.filter(x => x.id !== id); K.tindakan = (K.tindakan || []).filter(t => t.mesyuaratId !== id);
    simpanKur(); tutupSheet(); renderKurSemasa(); toast('Mesyuarat dipadam');
    antri('padamMesyuarat', { id }, 'Padam ' + (m ? m.tajuk : 'mesyuarat'));
  },
  lihatMinit: async el => {
    sibuk('Memuatkan minit…');
    try {
      const r = await call('lihatMinit', { id: el.dataset.id });
      if (/^image\//.test(r.mime)) paparZoom(`data:${r.mime};base64,${r.data}`);
      else if (/pdf/.test(r.mime)) {
        const bin = atob(r.data), arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        const bu = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' }));
        const w = bukaSheet(`<div class="prev-kepala"><h3>${esc(r.nama)}</h3><button class="ib" data-act="tutupSheet" aria-label="Tutup">${ic('x')}</button></div>
          <div class="prev-badan"><iframe src="${bu}" title="${esc(r.nama)}"></iframe></div><div class="prev-aksi"><button class="btn utama" id="minitTurun">${ic('download', 18)}Muat turun</button></div>`, { penuh: true });
        $('#minitTurun').onclick = () => simpanFail(r.data, r.mime, r.nama);
        const pantau = setInterval(() => { if (!document.body.contains(w)) { URL.revokeObjectURL(bu); clearInterval(pantau); } }, 5000);
      } else { simpanFail(r.data, r.mime, r.nama); toast('Minit dimuat turun'); }
    } catch (e) { toast(e.message, 'ralat'); } finally { sibuk(false); }
  },
  borangTindakan: el => { const t = el.dataset.id ? (K_().tindakan || []).find(x => x.id === el.dataset.id) : null; tutupSheet(); borangTindakan(el.dataset.m || (t && t.mesyuaratId), t); },
  togolTindakan: el => {
    const K = K_(), t = (K.tindakan || []).find(x => x.id === el.dataset.id); if (!t) return;
    t.status = t.status === 'SELESAI' ? 'BELUM' : 'SELESAI';
    t.selesaiPada = t.status === 'SELESAI' ? new Date().toISOString() : ''; t.selesaiOleh = t.status === 'SELESAI' ? S.user.nama : '';
    simpanKur(); toast(t.status === 'SELESAI' ? 'Tindakan ditanda selesai' : 'Tindakan dibuka semula');
    const terbuka = $('.sheet-wrap') && t.mesyuaratId; if (terbuka && $('.sheet .tindakan-senarai')) mesyuaratSheet(t.mesyuaratId);
    renderKurSemasa();
    antri('statusTindakan', { id: t.id, status: t.status }, 'Status tindakan');
  },
  padamTindakan: async el => {
    if (!await sahkan('Padam tindakan?', 'Tindakan susulan ini akan dibuang.', 'Padam', true)) return;
    const K = K_(), t = (K.tindakan || []).find(x => x.id === el.dataset.id);
    K.tindakan = K.tindakan.filter(x => x.id !== el.dataset.id); simpanKur(); renderKurSemasa(); toast('Tindakan dipadam');
    if (t) mesyuaratSheet(t.mesyuaratId);
    antri('padamTindakan', { id: el.dataset.id }, 'Padam tindakan');
  },
  borangDokSekolah: el => { const d = el.dataset.id ? (K_().dokSekolah || []).find(x => x.id === el.dataset.id) : null; tutupSheet(); borangDokSekolah(d); },
  lihatDokSekolah: el => lihatDokSekolah(el.dataset.id),
  padamDokSekolah: async el => {
    if (!await sahkan('Padam dokumen wajib sekolah?', 'Senarai semak dokumen ini dibuang. Fail yang telah dihantar oleh panitia tidak terjejas.', 'Padam', true)) return;
    const K = K_(), d = K.dokSekolah.find(x => x.id === el.dataset.id);
    K.dokSekolah = K.dokSekolah.filter(x => x.id !== el.dataset.id); simpanKur(); tutupSheet(); renderKurSemasa(); toast('Dokumen dipadam');
    antri('padamDokSekolah', { id: el.dataset.id }, 'Padam ' + (d ? d.tajuk : 'dokumen'));
  },
  hantarTugasan: el => hantarTugasanKe(el.dataset.pid, el.dataset.id, el.dataset.no)
});
Object.assign(SUB, {
  hantarProgram: f => {
    const K = K_(), baru = !f.id.value, id = f.id.value || idKlien('pg');
    const data = { id, panitiaId: f.panitiaId.value, tajuk: f.tajuk.value.trim(), kategori: f.kategori.value.trim().toUpperCase() || 'PROGRAM',
      tarikhMula: f.tarikhMula.value, tarikhTamat: f.tarikhTamat.value, masa: f.masa.value.trim(), tempat: f.tempat.value.trim(), catatan: f.catatan.value.trim() };
    if (!data.tajuk) return toast('Isi nama program.', 'ralat');
    if (!data.tarikhMula) return toast('Isi tarikh mula.', 'ralat');
    if (data.tarikhTamat && data.tarikhTamat < data.tarikhMula) return toast('Tarikh tamat mesti selepas tarikh mula.', 'ralat');
    const lama = K.program.find(p => p.id === id);
    const obj = Object.assign({ laporanId: '', diciptaId: S.user.id, diciptaOleh: S.user.nama }, lama || {}, data, { panitia: namaPanitia(data.panitiaId) });
    K.program = K.program.filter(p => p.id !== id).concat(obj);
    simpanKur(); tutupSheet(); S.tkBulan = data.tarikhMula.slice(0, 7); renderKurSemasa(); toast(baru ? 'Program ditambah ke takwim' : 'Program dikemas kini');
    antri('simpanProgram', data, 'Simpan program ' + data.tajuk);
  },
  hantarMesyuarat: f => {
    const K = K_(), id = f.id.value || idKlien('mj');
    const tarikh = f.tarikh.value, bil = Number(f.bil.value) || 1;
    if (!tarikh) return toast('Isi tarikh mesyuarat.', 'ralat');
    const data = { id, bil, tarikh, tajuk: f.tajuk.value.trim(), masa: f.masa.value.trim(), tempat: f.tempat.value.trim(), status: f.status.value, minitUrl: f.minitUrl.value.trim(), catatan: f.catatan.value.trim() };
    if (data.minitUrl && !/^https?:\/\/\S+$/i.test(data.minitUrl)) return toast('Pautan minit mesti bermula dengan http:// atau https://', 'ralat');
    const lama = (K.mesyuarat || []).find(x => x.id === id);
    const obj = Object.assign({ minitDriveId: '', minitNama: '' }, lama || {}, data, { tahun: tarikh.slice(0, 4), tajuk: data.tajuk || `Mesyuarat JK Kurikulum Bil. ${bil}/${tarikh.slice(0, 4)}` });
    K.mesyuarat = (K.mesyuarat || []).filter(x => x.id !== id).concat(obj).sort((a, b) => (b.tarikh > a.tarikh ? 1 : -1));
    simpanKur(); tutupSheet(); renderKurSemasa(); toast('Mesyuarat disimpan');
    antri('simpanMesyuarat', data, 'Simpan ' + obj.tajuk);
  },
  hantarTindakan: f => {
    const K = K_(), id = f.id.value || idKlien('tk');
    const g = (K.guru || []).find(x => x.id === f.pemilikId.value);
    const data = { id, mesyuaratId: f.mesyuaratId.value, perkara: f.perkara.value.trim(), pemilikId: g ? g.id : '', pemilikNama: g ? g.nama : f.pemilikNama.value.trim(), tarikhAkhir: f.tarikhAkhir.value };
    if (!data.perkara) return toast('Isi perkara tindakan.', 'ralat');
    if (!data.pemilikNama) return toast('Pilih guru atau isi nama yang bertanggungjawab.', 'ralat');
    const lama = (K.tindakan || []).find(x => x.id === id);
    K.tindakan = (K.tindakan || []).filter(x => x.id !== id).concat(Object.assign({ status: 'BELUM' }, lama || {}, data));
    simpanKur(); tutupSheet(); toast('Tindakan disimpan'); mesyuaratSheet(data.mesyuaratId); renderKurSemasa();
    antri('simpanTindakan', data, 'Tindakan: ' + data.perkara.slice(0, 40));
  },
  hantarDokSekolah: f => {
    const K = K_(), id = f.id.value || idKlien('ds');
    const data = { id, tajuk: f.tajuk.value.trim(), folderNo: Number(f.folderNo.value), tarikhAkhir: f.tarikhAkhir.value, catatan: f.catatan.value.trim() };
    if (!data.tajuk) return toast('Isi nama dokumen.', 'ralat');
    const lama = (K.dokSekolah || []).find(x => x.id === id);
    const status = lama ? lama.status : (K.papan || []).map(p => ({ panitiaId: p.id, nama: p.nama, siap: false, dicipta: '' }));
    K.dokSekolah = (K.dokSekolah || []).filter(x => x.id !== id).concat(Object.assign({}, lama || {}, data, { status }));
    simpanKur(); tutupSheet(); renderKurSemasa(); toast('Dokumen wajib sekolah disimpan');
    antri('simpanDokSekolah', data, 'Dokumen wajib: ' + data.tajuk);
  }
});
Object.assign(CHG, {
  tkTapis: el => { S.tkTapis = el.value; viewTakwim(); },
  minitFail: async el => {
    const file = el.files[0]; if (!file) return;
    const id = el.dataset.id;
    sibuk('Memuat naik minit…');
    try {
      const fl = await sediakanFail(file);
      const r = await call('muatNaikMinit', { id, fail: { nama: fl.nama, mime: fl.mime, data: fl.data } }, { masa: 300000 });
      const K = K_(); K.mesyuarat = (K.mesyuarat || []).map(m => (m.id === id ? Object.assign({}, m, r) : m)); simpanKur();
      toast('Minit dimuat naik'); mesyuaratSheet(id); renderKurSemasa();
    } catch (e) { toast(e.message, 'ralat'); } finally { sibuk(false); el.value = ''; }
  }
});
Object.assign(INP, { tkTindih: () => semakTindih() });

/* ---------- Pendengar global ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A') return;
  e.preventDefault();
  fn(el, e);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el, e); });
document.addEventListener('input', e => { const el = e.target.closest('[data-inp]'); if (el && INP[el.dataset.inp]) INP[el.dataset.inp](el, e); });
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-sub]');
  if (!f) return;
  e.preventDefault();
  const b = f.querySelector('[type=submit]');
  if (b) { b.disabled = true; setTimeout(() => { b.disabled = false; }, 1500); }
  SUB[f.dataset.sub](f, e);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const z = $('.zoom'); if (z) return z.remove();
  tutupSheet();
});
window.addEventListener('online', () => { setLuar(false); paparAntri(); if (S.token && S.data) { hantarOutbox(); sync(); } });
window.addEventListener('offline', () => { paparAntri(); setLuar(true); });

/* ---------- PWA ---------- */
function ikonPNG(n) {
  const c = document.createElement('canvas'); c.width = c.height = n;
  const x = c.getContext('2d');
  x.fillStyle = '#145C43'; x.fillRect(0, 0, n, n);
  const w = n * 0.13, gap = n * 0.045, base = n * 0.74;
  const warna = ['#F2B705', '#FFFFFF', '#9CC7B2', '#F2B705'];
  const tinggi = [0.46, 0.54, 0.42, 0.5];
  let sx = (n - (4 * w + 3 * gap)) / 2;
  warna.forEach((col, i) => {
    const h = n * tinggi[i];
    x.fillStyle = col; x.fillRect(sx, base - h, w, h);
    x.fillStyle = '#145C43'; x.beginPath(); x.arc(sx + w / 2, base - h * 0.2, w * 0.2, 0, Math.PI * 2); x.fill();
    sx += w + gap;
  });
  x.fillStyle = '#C9A06A'; x.fillRect(n * 0.16, base, n * 0.68, n * 0.045);
  return c.toDataURL('image/png');
}
function pasangPWA() {
  try {
    const fav = document.createElement('link'); fav.rel = 'icon'; fav.href = ikonPNG(64); document.head.appendChild(fav);
    const apple = document.createElement('link'); apple.rel = 'apple-touch-icon'; apple.href = ikonPNG(180); document.head.appendChild(apple);
    if (!DI_GAS()) {
      const man = {
        name: 'e-Kurikulum', short_name: 'e-Kurikulum', start_url: location.origin + location.pathname, scope: location.origin + location.pathname.replace(/[^/]*$/, ''),
        display: 'standalone', background_color: '#E9EEEA', theme_color: '#145C43',
        icons: [{ src: ikonPNG(192), sizes: '192x192', type: 'image/png' }, { src: ikonPNG(512), sizes: '512x512', type: 'image/png', purpose: 'any maskable' }]
      };
      const l = document.createElement('link'); l.rel = 'manifest';
      l.href = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: 'application/manifest+json' }));
      document.head.appendChild(l);
    }
  } catch (e) { /* */ }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.pasang = e; });
}
