/* =========================================================================
 * PAPAN PEMUKA AWAM (boleh dilihat tanpa log masuk)
 * ========================================================================= */
function stopTimers() {
  ['tvRot', 'tvData', 'tvClock', 'awamTimer'].forEach(k => { if (S[k]) { clearInterval(S[k]); clearTimeout(S[k]); S[k] = null; } });
}
const pubKatColor = (d, id) => { const i = d.kategori.findIndex(k => k.id === id); const k = d.kategori[i]; return (k && k.warna) || PALET[(i < 0 ? 5 : i) % PALET.length]; };
const pubPatch = (d, u, cls = '') => `<span class="patch ${cls}" style="--c:${pubKatColor(d, u.idKategori)}">${esc(initials(u.nama || u.unit))}</span>`;

function chartSvg(trend) {
  const pts = trend.filter(t => t.peratus != null);
  if (!pts.length) return `<p class="muted small" style="margin:0">Graf dipaparkan selepas kehadiran perjumpaan pertama direkod.</p>`;
  const W = 440, H = 240, pl = 44, pr = 16, pt = 28, pb = 36;
  const n = pts.length, iw = W - pl - pr, ih = H - pt - pb;
  const x = i => pl + (n === 1 ? iw / 2 : iw * i / (n - 1));
  const y = p => pt + (100 - p) / 100 * ih;
  const grid = [0, 50, 80, 100].map(v => `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line);stroke-width:1${v === 80 ? ';stroke-dasharray:4 4' : ''}"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end" style="fill:var(--ink-3);font-size:14px">${v}%</text>`).join('');
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.peratus).toFixed(1)}`).join(' ');
  const area = `${line} L${x(n - 1).toFixed(1)},${y(0)} L${x(0).toFixed(1)},${y(0)} Z`;
  const dots = pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.peratus)}" r="5" style="fill:var(--surface);stroke:var(--primary);stroke-width:3"/>
    <text x="${x(i)}" y="${y(p.peratus) - 11}" text-anchor="middle" style="fill:var(--ink);font-size:15px;font-weight:700">${p.peratus}</text>
    <text x="${x(i)}" y="${H - 12}" text-anchor="middle" style="fill:var(--ink-3);font-size:14px">P${p.bil}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Peratus kehadiran bagi setiap perjumpaan" style="width:100%;height:auto;display:block">${grid}
    <path d="${area}" style="fill:var(--primary);opacity:.1"/><path d="${line}" style="fill:none;stroke:var(--primary);stroke-width:3;stroke-linejoin:round;stroke-linecap:round"/>${dots}</svg>
    <p class="hint" style="margin:6px 0 0">Garis putus-putus menandakan sasaran 80%.</p>`;
}

function pubTicket(d) {
  const n = d.seterusnya;
  if (!n) return `<div class="ticket"><div class="ticket-coin">${ic('cal')}<small>Jadual</small></div><div><p style="margin:0">Perjumpaan seterusnya</p><h2>Belum ditetapkan</h2><p>Jadual akan dikemas kini oleh pihak sekolah.</p></div></div>`;
  const j = d.jadual.find(x => x.id === n.id) || {};
  const beza = daysDiff(d.today, n.tarikh);
  const bila = beza === 0 ? '' : beza === 1 ? 'Esok' : beza + ' hari lagi';
  return `<div class="ticket"><div class="ticket-coin">${n.bil}<small>Perjumpaan</small></div><div><p style="margin:0">${beza === 0 ? 'Perjumpaan hari ini' : 'Perjumpaan seterusnya'}</p><h2>${esc(fmtDate(n.tarikh, true))}</h2>${bila || j.catatan ? `<p>${esc([bila, j.catatan].filter(Boolean).join('. '))}</p>` : ''}</div></div>`;
}
function angkaHtml(d) {

    ${cat.length ? `<div class="list" style="margin-top:4px">${cat.map(j => `<div class="row"><span class="coin ${j.status === 'Dibatalkan' ? 'is-off' : ''}" style="width:40px;height:40px"><b>${j.bil}</b></span><div class="row-main"><div class="row-title">${esc(j.catatan)}</div><div class="row-sub">${j.tarikh ? esc(fmtDate(j.tarikh, true)) : 'Tarikh belum ditetapkan'}${j.status === 'Dibatalkan' ? ', dibatalkan' : ''}</div></div></div>`).join('')}</div>` : ''}`;

function pencapaianHtml(d, max = 20) {

function awamBody(d) {
  const o = d.opt || {};
  const secs = AWAM_SEC.filter(([k]) => (k !== 'pencapaian' || o.AWAM_PENCAPAIAN !== 'Sembunyi') && (k !== 'galeri' || o.AWAM_GALERI !== 'Tidak'));
  const sec = (id, title, body, sub = '') => `<section id="aw-${id}" class="aw-sec"><div class="sec"><h2>${title}</h2>${sub ? `<span class="small muted">${sub}</span>` : ''}</div>${body}</section>`;
  let h = `<nav class="tabs" aria-label="Bahagian papan pemuka">${secs.map(([k, l]) => `<button type="button" class="tab" data-act="jump" data-to="${k}">${l}</button>`).join('')}</nav>`;
  h += `<section id="aw-ringkasan" class="aw-sec"><div class="pub-hero"><div>${pubTicket(d)}</div>${d.pengumuman.length ? `<div>${pengumumanHtml(d)}</div>` : ''}</div>

  if (o.AWAM_SEMAKAN !== 'Tidak') {
    h += `<section class="semak"><div class="hstack" style="gap:10px;flex-wrap:nowrap;margin-bottom:10px"><span class="tile-ic" style="background:var(--surface)">${ic('users')}</span><div><h2 style="font-size:20px">Semak unit anak anda</h2><div class="small muted">Untuk ibu bapa: lihat unit, jawatan, kehadiran dan pencapaian anak.</div></div></div>
      <form id="fSemak" class="hstack" style="flex-wrap:nowrap" novalidate><input class="input grow" id="smK" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="No. MyKid, contoh 150101-10-1234" aria-label="Nombor MyKid anak"><button class="btn btn-primary" id="smBtn">Semak</button></form>
      <p class="hint" style="margin:8px 0 0">${ic('lock', 'i-s')} Nombor MyKid tidak dihantar ke pelayan. Ia ditukar kepada kod rahsia dalam peranti anda sebelum disemak.</p></section>`;
  }
  h += `<div class="grid2">${sec('kehadiran', 'Trend kehadiran', `<div class="card">${chartSvg(d.trend)}</div>`, 'Seluruh sekolah')}${sec('kategori', 'Pendaftaran kategori', kategoriHtml(d))}</div>`;
  h += `<div class="grid2">${sec('aktif', 'Unit paling aktif', topHtml(d), 'Laporan lengkap dan kehadiran')}${sec('jadual', 'Jadual perjumpaan', `<div class="card">${jadualHtml(d)}</div>`, 'Sesi ' + esc(d.sesi))}</div>`;
  if (o.AWAM_PENCAPAIAN !== 'Sembunyi') h += sec('pencapaian', 'Papan pencapaian', pencapaianHtml(d), 'Peringkat zon dan ke atas');
  if (o.AWAM_GALERI !== 'Tidak') h += sec('galeri', 'Galeri aktiviti', galeriHtml(d), 'Daripada laporan yang disahkan');
  h += sec('direktori', 'Direktori unit', direktoriHtml(d));
  h += `<footer class="pub-foot"><p>Data dikemas kini ${esc(fmtTs(d.dikemaskini))}. Halaman ini dikemas kini secara automatik.</p>
    <div class="hstack" style="justify-content:center"><a class="btn btn-sm" href="#/tv">${ic('eye', 'i-s')}Mod skrin TV</a>${S.token ? '' : `<a class="btn btn-sm btn-primary" href="#/masuk">Log masuk guru</a>`}</div></footer>`;
  return h;

function bindAwam(d, root) {
  hydrateImages(root);
  const q = $('#dirQ', root);
  if (q) q.oninput = () => {
    const v = q.value.trim().toLowerCase();
    $$('[data-grp] .row', root).forEach(r => r.classList.toggle('hide', !!v && !r.dataset.name.includes(v)));
    $$('[data-grp]', root).forEach(g => g.classList.toggle('hide', !$$('.row:not(.hide)', g).length));
  };
  const f = $('#fSemak', root);
  if (f) {
    const k = $('#smK', root);
    k.oninput = () => {
      const x = k.value.replace(/\D/g, '').slice(0, 12);
      k.value = x.length > 8 ? x.slice(0, 6) + '-' + x.slice(6, 8) + '-' + x.slice(8) : x.length > 6 ? x.slice(0, 6) + '-' + x.slice(6) : x;
    };
    f.onsubmit = async e => {
      e.preventDefault();
      const digits = k.value.replace(/\D/g, '');
      if (digits.length !== 12) return toast('Masukkan 12 digit nombor MyKid.', 'warn');
      await withBusy($('#smBtn', root), async () => {
        try {
          const key = 'K' + (await sha256hex(digits)).slice(0, 20);
          const r = await api('semakMurid', { k: key });
          k.value = '';
          openSemak(r, d);
        } catch (err) { toast(err.message, 'bad'); }
      });
    };
  }
  Object.assign(S.acts, {
    retry: () => route(),
    jump(el) { const t = $('#aw-' + el.dataset.to); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
    galeri(el) {
      const g = d.galeri[Number(el.dataset.i)];
      const sh = openSheet({ title: g.unit, body: `<img data-fid="${esc(g.id)}" data-pub="1" alt="" style="width:100%;border-radius:12px;display:block">${g.tajuk ? `<p style="margin:12px 0 0;font-weight:700">${esc(g.tajuk)}</p>` : ''}<p class="small muted" style="margin:6px 0 0">Perjumpaan ${g.bil}${g.tarikh ? ', ' + esc(fmtDate(g.tarikh, true)) : ''}</p>` });
      hydrateImages(sh.el);
    }
  });
}

/* =========================================================================
 * MOD SKRIN TV (paparan lobi sekolah, slaid bertukar automatik)
 * ========================================================================= */
const TV_MS = 15000;
function renderTV() {
  let d = null, idx = 0, slides = [];
  document.title = 'Mod TV | e-Kokurikulum';
  $('#app').innerHTML = `<div class="tv" id="tv"><header class="tv-h"><span id="tvLogo">${brandHtml()}</span><div><b id="tvNama">e-Kokurikulum</b><div class="tv-sub" id="tvSub">Papan pemuka kokurikulum</div></div><div class="tv-clock" id="tvClock"></div></header>
    <div class="tv-b" id="tvB"><div class="sk" style="height:60%;border-radius:20px;opacity:.2"></div></div>
    <footer class="tv-f"><div class="tv-dots" id="tvDots"></div><div class="tv-bar"><i id="tvBar"></i></div>
      <button class="btn btn-sm btn-ghost" data-act="tvFull">Skrin penuh</button><button class="btn btn-sm btn-ghost" data-act="tvExit">Keluar</button></footer></div>`;
  const clock = () => { const n = new Date(); const el = $('#tvClock'); if (el) el.innerHTML = `${String(n.getHours()).padStart(2, '0')}:${String(n.getMinutes()).padStart(2, '0')}<small>${esc(HARI[n.getDay()] + ', ' + n.getDate() + ' ' + BULAN[n.getMonth()] + ' ' + n.getFullYear())}</small>`; };
  clock();
  S.tvClock = setInterval(clock, 10000);
  const build = () => {
    const o = d.opt || {};
    const two = (a, b) => `<div class="tv-2">${a}${b}</div>`;
    slides = [
      ['Ringkasan', two(`<div>${pubTicket(d)}${d.pengumuman.length ? `<div style="margin-top:16px">${pengumumanHtml(d, 2)}</div>` : ''}</div>`, `<div>${angkaHtml(d)}</div>`)],
      d.pengumuman.length > 2 ? ['Pengumuman', pengumumanHtml(d, 4)] : null,
      ['Kehadiran', two(`<div><h3 class="tv-h3">Trend kehadiran</h3><div class="card">${chartSvg(d.trend)}</div></div>`, `<div><h3 class="tv-h3">Pendaftaran kategori</h3>${kategoriHtml(d)}</div>`)],
      ['Unit paling aktif', two(`<div>${topHtml(d)}</div>`, `<div><h3 class="tv-h3">Jadual perjumpaan</h3><div class="card">${jadualHtml(d)}</div></div>`)],
      o.AWAM_PENCAPAIAN !== 'Sembunyi' && d.pencapaian.length ? ['Papan pencapaian', pencapaianHtml(d, 6)] : null,
      o.AWAM_GALERI !== 'Tidak' && d.galeri.length ? ['Galeri aktiviti', galeriHtml(d, 8)] : null
    ].filter(Boolean);
    if (idx >= slides.length) idx = 0;
  };
  const show = () => {
    if (!slides.length) return;
    const [t, body] = slides[idx];
    const b = $('#tvB');
    if (!b) return;
    b.innerHTML = `<div class="tv-slide"><h2>${esc(t)}</h2>${body}</div>`;
    hydrateImages(b);
    $('#tvDots').innerHTML = slides.map((_, i) => `<span class="${i === idx ? 'on' : ''}"></span>`).join('');
    const bar = $('#tvBar');
    bar.style.animation = 'none'; void bar.offsetWidth; bar.style.animation = `tvBar ${TV_MS}ms linear forwards`;
  };
  const next = step => { idx = (idx + (step || 1) + slides.length) % slides.length; show(); restart(); };
  const restart = () => { clearInterval(S.tvRot); S.tvRot = setInterval(() => next(1), TV_MS); };
  const load = force => ninja('awam', 'awam', {}, v => {
    if (v.tutup) { $('#tvB').innerHTML = emptyHtml('lock', 'Paparan awam ditutup', 'Hubungi Super Admin sekolah.'); return; }
    const first = !d;
    d = v;
    S.awamNama = d.namaSekolah;
    refreshLogo(d.idLogo);
    $('#tvLogo').innerHTML = brandHtml();
    $('#tvNama').textContent = d.namaSekolah;
    $('#tvSub').textContent = 'Kokurikulum sesi ' + d.sesi;
    build();
    if (first) { show(); restart(); }
  }, { force, fresh: 60000 }).catch(e => { if (!d) $('#tvB').innerHTML = errHtml(e); });
  load(false);
  S.tvData = setInterval(() => load(true), 300000);
  S.acts = {
    retry: () => route(),
    tvFull() { const el = document.documentElement; if (document.fullscreenElement) document.exitFullscreen(); else if (el.requestFullscreen) el.requestFullscreen().catch(() => toast('Skrin penuh tidak disokong di sini.', 'warn')); },
    tvExit() { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); go(S.token ? '#/awam' : '#/utama'); },
    galeri() { next(1); }
  };
  $('#tvB').onclick = e => { if (!e.target.closest('[data-act]')) next(1); };
  S.tvKeys = S.tvKeys || (e => { if (!$('#tv')) return; if (e.key === 'ArrowRight' || e.key === ' ') { S.tvNext && S.tvNext(1); } else if (e.key === 'ArrowLeft') { S.tvNext && S.tvNext(-1); } });
  S.tvNext = next;
  document.removeEventListener('keydown', S.tvKeys);
  document.addEventListener('keydown', S.tvKeys);
}

      if (!(await confirmDlg('Buang gambar profil anda?', { ok: 'Buang', danger: true }))) return;
      try { await saveProfil({ idGambar: '' }); toast('Gambar dibuang.', 'ok'); } catch (e) { toast(e.message, 'bad'); }
    }
  };
  hydrateImages($('#pfAva'));
  $('#pfFile').onchange = async e => {

    if (!f) return;
    const box = $('#pfAva .avatar');

 *   Tab Ekstra                     : Anugerah Khas, Khidmat Masyarakat, Program NILAM, Perkhidmatan

const JENIS_PL = {
  UNIT: { nama: 'Aktiviti Kelab, Beruniform atau Sukan', ic: 'flag', sub: 'Pertandingan, program, karnival, kursus. Pelibatan, Pencapaian dan Khidmat Sumbangan.' },
  ANUGERAH: { nama: 'Anugerah Khas', ic: 'award', sub: 'Anugerah Remaja Perdana, Pengakap Raja, Anugerah Khas Kokurikulum dan lain-lain.' },
  KHIDMAT: { nama: 'Khidmat Masyarakat', ic: 'users', sub: 'Gotong-royong, kerohanian, bantuan bencana, kebudayaan dan lain-lain (dikira 1 hingga 5 kali).' },
  NILAM: { nama: 'Program NILAM', ic: 'file', sub: 'Tahap bintang NILAM murid.' },
  PERKHIDMATAN: { nama: 'Perkhidmatan', ic: 'shield', sub: 'Ketua murid, pengawas, ketua kelas dan jawatan perkhidmatan lain.' }
};
const labelKhid = v => { const [t, m] = String(v || '').split('|'); return t ? t.charAt(0) + t.slice(1).toLowerCase() + (m ? ' (' + m + ' mata)' : '') : ''; };
const labelUp = v => { const t = String(v || ''); return t ? t.charAt(0) + t.slice(1).toLowerCase() : ''; };
const optsDari = (list, v, label = x => x, kosong) => (kosong != null ? `<option value="">${esc(kosong)}</option>` : '') + list.map(x => `<option value="${esc(x)}" ${x === v ? 'selected' : ''}>${esc(label(x))}</option>`).join('');

async function pagePelibatan() {
  setTitle('Pelibatan PAJSK', 'Rekod pelibatan murid mengikut templat MOEIS');
  S.acts.retry = () => route();
  await admLoad('pelibatan', 'pelibatanBorang', {}, r => pelibatanView(r), 20000);
}

/** Ringkasan satu kumpulan rekod Ekstra untuk paparan */
function ekstraTajuk(g) {
  if (g.jenis === 'ANUGERAH') return labelUp(g.perkara);
  if (g.jenis === 'KHIDMAT') return g.aktiviti || 'Khidmat masyarakat';
  if (g.jenis === 'NILAM') return g.aktiviti || 'Program NILAM';
  return g.aktiviti || 'Perkhidmatan';
}
function ekstraNilaiLabel(x) {
  if (x.jenis === 'ANUGERAH') return x.nilai;
  if (x.jenis === 'KHIDMAT') return x.perkara;
  if (x.jenis === 'NILAM') return x.nilai;
  return labelKhid(x.perkara);
}

function pelibatanView(r) {
  const katNama = id => ((r.kategori.find(k => k.id === id) || K(id) || {}).nama) || '';
  const grup = [], gi = {};
  const tambah = (k, o, x) => { if (!gi[k]) { gi[k] = Object.assign(o, { list: [] }); grup.push(gi[k]); } gi[k].list.push(x); };
  r.rekod.forEach(x => tambah(['U', x.aktiviti, x.tarikh, x.peringkat, x.idKategori].join('|'), { jenis: 'UNIT', aktiviti: x.aktiviti, tarikh: x.tarikh, peringkat: x.peringkat, idKategori: x.idKategori }, x));
  (r.ekstra || []).forEach(x => tambah(['E', x.jenis, x.jenis === 'KHIDMAT' || x.jenis === 'ANUGERAH' ? x.perkara : '', x.aktiviti, x.tarikh].join('|'), { jenis: x.jenis, perkara: x.perkara, aktiviti: x.aktiviti, tarikh: x.tarikh }, x));
  grup.sort((a, b) => String(b.tarikh).localeCompare(String(a.tarikh)));
  const ikon = g => g.jenis === 'UNIT' ? patchHtml({ nama: katNama(g.idKategori), idKategori: g.idKategori }, 'patch-s') : `<span class="tile-ic">${ic(JENIS_PL[g.jenis].ic)}</span>`;
  const sub = g => g.jenis === 'UNIT' ? `${esc(katNama(g.idKategori))}, ${esc(g.peringkat)}` : esc(JENIS_PL[g.jenis].nama) + (g.jenis === 'KHIDMAT' ? ': ' + esc(g.perkara) : '');
  main(`${bannerHtml('', 'info', 'Semua guru boleh merekod pelibatan murid, walaupun bukan guru unit murid tersebut. Rekod terus digunakan untuk mengisi templat <b>PAJSK MOEIS</b>: tab Kelab, Beruniform, Sukan dan <b>Ekstra</b> (Anugerah Khas, Khidmat Masyarakat, NILAM, Perkhidmatan).')}
    <div class="sec"><h2>Rekod saya</h2><button class="btn btn-primary btn-sm" data-act="plBaru">${ic('plus', 'i-s')}Rekod baharu</button></div>
    ${grup.length ? `<div class="list">${grup.map((g, i) => `<button class="row row-wrap" data-act="plGrup" data-i="${i}">${ikon(g)}<div class="row-main"><div class="row-title">${esc(g.jenis === 'UNIT' ? g.aktiviti : ekstraTajuk(g))}</div><div class="row-sub">${sub(g)}${g.tarikh ? ', ' + esc(fmtDate(g.tarikh)) : ''}</div></div><span class="chip">${g.list.length} murid</span>${ic('chev', 'i-s')}</button>`).join('')}</div>`
      : emptyHtml('award', 'Belum ada rekod sesi ini', 'Tekan Rekod baharu dan pilih jenis pelibatan.', `<button class="btn btn-primary" data-act="plBaru">${ic('plus', 'i-s')}Rekod baharu</button>`)}`);
  S.acts = {
    retry: () => route(),
    plBaru: () => pilihJenisPelibatan(r),
    plGrup(el) { const g = grup[Number(el.dataset.i)]; if (g) openPelibatanGrup(r, g); }
  };
}

function pilihJenisPelibatan(r) {
  const sh = openSheet({
    title: 'Jenis pelibatan',
    body: `<div class="list">${Object.keys(JENIS_PL).map(k => `<button class="row row-wrap" data-act="pj" data-j="${k}"><span class="tile-ic">${ic(JENIS_PL[k].ic)}</span><div class="row-main"><div class="row-title">${esc(JENIS_PL[k].nama)}</div><div class="row-sub">${esc(JENIS_PL[k].sub)}</div></div>${ic('chev', 'i-s')}</button>`).join('')}</div>`,

/**
 * Pemilih murid dikongsi: carian, tapisan kelas, senarai dipilih dengan medan bagi setiap murid.
 * o.boleh(m) -> teks sebab jika tidak boleh dipilih; o.sub(m) -> teks kecil; o.baru() -> nilai lalai murid baharu;
 * o.medan(id, v) -> HTML medan bagi setiap murid (atribut data-f).
 */
function pasangPemilih(sh, r, o) {
  const murid = r.murid.map(([id, nama, kelas, unit]) => ({ id, nama, kelas, unit }));
  const byId = {}; murid.forEach(m => { byId[m.id] = m; });
  const kelasList = Array.from(new Set(murid.map(m => m.kelas).filter(Boolean))).sort(numSort);
  const st = { q: '', kelas: '', pilih: new Map() };
  sh.$('#pmBox').innerHTML = `<div class="field"><span class="label">Pilih murid <span class="muted small" id="plN">0 dipilih</span></span>
      <div class="pick-box"><div class="pick-head"><div class="search">${ic('search', 'i-s')}<input class="input" id="plQ" placeholder="Cari nama murid" autocomplete="off"></div>
      <select class="input" id="plKelas" style="max-width:130px"><option value="">Semua kelas</option>${kelasList.map(k => `<option>${esc(k)}</option>`).join('')}</select></div>
      <div class="pick-list" id="plL"></div></div></div><div id="plPilih"></div>`;
  const api2 = {
    st, byId,
    drawList() {
      const q = st.q.trim().toLowerCase();
      const L = murid.filter(m => (!st.kelas || m.kelas === st.kelas) && (!q || m.nama.toLowerCase().includes(q)));
      sh.$('#plL').innerHTML = L.slice(0, 400).map(m => {
        const tak = o.boleh ? o.boleh(m) : '';
        return `<label class="row" ${tak ? 'style="opacity:.55;cursor:not-allowed"' : ''}><input type="checkbox" value="${esc(m.id)}" ${st.pilih.has(m.id) ? 'checked' : ''} ${tak ? 'disabled' : ''}><div class="row-main"><div class="row-title">${esc(m.nama)}</div><div class="row-sub">${esc(m.kelas)}${tak ? ', ' + esc(tak) : (o.sub ? ', ' + esc(o.sub(m)) : '')}</div></div></label>`;
      }).join('') || `<div class="row small muted">Tiada murid sepadan.</div>`;
      sh.$('#plN').textContent = st.pilih.size + ' dipilih';
    },
    drawPilih() {
      sh.$('#plN').textContent = st.pilih.size + ' dipilih';
      const btn = sh.$('#plSave'); if (btn) btn.textContent = st.pilih.size ? `Simpan (${st.pilih.size} murid)` : 'Simpan';
      if (!st.pilih.size) { sh.$('#plPilih').innerHTML = ''; return; }
      sh.$('#plPilih').innerHTML = `<div class="label" style="margin:4px 2px 8px">Murid dipilih (${st.pilih.size})</div><div class="list">${Array.from(st.pilih.entries()).map(([id, v]) => {
        const m = byId[id], medan = o.medan ? o.medan(id, v) : '';
        return `<div class="row row-wrap" data-pm="${esc(id)}" style="flex-wrap:wrap;align-items:flex-start;row-gap:8px"><div class="row-main" style="flex:1 1 0;min-width:0"><div class="row-title">${esc(m.nama)}</div><div class="row-sub">${esc(m.kelas)}${o.sub ? ', ' + esc(o.sub(m)) : ''}</div></div>
          <button type="button" class="icon-btn" data-act="plBuang" data-id="${esc(id)}" aria-label="Buang ${esc(m.nama)}">${ic('x', 'i-s')}</button>
          ${medan ? `<div class="hstack" style="gap:6px;flex-wrap:wrap;flex-basis:100%">${medan}</div>` : ''}</div>`;
      }).join('')}</div>`;
    },
    data() { return Array.from(st.pilih.entries()).map(([idMurid, v]) => Object.assign({ idMurid }, v)); }
  };
  sh.acts.plBuang = el => { st.pilih.delete(el.dataset.id); api2.drawList(); api2.drawPilih(); };
  sh.$('#plL').onchange = e => {
    const i = e.target;
    if (!i.matches('input[type=checkbox]')) return;
    if (i.checked) st.pilih.set(i.value, o.baru ? o.baru() : {}); else st.pilih.delete(i.value);
    api2.drawPilih();
  };
  const ubah = e => { const el = e.target, row = el.closest('[data-pm]'); if (!row || !el.dataset.f) return; const v = st.pilih.get(row.dataset.pm); if (v) v[el.dataset.f] = el.value.trim(); };
  sh.$('#plPilih').oninput = ubah; sh.$('#plPilih').onchange = ubah;
  sh.$('#plQ').oninput = debounce(e => { st.q = e.target.value; api2.drawList(); }, 200);
  sh.$('#plKelas').onchange = e => { st.kelas = e.target.value; api2.drawList(); };
  api2.drawList(); api2.drawPilih();
  return api2;
}

function openPelibatanBaru(r, asal) {
  if (!r.kategori.length) return toast('Tiada kategori Kelab, Beruniform atau Sukan. Hubungi Super Admin.', 'warn');
  const kat = { id: (asal && asal.idKategori) || r.kategori[0].id };
  const kn = id => (r.kategori.find(k => k.id === id) || {}).nama || '';
  const sh = openSheet({
    title: asal ? 'Tambah murid' : 'Aktiviti Kelab, Beruniform atau Sukan', full: true,
    body: `<div class="field"><span class="label">Kategori PAJSK <span class="req">*</span></span><div class="pills" id="plKat" style="flex-wrap:wrap"></div></div>
      <div class="field"><label for="plA">Aktiviti, program atau pertandingan <span class="req">*</span></label><input class="input" id="plA" value="${esc(asal ? asal.aktiviti : '')}" placeholder="cth. Kejohanan Olahraga MSSD 2026"></div>
      <div class="hstack" style="align-items:flex-start"><div class="field grow"><label for="plP">Peringkat <span class="req">*</span></label><select class="input" id="plP">${PERINGKAT.map(x => `<option ${asal && asal.peringkat === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
      <div class="field grow"><label for="plT">Tarikh</label><input class="input" id="plT" type="date" max="${esc(today())}" value="${esc(asal ? asal.tarikh : today())}"></div></div>
      <div class="hstack" style="align-items:flex-start;flex-wrap:wrap"><div class="field grow"><label for="plH">Pencapaian (lalai)</label><input class="input" id="plH" list="plHL" value="Penyertaan"><datalist id="plHL">${HASIL.map(x => `<option value="${x}">`).join('')}</datalist></div>
      <div class="field grow"><label for="plK">Khidmat sumbangan (lalai)</label><select class="input" id="plK">${khidmatOpts('')}</select></div></div>
      <p class="hint" style="margin:-6px 2px 12px">Nilai lalai diberi kepada murid yang baru dipilih. Ubah bagi setiap murid dalam senarai <b>Murid dipilih</b> jika keputusan berbeza (contoh seorang Johan, yang lain Penyertaan).</p>
      <div id="pmBox"></div>`,
    foot: `<button class="btn" data-act="sheetClose">Batal</button><button class="btn btn-primary" data-act="save" id="plSave">Simpan</button>`,
    acts: {
      plKat(el) {
        kat.id = el.dataset.id;
        let buang = 0;
        Array.from(pm.st.pilih.keys()).forEach(id => { if (!pm.byId[id].unit[kat.id]) { pm.st.pilih.delete(id); buang++; } });
        if (buang) toast(buang + ' murid dibuang kerana tiada unit ' + kn(kat.id) + '.', 'warn');
        drawKat(); pm.drawList(); pm.drawPilih();
      },
      async save(el) {
        const aktiviti = sh.$('#plA').value.trim();
        if (aktiviti.length < 5) { sh.$('#plA').focus(); return toast('Isi nama aktiviti (sekurang-kurangnya 5 aksara).', 'warn'); }
        if (!pm.st.pilih.size) return toast('Pilih sekurang-kurangnya seorang murid.', 'warn');
        const data = { idKategori: kat.id, aktiviti, peringkat: sh.$('#plP').value, tarikh: sh.$('#plT').value, murid: pm.data() };
        await withBusy(el, async () => {
          try {
            const x = await api('simpanPelibatan', data);
            sh.close();
            toast(`Pelibatan disimpan untuk ${x.bil} murid.` + (x.sudahAda ? ` ${x.sudahAda} sudah direkod sebelum ini.` : '') + (x.tanpaUnit.length ? ` ${x.tanpaUnit.length} murid dilangkau kerana tiada unit.` : ''), x.tanpaUnit.length ? 'warn' : 'ok');
            selepasPelibatan();
          } catch (e) { toast(e.message, 'bad'); }
        });
      }
    }
  });
  const drawKat = () => { sh.$('#plKat').innerHTML = r.kategori.map(k => `<button type="button" class="${k.id === kat.id ? 'on' : ''}" data-act="plKat" data-id="${esc(k.id)}">${esc(k.nama)}</button>`).join(''); };
  const unitNama = m => (m.unit[kat.id] ? r.unit[m.unit[kat.id]] || 'Unit' : '');
  const pm = pasangPemilih(sh, r, {
    boleh: m => (m.unit[kat.id] ? '' : 'tiada unit ' + kn(kat.id)),
    sub: unitNama,
    baru: () => ({ pencapaian: sh.$('#plH').value.trim(), khidmat: sh.$('#plK').value }),
    medan: (id, v) => `<input class="input grow" style="min-width:130px" data-f="pencapaian" list="plHL" value="${esc(v.pencapaian)}" aria-label="Pencapaian"><select class="input grow" style="min-width:160px" data-f="khidmat" aria-label="Khidmat sumbangan">${khidmatOpts(v.khidmat)}</select>`
  });
  drawKat();
}

/** Borang tab Ekstra: ANUGERAH, KHIDMAT, NILAM, PERKHIDMATAN */
function openEkstraBaru(r, jenis, asal) {
  const L = r.senarai;
  const J = JENIS_PL[jenis];
  let atas = '', baru = () => ({}), medan = null, hint = '';
  if (jenis === 'ANUGERAH') {
    atas = `<div class="field"><label for="exP">Anugerah <span class="req">*</span></label><select class="input" id="exP">${optsDari(L.anugerah, asal && asal.perkara, labelUp, 'Pilih anugerah')}</select></div>
      <div class="field"><label for="exN">Tahap (lalai)</label><select class="input" id="exN">${optsDari(L.tahapAnugerah, 'PENERIMA', labelUp)}</select></div>`;
    baru = () => ({ nilai: sh.$('#exN').value });
    medan = (id, v) => `<select class="input grow" data-f="nilai" aria-label="Tahap">${optsDari(L.tahapAnugerah, v.nilai, labelUp)}</select>`;
    hint = 'SPPB menerima satu anugerah bagi setiap murid. Jika murid ada lebih daripada satu, anugerah yang lebih tinggi dalam senarai SPPB digunakan.';
  } else if (jenis === 'KHIDMAT') {
    atas = `<div class="field"><label for="exP">Kategori khidmat masyarakat <span class="req">*</span></label><select class="input" id="exP">${optsDari(L.khidmatMasyarakat, asal && asal.perkara, x => x, 'Pilih kategori')}</select></div>`;
    hint = 'Setiap rekod dikira satu kali penyertaan. Templat MOEIS mengisi bilangan (maksimum 5) bagi setiap kategori.';
  } else if (jenis === 'NILAM') {
    atas = `<div class="field"><label for="exN">Tahap NILAM (lalai)</label><select class="input" id="exN">${optsDari(L.nilam, '', labelUp)}</select></div>`;
    baru = () => ({ nilai: sh.$('#exN').value });
    medan = (id, v) => `<select class="input grow" data-f="nilai" aria-label="Tahap NILAM">${optsDari(L.nilam, v.nilai, labelUp)}</select>`;
    hint = 'Jika murid ada lebih daripada satu rekod, tahap bintang tertinggi digunakan.';
  } else {
    atas = `<div class="field"><label for="exN">Jawatan (lalai) <span class="req">*</span></label><select class="input" id="exN">${optsDari(L.perkhidmatan, '', labelKhid)}</select></div>`;
    baru = () => ({ nilai: sh.$('#exN').value });
    medan = (id, v) => `<select class="input grow" data-f="nilai" aria-label="Jawatan">${optsDari(L.perkhidmatan, v.nilai, labelKhid)}</select>`;
    hint = 'Jika murid memegang lebih daripada satu jawatan, jawatan dengan mata tertinggi digunakan.';
  }
  const perluAkt = jenis === 'KHIDMAT';
  const aktDef = asal ? asal.aktiviti : (jenis === 'NILAM' ? 'Program NILAM ' + ((S.boot && S.boot.sesi) || '') : '');
  const sh = openSheet({
    title: (asal ? 'Tambah murid: ' : '') + J.nama, full: true,
    body: `${atas}
      <div class="hstack" style="align-items:flex-start;flex-wrap:wrap"><div class="field grow"><label for="exA">${perluAkt ? 'Nama aktiviti <span class="req">*</span>' : 'Catatan / nama program'}</label><input class="input" id="exA" value="${esc(aktDef)}" placeholder="${perluAkt ? 'cth. Gotong-royong Surau Kg. Sg. Tua' : 'Pilihan'}"></div>

function openPelibatanGrup(r, g) {
  const unit = g.jenis === 'UNIT';
  const katN = unit ? (((r.kategori.find(k => k.id === g.idKategori) || {}).nama) || '') : '';
  const sh = openSheet({
    title: unit ? g.aktiviti : ekstraTajuk(g),
    body: `<p class="muted" style="margin-top:0">${unit ? esc(katN) + ', peringkat ' + esc(g.peringkat) : esc(JENIS_PL[g.jenis].nama)}${g.tarikh ? ', ' + esc(fmtDate(g.tarikh)) : ''}</p>
      <div class="list">${g.list.map((x, i) => `<button class="row row-wrap" data-act="plEdit" data-i="${i}"><div class="row-main"><div class="row-title">${esc(x.nama)}</div><div class="row-sub">${esc(x.kelas)}${unit ? ', ' + esc(x.unit) : ''}</div>
        <div class="row-sub" style="white-space:normal">${unit ? esc(x.pencapaian || 'Tiada pencapaian') + (x.khidmat ? ' · Khidmat: ' + esc(khidmatLabel(x.khidmat)) : '') : esc(ekstraNilaiLabel(x))}</div></div>${ic('edit', 'i-s')}</button>`).join('')}</div>`,
    foot: `<button class="btn" data-act="sheetClose">Tutup</button><button class="btn btn-primary" data-act="plTambah">${ic('plus', 'i-s')}Tambah murid</button>`,
    acts: {
      plEdit(el) { const x = g.list[Number(el.dataset.i)]; if (!x) return; sh.close(); if (unit) openPelibatanEdit(x); else openEkstraEdit(r, x); },
      plTambah() { sh.close(); if (unit) openPelibatanBaru(r, g); else openEkstraBaru(r, g.jenis, g); }
    }
  });
}

function openPelibatanEdit(x) {
  const sh = openSheet({
    title: x.nama,
    body: `<p class="muted" style="margin-top:0">${esc(x.kelas)}, ${esc(x.unit)}</p>
      <div class="field"><label for="peA">Aktiviti <span class="req">*</span></label><input class="input" id="peA" value="${esc(x.aktiviti)}"></div>
      <div class="hstack" style="align-items:flex-start"><div class="field grow"><label for="peP">Peringkat</label><select class="input" id="peP">${PERINGKAT.map(p => `<option ${p === x.peringkat ? 'selected' : ''}>${p}</option>`).join('')}</select></div>
      <div class="field grow"><label for="peT">Tarikh</label><input class="input" id="peT" type="date" max="${esc(today())}" value="${esc(x.tarikh)}"></div></div>
      <div class="field"><label for="peH">Pencapaian</label><input class="input" id="peH" list="peHL" value="${esc(x.pencapaian)}"><datalist id="peHL">${HASIL.map(h => `<option value="${h}">`).join('')}</datalist></div>
      <div class="field"><label for="peK">Khidmat sumbangan</label><select class="input" id="peK">${khidmatOpts(x.khidmat)}</select></div>`,
    foot: `<button class="btn btn-danger" data-act="del">${ic('trash', 'i-s')}Padam</button><button class="btn btn-primary" data-act="save">Simpan</button>`,
    acts: {
      async save(el) {
        const data = { id: x.id, aktiviti: sh.$('#peA').value.trim(), peringkat: sh.$('#peP').value, tarikh: sh.$('#peT').value, pencapaian: sh.$('#peH').value.trim(), khidmat: sh.$('#peK').value };
        if (data.aktiviti.length < 5) return toast('Isi nama aktiviti.', 'warn');
        await withBusy(el, async () => {
          try { await api('simpanPelibatan', data); sh.close(); toast('Rekod dikemas kini.', 'ok'); selepasPelibatan(); }
          catch (e) { toast(e.message, 'bad'); }
        });
      },
      async del() {
        if (!(await confirmDlg('Padam rekod pelibatan ' + esc(x.nama) + '?', { ok: 'Padam', danger: true }))) return;
        try { await api('deletePencapaian', { id: x.id }); sh.close(); toast('Rekod dipadam.', 'ok'); selepasPelibatan(); }
        catch (e) { toast(e.message, 'bad'); }
      }
    }
  });
}

function openEkstraEdit(r, x) {
  const L = r.senarai;
  let f = '';
  if (x.jenis === 'ANUGERAH') f = `<div class="field"><label for="eeP">Anugerah</label><select class="input" id="eeP">${optsDari(L.anugerah, x.perkara, labelUp)}</select></div><div class="field"><label for="eeN">Tahap</label><select class="input" id="eeN">${optsDari(L.tahapAnugerah, x.nilai, labelUp)}</select></div>`;
  else if (x.jenis === 'KHIDMAT') f = `<div class="field"><label for="eeP">Kategori</label><select class="input" id="eeP">${optsDari(L.khidmatMasyarakat, x.perkara)}</select></div>`;
  else if (x.jenis === 'NILAM') f = `<div class="field"><label for="eeN">Tahap NILAM</label><select class="input" id="eeN">${optsDari(L.nilam, x.nilai, labelUp)}</select></div>`;
  else f = `<div class="field"><label for="eeP">Jawatan</label><select class="input" id="eeP">${optsDari(L.perkhidmatan, x.perkara, labelKhid)}</select></div>`;
  const sh = openSheet({
    title: x.nama,
    body: `<p class="muted" style="margin-top:0">${esc(x.kelas)}, ${esc(JENIS_PL[x.jenis].nama)}</p>${f}
      <div class="field"><label for="eeA">${x.jenis === 'KHIDMAT' ? 'Nama aktiviti' : 'Catatan / nama program'}</label><input class="input" id="eeA" value="${esc(x.aktiviti)}"></div>
      <div class="field"><label for="eeT">Tarikh</label><input class="input" id="eeT" type="date" max="${esc(today())}" value="${esc(x.tarikh)}"></div>`,
    foot: `<button class="btn btn-danger" data-act="del">${ic('trash', 'i-s')}Padam</button><button class="btn btn-primary" data-act="save">Simpan</button>`,
    acts: {
      async save(el) {
        const v = s2 => (sh.$(s2) ? sh.$(s2).value : '');
        const data = { id: x.id, perkara: v('#eeP'), nilai: v('#eeN'), aktiviti: v('#eeA').trim(), tarikh: v('#eeT') };
        await withBusy(el, async () => {
          try { await api('simpanEkstra', data); sh.close(); toast('Rekod dikemas kini.', 'ok'); selepasPelibatan(); }
          catch (e) { toast(e.message, 'bad'); }
        });
      },
      async del() {
        if (!(await confirmDlg('Padam rekod ' + esc(JENIS_PL[x.jenis].nama) + ' bagi ' + esc(x.nama) + '?', { ok: 'Padam', danger: true }))) return;
        try { await api('padamEkstra', { id: x.id }); sh.close(); toast('Rekod dipadam.', 'ok'); selepasPelibatan(); }
        catch (e) { toast(e.message, 'bad'); }
      }
    }
  });
}

ROUTES.push(
  [/^#\/utama$/, pageHome],
  [/^#\/unit$/, pageUnits],
  [/^#\/unit\/([^/]+)(?:\/([a-z]+))?$/, pageUnit],
  [/^#\/laporan\/([^/]+)\/([^/]+)$/, pageLaporan],
  [/^#\/cetak\/([^/]+)\/([^/]+)$/, pageCetak],
  [/^#\/admin(?:\/([a-z]+))?$/, pageAdmin],
  [/^#\/profil$/, pageProfil],
  [/^#\/awam$/, pageAwam],
  [/^#\/sahkan$/, () => pageAdmin('sahkan')],
  [/^#\/kelas(?:\/([a-z]+))?$/, pageKelas],
  [/^#\/pajsk$/, () => go('#/kelas/pajsk')],
  [/^#\/pelibatan$/, pagePelibatan]
);

/* Satu pendengar klik untuk semua butang data-act (halaman dan lembaran) */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  const sh = S.sheets.slice().reverse().find(s => s.el.contains(el));
  if (sh) {
    if (act === 'sheetClose') { sh.close(); return; }
    const fn = sh.acts[act] || AUTH_ACTS[act];
    if (fn) { e.preventDefault(); fn(el, e); }
    return;
  }
  if (act === 'syncNow') { syncQueue(true); return; }
  const fn = S.acts[act] || AUTH_ACTS[act] || (act === 'logout' ? () => doLogout() : null);
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.sheets.length) S.sheets[S.sheets.length - 1].close();
});
window.addEventListener('hashchange', onHash);
window.addEventListener('online', () => { updateSync(); toast('Sambungan internet pulih.', 'ok'); syncQueue(); });
window.addEventListener('offline', () => { updateSync(); toast('Anda di luar talian. Data dalam cache masih boleh dibuka.', 'warn'); });
window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

/* Ninja fetch semasa kembali ke aplikasi: semak data di latar tanpa mengganggu pengguna */
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { hiddenAt = Date.now(); return; }
  if (!S.token || !S.boot) return;
  syncQueue();
  if (hiddenAt && Date.now() - hiddenAt > CONFIG.FRESH_MS) {
    ninja('boot', 'bootstrap', {}, v => { S.boot = v; S.user = v.user; renderNav(); setBrand(); }, { force: true }).catch(() => {});
    softRefresh();
  }
});
if (window.matchMedia) {
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const f = () => { if ((localStorage.getItem('koku_theme') || 'auto') === 'auto') applyTheme('auto'); };
  if (mq.addEventListener) mq.addEventListener('change', f); else if (mq.addListener) mq.addListener(f);
}

(async function init() {
  applyTheme(localStorage.getItem('koku_theme') || 'auto');
  await loadQueue();
  // Dihos dalam Apps Script: ambil #hash daripada URL /exec (contoh …/exec#/tv untuk skrin TV)
  if (inGas() && google.script.url && !location.hash) {
    await new Promise(res => { try { google.script.url.getLocation(l => { if (l && l.hash) location.replace('#' + String(l.hash).replace(/^#/, '')); res(); }); } catch (e) { res(); } setTimeout(res, 1500); });
  }
  route();
})();


/* Pilih unit untuk disertai (dari = null) atau untuk ditukar (dari = id unit semasa) */
function pilihUnit(dari) {
  const b = S.boot, u = S.user;
  const mine = {};
  (b.saya || []).forEach(s => { if (s.status === 'Aktif' || s.status === 'Menunggu') mine[s.idUnit] = 1; });
  const asal = dari ? U(dari) : null;
  const avail = b.unit.filter(x => x.status !== 'Tidak Aktif' && !mine[x.id]);
  const kats = b.kategori.slice().sort((a, c) => (asal && a.id === asal.idKategori ? -1 : 0) - (asal && c.id === asal.idKategori ? -1 : 0) || a.susunan - c.susunan);
  const sh = openSheet({
    title: dari ? 'Tukar unit' : 'Sertai unit', full: avail.length > 6,
    body: avail.length ? `<p class="muted" style="margin-top:0">${dari ? `Pilih unit baharu. Anda akan keluar daripada <b>${esc(asal ? asal.nama : '')}</b> dan terus menjadi guru penasihat unit yang dipilih.` : 'Anda terus menjadi guru penasihat unit yang dipilih.'}</p>` + kats.map(k => {
      const us = avail.filter(x => x.idKategori === k.id);
      return us.length ? `<div class="group-h" style="--c:${katColor(k.id)}"><span class="bar-c"></span>${esc(k.nama)}${asal && k.id === asal.idKategori ? ' <span class="chip">Kategori sama</span>' : ''}</div><div class="list">${us.map(x => `<button class="row" data-act="pilih" data-id="${esc(x.id)}">${patchHtml(x, 'patch-s')}<div class="row-main"><div class="row-title">${esc(x.nama)}</div><div class="row-sub">${x.ahli} ahli</div></div><span class="chip chip-pri">${dari ? 'Tukar' : 'Sertai'}</span></button>`).join('')}</div>` : '';
    }).join('') : emptyHtml('flag', 'Tiada unit lain', 'Anda sudah menyertai semua unit yang ada.'),
    acts: {
      async pilih(el) {
        const ke = U(el.dataset.id);
        if (dari && !(await confirmDlg(`Tukar daripada <b>${esc(asal.nama)}</b> ke <b>${esc(ke.nama)}</b>?`, { ok: 'Tukar' }))) return;
        sh.close();
        await ubahUnit(dari ? { dari, ke: ke.id } : { ke: ke.id }, dari ? `Anda kini guru penasihat ${ke.nama}.` : `Anda kini guru penasihat ${ke.nama}.`);
      }
    }
  });
}
async function ubahUnit(data, msg) {
  try {
    const r = await api('tukarUnit', data);
    toast(msg, 'ok');
    if (r.tanpaAdmin) toast(`${r.namaDari} kini tiada ketua unit. Super Admin perlu melantik ketua baharu.`, 'warn');
    await cacheStale('dash', 'unit');
    await refreshBoot();
    route(true);
  } catch (e) { toast(e.message, 'bad'); }
}
</script>
