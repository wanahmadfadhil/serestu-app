        </div>
        <div class="stack-s" style="gap:2px"><button class="icon-btn" data-act="mv" data-i="${i}" data-d="-1" aria-label="Naik" ${i === 0 ? 'disabled' : ''}>${ic('up', 'i-s')}</button><button class="icon-btn" data-act="mv" data-i="${i}" data-d="1" aria-label="Turun" ${i === items.length - 1 ? 'disabled' : ''}>${ic('down', 'i-s')}</button><button class="icon-btn" style="color:var(--bad)" data-act="rm" data-i="${i}" aria-label="Buang">${ic('trash', 'i-s')}</button></div>
      </div></div>`;
    }).join('') : `<div class="empty" style="padding:20px"><p>Belum ada jawatan.</p><button class="btn" data-act="tpl">${ic('wand')}Isi templat asas</button></div>`;
    hydrateImages(sh.el);
  };
  const sh = openSheet({
    title: 'Sunting carta organisasi', full: true,
    body: `<datalist id="jawList">${JAWATAN.map(j => `<option value="${j}">`).join('')}</datalist><p class="hint" style="margin-top:0">Susunan menentukan kedudukan dalam carta: guru di atas, diikuti murid mengikut urutan. Tekan bulatan gambar untuk menambah atau menukar gambar. Jawatan guru menggunakan gambar profil guru jika tiada gambar khas.</p><div id="ceList"></div>
      <div class="hstack"><button class="btn" data-act="addG">${ic('plus')}Jawatan guru</button><button class="btn" data-act="addM">${ic('plus')}Jawatan murid</button></div>`,
    foot: `<button class="btn" data-act="sheetClose">Batal</button><button class="btn btn-primary" data-act="save">Simpan carta</button>`,
    acts: {
      addG() { items.push({ jenis: 'Guru', jawatan: items.some(x => x.jenis === 'Guru') ? 'Guru Penasihat' : 'Ketua Guru Penasihat', idRujukan: '', idGambar: '' }); items.sort((a, b) => (a.jenis === 'Guru' ? 0 : 1) - (b.jenis === 'Guru' ? 0 : 1)); draw(); },
      addM() { items.push({ jenis: 'Murid', jawatan: '', idRujukan: '', idGambar: '' }); draw(); },
      tpl() {
        items = [{ jenis: 'Guru', jawatan: 'Ketua Guru Penasihat' }].concat(['Pengerusi', 'Naib Pengerusi', 'Setiausaha', 'Bendahari', 'AJK', 'AJK'].map(j => ({ jenis: 'Murid', jawatan: j })))
          .map(x => Object.assign({ idRujukan: '', idGambar: '' }, x));
        draw();

      async save(el) {

          } catch (e) { toast(e.message, 'bad'); }
        });
      }
    }
  });
  sh.el.addEventListener('change', async e => {
    const t = e.target;
    if (t.dataset.photo !== undefined && t.files && t.files[0]) {
      const i = Number(t.dataset.photo);
      const lab = t.closest('label');
      lab.innerHTML = '<span class="sk" style="width:100%;height:100%;border-radius:50%"></span>';
      try { items[i].idGambar = await uploadImage(t.files[0], { idUnit: d.unit.id, max: 600 }); }
      catch (err) { toast(err.message, 'bad'); }
      draw();
      return;
    }
    if (t.dataset.k) { items[Number(t.dataset.i)][t.dataset.k] = t.value; if (t.dataset.k === 'jenis' || t.dataset.k === 'idRujukan') { if (t.dataset.k === 'jenis') items[Number(t.dataset.i)].idRujukan = ''; draw(); } }
  });
  sh.el.addEventListener('input', e => { const t = e.target; if (t.dataset.k === 'jawatan') items[Number(t.dataset.i)].jawatan = t.value; });
  draw();
}

          try { const r = await api('savePencapaian', data); sh.close(); toast(r.bil > 1 ? `Pencapaian disimpan untuk ${r.bil} murid.` : 'Pencapaian disimpan.', 'ok'); reloadUnit(d.unit.id); }

const drafKey = (u, p) => 'koku_draf:' + u + ':' + p;
function readDraf(u, p) { try { return JSON.parse(localStorage.getItem(drafKey(u, p)) || 'null'); } catch (e) { return null; } }
async function patchUnitCache(id, fn) {

}

function lfFieldHtml(f, v, can, ai) {
  const id = 'lf_' + f.id;
  const req = f.wajib ? ' <span class="req">*</span>' : '';
  if (!can) {
    if (f.jenis === 'gambar') {
      const list = Array.isArray(v) ? v : [];
      return `<div class="field"><span class="label">${esc(f.label)}</span>${list.length ? `<div class="thumbs">${list.map(fid => `<div class="thumb"><img data-fid="${esc(fid)}" alt=""></div>`).join('')}</div>` : '<span class="muted">Tiada gambar</span>'}</div>`;
    }
    const txt = v ? (f.jenis === 'tarikh' ? fmtDate(v, true) : v) : '';
    return `<div class="field"><span class="label">${esc(f.label)}</span><div style="white-space:pre-wrap">${txt ? esc(txt) : '<span class="muted">Tiada</span>'}</div></div>`;
  }
  const lbl0 = `<label for="${id}">${esc(f.label)}${req}</label>`;
  const lbl = ai && aiSasaran(f) ? `<div class="lbl-row">${lbl0}<button type="button" class="ai-mini" data-act="aiSatu" data-f="${esc(f.id)}" title="Jana ${esc(f.label)} dengan AI">${ic('wand')}Jana</button></div>` : lbl0;
  const val = esc(v || '');
  if (f.id === 'tajuk') return `<div class="field">${lbl}<input class="input" id="${id}" maxlength="150" value="${val}" placeholder="Contoh: Latihan ikatan simpul asas"></div>`;
  switch (f.jenis) {
    case 'panjang': return `<div class="field">${lbl}<textarea class="input" id="${id}" rows="4">${val}</textarea></div>`;
    case 'tarikh': return `<div class="field">${lbl}<input class="input" id="${id}" type="date" value="${val}"></div>`;
    case 'masa': return `<div class="field">${lbl}<input class="input" id="${id}" type="time" value="${val}"></div>`;
    case 'pilihan': return `<div class="field">${lbl}<select class="input" id="${id}"><option value="">Pilih</option>${(f.pilihan || []).map(p => `<option ${p === v ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select></div>`;
    case 'gambar': return `<div class="field"><span class="label">${esc(f.label)}${req}</span><div class="thumbs" id="${id}"></div><span class="hint">Maksimum 6 gambar. Gambar dimampatkan secara automatik sebelum dimuat naik.</span></div>`;
    default: return `<div class="field">${lbl}<input class="input" id="${id}" value="${val}"></div>`;
  }
}

function renderLaporan(idP) {
  const d = S.ud;
  const j = jadual().find(x => x.id === idP);
  if (!j) {
    main(emptyHtml('cal', 'Perjumpaan tidak dijumpai', 'Jadual mungkin telah dikemas kini.', `<a class="btn" href="#/unit/${esc(d.unit.id)}/laporan">Kembali ke senarai</a>`));
    return;
  }
  const l = d.laporan.find(x => x.idPerjumpaan === idP) || null;
  const st = l ? l.status : '';
  const fmt0 = l ? formatV(l.versi) : activeFormat();
  const fmt = fmtLap(fmt0);
  const sup = S.user.super;
  const bolehSah = sup || !!S.user.pengesah;
  const can = !!d.peranan && j.status !== 'Dibatalkan' && (st === '' || st === 'Draf' || st === 'Dikembalikan');
  const local = can ? readDraf(d.unit.id, idP) : null;
  const val = Object.assign({}, (l && l.data) || {}, local ? local.data : {});
  fmt.medan.forEach(f => { if (f.jenis === 'tarikh' && !val[f.id] && j.tarikh) val[f.id] = j.tarikh; });
  S.lf = { unit: d.unit.id, idP, j, l, fmt, gambar: {} };
  fmt.medan.filter(f => f.jenis === 'gambar').forEach(f => { S.lf.gambar[f.id] = Array.isArray(val[f.id]) ? val[f.id].slice(0, 6) : []; });

  const wajib = d.ahli.filter(m => sudahMasuk(m, j));
  const hadir = wajib.filter(m => (d.kehadiran[m.id] || {})[j.bil] === 'H').length;
  const direkod = wajib.filter(m => (d.kehadiran[m.id] || {})[j.bil]).length;
  const coinCls = st === 'Disahkan' || st === 'Dihantar' ? 'is-done' : st ? 'is-part' : (isHeld(j) ? 'is-due' : '');

  let h = `<div class="card-flat spread" style="margin-bottom:14px"><div class="hstack" style="gap:12px;flex-wrap:nowrap"><span class="coin ${coinCls}"><b>${j.bil}</b></span><div><b>Perjumpaan ${j.bil}</b><div class="small muted">${j.tarikh ? esc(fmtDate(j.tarikh, true)) : 'Tarikh belum ditetapkan'}</div></div></div><div class="hstack" style="gap:6px">${lapChip(st)}${l ? `<a class="icon-btn" href="#/cetak/${esc(d.unit.id)}/${esc(idP)}" aria-label="Cetak laporan">${ic('print')}</a>` : ''}</div></div>`;

  if (j.status === 'Dibatalkan') h += bannerHtml('info', 'info', 'Perjumpaan ini telah dibatalkan. Laporan tidak diperlukan.');
  else if (st === 'Dikembalikan') h += bannerHtml('bad', 'alert', `<b>Dikembalikan untuk pembetulan${l.pengesah ? ' oleh ' + esc(l.pengesah) : ''}.</b><br>${esc(l.catatan || '')}`);
  else if (st === 'Dihantar') h += bannerHtml('info', bolehSah ? 'file' : 'clock', bolehSah ? 'Semak laporan ini, kemudian sahkan atau kembalikan kepada guru untuk pembetulan.' : `Dihantar oleh ${esc(l.pelapor)} pada ${esc(fmtTs(l.tarikhHantar))}. Laporan sedang menunggu pengesahan.`);
  else if (st === 'Disahkan') h += bannerHtml('ok', 'check', `Disahkan oleh ${esc(l.pengesah)} pada ${esc(fmtTs(l.tarikhSah))}. Laporan ini telah dikunci.`);
  if (can && j.tarikh && j.tarikh > today()) h += bannerHtml('info', 'cal', 'Perjumpaan ini belum berlangsung. Anda boleh menyediakan draf lebih awal.');
  if (local) h += bannerHtml('info', 'info', `<div class="spread"><span>Perubahan yang belum disimpan telah dipulihkan daripada peranti ini.</span><button class="btn btn-sm btn-ghost" data-act="buangLocal">Buang</button></div>`);

  const lengkap = wajib.length && direkod >= wajib.length;
  h += `<div class="card-flat spread" style="margin:12px 0 14px"><div><b>Kehadiran murid</b><div class="small muted">${!wajib.length ? 'Unit ini belum mempunyai ahli bagi perjumpaan ini.' : lengkap ? 'Dikira automatik daripada rekod kehadiran.' : `Rekod belum lengkap: ${direkod} daripada ${wajib.length} murid telah ditanda.`}</div>
    ${!lengkap && wajib.length && isHeld(j) ? `<a class="small" href="#/unit/${esc(d.unit.id)}/kehadiran">Lengkapkan kehadiran</a>` : ''}</div><span class="pct">${hadir}<span class="muted" style="font-size:16px">/${wajib.length}</span></span></div>`;

  const aiOn = can && aiSedia() && fmt.medan.some(aiSasaran);
  const aiCard = aiOn ? `<div class="ai-card"><span class="tile-ic">${ic('wand')}</span><div class="grow"><b>Pembantu AI</b><span class="small muted">Jana objektif, aktiviti dan refleksi berdasarkan Tajuk. Semak dan ubah suai sebelum menghantar.</span></div><button type="button" class="btn btn-primary btn-sm" data-act="aiJana">Jana</button></div>` : '';
  if (!fmt0.medan.length) h += emptyHtml('file', 'Format laporan belum ditetapkan', 'Super Admin perlu menetapkan medan laporan dahulu.');
  else h += `<form class="card" id="fLap" novalidate>${fmt.medan.map(f => lfFieldHtml(f, val[f.id], can, aiOn) + (f.id === 'tajuk' ? aiCard : '')).join('')}</form>`;
  if (can && sup && !aiSedia() && S.boot.tetapan.AI_AKTIF !== 'Tidak') h += `<p class="hint" style="margin:10px 2px">${ic('wand', 'i-s')} Pembantu AI boleh menjana objektif, aktiviti dan refleksi. <a href="#/admin/ai">Sediakan sekarang</a>.</p>`;

  if (l && (l.pelapor || l.kemaskini)) h += `<p class="small muted" style="margin:10px 2px">${l.pelapor ? 'Pelapor: ' + esc(l.pelapor) + '. ' : ''}Kemas kini terakhir ${esc(fmtTs(l.kemaskini))}. Format versi ${esc(l.versi)}.</p>`;

  let bar = '';
  if (can && fmt0.medan.length) {
    bar = `<div class="savebar"><div class="small muted grow" id="lfInfo">${local ? 'Belum dihantar ke pelayan' : 'Simpan automatik aktif'}</div><button class="btn" data-act="lfSave">Simpan draf</button><button class="btn btn-primary" data-act="lfSend">Hantar</button></div>`;
  } else if (bolehSah && (st === 'Dihantar' || st === 'Disahkan')) {
    bar = `<div class="savebar"><div class="grow"></div><button class="btn btn-danger" data-act="lfReturn">Kembalikan</button>${st === 'Dihantar' ? `<button class="btn btn-ok" data-act="lfApprove">${ic('check')}Sahkan</button>` : ''}</div>`;
  }
  $('#main').classList.toggle('page-savebar', !!bar);
  main(h + bar);
  hydrateImages($('#main'));
  if (can) {
    Object.keys(S.lf.gambar).forEach(drawGambar);
    const autosave = debounce(saveLocalDraft, 500);
    $('#main').oninput = e => { if (e.target.closest('#fLap')) { S.dirty = true; const i = $('#lfInfo'); if (i) i.textContent = 'Belum dihantar ke pelayan'; autosave(); } };
    $('#main').onchange = e => {
      const inp = e.target;
      if (inp.dataset && inp.dataset.gf) { addGambar(inp.dataset.gf, Array.from(inp.files || [])); inp.value = ''; return; }
      if (inp.closest('#fLap')) { S.dirty = true; autosave(); }
    };
  }
  S.acts = {
    retry: () => route(),
    lfSave: el => saveLaporanNow(el, false),
    lfSend: el => saveLaporanNow(el, true),
    aiJana: () => aiBuka(),
    async aiSatu(el) {
      const f = S.lf.fmt.medan.find(x => x.id === el.dataset.f);
      const box = $('#lf_' + f.id);
      if (box && box.value.trim() && !(await confirmDlg(`Ganti teks ${esc(f.label.toLowerCase())} sedia ada dengan teks baharu daripada AI?`, { ok: 'Ganti' }))) return;
      el.classList.add('is-busy');
      try { await aiJalan([f.id], S.lf.aiNota || ''); } finally { el.classList.remove('is-busy'); }
    },
    rmImg(el) {
      const g = S.lf.gambar[el.dataset.f];
      g.splice(Number(el.dataset.i), 1);
      S.dirty = true; saveLocalDraft(); drawGambar(el.dataset.f);
    },
    async buangLocal() {
      if (!(await confirmDlg('Buang perubahan yang disimpan dalam peranti ini dan kembali kepada versi pelayan?', { ok: 'Buang', danger: true }))) return;
      localStorage.removeItem(drafKey(S.lf.unit, S.lf.idP));
      S.dirty = false;
      renderLaporan(idP);
    },
    async lfApprove(el) {
      if (!(await confirmDlg('Sahkan laporan ini? Laporan akan dikunci daripada suntingan.', { ok: 'Sahkan' }))) return;
      reviewLaporan(el, 'Disahkan', '');
    },
    async lfReturn(el) {
      const c = await promptDlg('Kembalikan laporan', 'Nyatakan pembetulan yang diperlukan', { ok: 'Kembalikan', long: true, hint: 'Catatan ini akan dipaparkan kepada guru penasihat.' });
      if (c) reviewLaporan(el, 'Dikembalikan', c);
    }
  };
}

/* ---------- Pembantu AI dalam borang laporan ---------- */
function aiTajuk() {
  const t = $('#lf_tajuk');
  const v = t ? t.value.trim() : '';
  if (v.length < 3) {
    toast('Isi Tajuk dahulu. AI menggunakan Tajuk untuk menulis laporan.', 'warn');
    if (t) { t.scrollIntoView({ block: 'center', behavior: 'smooth' }); t.focus({ preventScroll: true }); }
    return '';
  }
  return v;
}
function aiBuka() {
  if (!aiTajuk()) return;
  const sas = S.lf.fmt.medan.filter(aiSasaran);
  const kosong = sas.filter(f => !($('#lf_' + f.id) || {}).value);
  const pilih = new Set((kosong.length ? kosong : sas).map(f => f.id));
  const sh = openSheet({
    title: 'Jana dengan AI',
    body: `<dl class="kv" style="margin-bottom:14px"><dt>Tajuk</dt><dd>${esc($('#lf_tajuk').value.trim())}</dd><dt>Unit</dt><dd>${esc(S.ud.unit.nama)}, perjumpaan ${S.lf.j.bil}</dd></dl>
      <div class="field"><label for="aiNota">Catatan ringkas (pilihan)</label><textarea class="input" id="aiNota" rows="3" maxlength="800" placeholder="Contoh: latihan simpul manuk dan buku sila, murid dibahagi 4 kumpulan, ada pertandingan kecil">${esc(S.lf.aiNota || '')}</textarea><span class="hint">Lebih banyak maklumat sebenar, lebih tepat hasilnya.</span></div>
      <div class="field"><span class="label">Medan yang dijana</span>${sas.map(f => { const ada = !!(($('#lf_' + f.id) || {}).value || '').trim(); return `<label class="check"><input type="checkbox" value="${esc(f.id)}" ${pilih.has(f.id) ? 'checked' : ''}><span><b>${esc(f.label)}</b>${ada ? '<br><span class="hint">Sudah diisi. Teks sedia ada akan diganti.</span>' : ''}</span></label>`; }).join('')}</div>
      <p class="hint">Nama murid tidak dihantar kepada AI. Hanya tajuk, unit, bilangan kehadiran dan catatan anda digunakan.</p>`,
    foot: `<button class="btn" data-act="sheetClose">Batal</button><button class="btn btn-primary" data-act="go">${ic('wand', 'i-s')}Jana</button>`,
    acts: {
      async go(el) {
        const medan = sh.$$('input[type=checkbox]:checked').map(i => i.value);
        if (!medan.length) return toast('Pilih sekurang-kurangnya satu medan.', 'warn');
        const nota = sh.$('#aiNota').value.trim();
        await withBusy(el, async () => { if (await aiJalan(medan, nota)) sh.close(); });
      }
    }
  });
}
async function aiJalan(medan, nota) {
  const tajuk = aiTajuk();
  if (!tajuk) return false;
  const lf = S.lf;
  lf.aiNota = nota;
  try {
    const r = await api('aiLaporan', { idUnit: lf.unit, idPerjumpaan: lf.idP, versi: lf.fmt.versi, tajuk, nota, medan, data: collectLaporan() }, { timeout: 90000 });
    if (S.lf !== lf) return true;
    Object.keys(r.hasil).forEach(id => {
      const box = $('#lf_' + id);
      if (!box) return;
      box.value = r.hasil[id];
      if (box.tagName === 'TEXTAREA') box.rows = Math.min(12, Math.max(4, r.hasil[id].split('\n').length + 1));
      box.classList.remove('ai-new'); void box.offsetWidth; box.classList.add('ai-new');
    });
    S.dirty = true; saveLocalDraft();
    const i = $('#lfInfo'); if (i) i.textContent = 'Belum dihantar ke pelayan';
    toast('Teks dijana. Semak dan ubah suai mengikut perjumpaan sebenar.' + (r.baki != null ? ` Baki hari ini: ${r.baki}.` : ''), 'ok');
    return true;
  } catch (e) {
    toast(e.net ? 'Pembantu AI memerlukan sambungan internet.' : e.message, 'bad');
    return false;
  }
}

function drawGambar(fid) {
  const box = $('#lf_' + fid);
  if (!box) return;
  const list = S.lf.gambar[fid];
  box.innerHTML = list.map((g, i) => `<div class="thumb">${g === '…' ? '<div class="sk" style="height:100%;border-radius:0"></div>' : `<img data-fid="${esc(g)}" alt="Gambar ${i + 1}"><button type="button" data-act="rmImg" data-f="${esc(fid)}" data-i="${i}" aria-label="Buang gambar">${ic('x', 'i-s')}</button>`}</div>`).join('')
    + (list.length < 6 ? `<label class="thumb thumb-add">${ic('camera')}Tambah<input type="file" accept="image/*" multiple class="sr" data-gf="${esc(fid)}"></label>` : '');
  hydrateImages(box);
}
async function addGambar(fid, files) {
  const list = S.lf.gambar[fid];
  const room = 6 - list.filter(g => g !== '…').length;
  if (!files.length) return;
  if (files.length > room) toast('Hanya ' + room + ' gambar lagi boleh ditambah.', 'warn');
  const unitId = S.lf.unit, idP = S.lf.idP;
  for (const f of files.slice(0, room)) {
    list.push('…');
    drawGambar(fid);
    try {
      const id = await uploadImage(f, { idUnit: unitId });
      const i = list.indexOf('…');
      if (i >= 0) list[i] = id;
      S.dirty = true;
    } catch (e) {
      const i = list.indexOf('…');
      if (i >= 0) list.splice(i, 1);
      toast(e.message, 'bad');
    }
    if (S.lf && S.lf.idP === idP) { drawGambar(fid); saveLocalDraft(); }
  }
}
function collectLaporan() {
  const out = {};
  S.lf.fmt.medan.forEach(f => {
    if (f.jenis === 'gambar') out[f.id] = (S.lf.gambar[f.id] || []).filter(g => g !== '…');
    else { const el = $('#lf_' + f.id); out[f.id] = el ? el.value.trim() : ''; }
  });
  return out;
}
function saveLocalDraft() {
  if (!S.lf || !$('#fLap')) return;
  try { localStorage.setItem(drafKey(S.lf.unit, S.lf.idP), JSON.stringify({ data: collectLaporan(), t: Date.now() })); } catch (e) { /* storan penuh */ }
}
async function saveLaporanNow(btn, hantar) {
  const lf = S.lf;
  if (Object.values(lf.gambar).some(g => g.includes('…'))) return toast('Tunggu sehingga gambar selesai dimuat naik.', 'warn');
  const data = collectLaporan();
  if (hantar) {
    const miss = lf.fmt.medan.filter(f => f.wajib && (f.jenis === 'gambar' ? !data[f.id].length : !data[f.id]));
    if (miss.length) {
      toast('Sila lengkapkan: ' + miss.map(f => f.label).join(', ') + '.', 'warn');
      const el = $('#lf_' + miss[0].id);
      if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); if (el.focus) el.focus({ preventScroll: true }); }
      return;
    }
    if (!(await confirmDlg(`Hantar laporan perjumpaan ${lf.j.bil} untuk pengesahan? Laporan tidak boleh disunting selepas dihantar kecuali dikembalikan oleh pengesah.`, { ok: 'Hantar' }))) return;
  }
  await withBusy(btn, async () => {
    try {
      const r = await api('saveLaporan', { idUnit: lf.unit, idPerjumpaan: lf.idP, data, hantar: !!hantar });
      localStorage.removeItem(drafKey(lf.unit, lf.idP));
      S.dirty = false;
      await patchUnitCache(lf.unit, d => { d.laporan = d.laporan.filter(x => x.idPerjumpaan !== lf.idP).concat([r.laporan]); });
      cacheStale('dash');
      toast(hantar ? 'Laporan dihantar untuk pengesahan.' : 'Draf laporan disimpan.', 'ok');
      if (hantar) go('#/unit/' + lf.unit + '/laporan');
      else renderLaporan(lf.idP);
    } catch (e) {
      if (e.net) { saveLocalDraft(); toast('Tiada talian. Laporan disimpan dalam peranti ini. Tekan simpan semula apabila talian pulih.', 'warn'); }
      else toast(e.message, 'bad');
    }
  });
}
async function reviewLaporan(btn, status, catatan) {
  const lf = S.lf;
  await withBusy(btn, async () => {
    try {
      const r = await api('statusLaporan', { id: lf.l.id, status, catatan });
      await patchUnitCache(lf.unit, d => { d.laporan = d.laporan.map(x => (x.id === r.laporan.id ? r.laporan : x)); });
      await cacheStale('dash', 'adm:sahkan');
      refreshBoot().catch(() => {});
      toast(status === 'Disahkan' ? 'Laporan disahkan.' : 'Laporan dikembalikan kepada guru.', 'ok');
      if (sessionStorage.getItem('koku_dariSahkan') === lf.idP) { sessionStorage.removeItem('koku_dariSahkan'); go(S.user.super ? '#/admin/sahkan' : '#/sahkan'); }
      else renderLaporan(lf.idP);
    } catch (e) { toast(e.message, 'bad'); }
  });
}

function signHtml(l, unitNama) {

function lapBody(d, j, l) {
  const fmt = fmtLap(formatV(l.versi));
  const k = K(d.unit.idKategori);
  const wajibN = d.ahli.filter(m => sudahMasuk(m, j)).length;
  const hadir = l.bilHadir !== '' && l.bilHadir != null ? l.bilHadir : d.ahli.filter(m => (d.kehadiran[m.id] || {})[j.bil] === 'H').length;
  let rows = `${l.data.tajuk ? `<tr><th>Tajuk</th><td><b>${esc(l.data.tajuk)}</b></td></tr>` : ''}<tr><th>Unit</th><td>${esc(d.unit.nama)}${k ? ' (' + esc(k.nama) + ')' : ''}</td></tr>
    <tr><th>Perjumpaan</th><td>Ke-${j.bil}, ${esc(fmtDate(j.tarikh, true))}</td></tr>
    <tr><th>Kehadiran murid</th><td>${esc(hadir)} daripada ${wajibN} orang</td></tr>`;
  fmt.medan.filter(f => f.jenis !== 'gambar' && f.id !== 'tajuk').forEach(f => {
    const v = l.data[f.id];
    rows += `<tr><th>${esc(f.label)}</th><td>${esc(f.jenis === 'tarikh' && v ? fmtDate(v) : (v || ''))}</td></tr>`;
  });
  const imgs = [].concat(...fmt.medan.filter(f => f.jenis === 'gambar').map(f => l.data[f.id] || []));
  return `<table>${rows}</table>${imgs.length ? `<b>Gambar aktiviti</b><div class="doc-imgs">${imgs.map(fid => `<img data-fid="${esc(fid)}" alt="">`).join('')}</div>` : ''}`;

function docSingle(d, idP) {

function docTahunan(d) {
  const J = jadual();
  const held = J.filter(isHeld);
  const heldB = held.map(j => j.bil);
  const k = K(d.unit.idKategori);
  const guru = d.guru.filter(g => g.status === 'Aktif');
  const L = d.ahli.filter(m => m.jantina === 'L').length, P = d.ahli.filter(m => m.jantina === 'P').length;
  const pcts = d.ahli.map(m => pctFor(d.kehadiran[m.id] || {}, heldB)).filter(p => p != null);
  const avg = pcts.length ? Math.round(pcts.reduce((a, b) => a + b, 0) / pcts.length) : null;
  const by = {};
  d.laporan.forEach(l => { by[l.idPerjumpaan] = l; });
  const siap = held.filter(j => by[j.id] && (by[j.id].status === 'Dihantar' || by[j.id].status === 'Disahkan'));

  let h = `<div class="doc">${docHead('Laporan Tahunan Kokurikulum Sesi ' + S.boot.sesi)}
    <table>
      <tr><th>Unit</th><td>${esc(d.unit.nama)}</td></tr>
      <tr><th>Kategori</th><td>${esc(k ? k.nama : '')}</td></tr>
      <tr><th>Guru penasihat</th><td>${guru.map(g => esc(g.nama) + (g.peranan === 'Admin' ? ', ' + labelKetua(d.unit.nama) : '')).join('<br>') || '-'}</td></tr>
      <tr><th>Bilangan ahli</th><td>${d.ahli.length} orang (${L} lelaki, ${P} perempuan)</td></tr>
      <tr><th>Perjumpaan</th><td>${held.length} diadakan daripada ${J.filter(j => j.status !== 'Dibatalkan').length} dirancang, ${siap.length} laporan lengkap</td></tr>
      <tr><th>Purata kehadiran</th><td>${avg == null ? '-' : avg + '%'}</td></tr>
    </table>`;
  if (d.carta.length) {
    h += `<h3>Carta organisasi</h3><table>${d.carta.map(c => `<tr><th>${esc(c.jawatan)}</th><td>${esc(c.nama || '')}</td></tr>`).join('')}</table>`;
  }
  if (d.ahli.length) {
    h += `<h3>Rekod kehadiran ahli</h3><div style="overflow-x:auto"><table class="att"><tr><th>Bil</th><th class="l">Nama</th><th class="l">Kelas</th>${heldB.map(b => `<th>P${b}</th>`).join('')}<th>%</th></tr>
      ${d.ahli.map((m, i) => { const mk = d.kehadiran[m.id] || {}; const p = pctFor(mk, heldB); return `<tr><td>${i + 1}</td><td class="l">${esc(m.nama)}</td><td class="l">${esc(m.kelas)}</td>${heldB.map(b => `<td>${esc(mk[b] || '')}</td>`).join('')}<td>${p == null ? '' : p}</td></tr>`; }).join('')}
    </table></div><p class="muted" style="font-size:12px">H hadir, T tidak hadir, B bersebab. Layanan status B: ${esc((S.boot.tetapan.LAYANAN_B || 'Dikecualikan').toLowerCase())}.</p>`;
  }
  if (d.pencapaian.length) {
    h += `<h3>Pencapaian</h3><table class="att"><tr><th class="l">Nama</th><th class="l">Aktiviti</th><th>Peringkat</th><th class="l">Pencapaian</th><th>Tarikh</th></tr>
      ${d.pencapaian.map(p => `<tr><td class="l">${esc(p.nama)}</td><td class="l">${esc(p.aktiviti)}</td><td>${esc(p.peringkat)}</td><td class="l">${esc(p.pencapaian)}</td><td>${esc(p.tarikh ? dshort(p.tarikh) + '/' + String(p.tarikh).slice(0, 4) : '')}</td></tr>`).join('')}</table>`;
  }
  const ketua = guru.find(g => g.peranan === 'Admin') || guru[0];
  h += signHtml({ pelapor: ketua ? ketua.nama : '' }, d.unit.nama);
  siap.forEach(j => {
    h += `<div class="pb"></div><h3>Laporan perjumpaan ${j.bil}${by[j.id].data && by[j.id].data.tajuk ? ': ' + esc(by[j.id].data.tajuk) : ''}</h3>${lapBody(d, j, by[j.id])}`;
  });
  return h + '</div>';
}

/* Import APDM / iDME: tampal dari Excel atau pilih fail CSV */
function parseTable(text) {
  text = String(text || '').replace(/^\uFEFF/, '');
  const head = text.split(/\r?\n/).slice(0, 5).join('\n');
  const cnt = ch => (head.match(new RegExp(ch === '\t' ? '\\t' : ch, 'g')) || []).length;
  const delim = cnt('\t') ? '\t' : (cnt(';') > cnt(',') ? ';' : ',');
  const rows = [];
  let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"' && cell === '') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(x => String(x).trim())).filter(r => r.some(Boolean));
}
const TAHUN_KATA = { SATU: 1, DUA: 2, TIGA: 3, EMPAT: 4, LIMA: 5, ENAM: 6 };
function parseTahun(v) {
  const s = String(v || '').toUpperCase();
  const m = s.match(/\d/);
  if (m) return m[0];
  const w = Object.keys(TAHUN_KATA).find(k => s.includes(k));
  return w ? String(TAHUN_KATA[w]) : '';
}
async function sha256hex(s) {
  if (!(window.crypto && crypto.subtle)) throw new Error('Pelayar ini tidak menyokong penyulitan (perlu HTTPS). Gunakan menu Import dalam Google Sheets.');
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
}
function detectCols(h) {
  const H = h.map(c => String(c).toUpperCase().trim());
  const find = (re, not) => H.findIndex(c => re.test(c) && !(not && not.test(c)));
  return {
    nama: find(/NAMA/, /(IBU|BAPA|PENJAGA|SEKOLAH|KELAS|GURU)/),
    kelas: find(/KELAS/, /(GURU)/),
    tahun: find(/(TAHUN|TINGKATAN)/, /(LAHIR|MASUK|DAFTAR)/),
    jantina: find(/JANTINA/),
    ic: find(/(MYKID|NO\.?\s*K\/?P|KAD PENGENALAN|SIJIL LAHIR|NO\.?\s*PENGENALAN)/)
  };
}
function openImport() {
  let rows = [], hi = -1, map = {};
  const sh = openSheet({
    title: 'Import data murid', full: true,
    body: '',
    foot: `<button class="btn" data-act="sheetClose">Tutup</button><button class="btn btn-primary" data-act="next" id="imNext">Seterusnya</button>`,
    acts: {
      next(el) {
        const txt = sh.$('#imTxt').value;
        rows = parseTable(txt);
        if (rows.length < 2) return toast('Tampal data termasuk baris tajuk, atau pilih fail CSV.', 'warn');
        hi = rows.slice(0, 15).findIndex(r => r.some(c => /NAMA/i.test(c)));
        const header = hi >= 0 ? rows[hi] : rows[0].map((_, i) => 'Lajur ' + (i + 1));
        map = hi >= 0 ? detectCols(header) : { nama: -1, kelas: -1, tahun: -1, jantina: -1, ic: -1 };
        step2(header);
      },
      async go(el) {
        const tanda = sh.$('#imTanda').checked;
        if (map.nama < 0 || map.kelas < 0) return toast('Pilih lajur nama dan kelas.', 'warn');
        if (tanda && !(await confirmDlg('Murid aktif yang tiada dalam fail ini akan ditanda <b>Berpindah</b>. Teruskan hanya jika fail ini mengandungi semua murid sekolah.', { ok: 'Teruskan', danger: true }))) return;
        await withBusy(el, async () => {
          try {
            const list = await buildRows();
            if (!list.length) return toast('Tiada baris murid yang sah.', 'warn');
            const r = await api('importMurid', { rows: list, tandaTiada: tanda }, { timeout: 120000 });
            sh.body(`<div class="empty"><div class="ico" style="background:var(--ok-soft);color:var(--ok)">${ic('check')}</div><h3>Import selesai</h3>
              <p>${r.baru} murid baharu, ${r.kemas} dikemas kini, ${r.sama} tiada perubahan${tanda ? ', ' + r.tiada + ' ditanda berpindah' : ''}.</p>
              <p class="small">Nombor kad pengenalan tidak disimpan. Sistem hanya menyimpan cincangan sebagai kunci padanan.</p></div>`);
            sh.foot(`<button class="btn btn-primary btn-block" data-act="sheetClose">Selesai</button>`);
            await cacheStale('adm:murid', 'dash');
            if (location.hash === '#/admin/murid') route(true);
          } catch (e) { toast(e.message, 'bad'); }
        });
      },
      back() { step1(); }
    }
  });
  const dataRows = () => rows.slice(hi >= 0 ? hi + 1 : 0).filter(r => map.nama >= 0 && String(r[map.nama] || '').trim());
  const rowOut = r => {
    const tahun = map.tahun >= 0 ? parseTahun(r[map.tahun]) : '';
    let kelas = String(r[map.kelas] || '').trim();
    if (kelas && !/^\d/.test(kelas) && tahun) kelas = tahun + ' ' + kelas;
    return { nama: String(r[map.nama]).trim(), kelas, jantina: map.jantina >= 0 ? r[map.jantina] || '' : '', ic: map.ic >= 0 ? String(r[map.ic] || '').replace(/\D/g, '').replace(/^(\d{11})$/, '0$1') : '' };
  };
  async function buildRows() {
    const out = [];
    for (const r of dataRows()) {
      const o = rowOut(r);
      const k = o.ic.length >= 6 ? 'K' + (await sha256hex(o.ic)).slice(0, 20) : 'N' + (await sha256hex(o.nama.toUpperCase().replace(/\s+/g, ' ').trim())).slice(0, 20);
      out.push({ k, nama: o.nama, kelas: o.kelas, jantina: o.jantina });
    }
    return out;
  }
  function step1() {
    sh.body(`<p class="muted" style="margin-top:0">Eksport senarai murid daripada APDM atau iDME, kemudian salin semua lajur (termasuk baris tajuk) dari Excel atau Google Sheets dan tampal di bawah.</p>
      <div class="field"><label for="imTxt">Data murid</label><textarea class="input" id="imTxt" rows="8" placeholder="NAMA&#9;TAHUN&#9;KELAS&#9;JANTINA&#9;NO. KP" style="font-size:13px;white-space:pre;overflow-x:auto"></textarea></div>
      <label class="import-drop" style="display:block;cursor:pointer">${ic('upload')}<br><b>Atau pilih fail CSV</b><br><span class="small">Fail .csv, .tsv atau .txt</span><input type="file" accept=".csv,.tsv,.txt,text/csv,text/plain" class="sr" id="imFile"></label>
      ${bannerHtml('info', 'info', 'Untuk lebih daripada 3000 murid, gunakan tab <b>APDM_Mentah</b> dan menu <b>Import dari tab</b> dalam Google Sheets.')}`);
    sh.foot(`<button class="btn" data-act="sheetClose">Tutup</button><button class="btn btn-primary" data-act="next">Seterusnya</button>`);
    sh.$('#imFile').onchange = async e => {
      const file = e.target.files[0];
      if (!file) return;
      sh.$('#imTxt').value = await file.text();
      toast('Fail dibaca: ' + file.name);
    };
  }
  function step2(header) {
    const opts = sel => `<option value="-1">Tiada</option>` + header.map((c, i) => `<option value="${i}" ${i === sel ? 'selected' : ''}>${esc(c || 'Lajur ' + (i + 1))}</option>`).join('');
    const sel = (k, lbl, req) => `<div class="field"><label for="im_${k}">${lbl}${req ? ' <span class="req">*</span>' : ''}</label><select class="input" id="im_${k}" data-k="${k}">${opts(map[k])}</select></div>`;
    sh.body(`<div class="stack-s">${sel('nama', 'Lajur nama', 1)}${sel('kelas', 'Lajur kelas', 1)}${sel('tahun', 'Lajur tahun (jika kelas tanpa nombor)')}${sel('jantina', 'Lajur jantina')}${sel('ic', 'Lajur no. kad pengenalan (untuk padanan sahaja)')}</div>
      <div class="sec"><h2 style="font-size:18px">Pratonton</h2><span class="small muted" id="imCount"></span></div><div class="table-wrap"><table class="data" id="imPrev"></table></div>
      <label class="check" style="margin-top:12px"><input type="checkbox" id="imTanda"><span><b>Tandakan murid yang tiada dalam fail sebagai Berpindah</b><br><span class="hint">Gunakan hanya jika fail ini mengandungi senarai lengkap semua murid sekolah.</span></span></label>`);
    sh.foot(`<button class="btn" data-act="back">Kembali</button><button class="btn btn-primary" data-act="go" id="imGo">Import</button>`);
    const prev = () => {
      const dr = dataRows();
      sh.$('#imCount').textContent = dr.length + ' baris';
      sh.$('#imGo').textContent = 'Import ' + dr.length + ' murid';
      sh.$('#imPrev').innerHTML = `<tr><th>Nama</th><th>Kelas</th><th>Jantina</th><th>Kunci</th></tr>` + dr.slice(0, 8).map(r => { const o = rowOut(r); return `<tr><td>${esc(o.nama)}</td><td>${esc(o.kelas)}</td><td>${esc(o.jantina)}</td><td>${o.ic.length >= 6 ? 'No. KP' : 'Nama'}</td></tr>`; }).join('');
    };
    sh.$$('select[data-k]').forEach(s => { s.onchange = () => { map[s.dataset.k] = Number(s.value); prev(); }; });
    prev();
  }
  step1();
}

/* ---------------- Jadual perjumpaan ---------------- */
function admJadual() {
  let items = jadual().map(j => ({ bil: j.bil, tarikh: j.tarikh || '', status: j.status === 'Dibatalkan' ? 'Dibatalkan' : 'Dirancang', catatan: j.catatan || '' }));
  const MAX = 15;
  const hari = s => { if (!s) return ''; const { y, m, d } = ymd(s); return HARI[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]; };
  const draw = () => {
    main(`<p class="muted" style="margin-top:0">Sesi ${esc(S.boot.sesi)}. Perjumpaan yang telah mempunyai rekod tidak boleh dibuang, tetapi boleh ditanda dibatalkan.</p>
      <div class="hstack" style="margin-bottom:12px"><button class="btn btn-sm" data-act="weekly">${ic('wand', 'i-s')}Isi tarikh mingguan</button>${items.length < MAX ? `<button class="btn btn-sm" data-act="add">${ic('plus', 'i-s')}Tambah perjumpaan</button>` : ''}${items.length > 1 ? `<button class="btn btn-sm btn-ghost" data-act="pop">Buang terakhir</button>` : ''}</div>
      <div class="card" style="padding:0">${items.map((x, i) => `<div class="jrow"><span class="coin ${x.status === 'Dibatalkan' ? 'is-off' : x.tarikh && x.tarikh <= today() ? 'is-done' : ''}"><b>${x.bil}</b></span>
        <div><input class="input" type="date" data-i="${i}" data-k="tarikh" value="${esc(x.tarikh)}" aria-label="Tarikh perjumpaan ${x.bil}"><div class="small muted" style="margin-top:3px">${esc(hari(x.tarikh))}</div></div>
        <select class="input" data-i="${i}" data-k="status" aria-label="Status perjumpaan ${x.bil}"><option ${x.status === 'Dirancang' ? 'selected' : ''}>Dirancang</option><option ${x.status === 'Dibatalkan' ? 'selected' : ''}>Dibatalkan</option></select>
        <input class="input jcat" data-i="${i}" data-k="catatan" value="${esc(x.catatan)}" placeholder="Catatan (pilihan), contoh: Hari Kokurikulum"></div>`).join('')}</div>
      <div class="savebar"><div class="small muted grow">${items.length} perjumpaan</div><button class="btn btn-primary" data-act="save">Simpan jadual</button></div>`);
    $('#main').classList.add('page-savebar');
  };
  draw();
  $('#main').oninput = $('#main').onchange = e => {
    const el = e.target;
    if (el.dataset.i == null) return;
    items[Number(el.dataset.i)][el.dataset.k] = el.value;
    S.dirty = true;
    if (e.type === 'change' && el.dataset.k !== 'catatan') draw();
  };
  S.acts = {
    retry: () => route(),
    add() { if (items.length < MAX) { items.push({ bil: items.length + 1, tarikh: '', status: 'Dirancang', catatan: '' }); S.dirty = true; draw(); } },
    pop() { items.pop(); S.dirty = true; draw(); },
    weekly() {
      const sh = openSheet({
        title: 'Isi tarikh mingguan',
        body: `<div class="field"><label for="wS">Tarikh perjumpaan pertama</label><input class="input" type="date" id="wS" value="${esc(items[0].tarikh || today())}"></div>
          <div class="field"><label for="wN">Selang</label><select class="input" id="wN"><option value="7">Setiap minggu</option><option value="14" selected>Setiap dua minggu</option><option value="21">Setiap tiga minggu</option><option value="28">Setiap empat minggu</option></select></div>
          <p class="hint">Tarikh bagi perjumpaan yang ditanda dibatalkan tidak diubah. Semak semula cuti sekolah selepas ini.</p>`,
        foot: `<button class="btn" data-act="sheetClose">Batal</button><button class="btn btn-primary" data-act="ok">Isi tarikh</button>`,
        acts: {
          ok() {
            const s = sh.$('#wS').value, n = Number(sh.$('#wN').value);
            if (!s) return;
            let k = 0;
            items.forEach(x => { if (x.status !== 'Dibatalkan') { x.tarikh = addDays(s, n * k); k++; } });
            S.dirty = true; sh.close(); draw();
          }
        }
      });
    },
    async save(el) {
      await withBusy(el, async () => {
        try {
          const r = await api('saveJadual', { items });
          S.dirty = false;
          S.boot.jadual = r.jadual;
          await cacheSet('boot', S.boot);
          await cacheStale('dash', 'unit');
          toast('Jadual disimpan.', 'ok');
          route(true);
        } catch (e) { toast(e.message, 'bad'); }
      });
    }
  };
}

/* ---------------- Format laporan (pembina borang) ---------------- */
const JENIS_LBL = { teks: 'Teks pendek', panjang: 'Teks panjang', tarikh: 'Tarikh', masa: 'Masa', pilihan: 'Senarai pilihan', gambar: 'Gambar' };
function admFormat() {
  const af = activeFormat();
  let medan = af.medan.map(f => Object.assign({}, f, { pilihan: (f.pilihan || []).slice() }));
  const slug = s => String(s || '').toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 24);
  const draw = () => {
    main(`<p class="muted" style="margin-top:0">Format aktif: versi ${esc(af.versi)}. Menyimpan perubahan akan mencipta versi baharu. Laporan yang sudah ditulis kekal dengan format asalnya. Medan <b>Tajuk</b> sentiasa dipaparkan di atas borang dan tidak perlu ditambah.</p>
      <div class="stack">${medan.map((f, i) => `<div class="mcard"><div class="mcard-h"><b>Medan ${i + 1}</b>
        <button class="icon-btn" data-act="mv" data-i="${i}" data-d="-1" aria-label="Naik" ${i === 0 ? 'disabled' : ''}>${ic('up', 'i-s')}</button>
        <button class="icon-btn" data-act="mv" data-i="${i}" data-d="1" aria-label="Turun" ${i === medan.length - 1 ? 'disabled' : ''}>${ic('down', 'i-s')}</button>
        <button class="icon-btn" data-act="rm" data-i="${i}" aria-label="Buang medan" style="color:var(--bad)">${ic('trash', 'i-s')}</button></div>
        <input class="input" data-i="${i}" data-k="label" value="${esc(f.label)}" placeholder="Label medan, contoh: Objektif aktiviti" aria-label="Label medan ${i + 1}">
        <div class="hstack" style="flex-wrap:nowrap"><select class="input" data-i="${i}" data-k="jenis" aria-label="Jenis medan ${i + 1}">${Object.keys(JENIS_LBL).map(k => `<option value="${k}" ${k === f.jenis ? 'selected' : ''}>${JENIS_LBL[k]}</option>`).join('')}</select>
          <label class="check" style="padding:0;white-space:nowrap;align-items:center"><input type="checkbox" data-i="${i}" data-k="wajib" ${f.wajib ? 'checked' : ''}>Wajib</label></div>
        ${f.jenis === 'pilihan' ? `<textarea class="input" data-i="${i}" data-k="pilihan" rows="3" placeholder="Satu pilihan setiap baris" style="min-height:84px">${esc(f.pilihan.join('\n'))}</textarea>` : ''}</div>`).join('')}</div>
      ${medan.length < 25 ? `<button class="btn btn-block" style="margin-top:12px" data-act="addM">${ic('plus')}Tambah medan</button>` : ''}
      <div class="savebar"><div class="small muted grow">${medan.length} medan</div><button class="btn btn-primary" data-act="save">Simpan versi baharu</button></div>`);
    $('#main').classList.add('page-savebar');
  };
  draw();
  $('#main').oninput = $('#main').onchange = e => {
    const el = e.target;
    if (el.dataset.i == null) return;
    const f = medan[Number(el.dataset.i)];
    const k = el.dataset.k;
    if (k === 'wajib') f.wajib = el.checked;
    else if (k === 'pilihan') f.pilihan = el.value.split('\n').map(s => s.trim()).filter(Boolean);
    else f[k] = el.value;
    S.dirty = true;
    if (k === 'jenis' && e.type === 'change') draw();
  };
  S.acts = {
    retry: () => route(),
    addM() { medan.push({ id: '', label: '', jenis: 'teks', wajib: false, pilihan: [] }); S.dirty = true; draw(); const ins = $$('input[data-k=label]'); if (ins.length) ins[ins.length - 1].focus(); },
    rm(el) { medan.splice(Number(el.dataset.i), 1); S.dirty = true; draw(); },
    mv(el) {
      const i = Number(el.dataset.i), j = i + Number(el.dataset.d);
      if (j < 0 || j >= medan.length) return;
      [medan[i], medan[j]] = [medan[j], medan[i]];
      S.dirty = true; draw();
    },
    async save(el) {
      if (medan.some(f => !String(f.label).trim())) return toast('Setiap medan mesti ada label.', 'warn');
      const used = {};
      const out = medan.map((f, i) => {
        let id = f.id || slug(f.label) || 'm' + (i + 1);
        while (used[id]) id += '_';
        used[id] = 1;
        return { id, label: f.label.trim(), jenis: f.jenis, wajib: !!f.wajib, pilihan: f.jenis === 'pilihan' ? f.pilihan : undefined };
      });
      if (!(await confirmDlg('Simpan format ini sebagai versi baharu? Laporan baharu akan menggunakan format ini.', { ok: 'Simpan' }))) return;
      await withBusy(el, async () => {
        try {
          const r = await api('saveFormat', { medan: out });
          S.dirty = false;
          toast('Format laporan versi ' + r.versi + ' diaktifkan.', 'ok');
          await admAfterWrite('boot');
        } catch (e) { toast(e.message, 'bad'); }
      });
    }
  };
}

function downloadText(name, text, mime) {
  const blob = new Blob(['\uFEFF' + text], { type: mime + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.append(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.append(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    ta.remove();
    return ok;
  }
}

/* =========================================================================
 * TEMPLAT PAJSK MOEIS: jana fail .xlsx daripada templat asal (dropdown dan helaian Senarai dikekalkan)
 * ========================================================================= */
const MOEIS_SHEET = { Kelab: 'xl/worksheets/sheet2.xml', Beruniform: 'xl/worksheets/sheet3.xml', Sukan: 'xl/worksheets/sheet4.xml', Ekstra: 'xl/worksheets/sheet5.xml', Tambahan: 'xl/worksheets/sheet6.xml' };
let MOEIS_TPL = null;
function moeisTpl() {
  if (!MOEIS_TPL) MOEIS_TPL = JSON.parse(document.getElementById('tplMoeis').textContent);
  return MOEIS_TPL;
}
const xmlEsc = v => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
const colName = i => { let n = '', x = i + 1; while (x) { const m = (x - 1) % 26; n = String.fromCharCode(65 + m) + n; x = Math.floor((x - 1) / 26); } return n; };
function moeisSheetXml(xml, rows, tab) {
  const a = xml.indexOf('<sheetData>'), b = xml.indexOf('</sheetData>');
  const data = xml.slice(a + 11, b);
  const h0 = data.indexOf('<row r="1"'), h1 = data.indexOf('</row>', h0) + 6;
  const header = data.slice(h0, h1);
  const ncol = (header.match(/<c /g) || []).length;
  const last = rows.length + 1;
  const body = rows.map((r, i) => {
    const n = i + 2;
    const cells = r.map((v, j) => {
      if (v === '' || v == null) return '';
      const ref = colName(j) + n;
      if (typeof v === 'number') return `<c r="${ref}"><v>${v}</v></c>`;
      return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
    }).join('');
    return `<row r="${n}" spans="1:${ncol}">${cells}</row>`;
  }).join('');
  let out = xml.slice(0, a) + '<sheetData>' + header + body + xml.slice(b);
  out = out.replace(/<dimension ref="[^"]*"\/>/, `<dimension ref="A1:${colName(ncol - 1)}${Math.max(1, last)}"/>`);
  out = out.replace(/(<pane [^>]*topLeftCell=")[^"]*"/, '$1C2"').replace(/(<selection pane="bottomRight"[^>]*activeCell=")[^"]*"( sqref=")[^"]*"/, '$1A2"$2A2"');
  // Panjangkan julat dropdown supaya meliputi semua baris murid
  const akhir = Math.max(60, last + 20);
  const panjang = rng => rng.replace(/([A-Z]+)(\d+):([A-Z]+)(\d+)/g, (m, c1, r1, c2, r2) => `${c1}${r1}:${c2}${Math.max(Number(r2), akhir)}`);
  const dv = MOEIS_DV[tab];
  if (dv) {
    // Templat asal mempunyai dropdown Aktiviti dan Jawatan yang tidak konsisten: bina semula dengan senarai yang betul bagi tab ini
    out = out.replace(/<x14:dataValidation [^>]*>(?:(?!<\/x14:dataValidation>)[\s\S])*<xm:sqref>[DE]\d+:[DE]\d+<\/xm:sqref><\/x14:dataValidation>/g, '');
    const baru = ['D', 'E'].map(c => `<x14:dataValidation type="list" errorStyle="warning" allowBlank="1" showErrorMessage="1" error="Pilih daripada senarai atau taip nama seperti dalam SPPB."><x14:formula1><xm:f>${dv[c]}</xm:f></x14:formula1><xm:sqref>${c}2:${c}${akhir}</xm:sqref></x14:dataValidation>`).join('');
    out = out.replace(/<x14:dataValidations [^>]*>/, m => m + baru);
  }
  out = out.replace(/<xm:sqref>([^<]*)<\/xm:sqref>/g, (m, r) => `<xm:sqref>${panjang(r)}</xm:sqref>`);
  out = out.replace(/(<dataValidation [^>]*sqref=")([^"]*)"/g, (m, p1, r) => `${p1}${panjang(r)}"`);
  out = out.replace(/<x14:dataValidations count="\d+"/, () => `<x14:dataValidations count="${(out.match(/<x14:dataValidation /g) || []).length}"`);
  return out;
}
const MOEIS_DV = {
  Kelab: { D: 'Senarai!$B$2:$B$14', E: 'Senarai!$C$2:$C$10' },
  Beruniform: { D: 'Senarai!$D$2:$D$7', E: 'Senarai!$E$2:$E$69' },
  Sukan: { D: 'Senarai!$F$2:$F$12', E: 'Senarai!$G$2:$G$21' }
};
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = u => { let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = CRC_T[(c ^ u[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
/** Penulis ZIP ringkas (tanpa mampatan): cukup untuk fail .xlsx */
function zipStore(files) {
  const enc = new TextEncoder(), loc = [], cen = [];
  let off = 0;
  const d = new Date(), dt = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate(), tm = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  files.forEach(([name, data]) => {
    const nm = enc.encode(name), crc = crc32(data), sz = data.length;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, tm, true); h.setUint16(12, dt, true); h.setUint32(14, crc, true); h.setUint32(18, sz, true); h.setUint32(22, sz, true);
    h.setUint16(26, nm.length, true); h.setUint16(28, 0, true);
    loc.push(new Uint8Array(h.buffer), nm, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, tm, true); c.setUint16(14, dt, true); c.setUint32(16, crc, true); c.setUint32(20, sz, true); c.setUint32(24, sz, true);
    c.setUint16(28, nm.length, true); c.setUint32(42, off, true);
    cen.push(new Uint8Array(c.buffer), nm);
    off += 30 + nm.length + sz;
  });
  const cenSz = cen.reduce((a, x) => a + x.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cenSz, true); e.setUint32(16, off, true);
  return new Blob(loc.concat(cen, [new Uint8Array(e.buffer)]), { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}
function buatXlsxMoeis(x) {
  const tpl = moeisTpl(), enc = new TextEncoder();
  const files = Object.keys(tpl).map(name => {
    let v = tpl[name];
    const sh = Object.keys(MOEIS_SHEET).find(k => MOEIS_SHEET[k] === name);
    if (sh) v = moeisSheetXml(v, x.sheets[sh] || [], sh);
    if (typeof v === 'string' && v.indexOf('b64:') === 0) return [name, Uint8Array.from(atob(v.slice(4)), ch => ch.charCodeAt(0))];
    return [name, enc.encode(v)];
  });
  return zipStore(files);
}
function muatTurunBlob(name, blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.append(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
const MOEIS_TAB = [['Kelab', 'Kelab'], ['Beruniform', 'Beruniform'], ['Sukan', 'Sukan'], ['Ekstra', 'Ekstra'], ['Tambahan', 'Tambahan']];
const MOEIS_HEAD = {
  main: ['ID Pengenalan', 'Nama', 'Ditaksir', 'Aktiviti Kokurikulum', 'Jawatan', 'Pelibatan: Peringkat', 'Pelibatan: Nombor', 'Pencapaian: Peringkat', 'Pencapaian: Tahap', 'Komitmen 1', 'Komitmen 2', 'Komitmen 3', 'Komitmen 4', 'Khidmat Sumbangan', 'Kehadiran'],
  Ekstra: ['ID Pengenalan', 'Nama', 'Ditaksir', 'Anugerah Khas (Perkara)', 'Anugerah Khas (Tahap)', 'KM: Kejiranan/Komuniti', 'KM: Alam Sekitar', 'KM: Bencana Alam', 'KM: Kerohanian', 'KM: Jabatan/Agensi', 'KM: Kebudayaan/Kesenian/Integrasi', 'KM: Insaniah', 'Program NILAM', 'Perkhidmatan'],
  Tambahan: ['ID Pengenalan', 'Nama', 'Tab', 'Aktiviti Tambahan', 'Pelibatan: Peringkat', 'Pelibatan: Nombor', 'Pencapaian: Peringkat', 'Pencapaian: Tahap']
};
/** Muat turun templat MOEIS bagi satu kelas (atau semua kelas untuk Super Admin) */
async function moeisMuatTurun(btn, kelas) {
  await withBusy(btn, async () => {
    try {
      const x = await api('pajskMoeis', { kelas: kelas || '' }, { timeout: 120000 });
      const nama = 'PAJSK_MOEIS_' + (x.kelas ? x.kelas.replace(/\s+/g, '_') : 'Semua_Kelas') + '_' + x.sesi + '.xlsx';

      toast(`${nama} dimuat turun (${n} murid).` + (x.tanpaKP.length ? ` ${x.tanpaKP.length} murid tanpa No. KP.` : ''), x.tanpaKP.length ? 'warn' : 'ok');
    } catch (e) { toast(e.message, 'bad'); }
  });
}
/** Pratonton data mengikut lajur templat MOEIS */
async function moeisPratonton(kelas) {
  const sh = openSheet({ title: 'Pratonton templat PAJSK MOEIS', full: true, body: skelList(4), foot: `<button class="btn" data-act="sheetClose">Tutup</button><button class="btn btn-primary" data-act="dl">${ic('download', 'i-s')}Muat turun .xlsx</button>` });
  let x;
  try { x = await api('pajskMoeis', { kelas: kelas || '' }, { timeout: 120000 }); } catch (e) { sh.body(errHtml(e)); return; }
  let tab = 'Beruniform';
  const draw = () => {
    const rows = x.sheets[tab] || [];
    const head = MOEIS_HEAD[tab] || MOEIS_HEAD.main;
    const amaran = [];
    if (!x.adaTabDataMurid) amaran.push('Tab DATA MURID tidak dijumpai. Lajur ID Pengenalan dibiarkan kosong; SPPB akan memadankan murid mengikut nama.');
    else if (x.tanpaKP.length) amaran.push(`${x.tanpaKP.length} murid tiada No. KP dalam tab DATA MURID: ${x.tanpaKP.slice(0, 4).map(esc).join(', ')}${x.tanpaKP.length > 4 ? ' dan lain-lain' : ''}.`);
    if (x.tiadaUnit.length) amaran.push(`${x.tiadaUnit.length} murid belum lengkap berunit: ${x.tiadaUnit.slice(0, 4).map(m => esc(m.nama) + ' (' + m.tab.join(', ') + ')').join(', ')}${x.tiadaUnit.length > 4 ? ' dan lain-lain' : ''}.`);
    if (x.tekaan.length) amaran.push(`${x.tekaan.length} unit belum dipetakan kepada nama aktiviti SPPB, jadi nama cadangan digunakan${S.user.super ? ' (semak di Pentadbiran, Pemetaan PAJSK MOEIS)' : ''}: ${x.tekaan.slice(0, 3).map(t => esc(t.unit) + ' = ' + esc(t.sppb)).join('; ')}.`);
    sh.body(`<dl class="kv" style="margin-bottom:12px"><dt>Kelas</dt><dd>${esc(x.kelas || 'Semua kelas')}</dd><dt>Murid</dt><dd>${x.sheets.Ekstra.length}</dd><dt>Perjumpaan diadakan</dt><dd>${x.diadakan}</dd></dl>
      ${amaran.map(a => bannerHtml('info', 'info', a)).join('<div style="height:8px"></div>')}
      <div class="pills" style="margin:12px 0;flex-wrap:wrap">${MOEIS_TAB.map(([k, l]) => `<button type="button" class="${k === tab ? 'on' : ''}" data-act="mt" data-t="${k}">${l} (${(x.sheets[k] || []).length})</button>`).join('')}</div>
      ${rows.length ? `<div class="table-wrap" style="max-height:52vh"><table class="data"><tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`
        : `<div class="card-flat small muted">Tiada baris dalam helaian ${esc(tab)}.</div>`}
      <p class="hint" style="margin-top:10px">Komitmen dicadangkan mengikut peratus kehadiran (80% ke atas: 4 item, 60%: 3, 40%: 2, kurang: 1). Semak dan ubah dalam Excel menggunakan dropdown sebelum dimuat naik ke SPPB. Skor dikira oleh SPPB sendiri.</p>`);
  };
  sh.acts.mt = el => { tab = el.dataset.t; draw(); };
  sh.acts.dl = el => moeisMuatTurun(el, kelas);
  draw();
}

function pajskView(r, pilihKelas, prefix = '') {
  let kelas = '';
  const draw = () => {
    const head = ['Nama', 'Kelas', 'Jantina'].concat(...r.kategori.map(k => [k, 'Jawatan', '% hadir', 'Pencapaian']));
    const kelasList = Array.from(new Set(r.rows.map(x => x[1]))).filter(Boolean).sort(numSort);
    const rows = r.rows.filter(x => !kelas || x[1] === kelas);
    const tiada = rows.filter(x => r.kategori.some((_, i) => !x[3 + i * 4]));
    const L = rows.filter(x => x[2] === 'L').length, P = rows.filter(x => x[2] === 'P').length;
    const moeisCard = `<div class="ai-card moeis-card" style="margin:0 0 14px"><span class="tile-ic">${ic('file')}</span><div class="grow"><b>Templat PAJSK MOEIS</b><span class="small muted">${pilihKelas ? (kelas ? 'Kelas ' + esc(kelas) + '. ' : 'Pilih kelas di bawah untuk satu fail setiap kelas. ') : ''}Fail Excel mengikut format SPPB: Kelab, Beruniform, Sukan, Ekstra dan Tambahan, lengkap dengan dropdown.</span></div>
      <div class="act"><button type="button" class="btn btn-primary btn-sm" data-act="moeis">${ic('download', 'i-s')}Muat turun</button><button type="button" class="btn btn-sm" data-act="moeisLihat">Pratonton</button></div></div>`;
    main(`${prefix}${moeisCard}${pilihKelas ? '' : `<div class="stat-grid" style="margin-bottom:12px"><div class="stat"><b>${rows.length}</b><span>Murid kelas ${esc(r.kelas)}</span></div><div class="stat ${tiada.length ? 'alert' : ''}"><b>${tiada.length}</b><span>Belum lengkap berunit</span></div></div>`}
      <p class="muted" style="margin-top:0">Peratus kehadiran dikira daripada ${r.diadakan} perjumpaan yang telah berlangsung. Pencapaian ialah peringkat tertinggi bagi setiap murid${pilihKelas || !(L + P) ? '' : `. ${L} lelaki, ${P} perempuan`}.</p>
      ${tiada.length ? bannerHtml('info', 'info', `${tiada.length} murid belum lengkap mendaftar dalam semua kategori${pilihKelas ? '' : ': ' + tiada.slice(0, 5).map(x => esc(x[0])).join(', ') + (tiada.length > 5 ? ' dan lain-lain' : '') + '. Maklumkan kepada guru penasihat atau Super Admin'}.`) : ''}
      <div class="hstack" style="margin:12px 0">${pilihKelas ? `<select class="input grow" id="pjK" style="max-width:220px"><option value="">Semua kelas</option>${kelasList.map(k => `<option ${k === kelas ? 'selected' : ''}>${esc(k)}</option>`).join('')}</select>` : '<div class="grow"></div>'}
        <button class="btn" data-act="csv">${ic('download')}CSV</button><button class="btn" data-act="copy">${ic('copy')}Salin</button></div>
      <p class="small muted" style="margin:0 2px 8px">${rows.length} murid${rows.length > 150 ? ', memaparkan 150 pertama' : ''}</p>
      <div class="table-wrap" style="max-height:62vh"><table class="data"><tr>${head.map(x => `<th>${esc(x)}</th>`).join('')}</tr>${rows.slice(0, 150).map(x => `<tr>${x.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>
      <p class="hint" style="margin-top:10px">Jadual di atas ialah ringkasan sistem. Untuk SPPB, gunakan butang Templat PAJSK MOEIS.</p>`);
    if ($('#pjK')) $('#pjK').onchange = e => { kelas = e.target.value; draw(); };
    const csvCell = c => { const v = String(c == null ? '' : c); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    const nama = kelas || r.kelas;
    S.acts = {
      retry: () => route(),
      moeis(el) { moeisMuatTurun(el, pilihKelas ? kelas : r.kelas); },
      moeisLihat() { moeisPratonton(pilihKelas ? kelas : r.kelas); },
      csv() { downloadText('pajsk-' + S.boot.sesi + (nama ? '-' + nama.replace(/\s+/g, '') : '') + '.csv', [head].concat(rows).map(x => x.map(csvCell).join(',')).join('\r\n'), 'text/csv'); },
      async copy() { const ok = await copyText([head].concat(rows).map(x => x.map(c => String(c == null ? '' : c).replace(/[\t\n]/g, ' ')).join('\t')).join('\n')); toast(ok ? rows.length + ' baris disalin. Tampal dalam Google Sheets.' : 'Pelayar menyekat salinan. Gunakan butang CSV.', ok ? 'ok' : 'warn'); }
    };
  };
  draw();
}

function kelasUnitView(r, prefix) {
  const kats = r.kategori, wajib = kats.filter(k => k.wajib);
  const unitOf = id => r.unit.find(u => u.id === id);
  const pending = {};
  const key = (m, k) => m + '|' + k;
  const cur = (m, k) => (key(m.id, k) in pending ? pending[key(m.id, k)] : (m.unit[k] || ''));
  const setVal = (m, k, v) => { if (v === (m.unit[k] || '')) delete pending[key(m.id, k)]; else pending[key(m.id, k)] = v; };
  const kurang = m => wajib.filter(k => !cur(m, k.id)).length;
  const st = { mode: 'murid', belum: r.murid.some(m => kurang(m)), q: '', kat: (wajib[0] || kats[0] || {}).id, unit: '' };

  const counters = () => {
    const n = Object.keys(pending).length;
    S.dirty = n > 0;
    const an = $('#kuAn'); if (an) an.innerHTML = analisaIsi();
    const b = $('#kuSave'); if (b) { b.disabled = !n; b.textContent = n ? `Simpan ${n} perubahan` : 'Tiada perubahan'; }
    const bel = r.murid.filter(m => kurang(m)).length;
    const a = $('#kuStat'); if (a) a.innerHTML = `<div class="stat"><b>${r.murid.length}</b><span>Murid kelas ${esc(r.kelas)}</span></div><div class="stat"><b style="color:var(--ok)">${r.murid.length - bel}</b><span>Lengkap berunit</span></div><div class="stat ${bel ? 'alert' : ''}"><b>${bel}</b><span>Belum lengkap</span></div>`;
  };
  const opsyen = (k, v) => {
    const us = r.unit.filter(u => u.idKategori === k.id);
    return `<option value="">${us.length ? 'Belum dipilih' : 'Tiada unit'}</option>${us.map(u => `<option value="${esc(u.id)}" ${u.id === v ? 'selected' : ''}>${esc(u.nama)} (${u.ahli})</option>`).join('')}`;
  };
  const kad = m => {
    const n = kurang(m);
    return `<div class="mcard ${n ? '' : 'is-done'}" data-m="${esc(m.id)}"><div class="mcard-h"><b style="font-size:15.5px">${esc(m.nama)}</b>${n ? `<span class="chip chip-warn">Belum ${n}</span>` : `<span class="chip chip-ok">${ic('check', 'i-s')}Lengkap</span>`}</div>
      <div class="ku-grid">${kats.map(k => { const v = cur(m, k.id); return `<div><label for="ku_${esc(m.id)}_${esc(k.id)}">${esc(k.nama)}${k.wajib ? '' : ' (pilihan)'}</label><select class="input ${key(m.id, k.id) in pending ? 'is-chg' : ''}" id="ku_${esc(m.id)}_${esc(k.id)}" data-m="${esc(m.id)}" data-k="${esc(k.id)}">${opsyen(k, v)}</select></div>`; }).join('')}</div></div>`;
  };
  const senarai = () => {
    const q = st.q.trim().toLowerCase();
    return r.murid.filter(m => (!st.belum || kurang(m)) && (!q || m.nama.toLowerCase().includes(q)));
  };

  /* Analisa bilangan murid kelas bagi setiap kategori (termasuk pilihan yang belum disimpan) */
  const analisa = k => {
    const ikut = {}, belum = [];
    r.murid.forEach(m => { const v = cur(m, k.id); if (v) (ikut[v] = ikut[v] || []).push(m); else belum.push(m); });
    return { ikut, belum, ada: r.murid.length - belum.length };
  };
  const analisaHtml = () => `<div id="kuAn">${analisaIsi()}</div>`;
  const analisaIsi = () => {
    const n = r.murid.length, ubah = Object.keys(pending).length;
    return `<div class="sec" style="margin-top:0"><h2 style="font-size:18px">Analisa kelas ${esc(r.kelas)}</h2><span class="small muted">Tekan kad untuk senarai nama</span></div>
      <div class="stat-grid" style="margin-bottom:${ubah ? 6 : 14}px">${kats.map(k => {
        const a = analisa(k), pct = n ? Math.round(a.ada / n * 100) : 0, nu = Object.keys(a.ikut).length;
        return `<button type="button" class="stat an-card" data-act="kuAnalisa" data-id="${esc(k.id)}" style="--c:${katColor(k.id)}" aria-label="Senarai murid ${esc(k.nama)}">
          <b>${a.ada}<small> / ${n}</small></b><span>${esc(k.nama)}${k.wajib ? '' : ' (pilihan)'}</span>
          <div class="an-bar"><i style="width:${pct}%"></i></div>
          <span class="an-belum" style="color:${a.belum.length && k.wajib ? 'var(--bad)' : 'var(--ink-3)'}">${a.belum.length ? a.belum.length + ' belum berunit' : 'Semua berunit'}${nu ? ', ' + nu + ' unit' : ''}</span></button>`;
      }).join('')}</div>${ubah ? `<p class="hint" style="margin:0 2px 14px">Analisa termasuk ${ubah} perubahan yang belum disimpan.</p>` : ''}`;
  };
  const bukaAnalisa = idK => {
    const k = kats.find(x => x.id === idK);
    if (!k) return;
    const a = analisa(k);
    const baris = L => `<div class="list">${L.slice().sort((x, y) => x.nama.localeCompare(y.nama)).map((m, i) => `<div class="row" style="min-height:48px"><span class="muted small" style="width:22px;text-align:right">${i + 1}.</span><div class="row-main"><div class="row-title">${esc(m.nama)}</div></div>${m.jantina ? `<span class="chip">${esc(m.jantina)}</span>` : ''}</div>`).join('')}</div>`;
    const unitList = Object.keys(a.ikut).map(id => ({ id, u: unitOf(id) || { nama: 'Unit', id }, L: a.ikut[id] }))
      .sort((x, y) => y.L.length - x.L.length || x.u.nama.localeCompare(y.u.nama));
    const lj = L => { const l = L.filter(m => m.jantina === 'L').length, p = L.filter(m => m.jantina === 'P').length; return l + p ? ` (L ${l}, P ${p})` : ''; };
    openSheet({
      title: k.nama + ': kelas ' + r.kelas, full: true,
      body: `<div class="stat-grid stat-3" style="margin-bottom:8px"><div class="stat"><b>${r.murid.length}</b><span>Murid kelas</span></div><div class="stat"><b style="color:var(--ok)">${a.ada}</b><span>Berunit</span></div><div class="stat ${a.belum.length && k.wajib ? 'alert' : ''}"><b>${a.belum.length}</b><span>Belum berunit</span></div></div>
        ${a.belum.length ? `<div class="an-grp" style="color:var(--bad)">${ic('alert', 'i-s')}Belum berunit<span class="chip chip-warn">${a.belum.length}${esc(lj(a.belum))}</span></div>${baris(a.belum)}` : ''}
        ${unitList.map(x => `<div class="an-grp">${patchHtml(x.u, 'patch-s')}${esc(x.u.nama)}<span class="chip">${x.L.length} murid${esc(lj(x.L))}</span></div>${baris(x.L)}`).join('')}
        ${!unitList.length && !a.belum.length ? emptyHtml('users', 'Tiada murid', '') : ''}`,
      foot: `<button class="btn btn-primary" data-act="sheetClose">Tutup</button>`
    });
  };

  const draw = () => {
    let body = '';
    if (st.mode === 'murid') {
      const L = senarai();
      body = `<div class="stack-s" style="margin-bottom:10px"><label class="check" style="padding:8px 2px"><input type="checkbox" id="kuBelum" ${st.belum ? 'checked' : ''}><span><b>Belum lengkap sahaja</b></span></label>
        <div class="search">${ic('search', 'i-s')}<input class="input" id="kuQ" placeholder="Cari nama murid" value="${esc(st.q)}" autocomplete="off"></div></div>
        <div class="ku-list" id="kuList">${L.map(kad).join('') || emptyHtml('check', 'Semua murid lengkap berunit', 'Nyahtanda "Belum lengkap sahaja" untuk melihat atau menukar unit murid.')}</div>`;
    } else {
      const k = kats.find(x => x.id === st.kat) || kats[0];
      const us = r.unit.filter(u => u.idKategori === k.id);
      if (!us.some(u => u.id === st.unit)) st.unit = (us[0] || {}).id || '';
      const L = r.murid.filter(m => !st.q || m.nama.toLowerCase().includes(st.q.trim().toLowerCase()));
      body = `${analisaHtml()}<div class="pills" style="margin-bottom:8px;flex-wrap:wrap">${kats.map(x => `<button type="button" class="${x.id === k.id ? 'on' : ''}" data-act="kuKat" data-id="${esc(x.id)}">${esc(x.nama)}</button>`).join('')}</div>
        <div class="field" style="margin-bottom:8px"><label for="kuUnit">Unit</label><select class="input" id="kuUnit">${us.map(u => `<option value="${esc(u.id)}" ${u.id === st.unit ? 'selected' : ''}>${esc(u.nama)} (${u.ahli} ahli)</option>`).join('')}</select></div>
        <div class="spread" style="margin-bottom:8px"><span class="small muted">Tanda murid untuk unit ini</span><button type="button" class="btn btn-sm btn-ghost" data-act="kuBaki">Pilih yang belum berunit</button></div>
        <div class="list" id="kuTick">${L.map(m => { const v = cur(m, k.id), u = unitOf(v); return `<label class="row mrow" style="cursor:pointer"><input type="checkbox" data-m="${esc(m.id)}" ${v && v === st.unit ? 'checked' : ''}><div class="row-main"><div class="row-title">${esc(m.nama)}</div><div class="row-sub">${u ? esc(u.nama) : 'Belum berunit'}${key(m.id, k.id) in pending ? ' (belum disimpan)' : ''}</div></div></label>`; }).join('')}</div>`;
    }
    main(`${prefix}<div class="stat-grid stat-3" id="kuStat" style="margin-bottom:12px"></div>
      <div class="pills" style="margin-bottom:12px"><button type="button" class="${st.mode === 'murid' ? 'on' : ''}" data-act="kuMode" data-m="murid">Ikut murid</button><button type="button" class="${st.mode === 'unit' ? 'on' : ''}" data-act="kuMode" data-m="unit">Ikut unit</button></div>
      <p class="hint" style="margin:-4px 2px 12px">${st.mode === 'murid' ? 'Pilih unit bagi setiap kategori pada kad murid. Nombor dalam kurungan ialah bilangan ahli semasa.' : 'Pilih kategori dan unit, kemudian tanda murid. Sesuai untuk rumah sukan atau unit yang sama bagi ramai murid.'}</p>
      ${body}
      <div class="savebar"><div class="small muted grow">Perubahan hanya disimpan selepas butang ditekan</div><button class="btn btn-primary" data-act="kuSimpan" id="kuSave" disabled>Tiada perubahan</button></div>`);
    $('#main').classList.add('page-savebar');
    counters();
    const q = $('#kuQ');
    if (q) q.oninput = debounce(e => { st.q = e.target.value; const pos = q.selectionStart; draw(); const n = $('#kuQ'); n.focus(); n.setSelectionRange(pos, pos); }, 250);
    const bel = $('#kuBelum');
    if (bel) bel.onchange = e => { st.belum = e.target.checked; draw(); };
    const us = $('#kuUnit');
    if (us) us.onchange = e => { st.unit = e.target.value; draw(); };
    $('#main').onchange = e => {
      const el = e.target;
      if (el.matches('select[data-m]')) {
        const m = r.murid.find(x => x.id === el.dataset.m);
        setVal(m, el.dataset.k, el.value);
        el.classList.toggle('is-chg', key(m.id, el.dataset.k) in pending);
        const card = el.closest('.mcard'), n = kurang(m);
        card.classList.toggle('is-done', !n);
        card.querySelector('.mcard-h .chip').outerHTML = n ? `<span class="chip chip-warn">Belum ${n}</span>` : `<span class="chip chip-ok">${ic('check', 'i-s')}Lengkap</span>`;
        counters();
      } else if (el.matches('#kuTick input')) {
        const m = r.murid.find(x => x.id === el.dataset.m), k = st.kat;
        if (el.checked) setVal(m, k, st.unit);
        else setVal(m, k, m.unit[k] && m.unit[k] !== st.unit ? m.unit[k] : '');
        const v = cur(m, k), u = unitOf(v);
        el.parentNode.querySelector('.row-sub').textContent = (u ? u.nama : 'Belum berunit') + (key(m.id, k) in pending ? ' (belum disimpan)' : '');
        counters();
      }
    };
  };

  S.acts = {
    retry: () => route(),
    kuMode(el) { st.mode = el.dataset.m; draw(); },
    kuKat(el) { st.kat = el.dataset.id; st.unit = ''; draw(); },
    kuAnalisa(el) { bukaAnalisa(el.dataset.id); },
    kuBaki() {
      let n = 0;
      r.murid.forEach(m => { if (!cur(m, st.kat)) { setVal(m, st.kat, st.unit); n++; } });
      draw();
      toast(n ? `${n} murid ditanda. Tekan Simpan untuk mengesahkan.` : 'Semua murid sudah berunit dalam kategori ini.');
    },
    async kuSimpan(el) {
      const perubahan = Object.keys(pending).map(x => { const [idMurid, idKategori] = x.split('|'); return { idMurid, idKategori, idUnit: pending[x] }; });
      if (!perubahan.length) return;
      const kosong = perubahan.filter(p => !p.idUnit).length;
      if (kosong && !(await confirmDlg(`${kosong} pilihan unit dikosongkan. Murid berkenaan akan dikeluarkan daripada unit tersebut. Teruskan?`, { ok: 'Teruskan', danger: true }))) return;
      await withBusy(el, async () => {
        try {
          const x = await api('simpanKelasUnit', { perubahan });
          Object.keys(pending).forEach(k => delete pending[k]);
          S.dirty = false;
          toast(`Disimpan: ${x.baru} pendaftaran baharu${x.tukar ? `, ${x.tukar} bertukar unit` : ''}${x.keluar ? `, ${x.keluar} dikosongkan` : ''}.`, 'ok');
          await cacheStale('kelasunit', 'pajsk', 'dash', 'unit', 'adm:belum', 'awam');
          route(true);

/* ---------------- Pengumuman ---------------- */
function pgStatus(p) {
  const t = today();
  if (p.status === 'Draf') return ['chip', 'Draf'];
  if (p.mula && p.mula > t) return ['chip chip-pri', 'Akan datang'];
  if (p.tamat && p.tamat < t) return ['chip', 'Tamat'];
  return ['chip chip-ok', 'Dipaparkan'];
}
async function admPengumuman() {
  const draw = r => {
    const list = r.pengumuman;
    main(`<div class="spread" style="margin-bottom:12px"><p class="small muted" style="margin:0">Pengumuman aktif dipaparkan di papan pemuka awam dan skrin TV, dan hilang sendiri selepas tarikh tamat.</p><button class="btn btn-primary btn-sm" data-act="edit">${ic('plus', 'i-s')}Baharu</button></div>
      ${list.length ? `<div class="list">${list.map(p => { const st = pgStatus(p); return `<button class="row" data-act="edit" data-id="${esc(p.id)}"><div class="row-main"><div class="row-title">${esc(p.tajuk)}</div><div class="row-sub">${p.mula ? esc(fmtDate(p.mula)) : 'Serta-merta'}${p.tamat ? ' hingga ' + esc(fmtDate(p.tamat)) : ''}</div></div><span class="${st[0]}">${st[1]}</span>${ic('chev', 'chev')}</button>`; }).join('')}</div>`
        : emptyHtml('chat', 'Belum ada pengumuman', 'Contoh: Kem Pengakap pada 12 Oktober, atau perjumpaan dibatalkan kerana cuti.')}`);
    S.acts = {
      retry: () => route(),
      edit(el) {
        const p = list.find(x => x.id === el.dataset.id) || { id: '', tajuk: '', isi: '', mula: today(), tamat: '', status: 'Aktif' };
        const sh = openSheet({
          title: p.id ? 'Sunting pengumuman' : 'Pengumuman baharu',
          body: `<div class="field"><label for="pgT">Tajuk</label><input class="input" id="pgT" maxlength="120" value="${esc(p.tajuk)}"></div>
            <div class="field"><label for="pgI">Isi</label><textarea class="input" id="pgI" rows="5" maxlength="1500">${esc(p.isi)}</textarea></div>
            <div class="hstack" style="flex-wrap:nowrap"><div class="field grow"><label for="pgM">Mula dipaparkan</label><input class="input" type="date" id="pgM" value="${esc(p.mula)}"></div>
            <div class="field grow"><label for="pgE">Tarikh tamat</label><input class="input" type="date" id="pgE" value="${esc(p.tamat)}"></div></div>
            <span class="hint" style="display:block;margin:-6px 0 10px">Kosongkan tarikh tamat untuk memaparkan tanpa had.</span>
            <label class="check"><input type="checkbox" id="pgD" ${p.status === 'Draf' ? 'checked' : ''}><span><b>Simpan sebagai draf</b><br><span class="hint">Draf tidak dipaparkan kepada orang ramai.</span></span></label>`,
          foot: `${p.id ? `<button class="btn btn-danger" data-act="del">Padam</button>` : ''}<button class="btn" data-act="sheetClose">Batal</button><button class="btn btn-primary" data-act="ok">Simpan</button>`,
          acts: {
            async ok(b) {
              const data = { id: p.id, tajuk: sh.$('#pgT').value.trim(), isi: sh.$('#pgI').value.trim(), mula: sh.$('#pgM').value, tamat: sh.$('#pgE').value, status: sh.$('#pgD').checked ? 'Draf' : 'Aktif' };
              if (!data.tajuk) return toast('Isi tajuk pengumuman.', 'warn');
              await withBusy(b, async () => {
                try { await api('savePengumuman', data); sh.close(); toast('Pengumuman disimpan.', 'ok'); await cacheStale('adm:peng', 'awam'); route(true); }
                catch (e) { toast(e.message, 'bad'); }
              });
            },
            async del() {
              if (!(await confirmDlg('Padam pengumuman ini?', { ok: 'Padam', danger: true }))) return;

              catch (e) { toast(e.message, 'bad'); }
            }
          }
        });
        setTimeout(() => sh.$('#pgT').focus(), 60);
      }
    };
  };
  await admLoad('adm:peng', 'pengumuman', {}, draw, 10000);
}

              await withBusy(b, async () => {

}


/* Padam atau gabung unit yang tersalah daftar */
async function padamUnit(u) {
  let g;
  try { g = (await api('unitGuna', { id: u.id })).guna; } catch (e) { return toast(e.message, 'bad'); }
  const lain = S.boot.unit.filter(x => x.idKategori === u.idKategori && x.id !== u.id).sort((a, b) => a.nama.localeCompare(b.nama));
  const k = K(u.idKategori);
  const selesai = async (r) => {
    toast(r.mode === 'gabung' ? `${u.nama} digabungkan ke ${r.ke}.` : `Unit ${u.nama} dipadam.`, 'ok');
    await cacheStale('unit', 'dash', 'pub', 'awam', 'adm:belum', 'adm:pajsk');
    admAfterWrite();
  };
  if (!g.jumlah) {
    if (!(await confirmDlg(`Padam unit <b>${esc(u.nama)}</b>? Unit ini tiada ahli, guru atau rekod.`, { ok: 'Padam', danger: true }))) return;
    try { await selesai(await api('deleteUnit', { id: u.id, mode: 'padam' })); } catch (e) { toast(e.message, 'bad'); }
    return;
  }
  const baris = [['ahli', 'Ahli sesi ini'], ['Kehadiran', 'Rekod kehadiran'], ['Laporan', 'Laporan perjumpaan'], ['Guru_Unit', 'Guru penasihat'], ['Carta_Organisasi', 'Jawatan carta'], ['Pencapaian', 'Pencapaian murid']].filter(([key]) => g[key]);
  const sh = openSheet({
    title: 'Padam ' + u.nama,
    body: `${bannerHtml('bad', 'alert', 'Unit ini mempunyai data. Pilih sama ada data dipindahkan ke unit lain atau dipadam bersama.')}
      <dl class="kv" style="margin:14px 0">${baris.map(([key, l]) => `<dt>${l}</dt><dd>${g[key]}</dd>`).join('')}</dl>
      <label class="check"><input type="radio" name="pdM" value="gabung" ${lain.length ? 'checked' : 'disabled'}><span><b>Gabungkan ke unit lain (disyorkan)</b><br><span class="hint">Ahli, kehadiran, laporan, guru dan pencapaian dipindahkan. Sesuai untuk unit pendua kerana salah ejaan.</span></span></label>
      <div class="field" id="pdKe" style="margin:4px 0 12px 34px">${lain.length ? `<select class="input" id="pdSel">${lain.map(x => `<option value="${esc(x.id)}">${esc(x.nama)} (${x.ahli} ahli)</option>`).join('')}</select>` : `<span class="hint">Tiada unit lain dalam kategori ${esc(k ? k.nama : '')}.</span>`}</div>
      <label class="check"><input type="radio" name="pdM" value="padam" ${lain.length ? '' : 'checked'}><span><b>Padam unit dan semua datanya</b><br><span class="hint">Ahli dikeluarkan dan rekod kehadiran, laporan serta pencapaian unit ini dipadam kekal.</span></span></label>
      <div class="field" id="pdSah" style="margin:4px 0 0 34px"><label for="pdNama">Taip <b>${esc(u.nama)}</b> untuk mengesahkan</label><input class="input" id="pdNama" autocomplete="off"></div>
      <p class="hint" style="margin-top:14px">Jika unit ini dicipta daripada DATA KOKO, betulkan juga ejaannya dalam tab DATA KOKO supaya unit ini tidak dicipta semula.</p>`,
    foot: `<button class="btn" data-act="sheetClose">Batal</button><button class="btn btn-danger" data-act="go">Teruskan</button>`,
    acts: {
      async go(el) {
        const mode = (sh.$('input[name=pdM]:checked') || {}).value;
        const data = { id: u.id, mode };
        if (mode === 'gabung') {
          data.gabungKe = sh.$('#pdSel').value;
          const ke = lain.find(x => x.id === data.gabungKe);
          if (!(await confirmDlg(`Gabungkan <b>${esc(u.nama)}</b> ke <b>${esc(ke.nama)}</b>? Unit ${esc(u.nama)} akan dipadam selepas data dipindahkan.`, { ok: 'Gabung', danger: true }))) return;
        } else {
          data.sahkan = sh.$('#pdNama').value;
          if (data.sahkan.trim().toUpperCase() !== u.nama.trim().toUpperCase()) return toast('Taip nama unit dengan tepat.', 'warn');
        }
        await withBusy(el, async () => {
          try { const r = await api('deleteUnit', data); sh.close(); await selesai(r); }
          catch (e) { toast(e.message, 'bad'); }
        });
      }
    }
  });
  const sync = () => { const m = (sh.$('input[name=pdM]:checked') || {}).value; sh.$('#pdKe').style.opacity = m === 'gabung' ? 1 : .45; sh.$('#pdSah').classList.toggle('hide', m !== 'padam'); };
  sh.$$('input[name=pdM]').forEach(i => { i.onchange = sync; });
  sync();
}
